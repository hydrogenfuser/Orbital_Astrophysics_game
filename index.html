<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL OS - CRT TERMINAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #080500;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.65) 50%
            );
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 9;
            opacity: 0.85;
        }

        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.15;
            font-size: 0.95rem;
        }

        .line-amber, .line-title, #prompt, #command-input {
            color: #ffb000;
            text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
        }

        .line-amber, .line-title {
            animation: generate-scan 0.08s ease-out forwards;
        }

        @keyframes generate-scan {
            0% {
                background-color: rgba(255, 176, 0, 0.12);
                color: #ffca42;
                text-shadow: 0 0 3px rgba(255, 176, 0, 0.6);
            }
            100% {
                background-color: transparent;
                color: #ffb000;
                text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
            }
        }

        .line-title { 
            font-weight: bold; 
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 176, 0, 0.4);
            padding-top: 8px;
        }
        #prompt {
            margin-right: 8px;
            font-weight: bold;
        }
        #command-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }

        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: rgba(255, 176, 0, 0.6);
        }
        #output::-webkit-scrollbar-track {
            background: #080500;
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">Command:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        let GameState = {
            activeSlot: "default_save",
            data: {
                user: { name: "Operator", password: "" },
                saveName: "default_save",
                timestamp: null,
                vessel: { name: "Probe-Alpha", mass_kg: 1200, altitude_m: 375000, velocity_ms: 2450 }
            }
        };

        let currentMode = "MAIN_MENU"; 
        let isExecutingProgram = false;
        let inRDModule = false;
        let tempName = "";
        let pendingLoadSlot = "";
        let scrollY = 0;
        let waveFrame = 0;
        let waveInterval = null;

        const techMatrix = [
            {
                tier: 0,
                tierName: "TIER 0: FOUNDATION GROUND",
                status: "fully_researched",
                categories: [
                    { cat: "Probes", status: "fully_researched" },
                    { cat: "Computers", status: "fully_researched" },
                    { cat: "Lifting Bodies", status: "fully_researched" },
                    { cat: "Fuels", status: "fully_researched" }
                ]
            },
            {
                tier: 1,
                tierName: "TIER 1: FIRST STEPS",
                status: "half_researched",
                categories: [
                    { cat: "Probes", status: "half_researched" },
                    { cat: "Computers", status: "half_researched" },
                    { cat: "Fuels", status: "half_researched" },
                    { cat: "Comms", status: "half_researched" },
                    { cat: "Power", status: "half_researched" }
                ]
            },
            {
                tier: 2,
                tierName: "TIER 2: DEEP SPACE",
                status: "locked",
                categories: [
                    { cat: "Probes", status: "locked" },
                    { cat: "Power", status: "locked" },
                    { cat: "Science", status: "locked" }
                ]
            }
        ];

        const outputEl = document.getElementById("output");
        const promptEl = document.getElementById("prompt");
        const inputEl = document.getElementById("command-input");

        function print(text, type = "amber") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function updatePrompt() {
            if (inRDModule) {
                promptEl.textContent = `[DIGITAL TREE // W/S: Scroll | exit: Back]> `;
                return;
            }
            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
        }

        function showTitle() {
            print("╔══════════════════════════════════════════════════╗", "title");
            print("║                   ORBITAL OS                     ║", "title");
            print("║             FRUTIGER DIGITAL TERMINAL            ║", "title");
            print("╚══════════════════════════════════════════════════╝", "title");
            print("");
        }

        function printProgramTree() {
            print("ORBITAL OS // SYSTEM DIRECTORY", "title");
            print("└── System Programs");
            print("    ├── VAB");
            print("    ├── Hangars");
            print("    ├── R&D");
            print("    ├── Astronaut Complex");
            print("    ├── Contractors");
            print("    ├── Flight");
            print("    └── DSN");
            print("");
        }

        function printMainMenuHelp() {
            print("System offline. Available commands:");
            print("  new             - Create a new profile and start game");
            print("  load            - View save files and login");
            print("  saves           - List available save files");
            print("  clear           - Clear terminal buffer");
        }

        function printLoggedInHelp() {
            print("Session Active. Available commands:");
            print("  run [program]   - Execute system program (e.g. 'run r&d')");
            print("  programs        - Display system program tree");
            print("  status          - Display vessel parameters");
            print("  save            - Save current progress");
            print("  logout          - Exit current session");
            print("  clear           - Clear terminal buffer");
        }

        function bootTerminal() {
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            inRDModule = false;
            if (waveInterval) clearInterval(waveInterval);
            updatePrompt();
            printMainMenuHelp();
        }

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // GENERATE PROCEDURAL DIGITAL TREE
        function generateDigitalTree() {
            const lines = [];
            const width = 76;
            const center = Math.floor(width / 2);
            let seed = 0;

            for (let i = 0; i < GameState.activeSlot.length; i++) {
                seed += GameState.activeSlot.charCodeAt(i);
            }

            // Render Unconnected Higher Tier Text Floating Labels
            for (let t = techMatrix.length - 1; t > 0; t--) {
                const tier = techMatrix[t];
                lines.push("");
                lines.push(" ".repeat(center - Math.floor(tier.tierName.length / 2)) + `[ ${tier.tierName} ]`);
                lines.push("");
                lines.push("");

                // Render procedural standalone branches for sub-techs without line connections
                tier.categories.forEach((cat, idx) => {
                    let lineBuffer = Array(width).fill(" ");
                    const dir = (idx % 2 === 0) ? -1 : 1;
                    const bLen = Math.floor(seededRandom(seed++) * 10) + 6;
                    const cFull = cat.status === "fully_researched";
                    const cHalf = cat.status === "half_researched";

                    // Character set: ASCII 200-216 for full, 193-197 for half
                    const bChar = cFull ? "═" : (cHalf ? "─" : "┄");

                    // Draw floating branch
                    const startX = center + (dir * 4);
                    for (let b = 0; b < bLen; b++) {
                        const pos = startX + (dir * b);
                        if (pos > 0 && pos < width) {
                            lineBuffer[pos] = bChar;
                        }
                    }

                    // Overlap animated leaves (176-178: ░, ▒, ▓) on top of the branches
                    const leafShifts = ["░", "▒", "▓", "░"];
                    for (let l = 0; l < bLen + 2; l++) {
                        const leafPos = startX + (dir * l);
                        if (leafPos > 0 && leafPos < width) {
                            if (seededRandom(seed++) > 0.35) {
                                const leafIndex = Math.abs((l + waveFrame) % leafShifts.length);
                                lineBuffer[leafPos] = leafShifts[leafIndex]; // Render directly over branch
                            }
                        }
                    }

                    lines.push(lineBuffer.join(""));
                });
                lines.push("");
            }

            // TIER 0 GROUND & 4-CHARACTER SAPLING BASE
            lines.push("");
            lines.push(" ".repeat(center - 10) + "░▒▓ TIER 0: SAPLING MATRIX ▓▒░");
            lines.push("");
            
            // Sapling top: ╢ (182) flanked by two ░ (176) leaves
            const leafLeft = (waveFrame % 2 === 0) ? "░" : "▒";
            const leafRight = (waveFrame % 2 === 0) ? "▒" : "░";
            lines.push(" ".repeat(center - 1) + leafLeft + "╢" + leafRight);
            
            // Sapling base stem: ║ (186)
            lines.push(" ".repeat(center) + "║");
            
            // Tier 0 Ground line
            lines.push(" ".repeat(center - 8) + "═════════╩═════════");
            lines.push(" ".repeat(center - 10) + "[ TIER 0: GROUND FOUNDATION ]");

            return lines;
        }

        async function runRDProgram() {
            isExecutingProgram = true;
            inputEl.disabled = true;
            outputEl.innerHTML = "";

            const bootLogs = [
                "[SYS] INITIALIZING EXECUTABLE: R&D.PMCS...",
                "[SYS] RENDERING TIER 0 SAPLING BASE...",
                "[SYS] SYNTHESIZING DYNAMIC LEAF WAVE ENGINE...",
                "[SYS] EXECUTION OK."
            ];

            for (const log of bootLogs) {
                print(log);
                await new Promise(r => setTimeout(r, 20));
            }
            print("");

            isExecutingProgram = false;
            inRDModule = true;
            inputEl.disabled = false;
            inputEl.focus();
            
            scrollY = 0;
            renderRDView();

            // Start ambient leaf waving animation loop
            if (waveInterval) clearInterval(waveInterval);
            waveInterval = setInterval(() => {
                if (inRDModule) {
                    waveFrame++;
                    renderRDView();
                }
            }, 350);
        }

        function renderRDView() {
            outputEl.innerHTML = "";
            print("================================================================================", "title");
            print("           RESEARCH & DEVELOPMENT // DIGITAL TREE (FRUTIGER AERO V1.0)          ", "title");
            print("================================================================================", "title");
            print("  NAVIGATION: Press [W] to scroll Up | [S] to scroll Down | Type 'exit' to quit");
            print("  SAPLING:    ║ (186) Base | ╢ (182) Stem | ░ (176) Leaves | ═╩═ Ground");
            print("--------------------------------------------------------------------------------");

            const fullTreeLines = generateDigitalTree();
            const viewportSize = 16;

            const maxScroll = Math.max(0, fullTreeLines.length - viewportSize);
            if (scrollY < 0) scrollY = 0;
            if (scrollY > maxScroll) scrollY = maxScroll;

            const visibleLines = fullTreeLines.slice(scrollY, scrollY + viewportSize);
            visibleLines.forEach(line => print(line));

            print("--------------------------------------------------------------------------------");
            print(`  VIEWPORT: Lines ${scrollY} - ${Math.min(scrollY + viewportSize, fullTreeLines.length)} of ${fullTreeLines.length} | Animated Wind Frame: ${waveFrame}`, "title");
            print("================================================================================", "title");
            updatePrompt();
        }

        function processCommand(input) {
            if (isExecutingProgram) return;

            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${input}`, "amber");
            }

            if (inRDModule) {
                if (input.toLowerCase() === "exit") {
                    inRDModule = false;
                    if (waveInterval) clearInterval(waveInterval);
                    outputEl.innerHTML = "";
                    print("[SYS] R&D Module Terminated.");
                    print("");
                    printLoggedInHelp();
                    updatePrompt();
                    return;
                }
                if (input.toLowerCase() === "w") {
                    scrollY -= 2;
                    renderRDView();
                    return;
                }
                if (input.toLowerCase() === "s") {
                    scrollY += 2;
                    renderRDView();
                    return;
                }
                print(`[SYS] Navigation active. Press 'W' (Up), 'S' (Down), or type 'exit'.`);
                return;
            }

            if (currentMode === "NEW_NAME") {
                if (!input) return;
                tempName = input;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "NEW_PASS") {
                if (!input) return;
                const password = input;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                outputEl.innerHTML = "";
                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' initialized.`);
                print(`[SYS] Access ID locked: [${slotName}]`);
                print("");
                printProgramTree();
                printLoggedInHelp();
                return;
            }

            if (currentMode === "LOAD_SELECT") {
                if (!input) return;
                const targetSlot = input.toLowerCase().replace(/\s+/g, '_');

                if (input.toLowerCase() === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${input}' not found.`);
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "LOAD_PASS") {
                if (!input) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === input) {
                    GameState.data = parsedData;
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    
                    outputEl.innerHTML = "";
                    updatePrompt();
                    
                    print(`[SYS] Access granted for profile '${GameState.data.user.name}'.`);
                    print("");
                    printProgramTree();
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Incorrect password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            const parts = input.split(" ");
            const cmd = parts[0].toLowerCase();
            const subCmd = parts[1] ? parts[1].toLowerCase() : "";

            if (currentMode === "LOGGED_IN") {
                if ((cmd === "run" && subCmd === "r&d") || cmd === "r&d") {
                    runRDProgram();
                    return;
                }

                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "programs":
                    case "dir":
                        printProgramTree();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Telemetry saved to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        GameState.activeSlot = "default_save";
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' or 'run r&d'.`);
                        break;
                }
                return;
            }

            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Scanning local memory...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const loadSaves = getSaveList();
                        if (loadSaves.length === 0) {
                            print("[ERR] No save files present in memory.");
                            return;
                        }

                        print("[SYS] Open Save Files:");
                        loadSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'.`);
                        break;
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (isExecutingProgram) return;

            if (inRDModule) {
                const key = e.key.toUpperCase();
                if (key === "W") {
                    scrollY -= 2;
                    renderRDView();
                } else if (key === "S") {
                    scrollY += 2;
                    renderRDView();
                }
            }

            if (e.key === "Enter") {
                const input = inputEl.value.trim();
                inputEl.value = "";
                processCommand(input);
            }
        });

        bootTerminal();
    </script>
</body>
</html>
