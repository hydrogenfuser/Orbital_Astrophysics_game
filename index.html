<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL OS - CRT TERMINAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #080500;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.65) 50%
            );
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 9;
            opacity: 0.85;
        }

        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.15;
            font-size: 0.95rem;
        }

        .line-amber, .line-title, #prompt, #command-input {
            color: #ffb000;
            text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
        }

        .line-amber, .line-title {
            animation: generate-scan 0.08s ease-out forwards;
        }

        @keyframes generate-scan {
            0% {
                background-color: rgba(255, 176, 0, 0.12);
                color: #ffca42;
                text-shadow: 0 0 3px rgba(255, 176, 0, 0.6);
            }
            100% {
                background-color: transparent;
                color: #ffb000;
                text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
            }
        }

        .line-title { 
            font-weight: bold; 
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 176, 0, 0.4);
            padding-top: 8px;
        }
        #prompt {
            margin-right: 8px;
            font-weight: bold;
        }
        #command-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }

        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: rgba(255, 176, 0, 0.6);
        }
        #output::-webkit-scrollbar-track {
            background: #080500;
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">Command:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        let GameState = {
            activeSlot: "default_save",
            data: {
                user: { name: "Operator", password: "" },
                saveName: "default_save",
                timestamp: null,
                maxUnlockedTier: 0,
                vessel: { 
                    name: "Sounder-Mk1", 
                    mass_kg: 580, 
                    fuelRatio: 65,
                    gimbal: 100,
                    finArea: 10,
                    sepDelay: 1.5
                }
            }
        };

        let currentMode = "MAIN_MENU"; 
        let inRDModule = false;
        let inVABModule = false;
        let activeVABApp = null;
        let isExecutingProgram = false;
        let isInspecting = false;
        let tempName = "";
        let pendingLoadSlot = "";
        let selectedTierIndex = 0;
        let selectedCategoryIndex = 0;

        const vabApplications = [
            { id: "rocket", name: "Rocket Designer", reqTechTier: 0 },
            { id: "payload", name: "Payload Designer", reqTechTier: 0 },
            { id: "rover", name: "Rover Simulator", reqTechTier: 1 },
            { id: "lander", name: "Lander Simulator", reqTechTier: 1 },
            { id: "drone", name: "Drone Simulator", reqTechTier: 2 },
            { id: "docking", name: "Docking Computer Simulator", reqTechTier: 2 },
            { id: "station", name: "Space Station Computer Simulator", reqTechTier: 2 }
        ];

        const techMatrix = [
            {
                tier: 0,
                tierName: "TIER 0: FOUNDATION TECH",
                categories: [
                    { cat: "Probes", name: "Sounding Rocket Payloads", desc: "Tiny volume (0.5 - 2 IVU). Used for sub-orbital vertical hops to test instruments in vacuum." },
                    { cat: "Computers", name: "Mechanical / Manual Relays", desc: "Computers are mechanical and slow, operating purely via radio command execution." },
                    { cat: "Lifting Bodies", name: "Unpressurized Sounding Rockets", desc: "Solid/liquid rockets for potential energy testing." },
                    { cat: "Fuels", name: "Kerosene & Solid Propellants", desc: "Volatile mixtures with higher failure risks." },
                    { cat: "RCS", name: "Cold Gas Thrusters", desc: "Pressurized Nitrogen systems for simple attitude holds." },
                    { cat: "Power", name: "Primary Silver-Zinc Batteries", desc: "Non-rechargeable energy cells." },
                    { cat: "Heat", name: "Passive Conduction Fins", desc: "Basic structural cooling surfaces." },
                    { cat: "Comms", name: "Omnidirectional Whips", desc: "360-degree broad-spectrum radio emissions." },
                    { cat: "Science", name: "Basic Sounding Suite", desc: "Thermometers, Barometers, and Geiger counters." }
                ]
            },
            {
                tier: 1,
                tierName: "TIER 1: FIRST STEPS",
                categories: [
                    { cat: "Probes", name: "Impactors & Early Satellites", desc: "Short-lived orbital probes and lunar impact capsules." },
                    { cat: "Computers", name: "Analog Guidance Computers", desc: "Basic analog calculation relays for trajectory correction." },
                    { cat: "Lifting Bodies", name: "ICBM-derived Launchers", desc: "Unpressurized ballistic launch systems for low orbit entry." },
                    { cat: "Fuels", name: "Refined RP-1 / LOX", desc: "Higher efficiency, safer chemical propellant mixtures." },
                    { cat: "RCS", name: "Hydrogen Peroxide Monopropellant", desc: "Catalytic thrust systems for fine directional control." },
                    { cat: "Power", name: "Basic Solar Panels", desc: "First-generation photovoltaic power generation." },
                    { cat: "Heat", name: "Multi-Layer Insulation (MLI)", desc: "Gold/Silver skin wraps for vacuum radiation shielding." },
                    { cat: "Comms", name: "Yagi-Uda Directional Antennas", desc: "Point-to-point focused radio communication dishes." },
                    { cat: "Science", name: "Deployable Boom Magnetometers", desc: "Extended sensors for cleaner planetary magnetic field mapping." }
                ]
            },
            {
                tier: 2,
                tierName: "TIER 2: ORBITAL OPERATIONS",
                categories: [
                    { cat: "Probes", name: "Standardized Bus Satellites", desc: "Modular satellite chassis with multi-year lifespan ratings." },
                    { cat: "Computers", name: "Digital Transistor Processing", desc: "Programmable digital logic blocks for real-time trajectory calculation." },
                    { cat: "Lifting Bodies", name: "Multistage Heavy Launchers", desc: "Precision staging rockets capable of GEO insertion payloads." },
                    { cat: "Fuels", name: "Cryogenic Hydrolox (LH2/LOX)", desc: "High specific impulse propellant for deep-space burn execution." },
                    { cat: "RCS", name: "Hydrazine Monopropellant", desc: "High-density hypergolic attitude control units." },
                    { cat: "Power", name: "Rechargeable Ni-Cd Banks & Photovoltaics", desc: "Sustained electrical storage systems for shadowed orbits." },
                    { cat: "Heat", name: "Ablative Heat Shields", desc: "Sacrificial atmospheric re-entry shields." },
                    { cat: "Comms", name: "Parabolic Deep Space Dishes", desc: "High-gain antennas for interplanetary signal acquisition." },
                    { cat: "Science", name: "Orbital Imaging & Multispectral Array", desc: "Surface mapping cameras and planetary atmosphere analysis." }
                ]
            }
        ];

        const outputEl = document.getElementById("output");
        const promptEl = document.getElementById("prompt");
        const inputEl = document.getElementById("command-input");

        function print(text, type = "amber") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function updatePrompt() {
            if (inRDModule) {
                if (isInspecting) {
                    promptEl.textContent = `[R&D LIBRARY // INSPECT: W/S/A/D=Back | exit=Quit]> `;
                } else {
                    promptEl.textContent = `[R&D LIBRARY // W/S:Nav | A/D:Tier | E:Inspect | unlock:Research | exit:Quit]> `;
                }
                return;
            }
            if (inVABModule) {
                if (activeVABApp) {
                    promptEl.textContent = `[VAB // ${activeVABApp.name.toUpperCase()} // 1-4:Tune | back:List | exit:Quit]> `;
                } else {
                    promptEl.textContent = `[VAB MENU // Enter App # | exit:Quit]> `;
                }
                return;
            }
            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
        }

        function showTitle() {
            print("╔══════════════════════════════════════════════════╗", "title");
            print("║                   ORBITAL OS                     ║", "title");
            print("║             FRUTIGER DIGITAL TERMINAL            ║", "title");
            print("╚══════════════════════════════════════════════════╝", "title");
            print("");
        }

        function printRDHeader() {
            print("╔══════════════════════════════════════════════════╗", "title");
            print("║               RESEARCH  ░▒▓  DEVELOPMENT         ║", "title");
            print("║                 (  R  __&__  D  )                ║", "title");
            print("║                       /     \\                    ║", "title");
            print("╚══════════════════════════════════════════════════╝", "title");
            print("");
        }

        function printVABHeader() {
            print("╔══════════════════════════════════════════════════╗", "title");
            print("║            VEHICLE ASSEMBLY BUILDING             ║", "title");
            print("║             [ MOD & TUNING MATRIX ]              ║", "title");
            print("╚══════════════════════════════════════════════════╝", "title");
            print("");
        }

        function printProgramTree() {
            print("ORBITAL OS // SYSTEM DIRECTORY", "title");
            print("└── System Programs");
            print("    ├── VAB");
            print("    ├── Hangars");
            print("    ├── R&D");
            print("    ├── Astronaut Complex");
            print("    ├── Contractors");
            print("    ├── Flight");
            print("    └── DSN");
            print("");
        }

        function printMainMenuHelp() {
            print("System offline. Available commands:");
            print("  new             - Create a new profile and start game");
            print("  load            - View save files and login");
            print("  saves           - List available save files");
            print("  clear           - Clear terminal buffer");
        }

        function printLoggedInHelp() {
            print("Session Active. Available commands:");
            print("  run [program]   - Execute system program (e.g. 'run r&d', 'run vab')");
            print("  programs        - Display system program tree");
            print("  status          - Display vessel parameters");
            print("  save            - Save current progress");
            print("  logout          - Exit current session");
            print("  clear           - Clear terminal buffer");
        }

        function bootTerminal() {
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            inRDModule = false;
            inVABModule = false;
            activeVABApp = null;
            updatePrompt();
            printMainMenuHelp();
        }

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        function renderLoadingVABASCII(percentage) {
            outputEl.innerHTML = "";
            print("   _________________________________________________________   ", "title");
            print("  /  _____________________________________________________  \\  ", "title");
            print(" /  /  _________________________________________________  \\  \\ ", "title");
            print("||  ||  [VAB] VEHICLE ASSEMBLY BAY INITIALIZING        ||  ||", "title");
            print("||  ||                                                 ||  ||", "title");
            print("||  ||                 .---|---|---.                   ||  ||", "title");
            print("||  ||                 |   |   |   |                   ||  ||", "title");
            print("||  ||                 |---|---|---|                   ||  ||", "title");
            print("||  ||                /|   |   |   |\\                  ||  ||", "title");
            print("||  ||               /_|___|___|___|_\\                 ||  ||", "title");
            print("||  ||                 |   |   |   |                   ||  ||", "title");
            print("||  ||                 |---|---|---|                   ||  ||", "title");
            print("||  ||                /|   |   |   |\\                  ||  ||", "title");
            print("||  ||               / |   |   |   | \\                 ||  ||", "title");
            print("||  ||              /__|___|___|___|__\\                ||  ||", "title");
            print("||  ||                                                 ||  ||", "title");
            
            const totalBars = 30;
            const filled = Math.floor((percentage / 100) * totalBars);
            const empty = totalBars - filled;
            const barStr = "[" + "█".repeat(filled) + "░".repeat(empty) + "]";
            
            print(`||  ||  LOADING: ${barStr} ${percentage}%`.padEnd(58) + "||  ||", "title");
            print(" \\  \\_________________________________________________/  / ", "title");
            print("  \\_____________________________________________________/  ", "title");
            print("");
        }

        // LOADING LOGIC: 4-7 seconds, 25% chance of 1-2s freeze, ASCII VAB bar rendering
        async function runModuleBootSequence(moduleName, onComplete) {
            isExecutingProgram = true;
            inputEl.disabled = true;

            const totalDurationSec = 4.0 + Math.random() * 3.0; // 4 to 7 seconds total
            const steps = 20;
            const stepDelay = (totalDurationSec * 1000) / steps;

            const isStuck = Math.random() < 0.25; // 25% chance
            const stuckStep = Math.floor(Math.random() * 10) + 5;
            const stuckDuration = 1000 + Math.random() * 1000; // 1-2 seconds freeze

            for (let i = 1; i <= steps; i++) {
                const percent = Math.floor((i / steps) * 100);
                renderLoadingVABASCII(percent);
                
                if (isStuck && i === stuckStep) {
                    print(`[WARN] BUS HANG DETECTED... RESOLVING BUFFER MEMORY...`, "amber");
                    await new Promise(r => setTimeout(r, stuckDuration));
                } else {
                    await new Promise(r => setTimeout(r, stepDelay));
                }
            }

            print(`[SYS] ${moduleName.toUpperCase()} BOOT COMPLETE.`);
            await new Promise(r => setTimeout(r, 300));

            isExecutingProgram = false;
            inputEl.disabled = false;
            inputEl.focus();
            onComplete();
        }

        function renderRDLibrary() {
            outputEl.innerHTML = "";
            isInspecting = false;
            printRDHeader();

            const activeTier = techMatrix[selectedTierIndex];
            const isTierUnlocked = (selectedTierIndex <= GameState.data.maxUnlockedTier);

            print("================================================================================", "title");
            print(`                 RESEARCH & DEVELOPMENT LIBRARY // ${activeTier.tierName}`, "title");
            print("================================================================================", "title");
            print("  CONTROLS: [W/S] Navigate Subsystems  |  [A/D] Change Tier  |  [E] Inspect Spec Sheet");
            print("  COMMANDS: Type 'unlock' to research active tier level.");
            print("--------------------------------------------------------------------------------");

            for (let i = 0; i < activeTier.categories.length; i++) {
                const item = activeTier.categories[i];
                const isSelected = (i === selectedCategoryIndex);
                const statusTag = isTierUnlocked ? "[UNLOCKED]" : "[LOCKED]";
                
                let lineStr = isSelected 
                    ? ` ►► ${statusTag.padEnd(10)} ${item.cat.toUpperCase().padEnd(15)} : ${item.name} ◄◄` 
                    : `    ${statusTag.padEnd(10)} ${item.cat.toUpperCase().padEnd(15)} : ${item.name}`;

                print(lineStr, isSelected ? "title" : "amber");
            }

            const activeCategory = activeTier.categories[selectedCategoryIndex];
            print("--------------------------------------------------------------------------------");
            print(`CURRENTLY HIGHLIGHTED: [${activeCategory.cat.toUpperCase()}] -> ${activeCategory.name}`, "title");
            print(`BRIEF: ${activeCategory.desc}`);
            print("================================================================================", "title");
            updatePrompt();
        }

        function showCategoryInspection() {
            outputEl.innerHTML = "";
            isInspecting = true;
            printRDHeader();

            const activeTier = techMatrix[selectedTierIndex];
            const item = activeTier.categories[selectedCategoryIndex];
            const isTierUnlocked = (selectedTierIndex <= GameState.data.maxUnlockedTier);

            print("================================================================================", "title");
            print(`              SPECIFICATION LEDGER // ${item.cat.toUpperCase()}`, "title");
            print("================================================================================", "title");
            print(`ITEM NAME:   ${item.name}`);
            print(`TIER LEVEL:  ${activeTier.tierName}`);
            print(`STATUS:      ${isTierUnlocked ? "UNLOCKED & AVAILABLE" : "RESEARCH REQUIRED"}`);
            print("--------------------------------------------------------------------------------");
            print("HARDWARE OVERVIEW:", "title");
            print(`  ${item.desc}`);
            print("--------------------------------------------------------------------------------");
            print("Press [W/A/S/D] to return to the catalog index.");
            print("================================================================================", "title");
            updatePrompt();
        }

        function renderVABMenu() {
            outputEl.innerHTML = "";
            printVABHeader();

            print("================================================================================", "title");
            print("                       VAB APPLICATION & SUITE SELECTION                        ", "title");
            print("================================================================================", "title");
            print("  Select an application by entering its option number below:");
            print("--------------------------------------------------------------------------------");

            vabApplications.forEach((app, idx) => {
                const isUnlocked = (app.reqTechTier <= GameState.data.maxUnlockedTier);
                const status = isUnlocked ? "[AVAILABLE]" : `[LOCKED - REQUIRES TIER ${app.reqTechTier}]`;
                const line = `  [${idx + 1}] ${app.name.padEnd(35)} ${status}`;
                print(line, "amber");
            });

            print("--------------------------------------------------------------------------------");
            print("Type 'exit' to leave the VAB.");
            print("================================================================================", "title");
            updatePrompt();
        }

        function renderVABAppStudio(app) {
            outputEl.innerHTML = "";
            printVABHeader();

            const v = GameState.data.vessel;
            const totalMass = v.mass_kg + Math.floor(v.fuelRatio * 4.2) + Math.floor(v.finArea * 1.5);
            const thrust = 12.5; // kN
            const twr = ((thrust * 1000) / (totalMass * 9.81)).toFixed(2);
            const estDV = Math.floor(1200 + (v.fuelRatio * 18) - (v.finArea * 5));

            print("================================================================================", "title");
            print(`            VAB TOOLKITS // ACTIVE: ${app.name.toUpperCase()}            `, "title");
            print("================================================================================", "title");
            print(`  TARGET CHASSIS: [ ${v.name} ]`);
            print("--------------------------------------------------------------------------------");
            print(" [TUNING & MODIFICATION MATRIX]", "title");
            print(`  [1] Fuel Mixture Ratio  : [${"█".repeat(Math.floor(v.fuelRatio / 10))}${"░".repeat(10 - Math.floor(v.fuelRatio / 10))}] ${v.fuelRatio}% Kerosene`);
            print(`  [2] Gimbal Limiter      : [${"█".repeat(Math.floor(v.gimbal / 10))}${"░".repeat(10 - Math.floor(v.gimbal / 10))}] ${v.gimbal}% Range`);
            print(`  [3] Aero Fin Area       : [${"█".repeat(Math.floor(v.finArea / 2))}${"░".repeat(10 - Math.floor(v.finArea / 2))}] ${v.finArea} sq.m`);
            print(`  [4] Stage Sep Delay     : [ ${v.sepDelay}s ]`);
            print("--------------------------------------------------------------------------------");
            print(" [DYNAMIC TELEMETRY CALCULATOR]", "title");
            print(`  Calculated Wet Mass : ${totalMass} kg`);
            print(`  Ground Thrust-to-Wt : ${twr} TWR`);
            print(`  Estimated Delta-V   : ${estDV} m/s`);
            print("--------------------------------------------------------------------------------");
            print("Controls: Type '1'-'4' to cycle values. Type 'back' for VAB Menu, or 'exit'.");
            print("================================================================================", "title");
            updatePrompt();
        }

        function processCommand(input) {
            if (isExecutingProgram) return;

            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${input}`, "amber");
            }

            if (inRDModule) {
                const cmd = input.toLowerCase();
                if (cmd === "exit") {
                    inRDModule = false;
                    isInspecting = false;
                    outputEl.innerHTML = "";
                    print("[SYS] R&D Library Session Closed.");
                    print("");
                    printLoggedInHelp();
                    updatePrompt();
                    return;
                }
                if (cmd === "unlock") {
                    if (selectedTierIndex <= GameState.data.maxUnlockedTier) {
                        print("[SYS] TIER ALREADY UNLOCKED.");
                    } else if (selectedTierIndex === GameState.data.maxUnlockedTier + 1) {
                        GameState.data.maxUnlockedTier = selectedTierIndex;
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] TECH TIER ${selectedTierIndex} UNLOCKED SUCCESSFULLY.`);
                        renderRDLibrary();
                    } else {
                        print(`[ERR] MUST UNLOCK TIER ${GameState.data.maxUnlockedTier + 1} FIRST.`);
                    }
                    return;
                }
                if (cmd === "w") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex > 0) selectedCategoryIndex--;
                    renderRDLibrary();
                    return;
                }
                if (cmd === "s") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex < techMatrix[selectedTierIndex].categories.length - 1) selectedCategoryIndex++;
                    renderRDLibrary();
                    return;
                }
                if (cmd === "a") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex > 0) {
                        selectedTierIndex--;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                    return;
                }
                if (cmd === "d") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex < techMatrix.length - 1) {
                        selectedTierIndex++;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                    return;
                }
                if (cmd === "e") {
                    if (!isInspecting) showCategoryInspection();
                    return;
                }
                print(`[SYS] Navigation: Use 'W', 'S', 'A', 'D', 'E', 'unlock', or type 'exit'.`);
                return;
            }

            if (inVABModule) {
                const cmd = input.toLowerCase();
                if (cmd === "exit") {
                    inVABModule = false;
                    activeVABApp = null;
                    outputEl.innerHTML = "";
                    print("[SYS] VAB Suite Exited.");
                    print("");
                    printLoggedInHelp();
                    updatePrompt();
                    return;
                }

                if (activeVABApp) {
                    if (cmd === "back") {
                        activeVABApp = null;
                        renderVABMenu();
                        return;
                    }
                    const v = GameState.data.vessel;
                    if (cmd === "1") {
                        v.fuelRatio = (v.fuelRatio + 10) > 100 ? 10 : v.fuelRatio + 10;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (cmd === "2") {
                        v.gimbal = (v.gimbal + 20) > 100 ? 20 : v.gimbal + 20;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (cmd === "3") {
                        v.finArea = (v.finArea + 2) > 20 ? 2 : v.finArea + 2;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (cmd === "4") {
                        v.sepDelay = (v.sepDelay >= 3.0) ? 0.5 : parseFloat((v.sepDelay + 0.5).toFixed(1));
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    print("[SYS] Type '1'-'4' to change parameters, 'back' for menu, or 'exit'.");
                    return;
                } else {
                    const option = parseInt(cmd, 10);
                    if (!isNaN(option) && option >= 1 && option <= vabApplications.length) {
                        const app = vabApplications[option - 1];
                        if (app.reqTechTier > GameState.data.maxUnlockedTier) {
                            print(`[ERR] ${app.name} is LOCKED. Requires Tier ${app.reqTechTier} research.`);
                            return;
                        }
                        activeVABApp = app;
                        renderVABAppStudio(app);
                        return;
                    }
                    print("[SYS] Select a valid option number or type 'exit'.");
                    return;
                }
            }

            if (currentMode === "NEW_NAME") {
                if (!input) return;
                tempName = input;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "NEW_PASS") {
                if (!input) return;
                const password = input;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                outputEl.innerHTML = "";
                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' initialized.`);
                print(`[SYS] Access ID locked: [${slotName}]`);
                print("");
                printProgramTree();
                printLoggedInHelp();
                return;
            }

            if (currentMode === "LOAD_SELECT") {
                if (!input) return;
                const targetSlot = input.toLowerCase().replace(/\s+/g, '_');

                if (input.toLowerCase() === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${input}' not found.`);
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "LOAD_PASS") {
                if (!input) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === input) {
                    GameState.data = parsedData;
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    
                    outputEl.innerHTML = "";
                    updatePrompt();
                    
                    print(`[SYS] Access granted for profile '${GameState.data.user.name}'.`);
                    print("");
                    printProgramTree();
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Incorrect password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            const parts = input.split(" ");
            const cmd = parts[0].toLowerCase();
            const subCmd = parts[1] ? parts[1].toLowerCase() : "";

            if (currentMode === "LOGGED_IN") {
                if ((cmd === "run" && subCmd === "r&d") || cmd === "r&d") {
                    runModuleBootSequence("R&D Module", () => {
                        inRDModule = true;
                        renderRDLibrary();
                    });
                    return;
                }

                if ((cmd === "run" && subCmd === "vab") || cmd === "vab") {
                    runModuleBootSequence("VAB Suite", () => {
                        inVABModule = true;
                        renderVABMenu();
                    });
                    return;
                }

                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "programs":
                    case "dir":
                        printProgramTree();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Unlocked Tier Level: ${GameState.data.maxUnlockedTier}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Telemetry saved to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        GameState.activeSlot = "default_save";
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help', 'run r&d', or 'run vab'.`);
                        break;
                }
                return;
            }

            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Scanning local memory...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const loadSaves = getSaveList();
                        if (loadSaves.length === 0) {
                            print("[ERR] No save files present in memory.");
                            return;
                        }

                        print("[SYS] Open Save Files:");
                        loadSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'.`);
                        break;
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (isExecutingProgram) return;

            if (inRDModule) {
                const key = e.key.toUpperCase();
                if (key === "W") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex > 0) selectedCategoryIndex--;
                    renderRDLibrary();
                } else if (key === "S") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex < techMatrix[selectedTierIndex].categories.length - 1) selectedCategoryIndex++;
                    renderRDLibrary();
                } else if (key === "A") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex > 0) {
                        selectedTierIndex--;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                } else if (key === "D") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex < techMatrix.length - 1) {
                        selectedTierIndex++;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                } else if (key === "E") {
                    if (!isInspecting) showCategoryInspection();
                }
            }

            if (e.key === "Enter") {
                const input = inputEl.value.trim();
                inputEl.value = "";
                processCommand(input);
            }
        });

        bootTerminal();
    </script>
</body>
</html>
