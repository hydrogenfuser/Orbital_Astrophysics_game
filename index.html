<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL OS - CRT TERMINAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #080500;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.65) 50%
            );
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 9;
            opacity: 0.85;
        }

        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.25;
        }

        .line-amber, .line-title, #prompt, #command-input {
            color: #ffb000;
            text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
        }

        .line-amber, .line-title {
            animation: generate-scan 0.08s ease-out forwards;
        }

        @keyframes generate-scan {
            0% {
                background-color: rgba(255, 176, 0, 0.12);
                color: #ffca42;
                text-shadow: 0 0 3px rgba(255, 176, 0, 0.6);
            }
            100% {
                background-color: transparent;
                color: #ffb000;
                text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
            }
        }

        .line-title { 
            font-weight: bold; 
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 176, 0, 0.4);
            padding-top: 8px;
        }
        #prompt {
            margin-right: 8px;
            font-weight: bold;
        }
        #command-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }

        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: rgba(255, 176, 0, 0.6);
        }
        #output::-webkit-scrollbar-track {
            background: #080500;
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">Command:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        let GameState = {
            activeSlot: null,
            data: {
                user: { name: "", password: "" },
                saveName: "",
                timestamp: null,
                unlockedTech: ["T0_FOUNDATION"],
                vessel: { name: "Probe-Alpha", mass_kg: 1200, altitude_m: 375000, velocity_ms: 2450 }
            }
        };

        let currentMode = "MAIN_MENU"; 
        let isExecutingProgram = false;
        let isMoveMode = false;
        let inRDModule = false;
        let tempName = "";
        let pendingLoadSlot = "";

        const techMatrix = [
            {
                tier: 0,
                tierName: "TIER 0: FOUNDATION TECH",
                unlocked: true,
                categories: [
                    { cat: "Probes", name: "Sounding Rocket Payloads", desc: "Tiny volume (0.5 - 2 IVU). Used for sub-orbital vertical hops to test instruments in vacuum." },
                    { cat: "Computers", name: "Mechanical / Manual Relays", desc: "Computers are mechanical and slow, operating purely via radio command execution." },
                    { cat: "Lifting Bodies", name: "Unpressurized Sounding Rockets", desc: "Solid/liquid rockets for potential energy testing." },
                    { cat: "Fuels", name: "Kerosene & Solid Propellants", desc: "Volatile mixtures with higher failure risks." },
                    { cat: "RCS", name: "Cold Gas Thrusters", desc: "Pressurized Nitrogen systems for simple attitude holds." },
                    { cat: "Power", name: "Primary Silver-Zinc Batteries", desc: "Non-rechargeable energy cells." },
                    { cat: "Heat", name: "Passive Conduction Fins", desc: "Basic structural cooling surfaces." },
                    { cat: "Comms", name: "Omnidirectional Whips", desc: "360-degree broad-spectrum radio emissions." },
                    { cat: "Science", name: "Basic Sounding Suite", desc: "Thermometers, Barometers, and Geiger counters." }
                ]
            },
            {
                tier: 1,
                tierName: "TIER 1: FIRST STEPS",
                unlocked: false,
                categories: [
                    { cat: "Probes", name: "Impactors & Early Satellites", desc: "Short-lived orbital probes and lunar impact capsules." },
                    { cat: "Computers", name: "Analog Guidance Computers", desc: "Basic analog calculation relays." },
                    { cat: "Lifting Bodies", name: "ICBM-derived Launchers", desc: "Unpressurized ballistic launch systems." },
                    { cat: "Fuels", name: "Refined RP-1 / LOX", desc: "Higher efficiency, safer mixtures." },
                    { cat: "RCS", name: "Hydrogen Peroxide Monopropellant", desc: "Catalytic thrust for directional control." },
                    { cat: "Power", name: "Basic Solar Panels", desc: "Photovoltaic power generation." },
                    { cat: "Heat", name: "Multi-Layer Insulation (MLI)", desc: "Gold/Silver skin wraps for radiation shield." },
                    { cat: "Comms", name: "Yagi-Uda Directional Antennas", desc: "Point-to-point radio dishes." },
                    { cat: "Science", name: "Deployable Boom Magnetometers", desc: "Extended sensors for cleaner data capture." }
                ]
            }
        ];

        let selectedTierIndex = 0;
        let selectedCategoryIndex = 0;

        const outputEl = document.getElementById("output");
        const promptEl = document.getElementById("prompt");
        const inputEl = document.getElementById("command-input");

        function print(text, type = "amber") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function updatePrompt() {
            if (isMoveMode) {
                promptEl.textContent = `[TREE NAV // TIER ${selectedTierIndex}: WASD=Move | E=Inspect | Q=Exit]> `;
                return;
            }
            if (inRDModule) {
                promptEl.textContent = `[R&D EXEC // VIEWING: TIER ${selectedTierIndex}]> Command:`;
                return;
            }
            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
        }

        function showTitle() {
            print("╔══════════════════════════════════════════════════╗", "title");
            print("║                   ORBITAL OS                     ║", "title");
            print("║              CRT MONITOR SYSTEM 0.1              ║", "title");
            print("╚══════════════════════════════════════════════════╝", "title");
            print("");
        }

        function printProgramTree() {
            print("ORBITAL OS // SYSTEM DIRECTORY", "title");
            print("└── System Programs");
            print("    ├── VAB");
            print("    ├── Hangars");
            print("    ├── R&D");
            print("    ├── Astronaut Complex");
            print("    ├── Contractors");
            print("    ├── Flight");
            print("    ├── DSN");
            print("    └── Planetary Charts");
            print("");
        }

        function printMainMenuHelp() {
            print("System offline. Available commands:");
            print("  new             - Create a new profile and start game");
            print("  load            - View save files and login");
            print("  saves           - List available save files");
            print("  clear           - Clear terminal buffer");
        }

        function printLoggedInHelp() {
            print("Session Active. Available commands:");
            print("  run [program]   - Execute system program (e.g. 'run r&d')");
            print("  programs        - Display system program tree");
            print("  status          - Display vessel parameters and telemetry");
            print("  save            - Save current progress");
            print("  logout          - Exit current session and lock terminal");
            print("  clear           - Clear terminal buffer");
        }

        function bootTerminal() {
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            inRDModule = false;
            isMoveMode = false;
            updatePrompt();
            printMainMenuHelp();
        }

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        async function runRDProgram() {
            isExecutingProgram = true;
            inputEl.disabled = true;
            outputEl.innerHTML = "";

            const bootLogs = [
                "[SYS] INITIALIZING EXECUTABLE: R&D.PMCS...",
                "[SYS] ALLOCATING MEMORY SECTORS...",
                "[SYS] RENDERING ASCII TECH TREE CANVAS...",
                "[SYS] EXECUTION OK."
            ];

            for (const log of bootLogs) {
                print(log);
                await new Promise(r => setTimeout(r, 20));
            }
            print("");

            const asciiR = ["██████╗ ", "██╔══██╗", "██████╔╝", "██╔══██╗", "██║  ██║", "╚═╝  ╚═╝"];
            const asciiAnd = [" █████╗ ", "██╔══██╗", "╚█████╔╝", "██╔══██╗", "╚█████╔╝", " ╚════╝ "];
            const asciiD = ["██████╗ ", "██╔══██╗", "██║  ██║", "██║  ██║", "██████╔╝", "╚═════╝ "];

            for (let i = 0; i < 6; i++) {
                print(asciiR[i] + "  " + asciiAnd[i] + "  " + asciiD[i], "title");
                await new Promise(r => setTimeout(r, 1000));
            }
            print("");

            print("LOADING TECH MATRIX:");
            let progress = 0;
            const progressDiv = document.createElement("div");
            progressDiv.className = "line-amber";
            outputEl.appendChild(progressDiv);

            while (progress < 100) {
                progress += 10;
                progressDiv.textContent = `PROGRESS: [${"█".repeat(progress / 5)}${"-".repeat(20 - progress / 5)}] ${progress}%`;
                await new Promise(r => setTimeout(r, 80));
            }

            isExecutingProgram = false;
            inRDModule = true;
            isMoveMode = false;
            inputEl.disabled = false;
            inputEl.focus();
            
            renderMainRDView();
        }

        // RENDER NON-MOVE MAIN VIEW WITH DYNAMIC ASCII TREE
        function renderMainRDView() {
            outputEl.innerHTML = "";
            print("================================================================================", "title");
            print("                   RESEARCH & DEVELOPMENT // MAIN TERMINAL                      ", "title");
            print("================================================================================", "title");
            print("");
            print("                     • • •  • • •                 ");
            print("                   • • • • • • • • •              [ TIER 1: FIRST STEPS ]");
            print("                  • • • • • • • • • •             (LOCKED BRANCH)");
            print("                   • • • • • • • • •              / ");
            print("                     \\  • • • •  /               /  ");
            print("                      \\    ||   /               /   ");
            print("                       \\   ||  /               /    ");
            print("                        \\  || /               /     ");
            print("                         \\ ||/               /      ");
            print("      • • • • •           \\||               /       ");
            print("    • • • • • • •          ||              /        ");
            print("   • • • • • • • • • ══════╬══════════════╝         ");
            print("    • • • • • • •          ||                       ");
            print("      • • • • •            ||                       ");
            print("                           ||                       ");
            print("                 [ Tier 0: Foundation ]             ");
            print("                   (UNLOCKED STUMP)                 ");
            print("");
            print("================================================================================", "title");
            print("  STATUS: Viewing Tier 0 Root Branch");
            print("  COMMANDS:");
            print("    move      - Enter WASD matrix mode to scroll categories and specs");
            print("    terminate - Exit R&D module and unmount process");
            print("================================================================================", "title");
            updatePrompt();
        }

        function renderStaticTechTree() {
            outputEl.innerHTML = "";

            const activeTier = techMatrix[selectedTierIndex];
            const activeCategory = activeTier.categories[selectedCategoryIndex];

            print("================================================================================", "title");
            print(`                     R&D TECH TREE MATRIX // ${activeTier.tierName}`, "title");
            print("================================================================================", "title");
            print("  CONTROLS: [W/S] Move Category  |  [A/D] Switch Tier  |  [E] Spec Sheet  |  [Q] Exit Nav");
            print("--------------------------------------------------------------------------------");

            for (let i = 0; i < activeTier.categories.length; i++) {
                const item = activeTier.categories[i];
                const isSelected = (i === selectedCategoryIndex);
                
                let lineStr = isSelected 
                    ? ` ►► [${item.cat.toUpperCase()}] : ${item.name} ◄◄` 
                    : `    [${item.cat.toUpperCase()}] : ${item.name}`;

                print(lineStr, isSelected ? "title" : "amber");
            }

            print("--------------------------------------------------------------------------------");
            print(`HIGHLIGHTED SPECIFICATION: [${activeCategory.cat.toUpperCase()}] -> ${activeCategory.name}`, "title");
            print(`DESCRIPTION: ${activeCategory.desc}`);
            print("================================================================================", "title");
            updatePrompt();
        }

        function showCategoryInspection(item) {
            outputEl.innerHTML = "";
            print("================================================================================", "title");
            print(`                   HARDWARE INSPECTION LEDGER: ${item.cat.toUpperCase()}`, "title");
            print("================================================================================", "title");
            print(`NAME: ${item.name}`);
            print(`SUBSYSTEM CLASSIFICATION: ${item.cat}`);
            print("");
            print("TECHNICAL OVERVIEW:", "title");
            print(`  ${item.desc}`);
            print("");
            print("--------------------------------------------------------------------------------");
            print("Press [W/A/S/D] to return to category list, or [Q] to exit navigation mode.");
            print("--------------------------------------------------------------------------------");
        }

        function processCommand(input) {
            if (isExecutingProgram) return;

            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${input}`, "amber");
            }

            if (currentMode === "NEW_NAME") {
                if (!input) return;
                tempName = input;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "NEW_PASS") {
                if (!input) return;
                const password = input;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                outputEl.innerHTML = "";
                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' initialized.`);
                print(`[SYS] Access ID locked: [${slotName}]`);
                print("");
                printProgramTree();
                printLoggedInHelp();
                return;
            }

            if (currentMode === "LOAD_SELECT") {
                if (!input) return;
                const targetSlot = input.toLowerCase().replace(/\s+/g, '_');

                if (input.toLowerCase() === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${input}' not found.`);
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "LOAD_PASS") {
                if (!input) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === input) {
                    GameState.data = parsedData;
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    
                    outputEl.innerHTML = "";
                    updatePrompt();
                    
                    print(`[SYS] Access granted for profile '${GameState.data.user.name}'.`);
                    print("");
                    printProgramTree();
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Incorrect password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            const parts = input.split(" ");
            const cmd = parts[0].toLowerCase();
            const subCmd = parts[1] ? parts[1].toLowerCase() : "";

            if (inRDModule) {
                if (cmd === "move") {
                    isMoveMode = true;
                    inputEl.disabled = true;
                    renderStaticTechTree();
                    return;
                }
                if (cmd === "terminate") {
                    inRDModule = false;
                    isMoveMode = false;
                    outputEl.innerHTML = "";
                    print("[SYS] R&D Module Terminated.");
                    print("");
                    printLoggedInHelp();
                    updatePrompt();
                    return;
                }
                print(`[ERR] Program active. Valid commands: 'move', 'terminate'.`);
                return;
            }

            if (currentMode === "LOGGED_IN") {
                if ((cmd === "run" && subCmd === "r&d") || cmd === "r&d") {
                    runRDProgram();
                    return;
                }

                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "programs":
                    case "dir":
                        printProgramTree();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Telemetry saved to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        GameState.activeSlot = null;
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' or 'run r&d'.`);
                        break;
                }
                return;
            }

            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Scanning local memory...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const loadSaves = getSaveList();
                        if (loadSaves.length === 0) {
                            print("[ERR] No save files present in memory.");
                            return;
                        }

                        print("[SYS] Open Save Files:");
                        loadSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'.`);
                        break;
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (isExecutingProgram) return;

            if (isMoveMode) {
                const key = e.key.toUpperCase();

                if (key === "W" && selectedCategoryIndex > 0) {
                    selectedCategoryIndex--;
                    renderStaticTechTree();
                } else if (key === "S" && selectedCategoryIndex < techMatrix[selectedTierIndex].categories.length - 1) {
                    selectedCategoryIndex++;
                    renderStaticTechTree();
                } else if (key === "A" && selectedTierIndex > 0) {
                    selectedTierIndex--;
                    renderStaticTechTree();
                } else if (key === "D" && selectedTierIndex < techMatrix.length - 1) {
                    selectedTierIndex++;
                    renderStaticTechTree();
                } else if (key === "E") {
                    const item = techMatrix[selectedTierIndex].categories[selectedCategoryIndex];
                    showCategoryInspection(item);
                } else if (key === "Q") {
                    e.preventDefault(); // Prevent 'q' character from printing
                    isMoveMode = false;
                    inputEl.disabled = false;
                    inputEl.focus();
                    inputEl.value = ""; // Clear buffer
                    renderMainRDView();
                }
                return;
            }

            if (e.key === "Enter") {
                const input = inputEl.value.trim();
                inputEl.value = "";
                processCommand(input);
            }
        });

        bootTerminal();
    </script>
</body>
</html>
