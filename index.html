<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL OS - CRT TERMINAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #080500;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.65) 50%
            );
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 9;
            opacity: 0.85;
        }

        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.25;
        }

        .line-amber, .line-title, #prompt, #command-input {
            color: #ffb000;
            text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
        }

        .line-amber, .line-title {
            animation: generate-scan 0.08s ease-out forwards;
        }

        @keyframes generate-scan {
            0% {
                background-color: rgba(255, 176, 0, 0.12);
                color: #ffca42;
                text-shadow: 0 0 3px rgba(255, 176, 0, 0.6);
            }
            100% {
                background-color: transparent;
                color: #ffb000;
                text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
            }
        }

        .line-title { 
            font-weight: bold; 
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 176, 0, 0.4);
            padding-top: 8px;
        }
        #prompt {
            margin-right: 8px;
            font-weight: bold;
        }
        #command-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }

        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: rgba(255, 176, 0, 0.6);
        }
        #output::-webkit-scrollbar-track {
            background: #080500;
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">Command:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        let GameState = {
            activeSlot: null,
            data: {
                user: { name: "", password: "" },
                saveName: "",
                timestamp: null,
                unlockedTech: ["T0_FOUNDATION"],
                vessel: { name: "Probe-Alpha", mass_kg: 1200, altitude_m: 375000, velocity_ms: 2450 }
            }
        };

        let currentMode = "MAIN_MENU"; 
        let isExecutingProgram = false;
        let isMoveMode = false;
        let tempName = "";
        let pendingLoadSlot = "";
        let pendingDeleteSlot = "";

        // Tech Tree Matrix Definition
        const techTree = [
            [
                { 
                    id: "T0_FOUNDATION", 
                    name: "Tier 0: Foundation Tech", 
                    tier: 0, 
                    unlocked: true,
                    desc: "Baseline sub-orbital rocket components and primitive analog systems.",
                    tech: [
                        "Probes: Sounding Rocket Payloads (0.5 - 2 IVU)",
                        "Computers: Mechanical / Manual Control Relays",
                        "Lifting Bodies: Unpressurized Sounding Rockets",
                        "Fuels: Low-grade Kerosene & Solid Propellants",
                        "RCS: Cold Gas Thrusters (Compressed Nitrogen)",
                        "Power: Primary Silver-Zinc Non-Rechargeable Batteries",
                        "Heat: Passive Conduction Fins & Thermal Paint",
                        "Comms: Omnidirectional Whip Antennas",
                        "Science: Thermometer, Barometer, Geiger Counter"
                    ]
                }
            ],
            [
                { 
                    id: "T1_EARLY_SPACE", 
                    name: "Tier 1: First Steps", 
                    tier: 1, 
                    unlocked: false,
                    desc: "Early orbital delivery systems, impactors, and short-lived satellites.",
                    tech: [
                        "Probes: Impactors, Early Satellites, Return Capsules",
                        "Computers: Analog Computers (AP/PE math via ground control)",
                        "Lifting Bodies: Early ICBM-based launch vehicles",
                        "Fuels: Refined RP-1 / LOX & Advanced Solids",
                        "RCS: Hydrogen Peroxide Monopropellant",
                        "Power: Basic Fragile Solar Panels",
                        "Heat: Gold/Silver Multi-Layer Insulation (MLI)",
                        "Comms: Directional Yagi-Uda Antennas",
                        "Science: Micrometeoroid Drums, Deployable Boom Magnetometers"
                    ]
                }
            ]
        ];

        let selectedRow = 0;
        let selectedCol = 0;

        const outputEl = document.getElementById("output");
        const promptEl = document.getElementById("prompt");
        const inputEl = document.getElementById("command-input");

        function print(text, type = "amber") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function updatePrompt() {
            if (isMoveMode) {
                promptEl.textContent = "[TREE NAV: WASD=Navigate | E=Detailed Inspection | Q=Exit]> ";
                return;
            }
            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                case "DELETE_SELECT":
                    promptEl.textContent = "Delete Save File:";
                    break;
                case "DELETE_CONFIRM":
                    promptEl.textContent = "Are you sure? (Y/N):";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
        }

        function showTitle() {
            print("╔══════════════════════════════════════════════════╗", "title");
            print("║                   ORBITAL OS                     ║", "title");
            print("║              CRT MONITOR SYSTEM 0.1              ║", "title");
            print("╚══════════════════════════════════════════════════╝", "title");
            print("");
        }

        function printProgramTree() {
            print("ORBITAL OS // SYSTEM DIRECTORY", "title");
            print("└── System Programs");
            print("    ├── VAB");
            print("    ├── Hangars");
            print("    ├── R&D");
            print("    ├── Astronaut Complex");
            print("    ├── Contractors");
            print("    ├── Flight");
            print("    ├── DSN");
            print("    └── Planetary Charts");
            print("");
        }

        function printMainMenuHelp() {
            print("System offline. Available commands:");
            print("  new      - Create a new profile and start game");
            print("  load     - View save files and login");
            print("  delete   - Delete a save file");
            print("  saves    - List available save files");
            print("  clear    - Clear terminal buffer");
        }

        function printLoggedInHelp() {
            print("Session Active. Available commands:");
            print("  run r&d  - Execute Research & Development Module");
            print("  programs - Display system program tree");
            print("  status   - Display vessel parameters and telemetry");
            print("  save     - Save current progress");
            print("  logout   - Exit current session and lock terminal");
            print("  clear    - Clear terminal buffer");
        }

        function bootTerminal() {
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            updatePrompt();
            printMainMenuHelp();
        }

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        // Executable Async Boot
        async function runRDProgram() {
            isExecutingProgram = true;
            inputEl.disabled = true;
            outputEl.innerHTML = "";

            const bootLogs = [
                "[SYS] INITIALIZING EXECUTABLE: R&D.PMCS...",
                "[SYS] ALLOCATING MEMORY SECTORS 0x00FF - 0x048A...",
                "[SYS] MOUNTING ARCHIVE: /sys/rd/tech_tree.db... OK",
                "[SYS] LOADING SCHEMATIC RENDERING ENGINE...",
                "[SYS] LINKING TECH NODES... OK",
                "[SYS] EXECUTION OK."
            ];

            for (const log of bootLogs) {
                print(log);
                await new Promise(r => setTimeout(r, Math.floor(Math.random() * 20) + 10));
            }
            print("");

            const asciiR = ["██████╗ ", "██╔══██╗", "██████╔╝", "██╔══██╗", "██║  ██║", "╚═╝  ╚═╝"];
            const asciiAnd = [" █████╗ ", "██╔══██╗", "╚█████╔╝", "██╔══██╗", "╚█████╔╝", " ╚════╝ "];
            const asciiD = ["██████╗ ", "██╔══██╗", "██║  ██║", "██║  ██║", "██████╔╝", "╚═════╝ "];

            for (let i = 0; i < 6; i++) {
                print(asciiR[i] + "  " + asciiAnd[i] + "  " + asciiD[i], "title");
                await new Promise(r => setTimeout(r, 1000));
            }
            print("");

            print("LOADING TECH MATRIX:");
            let progress = 0;
            const stallPoint = Math.floor(Math.random() * 60) + 20;
            const willStall = Math.random() < 0.25;
            let hasStalled = false;

            const progressDiv = document.createElement("div");
            progressDiv.className = "line-amber";
            outputEl.appendChild(progressDiv);

            while (progress < 100) {
                progress += 5;
                if (progress > 100) progress = 100;

                if (willStall && !hasStalled && progress >= stallPoint) {
                    hasStalled = true;
                    progressDiv.textContent = `PROGRESS: [${"█".repeat(Math.floor(progress / 5))}${"-".repeat(20 - Math.floor(progress / 5))}] ${Math.floor(progress)}% [BUSY...]`;
                    await new Promise(r => setTimeout(r, 2000));
                }

                progressDiv.textContent = `PROGRESS: [${"█".repeat(Math.floor(progress / 5))}${"-".repeat(20 - Math.floor(progress / 5))}] ${Math.floor(progress)}%`;
                await new Promise(r => setTimeout(r, 100));
            }

            // Lock into Tree View
            isExecutingProgram = false;
            isMoveMode = true;
            renderStaticTechTree();
            updatePrompt();
        }

        // KSP-Style Static Frame Render
        function renderStaticTechTree() {
            outputEl.innerHTML = ""; // Clear buffer to draw static layout

            print("================================================================================", "title");
            print("                     RESEARCH & DEVELOPMENT TECH TREE                           ", "title");
            print("================================================================================", "title");
            print("  CONTROLS: [W/A/S/D] Navigate Nodes  |  [E] Full Ledger  |  [Q] Exit View");
            print("--------------------------------------------------------------------------------");

            // Render Node Grid Map
            for (let r = 0; r < techTree.length; r++) {
                let nodeRowStr = "";
                for (let c = 0; c < techTree[r].length; c++) {
                    const node = techTree[r][c];
                    const isSelected = (r === selectedRow && c === selectedCol);
                    const statusTag = node.unlocked ? "[UNLOCKED]" : "[LOCKED]";
                    
                    if (isSelected) {
                        nodeRowStr += `  ►► [[ ${node.name} ]] ${statusTag} ◄◄  `;
                    } else {
                        nodeRowStr += `     [ ${node.name} ] ${statusTag}     `;
                    }
                }
                print(nodeRowStr, (r === selectedRow) ? "title" : "amber");

                if (r < techTree.length - 1) {
                    print("            │", "amber");
                    print("            ▼", "amber");
                }
            }

            // Real-Time Dynamic Inspection Panel
            const currentNode = techTree[selectedRow][selectedCol];
            print("--------------------------------------------------------------------------------");
            print(`NODE DETAILS: ${currentNode.name.toUpperCase()}`, "title");
            print(`DESCRIPTION: ${currentNode.desc}`);
            print("INCLUDED TECH & MODULES:");
            currentNode.tech.forEach(item => {
                print(`  • ${item}`);
            });
            print("================================================================================", "title");
        }

        function showFullLedger(node) {
            outputEl.innerHTML = "";
            print("================================================================================", "title");
            print(`                   HARDWARE SPECIFICATION LEDGER: ${node.name.toUpperCase()}`, "title");
            print("================================================================================", "title");
            print(`STATUS: ${node.unlocked ? "UNLOCKED & AVAILABLE" : "LOCKED"}`);
            print(`SUMMARY: ${node.desc}`);
            print("");
            print("TECHNICAL CATEGORY BREAKDOWN:", "title");
            node.tech.forEach(item => print(`  [SYSTEM SPEC] ${item}`));
            print("");
            print("--------------------------------------------------------------------------------");
            print("Press [W/A/S/D] to resume tree navigation or [Q] to exit to terminal.");
            print("--------------------------------------------------------------------------------");
        }

        function processCommand(input) {
            if (isExecutingProgram) return;

            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${input}`, "amber");
            }

            if (currentMode === "NEW_NAME") {
                if (!input) return;
                tempName = input;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "NEW_PASS") {
                if (!input) return;
                const password = input;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                outputEl.innerHTML = "";
                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' initialized.`);
                print(`[SYS] Access ID locked: [${slotName}]`);
                print("");
                printProgramTree();
                printLoggedInHelp();
                return;
            }

            if (currentMode === "LOAD_SELECT") {
                if (!input) return;
                const targetSlot = input.toLowerCase().replace(/\s+/g, '_');

                if (input.toLowerCase() === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${input}' not found.`);
                    print("Enter valid save file name or type 'cancel':");
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "LOAD_PASS") {
                if (!input) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === input) {
                    GameState.data = parsedData;
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    
                    outputEl.innerHTML = "";
                    updatePrompt();
                    
                    print(`[SYS] Access granted. Session loaded for profile '${GameState.data.user.name}'.`);
                    print("");
                    printProgramTree();
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Incorrect password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            const parts = input.split(" ");
            const cmd = parts[0].toLowerCase();
            const subCmd = parts[1] ? parts[1].toLowerCase() : "";

            if (currentMode === "LOGGED_IN") {
                if ((cmd === "run" && subCmd === "r&d") || cmd === "r&d") {
                    runRDProgram();
                    return;
                }

                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "programs":
                    case "dir":
                        printProgramTree();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        print(`Altitude: ${GameState.data.vessel.altitude_m} m`);
                        print(`Velocity: ${GameState.data.vessel.velocity_ms} m/s`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Telemetry saved to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        print(`[SYS] Logging out user '${GameState.data.user.name}'...`);
                        GameState.activeSlot = null;
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' or 'run r&d'.`);
                        break;
                }
                return;
            }

            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Scanning local state memory...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const loadSaves = getSaveList();
                        if (loadSaves.length === 0) {
                            print("[ERR] No save files present in system memory.");
                            return;
                        }

                        print("[SYS] Open Save Files Available:");
                        loadSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' for options.`);
                        break;
                }
            }
        }

        // Global Keyboard Handler (Input + WASD Matrix Nav)
        window.addEventListener("keydown", (e) => {
            if (isExecutingProgram) return;

            if (isMoveMode) {
                const key = e.key.toUpperCase();

                if (key === "W" && selectedRow > 0) {
                    selectedRow--;
                    if (selectedCol >= techTree[selectedRow].length) selectedCol = techTree[selectedRow].length - 1;
                    renderStaticTechTree();
                } else if (key === "S" && selectedRow < techTree.length - 1) {
                    selectedRow++;
                    if (selectedCol >= techTree[selectedRow].length) selectedCol = techTree[selectedRow].length - 1;
                    renderStaticTechTree();
                } else if (key === "A" && selectedCol > 0) {
                    selectedCol--;
                    renderStaticTechTree();
                } else if (key === "D" && selectedCol < techTree[selectedRow].length - 1) {
                    selectedCol++;
                    renderStaticTechTree();
                } else if (key === "E") {
                    const currentNode = techTree[selectedRow][selectedCol];
                    showFullLedger(currentNode);
                } else if (key === "Q") {
                    isMoveMode = false;
                    inputEl.disabled = false;
                    inputEl.focus();
                    outputEl.innerHTML = "";
                    updatePrompt();
                    print("[SYS] Exited R&D Tech Tree view.");
                    printLoggedInHelp();
                }
                return;
            }

            if (e.key === "Enter") {
                const input = inputEl.value.trim();
                inputEl.value = "";
                processCommand(input);
            }
        });

        bootTerminal();
    </script>
</body>
</html>
