}

    init: function() {
        this.ctx = this.canvas.getContext("2d");
        this.resize();
        window.addEventListener("resize", () => this.resize());
        
        this.canvas.addEventListener("mousedown", (e) => {
            this.isDragging = true;
            this.isTracking = false; 
            this.mouseMoved = false;
            this.dragStart = { x: e.clientX - this.camera.x, y: e.clientY - this.camera.y };
        });
        
        window.addEventListener("mousemove", (e) => {
            const rect = this.canvas.getBoundingClientRect();
            const mX = e.clientX - rect.left;
            const mY = e.clientY - rect.top;

            let overButton = false;
            if (this.btnBounds && mX >= this.btnBounds.x1 && mX <= this.btnBounds.x2 && mY >= this.btnBounds.y1 && mY <= this.btnBounds.y2) {
                overButton = true;
            }

            if (overButton) {
                if (!this.encyclopediaHovered) this.encyclopediaHovered = true;
                this.canvas.style.cursor = "pointer";
            } else {
                if (this.encyclopediaHovered) this.encyclopediaHovered = false;
                this.canvas.style.cursor = "crosshair";
            }

            if (!this.isDragging) return;
            this.mouseMoved = true;
            this.camera.x = e.clientX - this.dragStart.x;
            this.camera.y = e.clientY - this.dragStart.y;
        });

        window.addEventListener("mouseup", (e) => {
            this.isDragging = false;
            if (!this.mouseMoved) {
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                if (this.btnBounds && mouseX >= this.btnBounds.x1 && mouseX <= this.btnBounds.x2 && mouseY >= this.btnBounds.y1 && mouseY <= this.btnBounds.y2) {
                    return; 
                }
                
                this.checkClickSelection(mouseX, mouseY);
            }
        });
        
        this.canvas.addEventListener("wheel", (e) => {
            const zoomAmount = e.deltaY > 0 ? 0.8 : 1.25; 
            const rect = this.canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const worldX = (mouseX - this.camera.x - this.canvas.width/2) / this.camera.zoom;
            const worldY = (mouseY - this.camera.y - this.canvas.height/2) / this.camera.zoom;

            let newZoom = this.camera.zoom * zoomAmount;
            
            if (newZoom < 0.00000001) newZoom = 0.00000001; 
            if (newZoom > 20.0) newZoom = 20.0; 

            this.camera.zoom = newZoom;
            
            if(!this.isTracking) {
                this.camera.x = mouseX - (worldX * this.camera.zoom) - this.canvas.width/2;
                this.camera.y = mouseY - (worldY * this.camera.zoom) - this.canvas.height/2;
            }

            let visibleMajorBodies = [];
            let bodiesToCheck = [this.system, ...this.system.bodies]; 
            const cx = this.canvas.width / 2 + this.camera.x;
            const cy = this.canvas.height / 2 + this.camera.y;

            bodiesToCheck.forEach(b => {
                const sx = cx + (b.currentX * this.camera.zoom);
                const sy = cy + (b.currentY * this.camera.zoom);
                if (sx >= 0 && sx <= this.canvas.width && sy >= 0 && sy <= this.canvas.height) {
                    visibleMajorBodies.push(b);
                }
            });

            if (e.deltaY < 0) {
                if (visibleMajorBodies.length === 1 && !this.isTracking) {
                    this.activeTarget = visibleMajorBodies[0];
                    this.isTracking = true;
                }
            } else {
                if (this.isTracking && visibleMajorBodies.length > 1) {
                    this.isTracking = false;
                }
            }
        });
    },

    checkClickSelection: function(mouseX, mouseY) {
        const cx = this.canvas.width / 2 + this.camera.x;
        const cy = this.canvas.height / 2 + this.camera.y;
        
        let oVisRad = this.system.radius * this.camera.zoom;
        if (oVisRad < 15) oVisRad = 15; 

        if (Math.hypot(mouseX - cx, mouseY - cy) < oVisRad) {
            this.activeTarget = this.system;
            this.isTracking = true;
            return;
        }

        for (let planet of this.system.bodies) {
            const px = cx + (planet.currentX * this.camera.zoom);
            const py = cy + (planet.currentY * this.camera.zoom);
            let pVisRad = planet.radius * this.camera.zoom;
            if (pVisRad < 15) pVisRad = 15;

            if (Math.hypot(mouseX - px, mouseY - py) < pVisRad) {
                this.activeTarget = planet;
                this.isTracking = true;
                return;
            }
            
            for (let moon of planet.bodies) {
                const mx = cx + (moon.currentX * this.camera.zoom);
                const my = cy + (moon.currentY * this.camera.zoom);
                let mVisRad = moon.radius * this.camera.zoom;
                if (mVisRad < 10) mVisRad = 10;

                if (Math.hypot(mouseX - mx, mouseY - my) < mVisRad) {
                    this.activeTarget = moon;
                    this.isTracking = true;
                    return;
                }
            }
        }
        this.activeTarget = null; 
        this.isTracking = false;
    },

    selectTargetByName: function(name) {
        if (name === "OSIRIS") {
            this.activeTarget = this.system;
            this.isTracking = true;
            return true;
        }
        for (let planet of this.system.bodies) {
            if (planet.name === name) {
                this.activeTarget = planet;
                this.isTracking = true;
                return true;
            }
            for (let moon of planet.bodies) {
                if (moon.name === name) {
                    this.activeTarget = moon;
                    this.isTracking = true;
                    return true;
                }
            }
        }
        return false;
    },

    resize: function() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight - 50; 
    },

    start: function() {
        this.isRunning = true;
        this.canvas.style.display = "block";
        document.getElementById("output-log").style.display = "none";
        this.loop();
    },

    stop: function() {
        this.isRunning = false;
        this.activeTarget = null;
        this.isTracking = false;
        this.canvas.style.display = "none";
        document.getElementById("output-log").style.display = "block";
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    },

    loop: function() {
        if (!this.isRunning) return;
        this.update();
        this.render();
        requestAnimationFrame(() => this.loop());
    },

    update: function() {
        const elapsedSeconds = ((Date.now() - this.startTime) / 1000) * this.timeScale;
        
        this.system.bodies.forEach(planet => {
            const tP = ((2 * Math.PI) / planet.period) * elapsedSeconds;
            const rP = (planet.a * (1 - Math.pow(planet.e, 2))) / (1 + planet.e * Math.cos(tP));
            planet.currentR = rP; 
            planet.currentX = rP * Math.cos(tP);
            planet.currentY = rP * Math.sin(tP);
            
            planet.bodies.forEach(moon => {
                const tM = ((2 * Math.PI) / moon.period) * elapsedSeconds;
                const rM = (moon.a * (1 - Math.pow(moon.e, 2))) / (1 + moon.e * Math.cos(tM));
                moon.currentR = rM;
                if(planet.name === "RSAK" && moon.name === "RSUK") {
                    moon.currentX = planet.currentX + (rM * Math.cos(tM));
                    moon.currentY = planet.currentY + (rM * Math.sin(tM));
                } else if (planet.name === "RSAK" && moon.name === "ION") {
                    moon.currentX = planet.currentX + (rM * Math.cos(tM * 0.3));
                    moon.currentY = planet.currentY + (rM * Math.sin(tM * 0.3));
                } else {
                    moon.currentX = planet.currentX + (rM * Math.cos(tM));
                    moon.currentY = planet.currentY + (rM * Math.sin(tM));
                }
            });
        });

        if (this.activeTarget && this.isTracking) {
            this.camera.x = -(this.activeTarget.currentX * this.camera.zoom);
            this.camera.y = -(this.activeTarget.currentY * this.camera.zoom);
        }
    },

    render: function() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        const cx = this.canvas.width / 2 + this.camera.x;
        const cy = this.canvas.height / 2 + this.camera.y;

        // 1. Render Osiris Solid Accretion Discs (Solid Color, No Gradient Step Layers)
        if (this.camera.zoom > 0.00000001) {
            this.system.discs.forEach(disc => {
                const discRadius = (disc.start + disc.end) / 2;
                const discWidth = disc.end - disc.start;
                if (discRadius * this.camera.zoom > 0.5) {
                    this.ctx.beginPath();
                    this.ctx.arc(cx, cy, discRadius * this.camera.zoom, 0, 2 * Math.PI);
                    this.ctx.lineWidth = discWidth * this.camera.zoom;
                    this.ctx.strokeStyle = disc.color;
                    this.ctx.stroke();
                }
            });
            this.ctx.lineWidth = 1; 
        }

        // 2. Draw Osiris Event Horizon
        let oVisRad = this.system.radius * this.camera.zoom;
        if (oVisRad < 1.5) oVisRad = 1.5; 
        this.ctx.beginPath();
        this.ctx.arc(cx, cy, oVisRad, 0, 2 * Math.PI);
        this.ctx.fillStyle = "#0a0500"; 
        this.ctx.fill();
        this.ctx.strokeStyle = "#ffb000";
        this.ctx.stroke();

        if (this.activeTarget === this.system) {
            this.ctx.beginPath(); this.ctx.arc(cx, cy, oVisRad + 5, 0, 2 * Math.PI); this.ctx.stroke();
        }

        this.system.bodies.forEach(planet => {
            const px = cx + (planet.currentX * this.camera.zoom);
            const py = cy + (planet.currentY * this.camera.zoom);

            // 3. Draw Planet Orbit Path
            this.ctx.beginPath();
            this.ctx.setLineDash([5, 5]);
            this.ctx.strokeStyle = "rgba(255, 176, 0, 0.4)";
            const pOffset = planet.a * planet.e * this.camera.zoom;
            this.ctx.arc(cx - pOffset, cy, planet.a * this.camera.zoom, 0, 2 * Math.PI);
            this.ctx.stroke();
            this.ctx.setLineDash([]);

            // 4. Draw Rings (Realistic Scaling Width Check)
            if (this.camera.zoom > 0.0000001) {
                planet.rings.forEach(ring => {
                    const ringRadius = (ring.start + ring.end) / 2;
                    const ringWidth = ring.end - ring.start;
                    this.ctx.beginPath();
                    this.ctx.arc(px, py, ringRadius * this.camera.zoom, 0, 2 * Math.PI);
                    this.ctx.lineWidth = Math.max(0.5, ringWidth * this.camera.zoom);
                    this.ctx.strokeStyle = ring.color;
                    this.ctx.stroke();
                });
                this.ctx.lineWidth = 1; 
            }

            // 5. Draw Moon Orbit Paths
            planet.bodies.forEach(moon => {
                this.ctx.beginPath();
                this.ctx.setLineDash([2, 4]);
                this.ctx.strokeStyle = "rgba(255, 176, 0, 0.3)";
                const mOffset = moon.a * moon.e * this.camera.zoom;
                this.ctx.arc(px - mOffset, py, moon.a * this.camera.zoom, 0, 2 * Math.PI);
                this.ctx.stroke();
                this.ctx.setLineDash([]);
            });

            // 6. Draw Planet Body (Realistic Visual Metric Sizing Check)
            let pVisRad = planet.radius * this.camera.zoom;
            if (pVisRad < 2) pVisRad = 2;
            this.ctx.beginPath();
            this.ctx.arc(px, py, pVisRad, 0, 2 * Math.PI);
            this.ctx.fillStyle = "#0a0500"; this.ctx.fill();
            this.ctx.strokeStyle = "#ffb000"; this.ctx.stroke();
            if (this.activeTarget === planet) {
                this.ctx.beginPath(); this.ctx.arc(px, py, pVisRad + 5, 0, 2 * Math.PI); this.ctx.stroke();
            }

            if (this.camera.zoom > 0.0000001) {
                this.ctx.fillStyle = "#ffb000";
                this.ctx.font = "12px 'Courier New'";
                this.ctx.fillText(planet.name, px + pVisRad + 5, py + 4);
            }

            // 7. Draw Moon Bodies
            planet.bodies.forEach(moon => {
                const mx = cx + (moon.currentX * this.camera.zoom);
                const my = cy + (moon.currentY * this.camera.zoom);
                let mVisRad = moon.radius * this.camera.zoom;
                if (mVisRad < 1.5) mVisRad = 1.5;

                this.ctx.beginPath();
                this.ctx.arc(mx, my, mVisRad, 0, 2 * Math.PI);
                this.ctx.fillStyle = "#0a0500"; this.ctx.fill();
                this.ctx.strokeStyle = "#ffb000"; this.ctx.stroke();
                
                if (this.activeTarget === moon) {
                    this.ctx.beginPath(); this.ctx.arc(mx, my, mVisRad + 4, 0, 2 * Math.PI); this.ctx.stroke();
                }

                if (this.camera.zoom > 0.000005) {
                    this.ctx.fillStyle = "#ffb000";
                    this.ctx.font = "10px 'Courier New'";
                    this.ctx.fillText(moon.name, mx + mVisRad + 4, my + 3);
                }
            });
        });
        
        // 8. Mainframe Telemetry Inventory Display Panel
        if (this.activeTarget) {
            let isAnchor = this.activeTarget.name === "OSIRIS";
            
            let boxWidth = 340;
            let startX = this.canvas.width - (boxWidth + 10);
            let textX = startX + 10;
            
            let astroLines = this.activeTarget.desc_astro.split('\n');
            let buttonY = 100 + (astroLines.length * 20);
            if (!isAnchor) {
                buttonY += 150; 
            }
            let boxHeight = buttonY + 55;
            
            this.ctx.fillStyle = "rgba(10, 5, 0, 0.85)";
            this.ctx.fillRect(startX, 10, boxWidth, boxHeight);
            this.ctx.strokeStyle = "#ffb000";
            this.ctx.strokeRect(startX, 10, boxWidth, boxHeight);
            
            this.ctx.fillStyle = "#ffb000";
            this.ctx.font = "bold 16px 'Courier New'";
            this.ctx.fillText(`TARGET DIRECTORY: ${this.activeTarget.name}`, textX, 30);
            
            this.ctx.beginPath();
            this.ctx.moveTo(startX, 40);
            this.ctx.lineTo(startX + boxWidth, 40);
            this.ctx.stroke();

            this.ctx.font = "bold 12px 'Courier New'";
            this.ctx.fillText(`[ ASTROPHYSICS ]`, textX, 60);
            this.ctx.font = "12px 'Courier New'";
            this.ctx.fillText(`RADIUS:  ${Math.round(this.activeTarget.radius).toLocaleString()} KM`, textX, 80);
            for(let i=0; i<astroLines.length; i++) this.ctx.fillText(astroLines[i], textX, 100 + (i*20));

            if (!isAnchor) {
                let currentY = buttonY - 150;
                this.ctx.font = "bold 12px 'Courier New'";
                this.ctx.fillText(`[ ORBITAL DATA ]`, textX, currentY);
                this.ctx.font = "12px 'Courier New'";
                
                this.ctx.fillText(`DISTANCE: ${Math.round(this.activeTarget.currentR || 0).toLocaleString()} KM`, textX, currentY + 20);
                if(this.activeTarget.a) this.ctx.fillText(`SMA (a):  ${this.activeTarget.a.toLocaleString()} KM`, textX, currentY + 40);
                if(this.activeTarget.e !== undefined) this.ctx.fillText(`ECC (e):  ${this.activeTarget.e}`, textX, currentY + 60);
                if(this.activeTarget.inc !== undefined) this.ctx.fillText(`INC (i):  ${this.activeTarget.inc.toFixed(1)}°`, textX, currentY + 80);
                if(this.activeTarget.period) this.ctx.fillText(`PERIOD:   ${(this.activeTarget.period / 3600).toFixed(1)} HOURS`, textX, currentY + 100);
            }

            // Draw Dynamic Interactivity Encyclopedia Button Placeholder
            let btnX = startX + 10;
            let btnY = buttonY + 10;
            let btnW = boxWidth - 20;
            let btnH = 35;
            
            let btnColor = this.encyclopediaHovered ? "#ffdf00" : "#ffb000"; 
            let btnFill = this.encyclopediaHovered ? "rgba(255, 176, 0, 0.2)" : "rgba(255, 176, 0, 0.05)";
            
            this.ctx.fillStyle = btnFill;
            this.ctx.fillRect(btnX, btnY, btnW, btnH);
            this.ctx.strokeStyle = btnColor;
            this.ctx.strokeRect(btnX, btnY, btnW, btnH);
            
            this.ctx.fillStyle = btnColor;
            this.ctx.font = "bold 13px 'Courier New'";
            this.ctx.textAlign = "center";
            this.ctx.fillText("ENCYCLOPEDIA", btnX + btnW / 2, btnY + 22);
            this.ctx.textAlign = "left"; 
            
            this.btnBounds = { x1: btnX, y1: btnY, x2: btnX + btnW, y2: btnY + btnH };
        } else {
            this.btnBounds = null;
        }
        
        // Scale / UI Overlay Metrics
        this.ctx.fillStyle = "#ffb000";
        this.ctx.font = "14px 'Courier New'";
        this.ctx.fillText(`SCALE: 1px = ${(1/this.camera.zoom).toFixed(0)} km`, 10, 20);
        this.ctx.fillText(`TIME MULTIPLIER: ${this.timeScale}x`, 10, 40);
        if (this.isTracking) this.ctx.fillText(`[CAMERA LOCKED TO TARGET]`, 10, 60);
    }
};

// --- TERMINAL LOGIC ---
const Terminal={
    outputLog:document.getElementById("output-log"),
    inputField:document.getElementById("terminal-input"),
    inputWrapper:document.getElementById("input-wrapper"),
    userInput:document.getElementById("user-input"),
    currentApp: null,
    
    init:function(){
        this.userInput.addEventListener("keydown",e=>{"Enter"===e.key&&this.userInput.value.trim()!=""&&document.getElementById("pass-input").focus()});
        document.getElementById("pass-input").addEventListener("keydown",e=>{"Enter"===e.key&&AuthSystem.attemptLogin()});
        this.inputField.addEventListener("keydown",e=>{"Enter"===e.key&&(e=this.inputField.value,""!==e.trim()&&this.processInput(e),this.inputField.value="")});
        document.getElementById("submit-btn").addEventListener("click",()=>AuthSystem.attemptLogin());
        this.userInput.focus();
        MapEngine.init(); 
    },

    launchApp:function(appName){
        this.currentApp = "LOADING"; 
        this.inputField.disabled = true; 
        this.inputField.value = "";
        
        const loadTime = Math.floor(Math.random() * 2000) + 1500;
        const ticks = loadTime / 100;
        let currentTick = 0;
        
        const loader = setInterval(() => {
            currentTick++;
            let pct = Math.floor((currentTick / ticks) * 100);
            let pBar = "[";
            for(let i=0; i<20; i++) pBar += (i < pct/5) ? "█" : "░";
            pBar += "] " + pct + "%";
            
            this.outputLog.innerText = "ACCESSING " + appName + " MAINFRAME...\n" + pBar;
            
            if (currentTick >= ticks) {
                clearInterval(loader);
                this.currentApp = appName;
                this.inputField.disabled = false;
                this.inputWrapper.classList.add('app-mode');
                
                this.outputLog.innerText = appName + " ONLINE.\nAWAITING TARGET DESIGNATION OR TYPE 'TERMINATE'.";
                this.inputField.focus();
            }
        }, 100);
    },
    
    processInput:function(input){
        const cmd = input.toUpperCase().trim();

        if (this.currentApp !== null) {
            if (this.currentApp === "LOADING") return; 

            if (cmd === "TERMINATE") {
                this.currentApp = null;
                this.inputWrapper.classList.remove('app-mode');
                MapEngine.stop();
                this.outputLog.innerText = "OSIRIS KERNEL RESTORED.\nAPP TERMINATED.";
            } else if (this.currentApp === "PLANETARY CHARTS") {
                if (!MapEngine.isRunning) {
                    MapEngine.start();
                    let found = MapEngine.selectTargetByName(cmd);
                    if (!found) MapEngine.selectTargetByName("OSIRIS");
                } else {
                    let found = MapEngine.selectTargetByName(cmd);
                    if (!found) {
                        this.inputField.value = "";
                        this.inputField.placeholder = "ERR: UNKNOWN BODY";
                        setTimeout(() => this.inputField.placeholder = "", 2000);
                    }
                }
            } else {
                this.log("> " + cmd + "\nERR: APP [" + this.currentApp + "] IS RUNNING. TYPE 'TERMINATE' TO EXIT.");
            }
            return;
        }
