<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ORBITAL OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
:root{--t:#ffb000;--b:#0a0500;--f:'Courier New',Courier,monospace}
body{background:var(--b);color:var(--t);font-family:var(--f);margin:0;padding:20px;overflow:hidden;text-shadow:0 0 5px var(--t)}
.terminal-screen,.boot-screen{display:flex;flex-direction:column;height:95vh;justify-content:flex-end; position:relative;}
body::after{content:"";position:absolute;top:0;left:0;width:100vw;height:100vh;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.1),rgba(0,0,0,0.1) 1px,transparent 1px,transparent 2px);pointer-events:none;z-index:999}
.boot-screen{justify-content:center;align-items:center;text-align:center}
.title{font-size:3em;font-weight:bold;margin-bottom:40px;letter-spacing:10px;text-transform:uppercase}
.boot-box{border:1px solid var(--t);padding:20px;width:300px}
.input-container"><label>USERNAME:</label><input type="text" id="user-input" autocomplete="off"></div>
.input-container label{display:block;margin-bottom:5px}
#output-log{white-space:pre-wrap;overflow-y:auto;margin-bottom:10px;padding-right:10px; flex-grow:1; z-index: 10;}
.input-line{display:flex;align-items:center; z-index:10;}
.prompt{margin-right:10px;font-weight:bold}
input[type=text],input[type=password]{background:transparent;border:1px solid rgba(255,176,0,0.3);color:var(--t);font-family:var(--f);font-size:16px;outline:none;text-shadow:0 0 5px var(--t);padding:5px;width:280px}
input[type=text]:focus,input[type=password]:focus{border-color:var(--t)}
#terminal-input{border:none;flex-grow:1;width:auto}
#submit-btn{border:1px solid var(--t);padding:5px 15px;cursor:pointer;margin-top:10px;display:inline-block}
#submit-btn:hover{background:var(--t);color:var(--b);text-shadow:none}
.input-line.app-mode {border-top: 1px solid var(--t); padding-top: 10px; margin-top: 10px;}

#webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 50px); display: none; z-index: 1; }
#ui-canvas { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 50px); display: none; pointer-events: none; z-index: 2; }
</style>
</head><body>

<div id="boot-screen" class="boot-screen">
    <div class="title">ORBITAL</div>
    <div class="boot-box">
        <div class="input-container"><label>USERNAME:</label><input type="text" id="user-input" autocomplete="off"></div>
        <div class="input-container"><label>PASSWORD:</label><input type="password" id="pass-input" autocomplete="off"></div>
        <div id="submit-btn">[SUBMIT]</div>
    </div>
</div>

<div id="terminal-screen" class="terminal-screen" style="display:none;">
    <div id="webgl-container"></div>
    <canvas id="ui-canvas"></canvas>
    <div id="output-log">OSIRIS KERNEL BOOT (AMBER)... OK.</div>
    <div id="input-wrapper" class="input-line"><span class="prompt">></span><input type="text" id="terminal-input" autocomplete="off"></div>
</div>

<script>
// Deterministic Pseudo-Random Generator for consistent planetary data seeds
function createNoiseGen(seed) {
    return function(x, y) {
        let n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453123;
        return n - Math.floor(n);
    };
}

const AuthSystem={
    isAuthenticated:!1,
    validUser:"DIRECTOR",
    validPass:"TIER0",
    attemptLogin:function(){
        const e=document.getElementById("user-input").value.toUpperCase().trim(),
              t=document.getElementById("pass-input").value.toUpperCase().trim();
        e===this.validUser&&t===this.validPass?(
            this.isAuthenticated=!0,
            document.getElementById("boot-screen").style.display="none",
            document.getElementById("terminal-screen").style.display="flex",
            Terminal.log("\n[AUTH SUCCESS] WELCOME TO ORBITAL.\nType 'HELP' for commands."),
            Terminal.inputField.focus()
        ):(
            Terminal.clearInputs(),
            document.getElementById("user-input").placeholder="ERR: INVALID CREDENTIALS",
            setTimeout(()=>document.getElementById("user-input").placeholder="", 2000)
        )
    }
};

const MapEngine = {
    container: document.getElementById("webgl-container"),
    uiCanvas: document.getElementById("ui-canvas"),
    ctx: null,
    scene: null,
    camera: null,
    renderer: null,
    controls: null,
    isRunning: false,
    startTime: Date.now(),
    timeScale: 1, 
    activeTarget: null,
    lastTargetPos: null,
    UNIT_SCALE: 0.001, 
    
    // Global Terrain Storage for Encyclopedia
    furraTerrainWidth: 128,
    furraTerrainHeight: 64,
    furraTerrainMap: [],

    system: {
        name: "OSIRIS", radius: 12.6, axialTilt: 0,
        desc_astro: "CLASS: STELLAR BLACK HOLE\nEVENT HORIZON: 72 KM BOUNDARY\nSTRUCTURE: EXPONENTIAL VECTOR LINES\nPOLAR CONFIGURATION: ACTIVE EMISSION JETS",
        discs: [ { name: "ACCRETION LINES", start: 72, end: 120000, type: "line_disc" } ],
        bodies: [
            {
                name: "FURRA", a: 271000000, e: 0.0167, inc: 0.0, lan: 0.0, argp: 0.0, radius: 5796, period: 48384000, axialTilt: 14.32,
                desc_astro: "CLASS: HABITABLE TERRESTRIAL\nSURFACE CONFIG: PROCEDURAL VECTOR CONTOUR\nOCEAN LEVEL: 72.00% CRITICAL DENSITY\nMAP SYSTEM: TOPOGRAPHIC READOUT STORAGE",
                rings: [
                    { name: "RING A", start: 5796 + 2500, end: 5796 + 3100 },
                    { name: "RING B", start: 5796 + 3200, end: 5796 + 4100 },
                    { name: "RING C", start: 5796 + 4200, end: 5796 + 5100 },
                    { name: "RING D", start: 5796 + 6600, end: 5796 + 7300 },
                    { name: "RING E", start: 5796 + 7400, end: 5796 + 7920 }
                ],
                bodies: [
                    { name: "HARMONY", a: 5796 + 6000, e: 0.001, inc: 0.0, lan: 0.0, argp: 0.0, radius: 21, period: 14004, desc_astro: "CLASS: SHEPHERD MOON\nREGION: C / D RING SEGMENT GAP" },     
                    { name: "KIITOS", a: 340000, e: 0.05, inc: 0.0, lan: 0.0, argp: 90.0, radius: 1876, period: 2171520, desc_astro: "CLASS: MAJOR LUNAR BODY\nTIDALLY LOCKED" }  
                ]
            }
        ]
    },

    generateFurraTerrain: function() {
        const rand = createNoiseGen(42);
        this.furraTerrainMap = [];
        for (let y = 0; y <= this.furraTerrainHeight; y++) {
            let row = [];
            let lat = (y / this.furraTerrainHeight) * Math.PI;
            for (let x = 0; x <= this.furraTerrainWidth; x++) {
                let lon = (x / this.furraTerrainWidth) * Math.PI * 2;
                
                let nx = Math.sin(lat) * Math.cos(lon);
                let ny = Math.cos(lat);
                let nz = Math.sin(lat) * Math.sin(lon);
                
                // Multi-frequency noise breakdown
                let h1 = rand(nx * 2.1, ny * 2.1) * 0.6;
                let h2 = rand(nx * 5.5, nz * 5.5) * 0.3;
                let h3 = rand(ny * 12.0, nz * 12.0) * 0.1;
                let height = h1 + h2 + h3;
                
                // 72% Ocean Floor Clamping Math
                if (height < 0.44) {
                    height = 0.30; 
                }
                row.push(height);
            }
            this.furraTerrainMap.push(row);
        }
    },

    init: function() {
        this.ctx = this.uiCanvas.getContext("2d");
        this.generateFurraTerrain();
        
        this.scene = new THREE.Scene();
        const aspect = window.innerWidth / (window.innerHeight - 50);
        this.camera = new THREE.PerspectiveCamera(45, aspect, 0.0001, 1e9); 
        
        this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, logarithmicDepthBuffer: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight - 50);
        this.container.appendChild(this.renderer.domElement);
        
        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxDistance = 1e7; 
        
        this.buildSystem();
        window.addEventListener("resize", () => this.resize());
    },

    solveKepler: function(M, e) {
        let E = M;
        for (let i = 0; i < 5; i++) E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
        return E;
    },

    getTrueAnomaly: function(E, e) {
        return 2 * Math.atan2(Math.sqrt(1 + e) * Math.sin(E / 2), Math.sqrt(1 - e) * Math.cos(E / 2));
    },

    createBodyMesh: function(bodyData, parentObj, isStar = false) {
        const scaledRadius = bodyData.radius * this.UNIT_SCALE;
        let geometry;
        let coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        coreMat.polygonOffset = true; coreMat.polygonOffsetFactor = 1; coreMat.polygonOffsetUnits = 1;

        if (bodyData.name === "FURRA") {
            // Apply Topographic Vector Mesh Displacement
            geometry = new THREE.SphereGeometry(scaledRadius, this.furraTerrainWidth, this.furraTerrainHeight);
            const posAttr = geometry.attributes.position;
            const uvAttr = geometry.attributes.uv;
            
            for (let i = 0; i < posAttr.count; i++) {
                let u = uvAttr.getX(i);
                let v = uvAttr.getY(i);
                
                let tx = Math.min(Math.floor(u * this.furraTerrainWidth), this.furraTerrainWidth);
                let ty = Math.min(Math.floor((1 - v) * this.furraTerrainHeight), this.furraTerrainHeight);
                let heightValue = this.furraTerrainMap[ty][tx];
                
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                let vz = posAttr.getZ(i);
                
                let normal = new THREE.Vector3(vx, vy, vz).normalize();
                let displacement = heightValue * (350 * this.UNIT_SCALE); // Peak mountain amplitude scaled
                
                posAttr.setXYZ(i, vx + normal.x * displacement, vy + normal.y * displacement, vz + normal.z * displacement);
            }
            geometry.computeVertexNormals();
        } else {
            geometry = new THREE.SphereGeometry(scaledRadius, 32, 32);
        }
        
        const coreMesh = new THREE.Mesh(geometry, coreMat);
        
        if (!isStar) {
            // High-contrast topographic contour wireframe shading
            const wireMat = new THREE.MeshBasicMaterial({ color: 0xffb000, wireframe: true, transparent: true, opacity: 0.4 });
            const wireMesh = new THREE.Mesh(geometry, wireMat);
            coreMesh.add(wireMesh);
        } else {
            // OSIRIS Specific Modifications: Event Horizon Orange Border Edge Ring
            const borderGeom = new THREE.RingGeometry(scaledRadius * 1.02, scaledRadius * 1.08, 64);
            const borderMat = new THREE.MeshBasicMaterial({ color: 0xff7700, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
            const borderMesh = new THREE.Mesh(borderGeom, borderMat);
            borderMesh.lookAt(this.camera.position);
            coreMesh.add(borderMesh);
            this.osirisBorderMesh = borderMesh; // Retain pointer to update facing orientation
        }

        const pivot = new THREE.Group();
        const incGroup = new THREE.Group();
        const argpGroup = new THREE.Group();
        const translationGroup = new THREE.Group();
        const equatorGroup = new THREE.Group();
        
        if (!isStar) {
            pivot.rotation.y = THREE.MathUtils.degToRad(bodyData.lan);
            incGroup.rotation.x = THREE.MathUtils.degToRad(bodyData.inc);
            argpGroup.rotation.y = THREE.MathUtils.degToRad(bodyData.argp);
            
            const points = [];
            const pathMaterial = new THREE.LineBasicMaterial({ color: 0xffb000, transparent: true, opacity: 0.15 });
            const segments = 256; 
            for(let i=0; i<=segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                const r = (bodyData.a * (1 - Math.pow(bodyData.e, 2))) / (1 + bodyData.e * Math.cos(theta));
                points.push(new THREE.Vector3(Math.cos(theta) * r * this.UNIT_SCALE, 0, Math.sin(theta) * r * this.UNIT_SCALE));
            }
            const pathGeom = new THREE.BufferGeometry().setFromPoints(points);
            argpGroup.add(new THREE.Line(pathGeom, pathMaterial));
        }

        equatorGroup.rotation.x = THREE.MathUtils.degToRad(bodyData.axialTilt || 0);

        // --- LINE ACCRETION DISC SYSTEM WITH OUT-WEIGHTED WEIGHT DISTRIBUTION ---
        if (bodyData.discs) {
            bodyData.discs.forEach(disc => {
                const totalLoops = 140;
                const discGroup = new THREE.Group();
                
                for(let i=0; i<totalLoops; i++) {
                    // Exponential spacing biases loops heavily toward the outer rim
                    const pct = Math.pow(i / totalLoops, 1.8);
                    const radius = (disc.start + pct * (disc.end - disc.start)) * this.UNIT_SCALE;
                    
                    const linePoints = [];
                    const lineSegments = 128;
                    for (let j = 0; j <= lineSegments; j++) {
                        const theta = (j / lineSegments) * Math.PI * 2;
                        linePoints.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
                    }
                    const lineGeom = new THREE.BufferGeometry().setFromPoints(linePoints);
                    // Outer loops fade and scale slightly to provide volumetric visual thickness bounds
                    const lineMat = new THREE.LineBasicMaterial({ 
                        color: 0xffb000, 
                        transparent: true, 
                        opacity: 0.05 + (pct * 0.22) 
                    });
                    discGroup.add(new THREE.LineLoop(lineGeom, lineMat));
                }
                equatorGroup.add(discGroup);

                // --- HIGH VELOCITY POLAR REJECTION JETS ---
                const jetLinesCount = 36;
                const jetLength = 80000 * this.UNIT_SCALE;
                const jetGeom = new THREE.BufferGeometry();
                const jetVertices = [];
                
                for(let j=0; j<jetLinesCount; j++) {
                    let angle = (j / jetLinesCount) * Math.PI * 2;
                    let jetRadius = scaledRadius * 0.4;
                    let sX = Math.cos(angle) * jetRadius;
                    let sZ = Math.sin(angle) * jetRadius;
                    
                    // North Vector Column
                    jetVertices.push(sX, scaledRadius, sZ);
                    jetVertices.push(sX * 3, jetLength, sZ * 3);
                    // South Vector Column
                    jetVertices.push(sX, -scaledRadius, sZ);
                    jetVertices.push(sX * 3, -jetLength, sZ * 3);
                }
                jetGeom.setAttribute('position', new THREE.Float32BufferAttribute(jetVertices, 3));
                const jetMat = new THREE.LineSegmentsMaterial ? new THREE.LineBasicMaterial({color: 0xffb000, transparent:true, opacity:0.35}) : new THREE.LineBasicMaterial({color:0xffb000, transparent:true, opacity:0.25});
                const jetMesh = new THREE.LineSegments(jetGeom, jetMat);
                equatorGroup.add(jetMesh);
            });
        }

        if (bodyData.rings) {
            bodyData.rings.forEach(ring => {
                const innerR = ring.start * this.UNIT_SCALE;
                const outerR = ring.end * this.UNIT_SCALE;
                
                const ringGeom = new THREE.RingGeometry(innerR, outerR, 128);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xffb000, transparent: true, opacity: 0.14, side: THREE.DoubleSide });
                const ringMesh = new THREE.Mesh(ringGeom, ringMat);
                ringMesh.rotation.x = Math.PI / 2;
                equatorGroup.add(ringMesh);
                
                const drawBoundary = (radius) => {
                    const linePoints = [];
                    const lineSegments = 256;
                    for (let i = 0; i <= lineSegments; i++) {
                        const theta = (i / lineSegments) * Math.PI * 2;
                        linePoints.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
                    }
                    const lineGeom = new THREE.BufferGeometry().setFromPoints(linePoints);
                    const lineMat = new THREE.LineBasicMaterial({ color: 0xffb000, transparent: true, opacity: 0.6 });
                    return new THREE.LineLoop(lineGeom, lineMat);
                };
                equatorGroup.add(drawBoundary(innerR));
                equatorGroup.add(drawBoundary(outerR));
            });
        }
        
        equatorGroup.add(coreMesh);
        translationGroup.add(equatorGroup);
        argpGroup.add(translationGroup);
        incGroup.add(argpGroup);
        pivot.add(incGroup);
        parentObj.add(pivot);
        
        bodyData.mesh = coreMesh;
        bodyData.translationGroup = translationGroup;
        bodyData.equatorGroup = equatorGroup;
    },

    buildSystem: function() {
        this.system.group = new THREE.Group();
        this.scene.add(this.system.group);
        this.createBodyMesh(this.system, this.system.group, true);
        
        this.system.bodies.forEach(planet => {
            this.createBodyMesh(planet, this.system.group);
            planet.bodies.forEach(moon => {
                this.createBodyMesh(moon, planet.equatorGroup); 
            });
        });
    },

    selectTargetByName: function(name) {
        let target = null;
        if (name === "OSIRIS") target = this.system;
        else {
            for (let planet of this.system.bodies) {
                if (planet.name === name) target = planet;
                if (planet.bodies) {
                    for (let moon of planet.bodies) {
                        if (moon.name === name) target = moon;
                    }
                }
            }
        }
        
        if (target) {
            this.activeTarget = target;
            const targetPos = new THREE.Vector3();
            target.mesh.getWorldPosition(targetPos);
            
            const camOffset = (target.radius * this.UNIT_SCALE) * 5; 
            this.camera.position.copy(targetPos).add(new THREE.Vector3(0, camOffset, camOffset * 1.5));
            this.controls.target.copy(targetPos);
            this.lastTargetPos = targetPos.clone();
            return true;
        }
        return false;
    },

    resize: function() {
        const w = window.innerWidth, h = window.innerHeight - 50;
        this.uiCanvas.width = w; this.uiCanvas.height = h;
        if(this.camera) {
            this.camera.aspect = w / h;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(w, h);
        }
    },

    start: function() {
        this.isRunning = true;
        this.container.style.display = "block";
        this.uiCanvas.style.display = "block";
        document.getElementById("output-log").style.display = "none";
        this.resize();
        this.loop();
    },

    stop: function() {
        this.isRunning = false;
        this.activeTarget = null;
        this.container.style.display = "none";
        this.uiCanvas.style.display = "none";
        document.getElementById("output-log").style.display = "block";
    },

    loop: function() {
        if (!this.isRunning) return;
        this.update();
        this.renderer.render(this.scene, this.camera);
        this.drawUI();
        requestAnimationFrame(() => this.loop());
    },

    update: function() {
        const elapsedSeconds = ((Date.now() - this.startTime) / 1000) * this.timeScale;
        
        // Dynamic alignment of Event Horizon border ring to viewport vector
        if (this.osirisBorderMesh && this.camera) {
            this.osirisBorderMesh.lookAt(this.camera.position);
        }

        const processOrbitalMechanics = (body) => {
            if (!body.period) return;
            const M = ((2 * Math.PI) / body.period) * elapsedSeconds;
            const E = this.solveKepler(M, body.e);
            const theta = this.getTrueAnomaly(E, body.e);
            const r = (body.a * (1 - Math.pow(body.e, 2))) / (1 + body.e * Math.cos(theta));
            
            body.translationGroup.position.x = r * Math.cos(theta) * this.UNIT_SCALE;
            body.translationGroup.position.z = r * Math.sin(theta) * this.UNIT_SCALE;
        };

        this.system.bodies.forEach(planet => {
            processOrbitalMechanics(planet);
            if (planet.bodies) planet.bodies.forEach(moon => processOrbitalMechanics(moon));
        });

        if (this.activeTarget && this.activeTarget.mesh) {
            const currentPos = new THREE.Vector3();
            this.activeTarget.mesh.getWorldPosition(currentPos);
            
            if (this.lastTargetPos) {
                const delta = currentPos.clone().sub(this.lastTargetPos);
                this.camera.position.add(delta); 
            }
            this.controls.target.copy(currentPos); 
            this.lastTargetPos = currentPos.clone();
        }
        this.controls.update();
    },

    drawUI: function() {
        this.ctx.clearRect(0, 0, this.uiCanvas.width, this.uiCanvas.height);
        this.ctx.fillStyle = "#ffb000"; this.ctx.font = "14px 'Courier New'";
        this.ctx.fillText(`CHRONO ENGINE: 1:1 REAL TIME ANCHOR`, 10, 20);
        this.ctx.fillText(`SYSTEM RECOVERY MODE: RADAR INTERFACE`, 10, 40);

        if (this.activeTarget) {
            let isAnchor = this.activeTarget.name === "OSIRIS";
            let boxWidth = 360;
            let startX = this.uiCanvas.width - (boxWidth + 10); let textX = startX + 10;
            let astroLines = this.activeTarget.desc_astro.split('\n');
            
            let baseElementY = 100 + (astroLines.length * 20);
            if (!isAnchor) baseElementY += 100;
            
            // Dynamic padding addition for the Topographic Render box if Target is Furra
            let isFurra = this.activeTarget.name === "FURRA";
            let boxHeight = baseElementY + (isFurra ? 190 : 20);
            
            this.ctx.fillStyle = "rgba(10, 5, 0, 0.95)"; this.ctx.fillRect(startX, 10, boxWidth, boxHeight);
            this.ctx.strokeStyle = "#ffb000"; this.ctx.strokeRect(startX, 10, boxWidth, boxHeight);
            
            this.ctx.fillStyle = "#ffb000"; this.ctx.font = "bold 16px 'Courier New'";
            this.ctx.fillText(`TARGET: ${this.activeTarget.name}`, textX, 30);
            
            this.ctx.beginPath(); this.ctx.moveTo(startX, 40); this.ctx.lineTo(startX + boxWidth, 40); this.ctx.stroke();

            this.ctx.font = "bold 12px 'Courier New'"; this.ctx.fillText(`[ VISUAL MANIFEST ]`, textX, 60);
            this.ctx.font = "12px 'Courier New'";
            this.ctx.fillText(`RADIUS:  ${this.activeTarget.radius.toLocaleString()} KM`, textX, 80);
            for(let i=0; i<astroLines.length; i++) this.ctx.fillText(astroLines[i], textX, 100 + (i*20));

            if (!isAnchor) {
                let currentY = 100 + (astroLines.length * 20) + 10;
                this.ctx.font = "bold 12px 'Courier New'"; this.ctx.fillText(`[ TELEMETRY ]`, textX, currentY);
                this.ctx.font = "12px 'Courier New'";
                this.ctx.fillText(`SMA (a):  ${this.activeTarget.a.toLocaleString()} KM`, textX, currentY + 20);
                this.ctx.fillText(`ECC (e):  ${this.activeTarget.e}`, textX, currentY + 40);
                this.ctx.fillText(`INC (i):  ${this.activeTarget.inc.toFixed(2)}°`, textX, currentY + 60);
            }

            // ENCYCLOPEDIA TOPOGRAPHIC GRID MODULE RENDERING
            if (isFurra) {
                let mapBoxY = baseElementY - 10;
                this.ctx.font = "bold 12px 'Courier New'"; this.ctx.fillText(`[ ENCYCLOPEDIA TOPOGRAPHIC SCAN ]`, textX, mapBoxY);
                
                let renderX = textX;
                let renderY = mapBoxY + 10;
                let mapW = boxWidth - 30;
                let mapH = 140;
                
                // Draw surrounding radar window
                this.ctx.strokeStyle = "rgba(255, 176, 0, 0.4)";
                this.ctx.strokeRect(renderX, renderY, mapW, mapH);
                
                // Loop through global terrain buffer array to construct Mercator readout pixel-by-pixel
                let stepX = mapW / this.furraTerrainWidth;
                let stepY = mapH / this.furraTerrainHeight;
                
                for(let ty=0; ty<this.furraTerrainHeight; ty++) {
                    for(let tx=0; tx<this.furraTerrainWidth; tx++) {
                        let hVal = this.furraTerrainMap[ty][tx];
                        
                        if (hVal === 0.30) {
                            // Ocean floor coloring protocol
                            this.ctx.fillStyle = "rgba(255, 176, 0, 0.06)";
                        } else {
                            // Dynamic topographic line grouping based on continuous height layers
                            let lineIndex = Math.floor(hVal * 25);
                            if (lineIndex % 2 === 0) {
                                this.ctx.fillStyle = "rgba(255, 176, 0, 0.75)";
                            } else {
                                this.ctx.fillStyle = "rgba(255, 176, 0, 0.25)";
                            }
                        }
                        this.ctx.fillRect(renderX + (tx * stepX), renderY + (ty * stepY), Math.ceil(stepX), Math.ceil(stepY));
                    }
                }
                
                this.ctx.fillStyle = "#ffb000";
                this.ctx.font = "10px 'Courier New'";
                this.ctx.fillText(`MERCATOR PROJECTION MAP VECTOR // DETERMINISTIC SEED`, renderX, renderY + mapH + 15);
            }
        }
    }
};

const Terminal={
    outputLog:document.getElementById("output-log"),
    inputField:document.getElementById("terminal-input"),
    inputWrapper:document.getElementById("input-wrapper"),
    userInput:document.getElementById("user-input"),
    currentApp: null,
    
    init:function(){
        this.userInput.addEventListener("keydown",e=>{"Enter"===e.key&&this.userInput.value.trim()!=""&&document.getElementById("pass-input").focus()});
        document.getElementById("pass-input").addEventListener("keydown",e=>{"Enter"===e.key&&AuthSystem.attemptLogin()});
        this.inputField.addEventListener("keydown",e=>{"Enter"===e.key&&(e=this.inputField.value,""!==e.trim()&&this.processInput(e),this.inputField.value="")});
        document.getElementById("submit-btn").addEventListener("click",()=>AuthSystem.attemptLogin());
        this.userInput.focus();
        MapEngine.init(); 
    },

    launchApp:function(appName){
        this.currentApp = "LOADING"; 
        this.inputField.disabled = true; this.inputField.value = "";
        
        const ticks = 10; let currentTick = 0;
        const loader = setInterval(() => {
            currentTick++;
            let pct = Math.floor((currentTick / ticks) * 100);
            let pBar = "["; for(let i=0; i<20; i++) pBar += (i < pct/5) ? "█" : "░"; pBar += "] " + pct + "%";
            
            this.outputLog.innerText = "PARSING CONTINUOUS CELESTIAL METRICS...\n" + pBar;
            
            if (currentTick >= ticks) {
                clearInterval(loader);
                this.currentApp = appName;
                this.inputField.disabled = false;
                this.inputWrapper.classList.add('app-mode');
                this.outputLog.innerText = appName + " ONLINE.\nENTER TARGET DESIGNATION OR TYPE 'TERMINATE'.";
                this.inputField.focus();
            }
        }, 50);
    },
    
    processInput:function(input){
        const cmd = input.toUpperCase().trim();

        if (this.currentApp !== null) {
            if (this.currentApp === "LOADING") return; 
            if (cmd === "TERMINATE") {
                this.currentApp = null;
                this.inputWrapper.classList.remove('app-mode');
                MapEngine.stop();
                this.outputLog.innerText = "OSIRIS CORE MONITOR ACTIVE.\nREADY.";
            } else if (this.currentApp === "PLANETARY CHARTS") {
                if (!MapEngine.isRunning) {
                    if (cmd === "FURRA" || cmd === "OSIRIS" || cmd === "KIITOS" || cmd === "HARMONY") {
                        MapEngine.start();
                        MapEngine.selectTargetByName(cmd);
                    } else {
                        this.outputLog.innerText += "\n> " + cmd + "\nERR: REQUEST DENIED. TARGET NOT CONCORDANT WITH LOG DATA.";
                        window.scrollTo(0,document.body.scrollHeight);
                    }
                } else {
                    let found = MapEngine.selectTargetByName(cmd);
                    if (!found) {
                        this.inputField.value = "";
                        this.inputField.placeholder = "ERR: TRANSCEIVER ERROR OR TARGET OUT OF RANGE";
                        setTimeout(() => this.inputField.placeholder = "", 2000);
                    }
                }
            } else {
                this.log("> " + cmd + "\nERR: LINK ACTIVE. ENTER 'TERMINATE' TO CLEAR PORT.");
            }
            return;
        }

        this.log("> " + cmd);
        switch(cmd) {
            case "HELP": this.log("COMMAND REGISTER:\nHELP\nLIST\nLOGOUT\n\nSYSTEM DRIVERS:\nPLANETARY CHARTS"); break;
            case "LIST": this.log("SYSTEM MASS DIRECTORY:\n- OSIRIS (CENTRAL EVENT HORIZON BOUND)\n- FURRA (TERRESTRIAL TOPO BLUEPRINT)\n- HARMONY (RESONANT GAP SATELLITE)\n- KIITOS (MAJOR MOON COMPONENT)"); break;
            case "LOGOUT": location.reload(); break;
            case "PLANETARY CHARTS": this.launchApp(cmd); break;
            default: this.log("ERR: UNRECOGNIZED INSTRUCTION MATRIX.");
        }
    },
    
    log:function(e){this.outputLog.innerText+="\n"+e,window.scrollTo(0,document.body.scrollHeight)},
    clearInputs:function(){document.getElementById("user-input").value="",document.getElementById("pass-input").value="",this.userInput.focus()}
};
window.onload=()=>Terminal.init();
</script>
</body></html>
