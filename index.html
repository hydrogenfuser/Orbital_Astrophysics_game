<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ORBITAL OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
:root{--t:#ffb000;--b:#0a0500;--f:'Courier New',Courier,monospace}
body{background:var(--b);color:var(--t);font-family:var(--f);margin:0;padding:20px;overflow:hidden;text-shadow:0 0 5px var(--t)}
.terminal-screen,.boot-screen{display:flex;flex-direction:column;height:95vh;justify-content:flex-end; position:relative;}
body::after{content:"";position:absolute;top:0;left:0;width:100vw;height:100vh;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.1),rgba(0,0,0,0.1) 1px,transparent 1px,transparent 2px);pointer-events:none;z-index:999}
.boot-screen{justify-content:center;align-items:center;text-align:center}
.title{font-size:3em;font-weight:bold;margin-bottom:40px;letter-spacing:10px;text-transform:uppercase}
.boot-box{border:1px solid var(--t);padding:20px;width:300px}
.input-container{margin-bottom:10px;text-align:left}
.input-container label{display:block;margin-bottom:5px}
#output-log{white-space:pre-wrap;overflow-y:auto;margin-bottom:10px;padding-right:10px; flex-grow:1; z-index: 10;}
.input-line{display:flex;align-items:center; z-index:10;}
.prompt{margin-right:10px;font-weight:bold}
input[type=text],input[type=password]{background:transparent;border:1px solid rgba(255,176,0,0.3);color:var(--t);font-family:var(--f);font-size:16px;outline:none;text-shadow:0 0 5px var(--t);padding:5px;width:280px}
input[type=text]:focus,input[type=password]:focus{border-color:var(--t)}
#terminal-input{border:none;flex-grow:1;width:auto}
#submit-btn{border:1px solid var(--t);padding:5px 15px;cursor:pointer;margin-top:10px;display:inline-block}
#submit-btn:hover{background:var(--t);color:var(--b);text-shadow:none}
.input-line.app-mode {border-top: 1px solid var(--t); padding-top: 10px; margin-top: 10px;}

#webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 50px); display: none; z-index: 1; }
#ui-canvas { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 50px); display: none; pointer-events: none; z-index: 2; }
</style>
</head><body>

<div id="boot-screen" class="boot-screen">
    <div class="title">ORBITAL</div>
    <div class="boot-box">
        <div class="input-container"><label>USERNAME:</label><input type="text" id="user-input" autocomplete="off"></div>
        <div class="input-container"><label>PASSWORD:</label><input type="password" id="pass-input" autocomplete="off"></div>
        <div id="submit-btn">[SUBMIT]</div>
    </div>
</div>

<div id="terminal-screen" class="terminal-screen" style="display:none;">
    <div id="webgl-container"></div>
    <canvas id="ui-canvas"></canvas>
    <div id="output-log">OSIRIS KERNEL BOOT (AMBER)... OK.</div>
    <div id="input-wrapper" class="input-line"><span class="prompt">></span><input type="text" id="terminal-input" autocomplete="off"></div>
</div>

<script>
const AuthSystem={
    isAuthenticated:!1,
    validUser:"DIRECTOR",
    validPass:"TIER0",
    attemptLogin:function(){
        const e=document.getElementById("user-input").value.toUpperCase().trim(),
              t=document.getElementById("pass-input").value.toUpperCase().trim();
        e===this.validUser&&t===this.validPass?(
            this.isAuthenticated=!0,
            document.getElementById("boot-screen").style.display="none",
            document.getElementById("terminal-screen").style.display="flex",
            Terminal.log("\n[AUTH SUCCESS] WELCOME TO ORBITAL.\nType 'HELP' for commands."),
            Terminal.inputField.focus()
        ):(
            Terminal.clearInputs(),
            document.getElementById("user-input").placeholder="ERR: INVALID CREDENTIALS",
            setTimeout(()=>document.getElementById("user-input").placeholder="", 2000)
        )
    }
};

// --- TRUE SCALE 3D ASTROPHYSICS ENGINE ---
const MapEngine = {
    container: document.getElementById("webgl-container"),
    uiCanvas: document.getElementById("ui-canvas"),
    ctx: null,
    
    scene: null,
    camera: null,
    renderer: null,
    controls: null,
    
    isRunning: false,
    simulatedTime: 0,
    lastRealTime: 0,
    timeScale: 1, 
    
    elapseActive: false,
    elapseRemainingSeconds: 0,
    elapseOriginalScale: 1,
    
    activeTarget: null,
    lastTargetPos: null,
    
    UNIT_SCALE: 0.001, 
    
    system: {
        name: "OSIRIS", radius: 12.6, axialTilt: 0,
        desc_astro: "CLASS: STELLAR BLACK HOLE\nHORIZON REGION: 72 KM (ISCO)\nDISC MESH: VOLUMETRIC TOROIDAL",
        discs: [ 
            { name: "ACCRETION DISC", start: 72, end: 16000000, type: "accretion" } 
        ],
        bodies: [
            {
                name: "FURRA", a: 271000000, e: 0.0167, inc: 0.0, lan: 0.0, argp: 0.0, radius: 5796, period: 48384000, rotationPeriod: 115200, axialTilt: 14.32,
                desc_astro: "CLASS: HABITABLE TERRESTRIAL\nLIGHT MATRIX: PARALLAX TERMINATOR SHADER\nLANDMASS PROFILE: CONTINUOUS FRACTAL ISLAND",
                rings: [
                    { name: "RING A", start: 5796 + 2500, end: 5796 + 3100 },
                    { name: "RING B", start: 5796 + 3200, end: 5796 + 4100 },
                    { name: "RING C", start: 5796 + 4200, end: 5796 + 5100 },
                    { name: "RING D", start: 5796 + 6600, end: 5796 + 7300 },
                    { name: "RING E", start: 5796 + 7400, end: 5796 + 7920 }
                ],
                bodies: [
                    { name: "HARMONY", a: 5796 + 6000, e: 0.001, inc: 0.0, lan: 0.0, argp: 0.0, radius: 21, period: 14004, rotationPeriod: 14004,
                      desc_astro: "CLASS: SHEPHERD MOON\nREGION: C / D RING SEGMENT GAP" },     
                    { name: "KIITOS", a: 340000, e: 0.05, inc: 0.0, lan: 0.0, argp: 90.0, radius: 1876, period: 2171520, rotationPeriod: 2171520,
                      desc_astro: "CLASS: MAJOR LUNAR BODY\nTIDALLY LOCKED" }  
                ]
            }
        ]
    },

    init: function() {
        this.ctx = this.uiCanvas.getContext("2d");
        this.scene = new THREE.Scene();
        
        const aspect = window.innerWidth / (window.innerHeight - 50);
        this.camera = new THREE.PerspectiveCamera(45, aspect, 0.0001, 1e9); 
        
        this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, logarithmicDepthBuffer: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight - 50);
        this.container.appendChild(this.renderer.domElement);
        
        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxDistance = 1e7; 
        
        this.buildSystem();
        window.addEventListener("resize", () => this.resize());
    },

    solveKepler: function(M, e) {
        let E = M;
        for (let i = 0; i < 5; i++) {
            E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
        }
        return E;
    },

    getTrueAnomaly: function(E, e) {
        return 2 * Math.atan2(Math.sqrt(1 + e) * Math.sin(E / 2), Math.sqrt(1 - e) * Math.cos(E / 2));
    },

    generateFractalCoastline: function(points, iterations, roughness) {
        let currentPoints = [...points];
        for (let i = 0; i < iterations; i++) {
            let nextPoints = [];
            let currentRoughness = roughness / Math.pow(1.5, i);
            
            for (let j = 0; j < currentPoints.length; j++) {
                let p1 = currentPoints[j];
                let p2 = currentPoints[(j + 1) % currentPoints.length];
                
                let midX = (p1.x + p2.x) / 2;
                let midY = (p1.y + p2.y) / 2;
                
                let dx = p2.x - p1.x;
                let dy = p2.y - p1.y;
                let len = Math.sqrt(dx * dx + dy * dy);
                
                let nx = -dy / len;
                let ny = dx / len;
                
                let offset = (Math.sin(midX * 0.03) * Math.cos(midY * 0.03)) * currentRoughness * len;
                let displacedPoint = { x: midX + nx * offset, y: midY + ny * offset };
                
                nextPoints.push(p1);
                nextPoints.push(displacedPoint);
            }
            currentPoints = nextPoints;
        }
        return currentPoints;
    },

    createBodyMesh: function(bodyData, parentObj, isStar = false) {
        const scaledRadius = bodyData.radius * this.UNIT_SCALE;
        const geometry = new THREE.SphereGeometry(scaledRadius, 128, 128);
        
        let coreMat;
        
        if (bodyData.name === "FURRA") {
            const canvas = document.createElement('canvas');
            canvas.width = 4096; canvas.height = 2048;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = "rgba(4, 10, 12, 1.0)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "rgba(255, 176, 0, 0.35)"; 
            ctx.strokeStyle = "rgba(255, 176, 0, 0.95)"; 
            ctx.lineWidth = 4;
            
            let originX = 2048; let originY = 1024;
            let baseRadius = 140; 
            let basePoints = [];
            let steps = 16;
            
            for(let i = 0; i < steps; i++) {
                let angle = (i / steps) * Math.PI * 2;
                let rVariance = baseRadius * (0.8 + Math.sin(angle * 4) * 0.25 + Math.cos(angle * 2) * 0.1);
                basePoints.push({
                    x: originX + Math.cos(angle) * rVariance,
                    y: originY + Math.sin(angle) * rVariance
                });
            }
            
            let singularIslandCoast = this.generateFractalCoastline(basePoints, 7, 0.55);
            
            ctx.beginPath();
            ctx.moveTo(singularIslandCoast[0].x, singularIslandCoast[0].y);
            for(let i = 1; i < singularIslandCoast.length; i++) {
                ctx.lineTo(singularIslandCoast[i].x, singularIslandCoast[i].y);
            }
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 16;
            // Generating mipmaps ensures proper LOD scaling so lines don't alias/sparkle at extreme distances
            texture.generateMipmaps = true; 
            
            coreMat = new THREE.ShaderMaterial({
                uniforms: { uSurfaceTex: { value: texture } },
                vertexShader: `
                    varying vec3 vWorldNormal;
                    varying vec3 vWorldPosition;
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        vWorldNormal = normalize(vec3(modelMatrix * vec4(normal, 0.0)));
                        vec4 worldPos = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPos.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uSurfaceTex;
                    varying vec3 vWorldNormal;
                    varying vec3 vWorldPosition;
                    varying vec2 vUv;
                    void main() {
                        vec3 normal = normalize(vWorldNormal);
                        vec3 lightDir = normalize(-vWorldPosition);
                        float dotNL = dot(normal, lightDir);
                        float terminator = smoothstep(-0.06, 0.06, dotNL);
                        vec4 texColor = texture2D(uSurfaceTex, vUv);
                        vec3 nightSide = texColor.rgb * 0.02;
                        gl_FragColor = vec4(mix(nightSide, texColor.rgb, terminator), 1.0);
                    }
                `,
                transparent: false,
                depthWrite: true,
                side: THREE.FrontSide
            });
        } else {
            // BUG FIX: Uses a distinct solid color that doesn't perfectly match the background CSS, ensuring it acts as a visual blocker
            coreMat = new THREE.MeshBasicMaterial({ color: 0x160B00, depthWrite: true });
            coreMat.polygonOffset = true; coreMat.polygonOffsetFactor = 1; coreMat.polygonOffsetUnits = 1;
        }
        
        const coreMesh = new THREE.Mesh(geometry, coreMat);
        
        if (!isStar && bodyData.name !== "FURRA") {
            const wireMat = new THREE.MeshBasicMaterial({ color: 0xffb000, wireframe: true, transparent: true, opacity: 0.5, depthWrite: false });
            const wireMesh = new THREE.Mesh(geometry, wireMat);
            coreMesh.add(wireMesh);
        }

        const pivot = new THREE.Group();
        const incGroup = new THREE.Group();
        const argpGroup = new THREE.Group();
        const translationGroup = new THREE.Group();
        const equatorGroup = new THREE.Group();
        
        if (!isStar) {
            pivot.rotation.y = THREE.MathUtils.degToRad(bodyData.lan);
            incGroup.rotation.x = THREE.MathUtils.degToRad(bodyData.inc);
            argpGroup.rotation.y = THREE.MathUtils.degToRad(bodyData.argp);
            
            const points = [];
            const pathMaterial = new THREE.LineBasicMaterial({ color: 0xffb000, transparent: true, opacity: 0.2, depthWrite: false });
            const segments = 256; 
            for(let i=0; i<=segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                const r = (bodyData.a * (1 - Math.pow(bodyData.e, 2))) / (1 + bodyData.e * Math.cos(theta));
                points.push(new THREE.Vector3(Math.cos(theta) * r * this.UNIT_SCALE, 0, Math.sin(theta) * r * this.UNIT_SCALE));
            }
            const pathGeom = new THREE.BufferGeometry().setFromPoints(points);
            argpGroup.add(new THREE.Line(pathGeom, pathMaterial));
        }

        equatorGroup.rotation.x = THREE.MathUtils.degToRad(bodyData.axialTilt || 0);

        if (bodyData.name === "FURRA") {
            const atmosRadius = (bodyData.radius + 95) * this.UNIT_SCALE;
            const atmosGeom = new THREE.SphereGeometry(atmosRadius, 128, 128);
            
            const atmosMat = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vViewPosition;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        vViewPosition = -mvPosition.xyz;
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    varying vec3 vViewPosition;
                    void main() {
                        vec3 normal = normalize(vNormal);
                        vec3 viewDir = normalize(vViewPosition);
                        // BUG FIX: max(0.0) prevents NaN errors from crashing the pixels and tearing the planet texture
                        float intensity = pow(max(0.0, 0.72 - dot(normal, viewDir)), 2.8);
                        float edgeFade = smoothstep(0.0, 0.45, intensity);
                        gl_FragColor = vec4(1.0, 0.69, 0.0, edgeFade * 0.42);
                    }
                `,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true,
                depthWrite: false
            });
            
            const atmosMesh = new THREE.Mesh(atmosGeom, atmosMat);
            equatorGroup.add(atmosMesh);
        }

        if (bodyData.discs) {
            bodyData.discs.forEach(disc => {
                const lathePoints = [];
                const innerR = disc.start * this.UNIT_SCALE; const outerR = disc.end * this.UNIT_SCALE;
                const steps = 64;
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps; const r = innerR + Math.pow(t, 2) * (outerR - innerR);
                    lathePoints.push(new THREE.Vector2(r, Math.pow(t, 2) * (outerR * 0.12)));
                }
                for (let i = steps; i >= 0; i--) {
                    const t = i / steps; const r = innerR + Math.pow(t, 2) * (outerR - innerR);
                    lathePoints.push(new THREE.Vector2(r, -Math.pow(t, 2) * (outerR * 0.12)));
                }
                const discGeom = new THREE.LatheGeometry(lathePoints, 128);
                const discMesh = new THREE.Mesh(discGeom, new THREE.MeshBasicMaterial({ color: 0xffb000, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false }));
                discMesh.add(new THREE.Mesh(discGeom, new THREE.MeshBasicMaterial({ color: 0xffb000, transparent: true, opacity: 0.04, wireframe: true, depthWrite: false })));
                equatorGroup.add(discMesh);
            });
        }

        if (bodyData.rings) {
            bodyData.rings.forEach(ring => {
                const innerR = ring.start * this.UNIT_SCALE; const outerR = ring.end * this.UNIT_SCALE;
                const ringMesh = new THREE.Mesh(new THREE.RingGeometry(innerR, outerR, 128), new THREE.MeshBasicMaterial({ color: 0xffb000, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false }));
                ringMesh.rotation.x = Math.PI / 2; equatorGroup.add(ringMesh);
                
                const drawBoundary = (radius) => {
                    const linePoints = [];
                    for (let i = 0; i <= 256; i++) linePoints.push(new THREE.Vector3(Math.cos((i / 256) * Math.PI * 2) * radius, 0, Math.sin((i / 256) * Math.PI * 2) * radius));
                    return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(linePoints), new THREE.LineBasicMaterial({ color: 0xffb000, transparent: true, opacity: 0.6, depthWrite: false }));
                };
                equatorGroup.add(drawBoundary(innerR)); equatorGroup.add(drawBoundary(outerR));
            });
        }
        
        equatorGroup.add(coreMesh); translationGroup.add(equatorGroup); argpGroup.add(translationGroup); incGroup.add(argpGroup); pivot.add(incGroup); parentObj.add(pivot);
        
        bodyData.mesh = coreMesh; bodyData.translationGroup = translationGroup; bodyData.equatorGroup = equatorGroup;
    },

    buildSystem: function() {
        this.system.group = new THREE.Group(); this.scene.add(this.system.group);
        this.createBodyMesh(this.system, this.system.group, true);
        this.system.bodies.forEach(planet => {
            this.createBodyMesh(planet, this.system.group);
            planet.bodies.forEach(moon => this.createBodyMesh(moon, planet.equatorGroup));
        });
    },

    selectTargetByName: function(name) {
        let target = null;
        if (name === "OSIRIS") target = this.system;
        else {
            for (let planet of this.system.bodies) {
                if (planet.name === name) target = planet;
                if (planet.bodies) { for (let moon of planet.bodies) { if (moon.name === name) target = moon; } }
            }
        }
        if (target) {
            this.activeTarget = target; const targetPos = new THREE.Vector3(); target.mesh.getWorldPosition(targetPos);
            const camOffset = (target.radius * this.UNIT_SCALE) * 4;
            this.camera.position.copy(targetPos).add(new THREE.Vector3(0, camOffset * 0.5, camOffset * 1.2));
            this.controls.target.copy(targetPos);
            this.controls.minDistance = (target.radius * this.UNIT_SCALE) * 1.005;
            this.lastTargetPos = targetPos.clone(); return true;
        }
        return false;
    },

    executeTimeWarp: function(y, d, h, m, s, speedMode = "MEDIUM") {
        const totalSeconds = (y * 31536000) + (d * 86400) + (h * 3600) + (m * 60) + s;
        
        let realTimeDuration = 30; 
        if (speedMode === "FAST") realTimeDuration = 15;
        if (speedMode === "SLOW") realTimeDuration = 60;
        
        if (totalSeconds <= realTimeDuration) return false;
        
        this.elapseOriginalScale = this.timeScale;
        this.elapseRemainingSeconds = totalSeconds;
        this.elapseActive = true;
        
        this.timeScale = totalSeconds / realTimeDuration;
        return true;
    },

    stopTimeWarp: function() {
        if (!this.elapseActive) return;
        this.elapseActive = false;
        this.elapseRemainingSeconds = 0;
        this.timeScale = this.elapseOriginalScale;
    },

    resize: function() {
        const w = window.innerWidth, h = window.innerHeight - 50; this.uiCanvas.width = w; this.uiCanvas.height = h;
        if(this.camera) { this.camera.aspect = w / h; this.camera.updateProjectionMatrix(); this.renderer.setSize(w, h); }
    },

    start: function() {
        this.isRunning = true; this.lastRealTime = Date.now();
        this.container.style.display = "block"; this.uiCanvas.style.display = "block";
        document.getElementById("output-log").style.display = "none"; this.resize(); this.loop();
    },

    stop: function() { this.isRunning = false; this.activeTarget = null; this.stopTimeWarp(); this.container.style.display = "none"; this.uiCanvas.style.display = "none"; document.getElementById("output-log").style.display = "block"; },
    loop: function() { if (!this.isRunning) return; this.update(); this.renderer.render(this.scene, this.camera); this.drawUI(); requestAnimationFrame(() => this.loop()); },

    update: function() {
        const now = Date.now();
        if (!this.lastRealTime) this.lastRealTime = now;
        const dt = (now - this.lastRealTime) / 1000;
        this.lastRealTime = now;
        
        let deltaSimStep = dt * this.timeScale;
        
        if (this.elapseActive) {
            if (this.elapseRemainingSeconds <= deltaSimStep) {
                deltaSimStep = this.elapseRemainingSeconds;
                this.stopTimeWarp();
                Terminal.log("\n[CHRONO CODES COMPLETE] WARP TARGET RANGE ACHIEVED.");
            } else {
                this.elapseRemainingSeconds -= deltaSimStep;
            }
        }
        
        this.simulatedTime += deltaSimStep;
        
        const processOrbitalMechanics = (body) => {
            if (body.period) {
                const M = ((2 * Math.PI) / body.period) * this.simulatedTime;
                const theta = this.getTrueAnomaly(this.solveKepler(M, body.e), body.e);
                body.translationGroup.position.x = ((body.a * (1 - Math.pow(body.e, 2))) / (1 + body.e * Math.cos(theta))) * Math.cos(theta) * this.UNIT_SCALE;
                body.translationGroup.position.z = ((body.a * (1 - Math.pow(body.e, 2))) / (1 + body.e * Math.cos(theta))) * Math.sin(theta) * this.UNIT_SCALE;
            }
            if (body.rotationPeriod && body.mesh) {
                body.mesh.rotation.y = ((2 * Math.PI) / body.rotationPeriod) * this.simulatedTime;
            }
        };

        this.system.bodies.forEach(planet => { processOrbitalMechanics(planet); if (planet.bodies) planet.bodies.forEach(moon => processOrbitalMechanics(moon)); });

        if (this.activeTarget && this.activeTarget.mesh) {
            const currentPos = new THREE.Vector3(); this.activeTarget.mesh.getWorldPosition(currentPos);
            if (this.lastTargetPos) this.camera.position.add(currentPos.clone().sub(this.lastTargetPos));
            this.controls.target.copy(currentPos); this.lastTargetPos = currentPos.clone();
        }
        this.controls.update();
    },

    drawUI: function() {
        this.ctx.clearRect(0, 0, this.uiCanvas.width, this.uiCanvas.height);
        this.ctx.fillStyle = "#ffb000"; this.ctx.font = "14px 'Courier New'";
        this.ctx.fillText(`CHRONO ENGINE: ${this.timeScale.toLocaleString()}X SYSTEM VELOCITY`, 10, 20);
        this.ctx.fillText(`OSIRIS MASS MODEL: ACTIVE ACCRETION VECTOR MATRIX`, 10, 40);

        if (this.elapseActive) {
            let totalRem = Math.ceil(this.elapseRemainingSeconds);
            let yrs = Math.floor(totalRem / 31536000); let days = Math.floor((totalRem % 31536000) / 86400);
            let hrs = Math.floor((totalRem % 86400) / 3600); let mins = Math.floor((totalRem % 3600) / 60);
            let secs = totalRem % 60;
            
            let pYrs = String(yrs).padStart(4, '0'); let pDays = String(days).padStart(3, '0');
            let pHrs = String(hrs).padStart(2, '0'); let pMins = String(mins).padStart(2, '0'); let pSecs = String(secs).padStart(2, '0');
            
            let displayStr = `WARPING TIME CORE: T-MINUS [ ${pYrs}Y : ${pDays}D : ${pHrs}H : ${pMins}M : ${pSecs}S ]`;
            this.ctx.font = "bold 16px 'Courier New'";
            let strWidth = this.ctx.measureText(displayStr).width;
            let drawX = (this.uiCanvas.width - strWidth) / 2;
            let drawY = this.uiCanvas.height / 2;
            
            this.ctx.fillStyle = "rgba(10, 5, 0, 0.85)";
            this.ctx.fillRect(drawX - 20, drawY - 30, strWidth + 40, 50);
            this.ctx.strokeStyle = "#ffb000";
            this.ctx.strokeRect(drawX - 20, drawY - 30, strWidth + 40, 50);
            
            this.ctx.fillStyle = "#ffb000";
            this.ctx.fillText(displayStr, drawX, drawY);
            this.ctx.font = "10px 'Courier New'";
            this.ctx.fillText("PRESS [ENTER] TO EMERGENCY STOP ENGINE CHRONO CONVERSION", drawX + 15, drawY + 12);
        }

        if (this.activeTarget) {
            let isAnchor = this.activeTarget.name === "OSIRIS"; let boxWidth = 360;
            let startX = this.uiCanvas.width - (boxWidth + 10); let textX = startX + 10;
            let astroLines = this.activeTarget.desc_astro.split('\n');
            let buttonY = 100 + (astroLines.length * 20); if (!isAnchor) buttonY += 130;
            let boxHeight = buttonY + 20;
            
            this.ctx.fillStyle = "rgba(10, 5, 0, 0.9)"; this.ctx.fillRect(startX, 10, boxWidth, boxHeight);
            this.ctx.strokeStyle = "#ffb000"; this.ctx.strokeRect(startX, 10, boxWidth, boxHeight);
            this.ctx.fillStyle = "#ffb000"; this.ctx.font = "bold 16px 'Courier New'"; this.ctx.fillText(`TARGET: ${this.activeTarget.name}`, textX, 30);
            this.ctx.beginPath(); this.ctx.moveTo(startX, 40); this.ctx.lineTo(startX + boxWidth, 40); this.ctx.stroke();
            this.ctx.font = "bold 12px 'Courier New'"; this.ctx.fillText(`[ VISUAL MANIFEST ]`, textX, 60);
            this.ctx.font = "12px 'Courier New'"; this.ctx.fillText(`RADIUS:  ${this.activeTarget.radius.toLocaleString()} KM`, textX, 80);
            for(let i=0; i<astroLines.length; i++) this.ctx.fillText(astroLines[i], textX, 100 + (i*20));

            if (!isAnchor) {
                let currentY = buttonY - 130;
                this.ctx.font = "bold 12px 'Courier New'"; this.ctx.fillText(`[ TELEMETRY ]`, textX, currentY);
                this.ctx.font = "12px 'Courier New'";
                this.ctx.fillText(`SMA (a):  ${this.activeTarget.a.toLocaleString()} KM`, textX, currentY + 20);
                this.ctx.fillText(`ECC (e):  ${this.activeTarget.e}`, textX, currentY + 40);
                this.ctx.fillText(`INC (i):  ${this.activeTarget.inc.toFixed(2)}°`, textX, currentY + 60);
                this.ctx.fillText(`LAN (Ω):  ${this.activeTarget.lan.toFixed(2)}°`, textX, currentY + 80);
            }
        }
    }
};

const Terminal={
    outputLog:document.getElementById("output-log"),
    inputField:document.getElementById("terminal-input"),
    inputWrapper:document.getElementById("input-wrapper"),
    userInput:document.getElementById("user-input"),
    currentApp: null,
    
    init:function(){
        this.userInput.addEventListener("keydown",e=>{"Enter"===e.key&&this.userInput.value.trim()!=""&&document.getElementById("pass-input").focus()});
        document.getElementById("pass-input").addEventListener("keydown",e=>{"Enter"===e.key&&AuthSystem.attemptLogin()});
        
        this.inputField.addEventListener("keydown",e=>{
            if ("Enter"===e.key) {
                if (MapEngine.elapseActive) {
                    this.inputField.value = "STOP";
                }
                let val = this.inputField.value;
                if (""!==val.trim()) this.processInput(val);
                this.inputField.value = "";
            }
        });
        document.getElementById("submit-btn").addEventListener("click",()=>AuthSystem.attemptLogin());
        this.userInput.focus(); MapEngine.init(); 
    },

    launchApp:function(appName){
        this.currentApp = "LOADING"; this.inputField.disabled = true; this.inputField.value = "";
        const ticks = 10; let currentTick = 0;
        const loader = setInterval(() => {
            currentTick++; let pct = Math.floor((currentTick / ticks) * 100);
            let pBar = "["; for(let i=0; i<20; i++) pBar += (i < pct/5) ? "█" : "░"; pBar += "] " + pct + "%";
            this.outputLog.innerText = "PARSING COMPONENT DATA INTERFACES...\n" + pBar;
            if (currentTick >= ticks) {
                clearInterval(loader); this.currentApp = appName; this.inputField.disabled = false;
                this.inputWrapper.classList.add('app-mode');
                this.outputLog.innerText = appName + " ONLINE.\nENTER TARGET DESIGNATION, ELAPSE PARAMETERS, OR 'TERMINATE'.";
                this.inputField.focus();
            }
        }, 50);
    },
    
    processInput:function(input){
        const cleanInput = input.trim();
        const tokens = cleanInput.split(/\s+/);
        const cmd = tokens[0].toUpperCase();
        const fullCmd = cleanInput.toUpperCase();

        if (this.currentApp !== null) {
            if (this.currentApp === "LOADING") return; 
            
            if (cmd === "STOP" && MapEngine.elapseActive) {
                MapEngine.stopTimeWarp();
                this.log("> STOP\n[WARN] TIMECORE WARP INJECTOR SHUT DOWN SAFELY.");
                return;
            }
            
            if (cmd === "TERMINATE") {
                this.currentApp = null; this.inputWrapper.classList.remove('app-mode'); MapEngine.stop();
                this.outputLog.innerText = "OSIRIS CORE MONITOR ACTIVE.\nREADY.";
                return;
            } 
            
            if (this.currentApp === "PLANETARY CHARTS") {
                if (cmd === "ELAPSE") {
                    let argsStr = fullCmd.substring(6);
                    let yMatch = argsStr.match(/(\d+)\s*Y/); let y = yMatch ? parseInt(yMatch[1]) : 0;
                    let dMatch = argsStr.match(/(\d+)\s*D/); let d = dMatch ? parseInt(dMatch[1]) : 0;
                    let hMatch = argsStr.match(/(\d+)\s*H/); let h = hMatch ? parseInt(hMatch[1]) : 0;
                    let mMatch = argsStr.match(/(\d+)\s*M/); let m = mMatch ? parseInt(mMatch[1]) : 0;
                    let sMatch = argsStr.match(/(\d+)\s*S/); let s = sMatch ? parseInt(sMatch[1]) : 0;
                    
                    let speedMatch = argsStr.match(/\b(FAST|MEDIUM|SLOW)\b/);
                    let speedMode = speedMatch ? speedMatch[1] : "MEDIUM";
                    
                    if(!MapEngine.isRunning) {
                        this.log("ERR: PIPELINE SHUTDOWN. ENGINE UNLOADED.");
                        return;
                    }
                    let activated = MapEngine.executeTimeWarp(y, d, h, m, s, speedMode);
                    if (activated) {
                        this.log(`> ELAPSE CORE MATRIX INITIATED: ${y}Y ${d}D ${h}H ${m}M ${s}S [${speedMode} WARP]`);
                    } else {
                        this.log("ERR: DURATION TOO SHORT FOR REQUESTED WARP SPEED.");
                    }
                    return;
                }

                if (!MapEngine.isRunning) {
                    if (cmd === "FURRA" || cmd === "OSIRIS" || cmd === "KIITOS" || cmd === "HARMONY") {
                        MapEngine.start(); MapEngine.selectTargetByName(cmd);
                    } else {
                        this.outputLog.innerText += "\n> " + cleanInput + "\nERR: REQUEST DENIED. DESIGNATION OUTSIDE RANGE.";
                        window.scrollTo(0,document.body.scrollHeight);
                    }
                } else {
                    let found = MapEngine.selectTargetByName(cmd);
                    if (!found) {
                        this.inputField.placeholder = "ERR: OBJECT DETACHED OR RESTRICTED";
                        setTimeout(() => this.inputField.placeholder = "", 2000);
                    }
                }
            } else {
                this.log("> " + cleanInput + "\nERR: APPLICATION UNSTABLE. FINISH OPERATION OR 'TERMINATE'.");
            }
            return;
        }

        this.log("> " + cleanInput);

        if (fullCmd === "PLANETARY CHARTS") {
            this.launchApp("PLANETARY CHARTS");
            return;
        }

        switch(cmd) {
            case "HELP": this.log("COMMAND MENU:\nHELP\nLIST\nLOGOUT\n\nSYSTEM MODULES:\nPLANETARY CHARTS"); break;
            case "LIST": this.log("CANON BALANCES INSTALLED:\n- OSIRIS (BLACK HOLE ANCHOR)\n- FURRA (TERRESTRIAL MOUNT)\n- HARMONY (GAP MOON)\n- KIITOS (OUTER LUNAR BOUNDARY)"); break;
            case "LOGOUT": location.reload(); break;
            default: this.log("ERR: COMMAND PARSE EXCEPTION.");
        }
    },
    
    log:function(e){this.outputLog.innerText+="\n"+e,window.scrollTo(0,document.body.scrollHeight)},
    clearInputs:function(){document.getElementById("user-input").value="",document.getElementById("pass-input").value="",this.userInput.focus()}
};
window.onload=()=>Terminal.init();
</script>
</body></html>
