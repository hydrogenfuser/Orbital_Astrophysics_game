<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL OS v0.0.1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #080500;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.65) 50%
            );
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 9;
            opacity: 0.85;
        }

        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.15;
            font-size: 0.95rem;
        }

        .line-amber, .line-title, #prompt, #command-input, #controls-bar {
            color: #ffb000;
            text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
        }

        .line-amber, .line-title {
            animation: generate-scan 0.08s ease-out forwards;
        }

        @keyframes generate-scan {
            0% {
                background-color: rgba(255, 176, 0, 0.12);
                color: #ffca42;
                text-shadow: 0 0 3px rgba(255, 176, 0, 0.6);
            }
            100% {
                background-color: transparent;
                color: #ffb000;
                text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
            }
        }

        .line-title { 
            font-weight: bold; 
        }

        #controls-bar {
            padding: 6px 10px;
            margin-bottom: 6px;
            background: rgba(255, 176, 0, 0.08);
            border: 1px solid rgba(255, 176, 0, 0.4);
            font-size: 0.85rem;
            display: none;
            font-weight: bold;
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 176, 0, 0.4);
            padding-top: 8px;
        }

        #prompt {
            margin-right: 8px;
            font-weight: bold;
        }

        #command-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }

        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: rgba(255, 176, 0, 0.6);
        }
        #output::-webkit-scrollbar-track {
            background: #080500;
        }
    </style>
</head>
<body>

        <div id="controls-bar"></div>
        <div id="input-line">
            <span id="prompt">Command:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

        const outputEl = document.getElementById("output");

        const inputEl = document.getElementById("command-input");

        function print(text, type = "amber") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function updateControlsBar() {
            if (activeProgram === "RD") {
                controlsBarEl.style.display = "block";
                if (rdInputFocus) {
                    controlsBarEl.textContent = `[ CONTROLS ] Mode: TERMINAL TYPING | Type 'terminate' to exit | Press [ESC] or [Q] to switch back to WASD Navigation`;
                } else {
                    controlsBarEl.textContent = `[ CONTROLS ] Mode: MOVE/NAVIGATE TREE | [WASD]: Move | [E]: Select/Inspect | [Q]: Terminal Typing | Type 'terminate': Exit`;
                }
            } else if (activeProgram === "VAB") {
                controlsBarEl.style.display = "block";
                if (rdInputFocus) {
                    controlsBarEl.textContent = `[ CONTROLS ] Mode: TERMINAL TYPING | Type 'terminate' to exit | Press [ESC] or [Q] to switch back to WASD Navigation`;
                } else {
                    controlsBarEl.textContent = `[ CONTROLS ] Mode: MOVE/NAVIGATE VAB | [W/S]: Select Component | [E]: Inspect | [Q]: Terminal Typing | Type 'terminate': Exit`;
                }
            } else {
                controlsBarEl.style.display = "none";
            }
        }

        function updatePrompt() {
            updateControlsBar();

            if (activeProgram) {
                if (rdInputFocus) {
                    promptEl.textContent = `[${activeProgram} // TERMINAL INPUT]> `;
                    inputEl.focus();
                } else {
                    promptEl.textContent = `[${activeProgram} // NAV MODE (Press Q for Typing)]> `;
                    inputEl.blur();
                }
                return;
            }

            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
            inputEl.focus();
        }

        function bootTerminal() {
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            activeProgram = null;
            rdInputFocus = false;
            updatePrompt();
            printMainMenuHelp();
        }

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        // ASCII Loading screen renderer using ASCII 177 (▒) and 219 (█)
        function renderLoadingASCII(percentage, moduleName) {
            outputEl.innerHTML = "";
            print("================================================================================", "title");
            print(`                 INITIALIZING SUBSYSTEM: ${moduleName.toUpperCase()}`, "title");
            print("================================================================================", "title");
            print("");
            print("  ██████╗ ██████╗ ██████╗ ██████╗████████╗██████╗ ██╗     ", "title");
            print("  ██╔══██╗██╔══██╗██╔══██╗██╔════╝   ██║   ██╔══██╗██║     ", "title");
            print("  ██║  ██║██████╔╝██████╔╝█████╗     ██║   ███████║██║     ", "title");
            print("  ██║  ██║██╔══██╗██╔══██╗██╔══╝     ██║   ██╔══██║██║     ", "title");
            print("  ██████╔╝██║  ██║██████╔╝███████╗   ██║   ██║  ██║███████╗", "title");
            print("  ╚═════╝ ╚═╝  ╚═╝╚═════╝ ╚══════╝   ╚═╝   ╚═╝  ╚═╝╚══════╝", "title");
            print("");
            
            const totalBars = 40;
            const filled = Math.floor((percentage / 100) * totalBars);
            const empty = totalBars - filled;
            const barStr = "[" + "█".repeat(filled) + "▒".repeat(empty) + "]";
            
            print(`  BUS LINK STATUS: ${barStr} ${percentage}%`, "title");
            print("");
            print("================================================================================", "title");
        }

        // Dedicated dynamic loading screens with 4-7 second timers and buffer hang logic
        async function runModuleBootSequence(moduleName, onComplete) {
            isExecutingProgram = true;
            inputEl.disabled = true;

            const totalDurationSec = 4.0 + Math.random() * 3.0; // 4.0 to 7.0 seconds
            const steps = 30;
            const stepDelay = (totalDurationSec * 1000) / steps;

            const isStuck = Math.random() < 0.25; // 25% chance buffer hang
            const stuckStep = Math.floor(Math.random() * 12) + 10;
            const stuckDuration = 1200 + Math.random() * 1000;

            for (let i = 1; i <= steps; i++) {
                const percent = Math.floor((i / steps) * 100);
                renderLoadingASCII(percent, moduleName);
                
                if (isStuck && i === stuckStep) {
                    print(`  [WARN] MEMORY BUFFER HANG... RE-SYNCHRONIZING BUS LINK...`, "amber");
                    await new Promise(r => setTimeout(r, stuckDuration));
                } else {
                    await new Promise(r => setTimeout(r, stepDelay));
                }
            }

            print(`  [SYS] ${moduleName.toUpperCase()} BOOT COMPLETE.`);
            await new Promise(r => setTimeout(r, 200));

            isExecutingProgram = false;
            inputEl.disabled = false;
            onComplete();
        }

        function renderRDLibrary() {
            outputEl.innerHTML = "";
            isInspecting = false;
            printRDHeader();

            const activeTier = techMatrix[selectedTierIndex];
            const activeCategory = activeTier.categories[selectedCategoryIndex];

            print(`TECH MATRIX // LAYER ${selectedTierIndex}: ${activeTier.tierName}`, "title");
            print("--------------------------------------------------------------------------------");

            for (let i = 0; i < activeTier.categories.length; i++) {
                const item = activeTier.categories[i];
                const isSelected = (i === selectedCategoryIndex);
                
                let lineStr = isSelected 
                    ? ` ►► [MOVE SELECT] ${item.cat.toUpperCase().padEnd(16)} : ${item.name} ◄◄` 
                    : `    [AVAILABLE]   ${item.cat.toUpperCase().padEnd(16)} : ${item.name}`;

                print(lineStr, isSelected ? "title" : "amber");
            }

            print("--------------------------------------------------------------------------------");
            print(`ACTIVE NODE: [${activeCategory.cat.toUpperCase()}] -> ${activeCategory.name}`, "title");
            print(`SUMMARY: ${activeCategory.desc}`);
            print("================================================================================", "title");
            updatePrompt();
        }

        function terminateProgram() {
            const prevProgram = activeProgram;
            activeProgram = null;
            rdInputFocus = false;
            isInspecting = false;
            outputEl.innerHTML = "";
            print(`[SYS] ${prevProgram} Module terminated.`);
            print("");
            printLoggedInHelp();
            updatePrompt();
        }

        function processCommand(input) {
            if (isExecutingProgram) return;

            const trimmed = input.trim();

            if (activeProgram) {
                print(`${promptEl.textContent} ${trimmed}`, "amber");
                if (trimmed.toLowerCase() === "terminate") {
                    terminateProgram();
                    return;
                }
                print(`[SYS] Terminal command '${trimmed}' executed in ${activeProgram}. Type 'terminate' to exit program.`);
                return;
            }

            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${trimmed}`, "amber");
            }

            if (currentMode === "NEW_NAME") {
                if (!trimmed) return;
                tempName = trimmed;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "NEW_PASS") {
                if (!trimmed) return;
                const password = trimmed;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                outputEl.innerHTML = "";
                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' initialized.`);
                print(`[SYS] Access ID locked: [${slotName}]`);
                print("");
                printProgramTree();
                printLoggedInHelp();
                return;
            }

            if (currentMode === "LOAD_SELECT") {
                if (!trimmed) return;
                const targetSlot = trimmed.toLowerCase().replace(/\s+/g, '_');

                if (trimmed.toLowerCase() === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${trimmed}' not found.`);
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "LOAD_PASS") {
                if (!trimmed) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === trimmed) {
                    GameState.data = parsedData;
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    
                    outputEl.innerHTML = "";
                    updatePrompt();
                    
                    print(`[SYS] Access granted for profile '${GameState.data.user.name}'.`);
                    print("");
                    printProgramTree();
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Incorrect password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            const parts = trimmed.split(" ");
            const cmd = parts[0].toLowerCase();
            const subCmd = parts[1] ? parts[1].toLowerCase() : "";

            if (currentMode === "LOGGED_IN") {
                if (cmd === "terminate") {
                    print("[SYS] No active sub-program running to terminate.");
                    return;
                }

                if ((cmd === "run" && subCmd === "r&d") || cmd === "r&d") {
                    runModuleBootSequence("Research & Development", () => {
                        activeProgram = "RD";
                        rdInputFocus = false;
                        renderRDLibrary();
                    });
                    return;
                }

                if ((cmd === "run" && subCmd === "vab") || cmd === "vab") {
                    runModuleBootSequence("Vehicle Assembly Building", () => {
                        activeProgram = "VAB";
                        rdInputFocus = false;
                        renderVAB();
                    });
                    return;
                }

                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "programs":
                    case "dir":
                        printProgramTree();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Telemetry saved to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        GameState.activeSlot = "default_save";
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help', 'run r&d', or 'run vab'.`);
                        break;
                }
                return;
            }

            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Scanning local memory...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const loadSaves = getSaveList();
                        if (loadSaves.length === 0) {
                            print("[ERR] No save files present in memory.");
                            return;
                        }

                        print("[SYS] Open Save Files:");
                        loadSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'.`);
                        break;
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (isExecutingProgram) return;

            if (activeProgram) {
                if (e.key === "Escape") {
                    rdInputFocus = false;
                    updatePrompt();
                    return;
                }

                if (!rdInputFocus) {
                    const key = e.key.toUpperCase();

                    if (key === "Q") {
                        rdInputFocus = true;
                        updatePrompt();
                        e.preventDefault();
                        return;
                    }

                    if (activeProgram === "RD") {
                        if (key === "W") {
                            if (isInspecting) { renderRDLibrary(); return; }
                            if (selectedCategoryIndex > 0) selectedCategoryIndex--;
                            renderRDLibrary();
                        } else if (key === "S") {
                            if (isInspecting) { renderRDLibrary(); return; }
                            if (selectedCategoryIndex < techMatrix[selectedTierIndex].categories.length - 1) selectedCategoryIndex++;
                            renderRDLibrary();
                        } else if (key === "A") {
                            if (isInspecting) { renderRDLibrary(); return; }
                            if (selectedTierIndex > 0) {
                                selectedTierIndex--;
                                selectedCategoryIndex = 0;
                            }
                            renderRDLibrary();
                        } else if (key === "D") {
                            if (isInspecting) { renderRDLibrary(); return; }
                            if (selectedTierIndex < techMatrix.length - 1) {
                                selectedTierIndex++;
                                selectedCategoryIndex = 0;
                            }
                            renderRDLibrary();
                        } else if (key === "E") {
                            if (isInspecting) {
                                renderRDLibrary();
                            } else {
                                showCategoryInspection();
                            }
                        }
                    } else if (activeProgram === "VAB") {
                        if (key === "W") {
                            if (isInspecting) { renderVAB(); return; }
                            if (selectedVabIndex > 0) selectedVabIndex--;
                            renderVAB();
                        } else if (key === "S") {
                            if (isInspecting) { renderVAB(); return; }
                            if (selectedVabIndex < vabInventory.length - 1) selectedVabIndex++;
                            renderVAB();
                        } else if (key === "E") {
                            if (isInspecting) {
                                renderVAB();
                            } else {
                                showVabInspection();
                            }
                        }
                    }
                } else {
                    if (e.key === "Q" && inputEl.value === "") {
                        rdInputFocus = false;
                        updatePrompt();
                        e.preventDefault();
                        return;
                    }
                }
            }

            if (e.key === "Enter") {
                const input = inputEl.value;
                inputEl.value = "";
                processCommand(input);
            }
        });

        bootTerminal();
    </script>
</body>
</html>
