<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL v0.0.1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #080500;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.65) 50%
            );
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 9;
            opacity: 0.85;
        }

        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.25;
            font-size: 0.95rem;
        }

        .line-amber, .line-title, #prompt, #command-input, #controls-info {
            color: #ffb000;
            text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
        }

        .line-amber, .line-title {
            animation: generate-scan 0.08s ease-out forwards;
        }

        @keyframes generate-scan {
            0% {
                background-color: rgba(255, 176, 0, 0.12);
                color: #ffca42;
                text-shadow: 0 0 3px rgba(255, 176, 0, 0.6);
            }
            100% {
                background-color: transparent;
                color: #ffb000;
                text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
            }
        }

        .line-title { 
            font-weight: bold; 
        }

        .entry-title {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 2px;
        }

        .entry-version {
            font-size: 1.1rem;
            opacity: 0.85;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }

        #controls-info {
            border-top: 1px solid rgba(255, 176, 0, 0.35);
            padding: 6px 0;
            font-size: 0.88rem;
            min-height: 1.6rem;
            opacity: 0.95;
            font-weight: bold;
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 176, 0, 0.5);
            padding-top: 8px;
        }

        #prompt {
            margin-right: 8px;
            font-weight: bold;
        }

        #command-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }

        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: rgba(255, 176, 0, 0.6);
        }
        #output::-webkit-scrollbar-track {
            background: #080500;
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div id="output"></div>
        <div id="controls-info"></div>
        <div id="input-line">
            <span id="prompt">Command:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        let GameState = {
            activeSlot: "default_save",
            data: {
                user: { name: "Operator", password: "" },
                saveName: "default_save",
                timestamp: null,
                vessel: { 
                    name: "Sounder-Mk1", 
                    mass_kg: 580, 
                    fuelRatio: 65,
                    gimbal: 100,
                    finArea: 10,
                    sepDelay: 1.5
                }
            }
        };

        let currentMode = "MAIN_MENU"; 
        let inRDModule = false;
        let isRDNavActive = false;
        let inVABModule = false;
        let activeVABApp = null;
        let isExecutingProgram = false;
        let isInspecting = false;
        let tempName = "";
        let pendingLoadSlot = "";
        let selectedTierIndex = 0;
        let selectedCategoryIndex = 0;

        const vabApplications = [
            { id: "rocket", name: "Rocket Designer" },
            { id: "payload", name: "Payload Designer" },
            { id: "rover", name: "Rover Simulator" },
            { id: "lander", name: "Lander Simulator" },
            { id: "drone", name: "Drone Simulator" },
            { id: "docking", name: "Docking Computer Simulator" },
            { id: "station", name: "Space Station Computer Simulator" }
        ];

        const techMatrix = [
            {
                tier: 0,
                tierName: "TIER 0: FOUNDATION TECH",
                categories: [
                    { cat: "Probes", name: "Sounding Rocket Payloads", desc: "Tiny volume (0.5 - 2 IVU). Used for sub-orbital vertical hops to test instruments in vacuum." },
                    { cat: "Computers", name: "Mechanical / Manual Relays", desc: "Computers are mechanical and slow, operating purely via radio command execution." },
                    { cat: "Lifting Bodies", name: "Unpressurized Sounding Rockets", desc: "Solid/liquid rockets for potential energy testing." },
                    { cat: "Fuels", name: "Kerosene & Solid Propellants", desc: "Volatile mixtures with higher failure risks." },
                    { cat: "RCS", name: "Cold Gas Thrusters", desc: "Pressurized Nitrogen systems for simple attitude holds." },
                    { cat: "Power", name: "Primary Silver-Zinc Batteries", desc: "Non-rechargeable energy cells." },
                    { cat: "Heat", name: "Passive Conduction Fins", desc: "Basic structural cooling surfaces." },
                    { cat: "Comms", name: "Omnidirectional Whips", desc: "360-degree broad-spectrum radio emissions." },
                    { cat: "Science", name: "Basic Sounding Suite", desc: "Thermometers, Barometers, and Geiger counters." }
                ]
            },
            {
                tier: 1,
                tierName: "TIER 1: FIRST STEPS",
                categories: [
                    { cat: "Probes", name: "Impactors & Early Satellites", desc: "Short-lived orbital probes and lunar impact capsules." },
                    { cat: "Computers", name: "Analog Guidance Computers", desc: "Basic analog calculation relays for trajectory correction." },
                    { cat: "Lifting Bodies", name: "ICBM-derived Launchers", desc: "Unpressurized ballistic launch systems for low orbit entry." },
                    { cat: "Fuels", name: "Refined RP-1 / LOX", desc: "Higher efficiency, safer chemical propellant mixtures." },
                    { cat: "RCS", name: "Hydrogen Peroxide Monopropellant", desc: "Catalytic thrust systems for fine directional control." },
                    { cat: "Power", name: "Basic Solar Panels", desc: "First-generation photovoltaic power generation." },
                    { cat: "Heat", name: "Multi-Layer Insulation (MLI)", desc: "Gold/Silver skin wraps for vacuum radiation shielding." },
                    { cat: "Comms", name: "Yagi-Uda Directional Antennas", desc: "Point-to-point focused radio communication dishes." },
                    { cat: "Science", name: "Deployable Boom Magnetometers", desc: "Extended sensors for cleaner planetary magnetic field mapping." }
                ]
            }
        ];

        const outputEl = document.getElementById("output");
        const promptEl = document.getElementById("prompt");
        const inputEl = document.getElementById("command-input");
        const controlsInfoEl = document.getElementById("controls-info");

        function print(text, type = "amber") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function setControlsBar(text) {
            controlsInfoEl.textContent = text;
        }

        function updatePrompt() {
            if (inRDModule) {
                if (isRDNavActive) {
                    setControlsBar("CONTROLS: WASD = Navigate Tree | E = Inspect Item | Q = Exit WASD Nav Mode | 'terminate' = Close Program");
                    promptEl.textContent = `[R&D // WASD NAV ACTIVE]> `;
                } else if (isInspecting) {
                    setControlsBar("CONTROLS: WASD/Q = Return to Index | 'terminate' = Close Program");
                    promptEl.textContent = `[R&D // INSPECTION VIEW]> `;
                } else {
                    setControlsBar("CONTROLS: Type 'move' to unlock WASD navigation | 'terminate' = Close Program");
                    promptEl.textContent = `[R&D // COMMAND]> `;
                }
                return;
            }

            if (inVABModule) {
                setControlsBar("CONTROLS: Enter Option # (1-7) | 'back' = App List | 'terminate' = Close Program");
                if (activeVABApp) {
                    promptEl.textContent = `[VAB // ${activeVABApp.name.toUpperCase()} ]> `;
                } else {
                    promptEl.textContent = `[VAB // MENU]> `;
                }
                return;
            }

            setControlsBar("SYSTEM READY // Enter command.");

            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
        }

        function showTitle() {
            const titleDiv = document.createElement("div");
            titleDiv.className = "entry-title line-title";
            titleDiv.textContent = "ORBITAL";
            
            const versionDiv = document.createElement("div");
            versionDiv.className = "entry-version line-amber";
            versionDiv.textContent = "v0.0.1";

            outputEl.appendChild(titleDiv);
            outputEl.appendChild(versionDiv);
            print("");
        }

        function printRDHeader() {
            print("██████▒   ▒▒▒   ██████▒ ", "title");
            print("██▒  ██▒   █    ██▒  ██▒", "title");
            print("██████▒   ▒█▒   ██▒  ██▒", "title");
            print("██▒  ██▒   █    ██▒  ██▒", "title");
            print("██▒  ██▒  ▒▒▒   ██████▒ ", "title");
            print("================================================================================", "title");
            print("                    RESEARCH & DEVELOPMENT LABORATORY                           ", "title");
            print("================================================================================", "title");
            print("");
        }

        function printVABHeader() {
            print("██▒  ██▒  █████▒   ██████▒ ", "title");
            print("██▒  ██▒ ██▒  ██▒  ██▒  ██▒", "title");
            print("██▒  ██▒ ███████▒  ██████▒ ", "title");
            print("██▒  ██▒ ██▒  ██▒  ██▒  ██▒", "title");
            print(" █████▒  ██▒  ██▒  ██████▒ ", "title");
            print("================================================================================", "title");
            print("                   VEHICLE ASSEMBLY BUILDING SYSTEM                             ", "title");
            print("================================================================================", "title");
            print("");
        }

        function printProgramTree() {
            print("ORBITAL OS // SYSTEM DIRECTORY", "title");
            print("└── System Programs");
            print("    ├── VAB");
            print("    ├── Hangars");
            print("    ├── R&D");
            print("    ├── Astronaut Complex");
            print("    ├── Contractors");
            print("    ├── Flight");
            print("    └── DSN");
            print("");
        }

        function printMainMenuHelp() {
            print("Available commands:");
            print("  new             - Create a new profile and start session");
            print("  load            - View save files and login");
            print("  saves           - List available save files");
            print("  clear           - Clear terminal screen");
        }

        function printLoggedInHelp() {
            print("Available commands:");
            print("  run [program]   - Execute system program (e.g. 'run r&d', 'run vab')");
            print("  programs        - Display system program tree");
            print("  status          - Display vessel parameters");
            print("  save            - Save current progress");
            print("  logout          - Exit current session");
            print("  clear           - Clear terminal screen");
        }

        function bootTerminal() {
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            inRDModule = false;
            isRDNavActive = false;
            inVABModule = false;
            activeVABApp = null;
            updatePrompt();
            printMainMenuHelp();
        }

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        function renderLoadingFrame(logoLines, percent, logs, moduleType) {
            outputEl.innerHTML = "";
            
            // Top-Down Stage Logo Rendering
            const linesToShow = Math.max(1, Math.ceil((percent / 100) * logoLines.length));
            for (let l = 0; l < logoLines.length; l++) {
                if (l < linesToShow) {
                    print(logoLines[l], "title");
                } else {
                    print("");
                }
            }

            print("================================================================================", "title");
            print(`MOUNTING SYSTEM MODULE: ${moduleType === "RD" ? "RESEARCH & DEVELOPMENT" : "VEHICLE ASSEMBLY BAY"}`, "title");
            print("================================================================================", "title");
            print("");

            // Middle ASCII Progress Bar with centered percentage underneath
            const totalWidth = 36;
            const filled = Math.floor((percent / 100) * totalWidth);
            const empty = totalWidth - filled;
            const barStr = "[" + "█".repeat(filled) + "░".repeat(empty) + "]";
            
            print(`                      ${barStr}`, "title");
            print(`                                 ${percent}%`, "title");
            print("");
            print("--------------------------------------------------------------------------------");
            print("PARSING TELEMETRY & SYSTEM LOGS:", "title");
            logs.forEach(log => {
                print(` > ${log}`);
            });
        }

        async function runModuleBootSequence(moduleType, onComplete) {
            isExecutingProgram = true;
            inputEl.disabled = true;

            const totalDurationMs = (5.0 + Math.random() * 2.0) * 1000; // 5 to 7 seconds
            const steps = 28;
            const stepDelay = totalDurationMs / steps;

            const willGetStuck = Math.random() < 0.25; // 25% chance of connection delay
            const stuckStep = Math.floor(Math.random() * 10) + 10;
            const stuckDurationMs = 3000; // 3 second hang

            const parseQueue = [
                "Authorizing user security credentials...",
                "Establishing physical wire connection...",
                "Routing telemetry data protocols...",
                "Allocating local stack memory buffers...",
                "Bypassing mainframe authentication proxy...",
                "Initializing bus interface controllers...",
                "Loading hardware specs and definitions...",
                "Verifying hardware node parity keys..."
            ];

            const logoLines = (moduleType === "RD") ? [
                "██████▒   ▒▒▒   ██████▒ ",
                "██▒  ██▒   █    ██▒  ██▒",
                "██████▒   ▒█▒   ██▒  ██▒",
                "██▒  ██▒   █    ██▒  ██▒",
                "██▒  ██▒  ▒▒▒   ██████▒ "
            ] : [
                "██▒  ██▒  █████▒   ██████▒ ",
                "██▒  ██▒ ██▒  ██▒  ██▒  ██▒",
                "██▒  ██▒ ███████▒  ██████▒ ",
                "██▒  ██▒ ██▒  ██▒  ██▒  ██▒",
                " █████▒  ██▒  ██▒  ██████▒ "
            ];

            let activeLogs = [];
            let isStuckTriggered = false;

            for (let i = 1; i <= steps; i++) {
                const percent = Math.floor((i / steps) * 100);

                if (parseQueue.length > 0 && Math.random() < 0.4) {
                    const msg = parseQueue.shift();
                    if (msg) activeLogs.push(msg);
                    if (activeLogs.length > 5) activeLogs.shift();
                }

                if (willGetStuck && i === stuckStep && !isStuckTriggered) {
                    isStuckTriggered = true;
                    activeLogs.push("[WARN] Connection interruption detected... Re-routing bus connection...");
                    if (activeLogs.length > 5) activeLogs.shift();
                    renderLoadingFrame(logoLines, percent, activeLogs, moduleType);
                    await new Promise(r => setTimeout(r, stuckDurationMs));
                }

                renderLoadingFrame(logoLines, percent, activeLogs, moduleType);
                await new Promise(r => setTimeout(r, stepDelay));
            }

            outputEl.innerHTML = "";
            isExecutingProgram = false;
            inputEl.disabled = false;
            inputEl.focus();
            onComplete();
        }

        function renderRDLibrary() {
            outputEl.innerHTML = "";
            isInspecting = false;
            printRDHeader();

            const activeTier = techMatrix[selectedTierIndex];
            const activeCategory = activeTier.categories[selectedCategoryIndex];

            print(`ACTIVE TIER: ${activeTier.tierName}`, "title");
            print("--------------------------------------------------------------------------------");

            for (let i = 0; i < activeTier.categories.length; i++) {
                const item = activeTier.categories[i];
                const isSelected = (i === selectedCategoryIndex);
                
                let lineStr = isSelected 
                    ? ` ►► [UNLOCKED] ${item.cat.toUpperCase().padEnd(15)} : ${item.name} ◄◄` 
                    : `    [UNLOCKED] ${item.cat.toUpperCase().padEnd(15)} : ${item.name}`;

                print(lineStr, isSelected ? "title" : "amber");
            }

            print("--------------------------------------------------------------------------------");
            print(`CURRENTLY HIGHLIGHTED: [${activeCategory.cat.toUpperCase()}] -> ${activeCategory.name}`, "title");
            print(`BRIEF: ${activeCategory.desc}`);
            print("================================================================================", "title");
            updatePrompt();
        }

        function showCategoryInspection() {
            outputEl.innerHTML = "";
            isInspecting = true;
            printRDHeader();

            const activeTier = techMatrix[selectedTierIndex];
            const item = activeTier.categories[selectedCategoryIndex];

            print(`SPECIFICATION LEDGER // ${item.cat.toUpperCase()}`, "title");
            print("--------------------------------------------------------------------------------");
            print(`ITEM NAME:   ${item.name}`);
            print(`TIER LEVEL:  ${activeTier.tierName}`);
            print(`STATUS:      UNLOCKED & AVAILABLE`);
            print("--------------------------------------------------------------------------------");
            print("HARDWARE OVERVIEW:", "title");
            print(`  ${item.desc}`);
            print("--------------------------------------------------------------------------------");
            print("================================================================================", "title");
            updatePrompt();
        }

        function renderVABMenu() {
            outputEl.innerHTML = "";
            printVABHeader();

            print("AVAILABLE APPLICATIONS:", "title");
            print("--------------------------------------------------------------------------------");

            vabApplications.forEach((app, idx) => {
                const line = `  [${idx + 1}] ${app.name}`;
                print(line, "amber");
            });

            print("--------------------------------------------------------------------------------");
            print("================================================================================", "title");
            updatePrompt();
        }

        function renderVABAppStudio(app) {
            outputEl.innerHTML = "";
            printVABHeader();

            const v = GameState.data.vessel;
            const totalMass = v.mass_kg + Math.floor(v.fuelRatio * 4.2) + Math.floor(v.finArea * 1.5);
            const thrust = 12.5; // kN
            const twr = ((thrust * 1000) / (totalMass * 9.81)).toFixed(2);
            const estDV = Math.floor(1200 + (v.fuelRatio * 18) - (v.finArea * 5));

            print(`ACTIVE STUDIO TOOLKIT: ${app.name.toUpperCase()}`, "title");
            print(`TARGET CHASSIS: [ ${v.name} ]`);
            print("--------------------------------------------------------------------------------");
            print(" [TUNING & MODIFICATION MATRIX]", "title");
            print(`  [1] Fuel Mixture Ratio  : [${"█".repeat(Math.floor(v.fuelRatio / 10))}${"░".repeat(10 - Math.floor(v.fuelRatio / 10))}] ${v.fuelRatio}% Kerosene`);
            print(`  [2] Gimbal Limiter      : [${"█".repeat(Math.floor(v.gimbal / 10))}${"░".repeat(10 - Math.floor(v.gimbal / 10))}] ${v.gimbal}% Range`);
            print(`  [3] Aero Fin Area       : [${"█".repeat(Math.floor(v.finArea / 2))}${"░".repeat(10 - Math.floor(v.finArea / 2))}] ${v.finArea} sq.m`);
            print(`  [4] Stage Sep Delay     : [ ${v.sepDelay}s ]`);
            print("--------------------------------------------------------------------------------");
            print(" [DYNAMIC TELEMETRY CALCULATOR]", "title");
            print(`  Calculated Wet Mass : ${totalMass} kg`);
            print(`  Ground Thrust-to-Wt : ${twr} TWR`);
            print(`  Estimated Delta-V   : ${estDV} m/s`);
            print("--------------------------------------------------------------------------------");
            print("Controls: Type '1'-'4' to adjust parameters. Type 'back' for VAB menu, or 'terminate'.");
            print("================================================================================", "title");
            updatePrompt();
        }

        function processCommand(input) {
            if (isExecutingProgram) return;

            const trimmedInput = input.trim();
            const lowerInput = trimmedInput.toLowerCase();

            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${trimmedInput}`, "amber");
            }

            if (lowerInput === "terminate") {
                inRDModule = false;
                isRDNavActive = false;
                inVABModule = false;
                isInspecting = false;
                activeVABApp = null;
                outputEl.innerHTML = "";
                print("[SYS] ACTIVE PROGRAM TERMINATED.");
                print("");
                printLoggedInHelp();
                updatePrompt();
                return;
            }

            if (inRDModule) {
                if (lowerInput === "move") {
                    isRDNavActive = true;
                    updatePrompt();
                    print("[SYS] WASD Navigation Unlocked. Use WASD keys to browse tree, 'E' to select/inspect, 'Q' to return to typing.");
                    return;
                }

                if (isRDNavActive) {
                    if (lowerInput === "q") {
                        isRDNavActive = false;
                        updatePrompt();
                        print("[SYS] Exited WASD navigation mode. Type 'move' to enter again.");
                        return;
                    }
                }

                if (isInspecting) {
                    if (lowerInput === "q" || lowerInput === "back") {
                        renderRDLibrary();
                        return;
                    }
                }

                print(`[SYS] R&D Command: Type 'move' to activate tree navigation, or 'terminate' to exit.`);
                return;
            }

            if (inVABModule) {
                if (activeVABApp) {
                    if (lowerInput === "back") {
                        activeVABApp = null;
                        renderVABMenu();
                        return;
                    }
                    const v = GameState.data.vessel;
                    if (lowerInput === "1") {
                        v.fuelRatio = (v.fuelRatio + 10) > 100 ? 10 : v.fuelRatio + 10;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "2") {
                        v.gimbal = (v.gimbal + 20) > 100 ? 20 : v.gimbal + 20;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "3") {
                        v.finArea = (v.finArea + 2) > 20 ? 2 : v.finArea + 2;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "4") {
                        v.sepDelay = (v.sepDelay >= 3.0) ? 0.5 : parseFloat((v.sepDelay + 0.5).toFixed(1));
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    print("[SYS] Type '1'-'4' to adjust, 'back' for menu, or 'terminate'.");
                    return;
                } else {
                    const option = parseInt(lowerInput, 10);
                    if (!isNaN(option) && option >= 1 && option <= vabApplications.length) {
                        activeVABApp = vabApplications[option - 1];
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    print("[SYS] Enter an application number (1-7), or type 'terminate'.");
                    return;
                }
            }

            if (currentMode === "NEW_NAME") {
                if (!trimmedInput) return;
                tempName = trimmedInput;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "NEW_PASS") {
                if (!trimmedInput) return;
                const password = trimmedInput;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                outputEl.innerHTML = "";
                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' created.`);
                print(`[SYS] Profile ID: [${slotName}]`);
                print("");
                printProgramTree();
                printLoggedInHelp();
                return;
            }

            if (currentMode === "LOAD_SELECT") {
                if (!trimmedInput) return;
                const targetSlot = trimmedInput.toLowerCase().replace(/\s+/g, '_');

                if (lowerInput === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${trimmedInput}' not found.`);
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "LOAD_PASS") {
                if (!trimmedInput) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === trimmedInput) {
                    GameState.data = parsedData;
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    
                    outputEl.innerHTML = "";
                    updatePrompt();
                    
                    print(`[SYS] Access granted for user '${GameState.data.user.name}'.`);
                    print("");
                    printProgramTree();
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Invalid password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            const parts = lowerInput.split(" ");
            const cmd = parts[0];
            const subCmd = parts[1] || "";

            if (currentMode === "LOGGED_IN") {
                if ((cmd === "run" && subCmd === "r&d") || cmd === "r&d") {
                    runModuleBootSequence("RD", () => {
                        inRDModule = true;
                        isRDNavActive = false;
                        renderRDLibrary();
                    });
                    return;
                }

                if ((cmd === "run" && subCmd === "vab") || cmd === "vab") {
                    runModuleBootSequence("VAB", () => {
                        inVABModule = true;
                        renderVABMenu();
                    });
                    return;
                }

                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "programs":
                    case "dir":
                        printProgramTree();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Data written to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        GameState.activeSlot = "default_save";
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help', 'run r&d', or 'run vab'.`);
                        break;
                }
                return;
            }

            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Reading save records...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const loadSaves = getSaveList();
                        if (loadSaves.length === 0) {
                            print("[ERR] No save files present in memory.");
                            return;
                        }

                        print("[SYS] Available Save Files:");
                        loadSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'.`);
                        break;
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (isExecutingProgram) return;

            if (inRDModule && isRDNavActive) {
                const key = e.key.toUpperCase();
                if (key === "W") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex > 0) selectedCategoryIndex--;
                    renderRDLibrary();
                } else if (key === "S") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex < techMatrix[selectedTierIndex].categories.length - 1) selectedCategoryIndex++;
                    renderRDLibrary();
                } else if (key === "A") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex > 0) {
                        selectedTierIndex--;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                } else if (key === "D") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex < techMatrix.length - 1) {
                        selectedTierIndex++;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                } else if (key === "E") {
                    if (!isInspecting) showCategoryInspection();
                } else if (key === "Q") {
                    if (isInspecting) {
                        renderRDLibrary();
                    } else {
                        isRDNavActive = false;
                        updatePrompt();
                        print("[SYS] Exited WASD navigation mode.");
                    }
                }
            }

            if (e.key === "Enter") {
                const input = inputEl.value;
                inputEl.value = "";
                processCommand(input);
            }
        });

        bootTerminal();
    </script>
</body>
</html>
