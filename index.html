        // Compute 2D shelf placement inside normalized probe chassis coordinates
        function compute2DLayout(modules, probeSideX = 0.50, probeSideY = 0.50) {
            let curX = 0;
            let curY = 0;
            let rowH = 0;

            return modules.map(mod => {
                if (mod.mount === "top") {
                    return { ...mod, posX: 0, posY: 0, relW: 0, relH: 0, relX: 0, relY: 0 };
                }

                let pw = mod.dimX / probeSideX; // normalized relative to chassis width
                let ph = mod.dimY / probeSideY; // normalized relative to chassis height

                if (curX + pw > 1.0001) {
                    curX = 0;
                    curY += rowH;
                    rowH = 0;
                }

                const item = {
                    ...mod,
                    posX: curX,
                    posY: curY,
                    relW: pw,
                    relH: ph,
                    relX: curX * probeSideX,
                    relY: curY * probeSideY
                };

                curX += pw;
                if (ph > rowH) rowH = ph;

                return item;
            });
        }

        // Validate physical fitting inside chassis
        function canFitInProbe(existingModules, newPart, probeSideX = 0.50, probeSideY = 0.50) {
            const testList = [...existingModules, { ...newPart }];
            
            // Check total footprint area
            const totalArea = testList.reduce((acc, m) => acc + (m.dimX * m.dimY), 0);
            const maxArea = payloadSpecs.maxArea || 0.25;
            if (totalArea > maxArea + 0.0001) {
                return { canFit: false, reason: "Area footprint limit exceeded." };
            }

            // Check geometric layout fit
            const layout = compute2DLayout(testList, probeSideX, probeSideY);
            for (let item of layout) {
                if (item.mount === "top") continue;
                if (item.posY + item.relH > 1.0001) {
                    return { canFit: false, reason: "Geometric space exceeded (item does not physically fit in grid)." };
                }
            }

            return { canFit: true };
        }

        function isFanTouchingComputer(fanItem, placedModules) {
            const computers = placedModules.filter(m => m.id === "analog_computer");
            if (computers.length === 0) return false;

            const fX1 = fanItem.posX;
            const fY1 = fanItem.posY;
            const fX2 = fanItem.posX + fanItem.relW;
            const fY2 = fanItem.posY + fanItem.relH;

            const eps = 0.02;

            for (let c of computers) {
                const cX1 = c.posX;
                const cY1 = c.posY;
                const cX2 = c.posX + c.relW;
                const cY2 = c.posY + c.relH;

                const touchX = (fX1 <= cX2 + eps) && (fX2 >= cX1 - eps);
                const touchY = (fY1 <= cY2 + eps) && (fY2 >= cY1 - eps);

                if (touchX && touchY) return true;
            }

            return false;
        }

        function renderProbeGraphicsLoop() {
            if (!isRenderingCanvas) return;

            const now = performance.now();
            const dt = (now - lastFrameTime) / 1000;
            lastFrameTime = now;

            const flashVal = 0.5 + 0.5 * Math.sin(now * 0.008);
            const flashAmber = `rgba(255, 176, 0, ${0.35 + 0.65 * flashVal})`;

            const rect = canvasContainerEl.getBoundingClientRect();
            probeCanvas.width = rect.width || 700;
            probeCanvas.height = rect.height || 400;

            const w = probeCanvas.width;
            const h = probeCanvas.height;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "#050300";
            ctx.fillRect(0, 0, w, h);

            // Side lengths of probe chassis (Default 0.5m x 0.5m)
            const sideX = payloadSpecs.sideX || 0.50;
            const sideY = payloadSpecs.sideY || 0.50;

            const probeCenterX = w * 0.30;
            const probeCenterY = h * 0.52;

            // Scale factor relative to 0.5m dimensions
            const scalePx = Math.min(w * 0.48, 360); 
            const baseW = scalePx * (sideX / 0.50);
            const baseH = scalePx * (sideY / 0.50);

            const left = probeCenterX - (baseW / 2);
            const top = probeCenterY - (baseH / 2);

            // Calculate Pressurization status
            const pressTarget = payloadSpecs.isPressurized ? 1.0 : 0.0;
            if (pressurizeCurrent < pressTarget) {
                pressurizeCurrent = Math.min(pressTarget, pressurizeCurrent + dt / 2.0);
            } else if (pressurizeCurrent > pressTarget) {
                pressurizeCurrent = Math.max(pressTarget, pressurizeCurrent - dt / 2.0);
            }

            const modules = payloadSpecs.modules || [];
            const placedModules = compute2DLayout(modules, sideX, sideY);

            // Render Antennas on Top of probe shell
            const topAntennas = placedModules.filter(m => m.mount === "top");

            if (topAntennas.length > 0) {
                const antennaSpacing = baseW / (topAntennas.length + 1);
                topAntennas.forEach((ant, idx) => {
                    const antX = left + antennaSpacing * (idx + 1);
                    const antStartY = payloadSpecs.shape === "Spherical" 
                        ? probeCenterY - Math.sqrt(Math.max(0, (baseW / 2) ** 2 - (antX - probeCenterX) ** 2)) 
                        : top;
                    
                    ctx.strokeStyle = "#ffb000";
                    ctx.fillStyle = "#ffb000";
                    ctx.lineWidth = 2.0;

                    if (ant.id === "dipole") {
                        // High-detail Dipole Antenna Model
                        ctx.fillRect(antX - 12, antStartY - 6, 24, 6); // Heavy Base Flange
                        ctx.fillRect(antX - 5, antStartY - 18, 10, 12); // Central Feeder/Balun Housing

                        // Insulator rings
                        ctx.fillStyle = "rgba(255, 176, 0, 0.4)";
                        ctx.fillRect(antX - 7, antStartY - 12, 14, 3);
                        ctx.fillStyle = "#ffb000";

                        // Reinforced Vertical Mast
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.moveTo(antX, antStartY - 18);
                        ctx.lineTo(antX, antStartY - 50);
                        ctx.stroke();

                        // Central Distribution Hub
                        ctx.fillRect(antX - 8, antStartY - 54, 16, 6);
                        ctx.beginPath();
                        ctx.arc(antX, antStartY - 51, 3, 0, Math.PI * 2);
                        ctx.fillStyle = "#050300";
                        ctx.fill();
                        ctx.fillStyle = "#ffb000";

                        // Dual Branching Telescopic Horizontal Arms
                        ctx.lineWidth = 3.0;
                        ctx.beginPath();
                        ctx.moveTo(antX - 8, antStartY - 51);
                        ctx.lineTo(antX - 70, antStartY - 72); // Left Branch

                        ctx.moveTo(antX + 8, antStartY - 51);
                        ctx.lineTo(antX + 70, antStartY - 72); // Right Branch
                        ctx.stroke();

                        // Dipole Loading Coils & End Elements
                        ctx.fillRect(antX - 45, antStartY - 68, 10, 8);
                        ctx.fillRect(antX + 35, antStartY - 68, 10, 8);

                        ctx.beginPath();
                        ctx.arc(antX - 70, antStartY - 72, 5, 0, Math.PI * 2);
                        ctx.arc(antX + 70, antStartY - 72, 5, 0, Math.PI * 2);
                        ctx.fill();

                    } else if (ant.id === "helical") {
                        // High-Detail 3D Helical Antenna
                        ctx.fillRect(antX - 14, antStartY - 6, 28, 6); // Ground reflector base plate
                        
                        const coilHeight = 95;
                        const coilRadius = 20;
                        const turns = 8;
                        const topY = antStartY - coilHeight;

                        // Central axial line going straight through middle
                        ctx.lineWidth = 1.5;
                        ctx.strokeStyle = "rgba(255, 176, 0, 0.6)";
                        ctx.beginPath();
                        ctx.moveTo(antX, antStartY - 6);
                        ctx.lineTo(antX, topY);
                        ctx.stroke();

                        // Draw realistic 3D spiral coil with depth shading
                        const pointsPerTurn = 24;
                        const totalPoints = turns * pointsPerTurn;

                        for (let p = 0; p < totalPoints; p++) {
                            const angle1 = (p / pointsPerTurn) * Math.PI * 2;
                            const angle2 = ((p + 1) / pointsPerTurn) * Math.PI * 2;
                            
                            const curY1 = (antStartY - 6) - (p / totalPoints) * (coilHeight - 10);
                            const curY2 = (antStartY - 6) - ((p + 1) / totalPoints) * (coilHeight - 10);
                            
                            const curX1 = antX + Math.sin(angle1) * coilRadius;
                            const curX2 = antX + Math.sin(angle2) * coilRadius;

                            const cosA = Math.cos(angle1);
                            ctx.strokeStyle = cosA > 0 ? "#ffb000" : "rgba(255, 176, 0, 0.4)";
                            ctx.lineWidth = cosA > 0 ? 2.8 : 1.5;

                            ctx.beginPath();
                            ctx.moveTo(curX1, curY1);
                            ctx.lineTo(curX2, curY2);
                            ctx.stroke();
                        }

                        // Top feed transition cap
                        ctx.strokeStyle = "#ffb000";
                        ctx.lineWidth = 2.0;
                        ctx.fillRect(antX - 10, topY - 4, 20, 5);
                        ctx.beginPath();
                        ctx.arc(antX, topY - 4, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            }

            // Internal Bounds Clipping
            ctx.save();
            ctx.beginPath();
            if (payloadSpecs.shape === "Spherical") {
                ctx.ellipse(probeCenterX, probeCenterY, baseW / 2, baseH / 2, 0, 0, Math.PI * 2);
            } else {
                ctx.rect(left, top, baseW, baseH);
            }
            ctx.clip();

            // Amber Pressurization Hue Background
            if (pressurizeCurrent > 0.001) {
                ctx.fillStyle = `rgba(255, 176, 0, ${0.28 * pressurizeCurrent})`;
                ctx.fillRect(left - 20, top - 20, baseW + 40, baseH + 40);
            }

            let innerWidth, innerHeight, innerLeft, innerTop;

            if (payloadSpecs.shape === "Spherical") {
                innerWidth = baseW / Math.SQRT2;
                innerHeight = baseH / Math.SQRT2;
                innerLeft = probeCenterX - (innerWidth / 2);
                innerTop = probeCenterY - (innerHeight / 2);
            } else {
                innerWidth = baseW - 16;
                innerHeight = baseH - 16;
                innerLeft = left + 8;
                innerTop = top + 8;
            }

            // Draw 2D Internal Modules
            placedModules.forEach((mod) => {
                if (mod.mount === "top") return;

                const mX = innerLeft + mod.posX * innerWidth;
                const mY = innerTop + mod.posY * innerHeight;
                const mW = mod.relW * innerWidth;
                const mH = mod.relH * innerHeight;

                ctx.fillStyle = "rgba(255, 176, 0, 0.22)";
                ctx.strokeStyle = "#ffb000";
                ctx.lineWidth = 1.5;

                ctx.fillRect(mX, mY, mW - 1, mH - 1);
                ctx.strokeRect(mX, mY, mW - 1, mH - 1);

                ctx.fillStyle = "#ffb000";
                const fontSize = Math.max(8, Math.min(12, Math.floor(mH * 0.40)));
                ctx.font = `${fontSize}px 'Courier New', monospace`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                let shortName = mod.name.replace("Analog ", "").replace(" battery", "");
                if (mW < 35) shortName = shortName.substring(0, 3);
                
                // Special module indicator rendering
                if (mod.id === "film_camera") {
                    ctx.fillText(shortName, mX + mW / 2, mY + mH / 2 - 4);
                    const dirArrow = mod.direction === "Left" ? "◄" : "►";
                    
                    // Wall check validation
                    const isLeftWall = mod.posX === 0;
                    const isRightWall = (mod.posX + mod.relW) >= 0.999;
                    const isValidWall = (mod.direction === "Left" && isLeftWall) || (mod.direction === "Right" && isRightWall);

                    ctx.fillStyle = isValidWall ? "#ffb000" : flashAmber;
                    ctx.fillText(`CAM ${dirArrow}`, mX + mW / 2, mY + mH / 2 + 6);
                } else if (mod.id === "ballistic_capsule") {
                    ctx.fillText(shortName, mX + mW / 2, mY + mH / 2 - 4);
                    const pTag = mod.parachute ? "P" : "-";
                    const hTag = mod.heatShield ? "H" : "-";
                    const iTag = mod.internalSlot ? mod.internalSlot.substring(0, 3).toUpperCase() : "NONE";
                    ctx.fillText(`[${pTag}|${hTag}|${iTag}]`, mX + mW / 2, mY + mH / 2 + 6);
                } else {
                    ctx.fillText(shortName, mX + mW / 2, mY + mH / 2);
                }
            });

            ctx.restore();

            // Outline of chassis
            if (payloadSpecs.shape === "Spherical") {
                ctx.strokeStyle = "rgba(255, 176, 0, 0.25)";
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.strokeRect(innerLeft, innerTop, innerWidth, innerHeight);
                ctx.setLineDash([]);
            }

            ctx.strokeStyle = "#ffb000";
            ctx.lineWidth = 2.5;
            ctx.shadowColor = "#ffb000";
            ctx.shadowBlur = 8;
            ctx.beginPath();
            if (payloadSpecs.shape === "Spherical") {
                ctx.ellipse(probeCenterX, probeCenterY, baseW / 2, baseH / 2, 0, 0, Math.PI * 2);
            } else {
                ctx.rect(left, top, baseW, baseH);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Right HUD: Area calculation and specs
            const rightX = w * 0.58;
            const usedArea = modules.reduce((acc, m) => acc + (m.dimX * m.dimY), 0);
            const maxArea = payloadSpecs.maxArea || 0.25;
            const remainingArea = Math.max(0, maxArea - usedArea);

            ctx.fillStyle = "#ffb000";
            ctx.font = "bold 13px 'Courier New', monospace";
            ctx.textAlign = "left";
            ctx.textBaseline = "top";

            ctx.fillText(`CHASSIS: ${payloadSpecs.name.toUpperCase()} [${sideX}m x ${sideY}m ${payloadSpecs.shape.toUpperCase()}]`, rightX, 15);
            ctx.fillText(`ATMOSPHERE: ${pressurizeCurrent > 0.01 ? `PRESSURIZING (${Math.floor(pressurizeCurrent * 100)}%)` : "VACUUM"}`, rightX, 32);

            const areaExceeded = usedArea > maxArea + 0.0001;
            ctx.fillStyle = areaExceeded ? flashAmber : "#ffb000";
            ctx.fillText(`FOOTPRINT AREA: ${usedArea.toFixed(3)} / ${maxArea.toFixed(2)} m² used`, rightX, 55);
            ctx.fillText(`REMAINING AREA: ${remainingArea.toFixed(3)} m² left`, rightX, 70);

            ctx.strokeStyle = "rgba(255, 176, 0, 0.4)";
            ctx.beginPath();
            ctx.moveTo(rightX, 88);
            ctx.lineTo(w - 15, 88);
            ctx.stroke();

            ctx.fillStyle = "#ffb000";
            ctx.font = "bold 11px 'Courier New', monospace";
            ctx.fillText("INSTALLED 2D MODULES:", rightX, 96);

            if (modules.length === 0) {
                ctx.fillStyle = "rgba(255, 176, 0, 0.7)";
                ctx.fillText("  (No modules installed - type 'add' to open parts menu)", rightX, 114);
            } else {
                modules.forEach((mod, idx) => {
                    ctx.fillStyle = "#ffb000";
                    const dimStr = mod.mount === "top" ? "[TOP MOUNT]" : `[${mod.dimX}x${mod.dimY}m]`;
                    ctx.fillText(`  ${idx + 1}. ${mod.name.padEnd(20)} ${dimStr}`, rightX, 114 + (idx * 16));
                });
            }

            // Heat & Electrical Telemetry Logic
            let totalWatts = modules.reduce((a, m) => a + m.watts, 0);
            let totalVolts = modules.some(m => m.volts === 12) ? 12 : (modules.some(m => m.volts === 5) ? 5 : 0);
            let totalCapAh = modules.reduce((a, m) => a + m.capAh, 0);
            let heatGen = modules.reduce((a, m) => a + m.heatGen, 0);
            
            let isolatedFanCount = 0;
            let heatDiss = placedModules.reduce((a, m) => {
                if (m.id === "single_fan" || m.id === "fan_array") {
                    const isTouching = isFanTouchingComputer(m, placedModules);
                    if (!isTouching) {
                        isolatedFanCount++;
                        return a;
                    }
                    if (pressurizeCurrent < 0.5) {
                        return a;
                    }
                    return a + m.heatDiss;
                }
                return a + m.heatDiss;
            }, 0);

            let timeStr = "0h 00m";
            if (totalWatts > 0 && totalCapAh > 0) {
                const totalWattHours = totalCapAh * totalVolts;
                const hours = totalWattHours / totalWatts;
                const h = Math.floor(hours);
                const m = Math.floor((hours - h) * 60);
                timeStr = `${h}h ${m}m`;
            } else if (totalWatts === 0 && totalCapAh > 0) {
                timeStr = "∞ (No Load)";
            } else {
                timeStr = "0m (No Power)";
            }

            const hudY = h - 110;

            ctx.fillStyle = "#ffb000";
            ctx.font = "bold 12px 'Courier New', monospace";
            ctx.fillText(`ELECTRICAL:`, rightX, hudY);
            
            ctx.fillStyle = "#ffb000";
            ctx.font = "11px 'Courier New', monospace";
            ctx.fillText(`  Watts                 : ${totalWatts.toFixed(1)} W`, rightX, hudY + 15);
            ctx.fillText(`  Volts                 : ${totalVolts} V`, rightX, hudY + 28);
            ctx.fillText(`  Time until power loss : ~${timeStr}`, rightX, hudY + 41);

            // Heat Telemetry
            const maxBar = 22;
            const genFilled = Math.min(maxBar, Math.floor((heatGen / 30) * maxBar));
            const genBar = "[" + "█".repeat(genFilled) + "░".repeat(maxBar - genFilled) + "]";
            
            const dissFilled = Math.min(maxBar, Math.floor((heatDiss / 30) * maxBar));
            const dissBar = "[" + "█".repeat(dissFilled) + "░".repeat(maxBar - dissFilled) + "]";

            const heatWarning = heatGen > heatDiss;
            ctx.fillStyle = heatWarning ? flashAmber : "#ffb000";
            ctx.font = "bold 12px 'Courier New', monospace";
            ctx.fillText(`HEAT ${heatWarning ? "[OVERHEAT RISK!]" : "[STABLE]"}`, rightX, hudY + 58);
            
            ctx.fillStyle = "#ffb000";
            ctx.font = "11px 'Courier New', monospace";
            ctx.fillText(`  Heat Generated: ${genBar} ${heatGen.toFixed(1)}W`, rightX, hudY + 71);
            
            let fanStatusNote = "";
            if (isolatedFanCount > 0) {
                fanStatusNote = " (Fan detached - must touch computer)";
            } else if (modules.some(m => m.id === "single_fan" || m.id === "fan_array") && pressurizeCurrent < 0.5) {
                fanStatusNote = " (Fan inactive in vacuum)";
            }

            ctx.fillStyle = (isolatedFanCount > 0 || (modules.some(m => m.id.includes("fan")) && pressurizeCurrent < 0.5)) ? flashAmber : "#ffb000";
            ctx.fillText(`  Heat Dealt With: ${dissBar} ${heatDiss.toFixed(1)}W${fanStatusNote}`, rightX, hudY + 84);

            // Spark particles
            for (let i = sparkParticles.length - 1; i >= 0; i--) {
                const sp = sparkParticles[i];
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.vy += 0.25;
                sp.life -= 0.03;

                if (sp.life <= 0) {
                    sparkParticles.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = `rgba(255, ${Math.floor(176 * sp.life)}, 0, ${sp.life})`;
                ctx.beginPath();
                ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Interactive Part Selector WASD Modal
            if (inPartPicker) {
                const modalW = w * 0.88;
                const modalH = h * 0.82;
                const modalX = (w - modalW) / 2;
                const modalY = (h - modalH) / 2;

                ctx.fillStyle = "rgba(8, 5, 0, 0.95)";
                ctx.fillRect(modalX, modalY, modalW, modalH);
                ctx.strokeStyle = "#ffb000";
                ctx.lineWidth = 2;
                ctx.strokeRect(modalX, modalY, modalW, modalH);

                ctx.fillStyle = "#ffb000";
                ctx.font = "bold 14px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText("=== HARDWARE PARTS CATALOG [WASD TO NAVIGATE] ===", w / 2, modalY + 18);

                let catStartX = modalX + 15;
                ctx.textAlign = "left";
                ctx.font = "bold 11px 'Courier New', monospace";

                PART_CATEGORIES.forEach((cat, idx) => {
                    const isSelected = (idx === selectedPartCatIndex);
                    if (isSelected) {
                        ctx.fillStyle = "#ffb000";
                        ctx.fillText(`► [${cat.catName}] ◄`, catStartX, modalY + 42);
                        catStartX += ctx.measureText(`► [${cat.catName}] ◄`).width + 10;
                    } else {
                        ctx.fillStyle = "rgba(255, 176, 0, 0.5)";
                        ctx.fillText(`  ${cat.catName}  `, catStartX, modalY + 42);
                        catStartX += ctx.measureText(`  ${cat.catName}  `).width + 10;
                    }
                });

                ctx.strokeStyle = "rgba(255, 176, 0, 0.4)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(modalX + 15, modalY + 56);
                ctx.lineTo(modalX + modalW - 15, modalY + 56);
                ctx.stroke();

                const currentCat = PART_CATEGORIES[selectedPartCatIndex];
                const listX = modalX + 25;
                let listY = modalY + 75;

                ctx.font = "bold 12px 'Courier New', monospace";
                ctx.fillStyle = "#ffb000";
                ctx.fillText(`CATEGORY: ${currentCat.catName}`, listX, listY);
                listY += 20;

                currentCat.parts.forEach((p, idx) => {
                    const isHovered = (idx === selectedPartItemIndex);
                    const dimStr = p.mount === "top" ? "TOP MOUNT" : `${p.dimX}x${p.dimY}m`;
                    if (isHovered) {
                        ctx.fillStyle = "#ffb000";
                        ctx.fillText(` ► ${p.name.padEnd(20)} (${dimStr})`, listX, listY);
                    } else {
                        ctx.fillStyle = "rgba(255, 176, 0, 0.6)";
                        ctx.fillText(`   ${p.name.padEnd(20)} (${dimStr})`, listX, listY);
                    }
                    listY += 22;
                });

                const hoveredPart = currentCat.parts[selectedPartItemIndex];
                const specX = modalX + modalW * 0.48;
                let specY = modalY + 75;

                ctx.strokeStyle = "rgba(255, 176, 0, 0.3)";
                ctx.beginPath();
                ctx.moveTo(specX - 15, modalY + 65);
                ctx.lineTo(specX - 15, modalY + modalH - 45);
                ctx.stroke();

                if (hoveredPart) {
                    ctx.fillStyle = "#ffb000";
                    ctx.font = "bold 13px 'Courier New', monospace";
                    ctx.fillText(`SPECIFICATIONS: ${hoveredPart.name.toUpperCase()}`, specX, specY);
                    specY += 22;

                    ctx.font = "11px 'Courier New', monospace";
                    ctx.fillStyle = "#ffb000";
                    ctx.fillText(`  Dimensions (X x Y): ${hoveredPart.dimX} x ${hoveredPart.dimY} m`, specX, specY); specY += 16;
                    ctx.fillText(`  Footprint Area    : ${(hoveredPart.dimX * hoveredPart.dimY).toFixed(3)} m²`, specX, specY); specY += 16;
                    ctx.fillText(`  Power Draw        : ${hoveredPart.watts} Watts @ ${hoveredPart.volts} Volts`, specX, specY); specY += 16;
                    ctx.fillText(`  Battery Capacity  : ${hoveredPart.capAh} Ah`, specX, specY); specY += 16;
                    ctx.fillText(`  Heat Generation   : ${hoveredPart.heatGen} W`, specX, specY); specY += 16;
                    ctx.fillText(`  Heat Dissipation  : ${hoveredPart.heatDiss} W`, specX, specY); specY += 22;

                    ctx.fillStyle = "#ffb000";
                    ctx.fillText(`DESCRIPTION:`, specX, specY); specY += 16;
                    ctx.fillStyle = "rgba(255, 176, 0, 0.85)";
                    
                    const words = hoveredPart.desc.split(" ");
                    let line = "  ";
                    words.forEach(w => {
                        if ((line + w).length > 32) {
                            ctx.fillText(line, specX, specY);
                            specY += 15;
                            line = "  " + w + " ";
                        } else {
                            line += w + " ";
                        }
                    });
                    if (line.trim()) ctx.fillText(line, specX, specY);
                }

                ctx.strokeStyle = "rgba(255, 176, 0, 0.4)";
                ctx.beginPath();
                ctx.moveTo(modalX + 15, modalY + modalH - 35);
                ctx.lineTo(modalX + modalW - 15, modalY + modalH - 35);
                ctx.stroke();

                ctx.fillStyle = "#ffb000";
                ctx.font = "bold 11px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText("[A / D] Category | [W / S] Highlight | [E] Install Module | [Q] Exit", w / 2, modalY + modalH - 15);
            }

            // Interactive Module Editor WASD / Slider Overlay Modal
            if (inModuleEditor && editingModuleIndex >= 0 && payloadSpecs.modules[editingModuleIndex]) {
                const targetMod = payloadSpecs.modules[editingModuleIndex];
                const modalW = w * 0.82;
                const modalH = h * 0.75;
                const modalX = (w - modalW) / 2;
                const modalY = (h - modalH) / 2;

                ctx.fillStyle = "rgba(8, 5, 0, 0.95)";
                ctx.fillRect(modalX, modalY, modalW, modalH);
                ctx.strokeStyle = "#ffb000";
                ctx.lineWidth = 2;
                ctx.strokeRect(modalX, modalY, modalW, modalH);

                ctx.fillStyle = "#ffb000";
                ctx.font = "bold 14px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText(`=== EDIT MODULE: ${targetMod.name.toUpperCase()} ===`, w / 2, modalY + 22);

                ctx.strokeStyle = "rgba(255, 176, 0, 0.4)";
                ctx.beginPath();
                ctx.moveTo(modalX + 15, modalY + 36);
                ctx.lineTo(modalX + modalW - 15, modalY + 36);
                ctx.stroke();

                const startY = modalY + 60;
                ctx.textAlign = "left";

                if (editingModuleType === "ballistic_capsule") {
                    const slots = [
                        { name: "Parachute", val: targetMod.parachute ? "INSTALLED [YES]" : "NONE [NO]" },
                        { name: "Heat Shield", val: targetMod.heatShield ? "INSTALLED [YES]" : "NONE [NO]" },
                        { name: "Internal Slot", val: targetMod.internalSlot || "None" }
                    ];

                    slots.forEach((s, idx) => {
                        const isFocused = (idx === selectedModuleSlotIndex);
                        const curY = startY + (idx * 35);

                        ctx.font = "bold 13px 'Courier New', monospace";
                        if (isFocused) {
                            ctx.fillStyle = "#ffb000";
                            ctx.fillText(`► SLOT ${idx + 1}: ${s.name.padEnd(16)} : [ ${s.val} ] ◄`, modalX + 30, curY);
                        } else {
                            ctx.fillStyle = "rgba(255, 176, 0, 0.6)";
                            ctx.fillText(`  SLOT ${idx + 1}: ${s.name.padEnd(16)} : [ ${s.val} ]`, modalX + 30, curY);
                        }
                    });

                    ctx.fillStyle = "rgba(255, 176, 0, 0.8)";
                    ctx.font = "11px 'Courier New', monospace";
                    ctx.fillText("NOTE: Internal slot holds Film Capsule OR Flight Recorder (Mutually Exclusive).", modalX + 30, startY + 130);

                    ctx.fillStyle = "#ffb000";
                    ctx.font = "bold 11px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.fillText("[W / S] Select Slot | [E] Toggle Option | [Q] Exit Editing", w / 2, modalY + modalH - 18);

                } else if (editingModuleType === "film_camera") {
                    // Check wall placement for arrow direction validation
                    const placedList = compute2DLayout(payloadSpecs.modules, sideX, sideY);
                    const cameraPlaced = placedList.find((m, i) => i === editingModuleIndex);
                    
                    let wallValid = false;
                    if (cameraPlaced) {
                        const isLeftWall = cameraPlaced.posX === 0;
                        const isRightWall = (cameraPlaced.posX + cameraPlaced.relW) >= 0.999;
                        wallValid = (targetMod.direction === "Left" && isLeftWall) || (targetMod.direction === "Right" && isRightWall);
                    }

                    const renderSliderBar = (valPercent) => {
                        const barLen = 14;
                        const filled = Math.min(barLen, Math.floor((valPercent / 100) * barLen));
                        return "[" + "█".repeat(filled) + "░".repeat(barLen - filled) + "]";
                    };

                    const options = [
                        { name: "Aperture Size", type: "slider", val: targetMod.aperture || 50, label: `f/${(1.4 + (targetMod.aperture / 100) * 14.6).toFixed(1)}` },
                        { name: "Optical Zoom", type: "slider", val: targetMod.zoom || 30, label: `${(1.0 + (targetMod.zoom / 100) * 9.0).toFixed(1)}x` },
                        { name: "Shutter Speed", type: "slider", val: targetMod.exposure || 40, label: `1/${Math.floor(1000 - (targetMod.exposure / 100) * 950)}s` },
                        { name: "Film ISO Gain", type: "slider", val: targetMod.iso || 50, label: `ISO ${Math.floor(100 + (targetMod.iso / 100) * 3100)}` },
                        { name: "Facing Direction", type: "toggle", val: targetMod.direction || "Left", label: targetMod.direction === "Left" ? "LEFT (◄)" : "RIGHT (►)" }
                    ];

                    options.forEach((opt, idx) => {
                        const isFocused = (idx === selectedModuleSlotIndex);
                        const curY = startY + (idx * 28);

                        ctx.font = "bold 12px 'Courier New', monospace";
                        if (opt.type === "slider") {
                            const barStr = renderSliderBar(opt.val);
                            if (isFocused) {
                                ctx.fillStyle = "#ffb000";
                                ctx.fillText(`► ${opt.name.padEnd(16)} : ${barStr} ${opt.val.toString().padStart(3)}% (${opt.label}) ◄`, modalX + 25, curY);
                            } else {
                                ctx.fillStyle = "rgba(255, 176, 0, 0.6)";
                                ctx.fillText(`  ${opt.name.padEnd(16)} : ${barStr} ${opt.val.toString().padStart(3)}% (${opt.label})`, modalX + 25, curY);
                            }
                        } else {
                            if (isFocused) {
                                ctx.fillStyle = "#ffb000";
                                ctx.fillText(`► ${opt.name.padEnd(16)} : [ ${opt.label} ] ◄`, modalX + 25, curY);
                            } else {
                                ctx.fillStyle = "rgba(255, 176, 0, 0.6)";
                                ctx.fillText(`  ${opt.name.padEnd(16)} : [ ${opt.label} ]`, modalX + 25, curY);
                            }
                        }
                    });

                    ctx.fillStyle = wallValid ? "#ffb000" : flashAmber;
                    ctx.font = "bold 11px 'Courier New', monospace";
                    ctx.fillText(`WALL MOUNT CHECK: ${wallValid ? "VALID (Connected to shell wall)" : "INVALID (Must point out wall connection!)"}`, modalX + 25, startY + 160);

                    ctx.fillStyle = "#ffb000";
                    ctx.textAlign = "center";
                    ctx.fillText("[W / S] Select Slider | [A / D] Adjust Slider Value | [Q] Exit Editing", w / 2, modalY + modalH - 18);
                }
            }

            animFrameId = requestAnimationFrame(renderProbeGraphicsLoop);
        }

        function processCommand(input) {
            if (isExecutingProgram) return;

            const trimmedInput = input.trim();
            const lowerInput = trimmedInput.toLowerCase();

            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${trimmedInput}`, "amber");
            }

            if (lowerInput === "terminate") {
                if (animFrameId) cancelAnimationFrame(animFrameId);
                inRDModule = false;
                isRDNavActive = false;
                inVABModule = false;
                inPayloadDesigner = false;
                isRenderingCanvas = false;
                inPartPicker = false;
                inModuleEditor = false;
                isInspecting = false;
                canvasContainerEl.style.display = "none";
                outputEl.style.display = "block";
                activeVABApp = null;
                outputEl.innerHTML = "";
                print("[SYS] ACTIVE PROGRAM TERMINATED.");
                print("");
                printLoggedInHelp();
                updatePrompt();
                return;
            }

            if (inPayloadDesigner) {
                if (isRenderingCanvas) {
                    if (lowerInput === "add") {
                        inPartPicker = true;
                        selectedPartCatIndex = 0;
                        selectedPartItemIndex = 0;
                        updatePrompt();
                        return;
                    }

                    if (lowerInput === "edit module" || lowerInput.startsWith("edit module")) {
                        const arg = lowerInput.replace("edit module", "").trim();
                        let targetIdx = -1;

                        if (arg === "ballistic capsule" || arg === "capsule") {
                            targetIdx = payloadSpecs.modules.findIndex(m => m.id === "ballistic_capsule");
                        } else if (arg === "film camera" || arg === "camera") {
                            targetIdx = payloadSpecs.modules.findIndex(m => m.id === "film_camera");
                        } else {
                            targetIdx = payloadSpecs.modules.findIndex(m => m.id === "ballistic_capsule" || m.id === "film_camera");
                        }

                        if (targetIdx >= 0) {
                            const mod = payloadSpecs.modules[targetIdx];
                            inModuleEditor = true;
                            editingModuleType = mod.id;
                            editingModuleIndex = targetIdx;
                            selectedModuleSlotIndex = 0;
                            updatePrompt();
                            print(`[SYS] Opened module editor for '${mod.name}'.`);
                        } else {
                            print(`[ERR] No editable module found (Ballistic Capsule / Film Camera). Install one first.`);
                        }
                        return;
                    }

                    if (lowerInput === "pressurize") {
                        payloadSpecs.isPressurized = true;
                        print("[SYS] Initialized payload pressurization process (2.0 sec).");
                        return;
                    }

                    if (lowerInput === "depressurize") {
                        payloadSpecs.isPressurized = false;
                        print("[SYS] Initialized payload depressurization process (2.0 sec).");
                        return;
                    }

                    if (lowerInput.startsWith("add ")) {
                        const search = lowerInput.substring(4).trim();
                        const part = AVAILABLE_PARTS.find(p => p.id === search || p.name.toLowerCase() === search);
                        if (!part) {
                            print(`[ERR] Unknown module '${search}'. Type 'add' to open interactive part menu.`);
                            return;
                        }

                        // Validate physical fit and footprint limits
                        const sideX = payloadSpecs.sideX || 0.50;
                        const sideY = payloadSpecs.sideY || 0.50;
                        const fitResult = canFitInProbe(payloadSpecs.modules, part, sideX, sideY);

                        if (!fitResult.canFit) {
                            print(`[ERR] Cannot install '${part.name}'. ${fitResult.reason}`);
                            return;
                        }

                        payloadSpecs.modules.push({ ...part });
                        print(`[SYS] Installed '${part.name}' into chassis.`);

                        const rect = canvasContainerEl.getBoundingClientRect();
                        spawnSparks((rect.width || 700) * 0.30, (rect.height || 400) * 0.50);
                        return;
                    }

                    if (lowerInput.startsWith("remove ")) {
                        const search = lowerInput.substring(7).trim();
                        const idx = payloadSpecs.modules.findIndex(m => m.id === search || m.name.toLowerCase() === search);
                        if (idx >= 0) {
                            const removed = payloadSpecs.modules.splice(idx, 1)[0];
                            print(`[SYS] Removed '${removed.name}' from chassis.`);
                        } else {
                            print(`[ERR] Module '${search}' not found inside current payload.`);
                        }
                        return;
                    }

                    if (lowerInput === "save") {
                        if (!GameState.data.savedPayloads) GameState.data.savedPayloads = [];
                        const existingIdx = GameState.data.savedPayloads.findIndex(p => p.name.toLowerCase() === payloadSpecs.name.toLowerCase());
                        if (existingIdx >= 0) {
                            GameState.data.savedPayloads[existingIdx] = JSON.parse(JSON.stringify(payloadSpecs));
                        } else {
                            GameState.data.savedPayloads.push(JSON.parse(JSON.stringify(payloadSpecs)));
                        }
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        renderPayloadListScreen();
                        print(`[SYS] Payload design '${payloadSpecs.name}' successfully saved to memory.`);
                        return;
                    }

                    if (lowerInput === "back") {
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    print("[SYS] Canvas Commands: 'add', 'edit module', 'remove [item]', 'pressurize', 'depressurize', 'save', 'back', 'terminate'.");
                    return;
                }

                if (payloadSubMode === "LIST") {
                    if (lowerInput === "back") {
                        inPayloadDesigner = false;
                        activeVABApp = null;
                        renderVABMenu();
                        return;
                    }
                    if (lowerInput === "new") {
                        payloadSubMode = "CRITERIA";
                        payloadStep = "NAME";
                        payloadSpecs = {
                            name: "",
                            maxArea: 0.25,
                            sideX: 0.50,
                            sideY: 0.50,
                            shape: "Cubic",
                            purpose: "Payload",
                            isPressurized: false,
                            modules: []
                        };
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    const selIdx = parseInt(lowerInput, 10);
                    if (!isNaN(selIdx) && GameState.data.savedPayloads && selIdx >= 1 && selIdx <= GameState.data.savedPayloads.length) {
                        payloadSpecs = JSON.parse(JSON.stringify(GameState.data.savedPayloads[selIdx - 1]));
                        if (!payloadSpecs.modules) payloadSpecs.modules = [];
                        payloadSubMode = "CRITERIA";
                        payloadStep = "CONFIRM";
                        renderPayloadDesignerCriteria();
                        print(`[SYS] Loaded saved payload design '${payloadSpecs.name}'.`);
                        return;
                    }

                    if (lowerInput.startsWith("load ")) {
                        const targetName = trimmedInput.substring(5).trim();
                        const foundPayload = GameState.data.savedPayloads ? GameState.data.savedPayloads.find(p => p.name.toLowerCase() === targetName.toLowerCase()) : null;
                        if (foundPayload) {
                            payloadSpecs = JSON.parse(JSON.stringify(foundPayload));
                            if (!payloadSpecs.modules) payloadSpecs.modules = [];
                            payloadSubMode = "CRITERIA";
                            payloadStep = "CONFIRM";
                            renderPayloadDesignerCriteria();
                            print(`[SYS] Loaded saved payload design '${payloadSpecs.name}'.`);
                            return;
                        } else {
                            print(`[ERR] Payload '${targetName}' not found in registry.`);
                            return;
                        }
                    }

                    if (lowerInput.startsWith("delete")) {
                        const targetName = trimmedInput.substring(6).trim();
                        if (!targetName) {
                            print("[SYS] Usage: delete [payload name]");
                            return;
                        }
                        const exists = GameState.data.savedPayloads && GameState.data.savedPayloads.some(p => p.name.toLowerCase() === targetName.toLowerCase());
                        if (!exists) {
                            print(`[ERR] Payload '${targetName}' not found in registry.`);
                            return;
                        }
                        payloadDeleteTarget = targetName;
                        payloadSubMode = "DELETE_CONFIRM";
                        print(`[WARN] Confirm deletion of payload '${targetName}'? (type 'yes' or 'no')`, "title");
                        updatePrompt();
                        return;
                    }
                    print("[SYS] Options: 'new', [1-N] / 'load [name]', 'delete [name]', 'back', or 'terminate'.");
                    return;
                }

                if (payloadSubMode === "DELETE_CONFIRM") {
                    if (lowerInput === "yes" || lowerInput === "y") {
                        GameState.data.savedPayloads = GameState.data.savedPayloads.filter(p => p.name.toLowerCase() !== payloadDeleteTarget.toLowerCase());
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        const removed = payloadDeleteTarget;
                        payloadDeleteTarget = "";
                        renderPayloadListScreen();
                        print(`[SYS] Payload design '${removed}' deleted.`);
                        return;
                    }
                    if (lowerInput === "no" || lowerInput === "n" || lowerInput === "back") {
                        payloadDeleteTarget = "";
                        renderPayloadListScreen();
                        print("[SYS] Deletion canceled.");
                        return;
                    }
                    print("[SYS] Confirm deletion of payload? Type 'yes' or 'no'.");
                    return;
                }

                if (payloadSubMode === "CRITERIA") {
                    if (lowerInput === "back") {
                        renderPayloadListScreen();
                        return;
                    }

                    if (payloadStep === "NAME") {
                        if (!trimmedInput) {
                            print("[SYS] Please enter a valid payload name.");
                            return;
                        }
                        payloadSpecs.name = trimmedInput;
                        payloadStep = "SIZE";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "SIZE") {
                        if (lowerInput === "1") {
                            payloadSpecs.sideX = 0.50; payloadSpecs.sideY = 0.50; payloadSpecs.maxArea = 0.25;
                        } else if (lowerInput === "2") {
                            payloadSpecs.sideX = 0.50; payloadSpecs.sideY = 1.00; payloadSpecs.maxArea = 0.50;
                        } else if (lowerInput === "3") {
                            payloadSpecs.sideX = 1.00; payloadSpecs.sideY = 1.00; payloadSpecs.maxArea = 1.00;
                        } else {
                            print("[SYS] Select size option 1, 2, or 3.");
                            return;
                        }
                        payloadStep = "SHAPE";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "SHAPE") {
                        if (lowerInput === "1") payloadSpecs.shape = "Cubic";
                        else if (lowerInput === "2") payloadSpecs.shape = "Spherical";
                        else {
                            print("[SYS] Select shape option 1 or 2.");
                            return;
                        }
                        payloadStep = "PURPOSE";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "PURPOSE") {
                        if (lowerInput === "1") payloadSpecs.purpose = "Payload";
                        else {
                            print("[SYS] Select purpose option 1.");
                            return;
                        }
                        payloadStep = "CONFIRM";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "CONFIRM") {
                        if (lowerInput === "start") {
                            outputEl.style.display = "none";
                            canvasContainerEl.style.display = "flex";
                            isRenderingCanvas = true;
                            lastFrameTime = performance.now();
                            updatePrompt();
                            renderProbeGraphicsLoop();
                            return;
                        }
                        print("[SYS] Type 'start' to initialize chassis canvas, or 'back' to return.");
                        return;
                    }
                }
            }

            if (inRDModule) {
                if (lowerInput === "move") {
                    isRDNavActive = true;
                    updatePrompt();
                    print("[SYS] WASD Navigation Unlocked. Use WASD keys to browse tree, 'E' to select/inspect, 'Q' to return to typing.");
                    return;
                }

                if (isRDNavActive) {
                    if (lowerInput === "q") {
                        isRDNavActive = false;
                        updatePrompt();
                        print("[SYS] Exited WASD navigation mode. Type 'move' to enter again.");
                        return;
                    }
                }

                if (isInspecting) {
                    if (lowerInput === "q" || lowerInput === "back") {
                        renderRDLibrary();
                        return;
                    }
                }

                print(`[SYS] R&D Command: Type 'move' to activate tree navigation, or 'terminate' to exit.`);
                return;
            }

            if (inVABModule) {
                if (activeVABApp) {
                    if (lowerInput === "back") {
                        activeVABApp = null;
                        renderVABMenu();
                        return;
                    }
                    const v = GameState.data.vessel;
                    if (lowerInput === "1") {
                        v.fuelRatio = (v.fuelRatio + 10) > 100 ? 10 : v.fuelRatio + 10;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "2") {
                        v.gimbal = (v.gimbal + 20) > 100 ? 20 : v.gimbal + 20;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "3") {
                        v.finArea = (v.finArea + 2) > 20 ? 2 : v.finArea + 2;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "4") {
                        v.sepDelay = (v.sepDelay >= 3.0) ? 0.5 : parseFloat((v.sepDelay + 0.5).toFixed(1));
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    print("[SYS] Type '1'-'4' to adjust, 'back' for menu, or 'terminate'.");
                    return;
                } else {
                    const option = parseInt(lowerInput, 10);
                    if (!isNaN(option) && option >= 1 && option <= vabApplications.length) {
                        activeVABApp = vabApplications[option - 1];
                        if (activeVABApp.id === "payload") {
                            inPayloadDesigner = true;
                            renderPayloadListScreen();
                            return;
                        }
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    print("[SYS] Enter an application number (1-7), or type 'terminate'.");
                    return;
                }
            }

            if (currentMode === "NEW_NAME") {
                if (!trimmedInput) return;
                tempName = trimmedInput;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "NEW_PASS") {
                if (!trimmedInput) return;
                const password = trimmedInput;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();
                if (!GameState.data.savedPayloads) GameState.data.savedPayloads = [];

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                outputEl.innerHTML = "";
                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' created.`);
                print(`[SYS] Profile ID: [${slotName}]`);
                print("");
                printProgramTree();
                printLoggedInHelp();
                return;
            }

            if (currentMode === "LOAD_SELECT") {
                if (!trimmedInput) return;
                const targetSlot = trimmedInput.toLowerCase().replace(/\s+/g, '_');

                if (lowerInput === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${trimmedInput}' not found.`);
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "LOAD_PASS") {
                if (!trimmedInput) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === trimmedInput) {
                    GameState.data = parsedData;
                    if (!GameState.data.savedPayloads) GameState.data.savedPayloads = [];
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    
                    outputEl.innerHTML = "";
                    updatePrompt();
                    
                    print(`[SYS] Access granted for user '${GameState.data.user.name}'.`);
                    print("");
                    printProgramTree();
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Invalid password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            const parts = lowerInput.split(" ");
            const cmd = parts[0];
            const subCmd = parts[1] || "";

            if (currentMode === "LOGGED_IN") {
                if ((cmd === "run" && subCmd === "r&d") || cmd === "r&d") {
                    runModuleBootSequence("RD", () => {
                        inRDModule = true;
                        isRDNavActive = false;
                        renderRDLibrary();
                    });
                    return;
                }

                if ((cmd === "run" && subCmd === "vab") || cmd === "vab") {
                    runModuleBootSequence("VAB", () => {
                        inVABModule = true;
                        renderVABMenu();
                    });
                    return;
                }

                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "programs":
                    case "dir":
                        printProgramTree();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        print(`Saved Payloads: ${GameState.data.savedPayloads ? GameState.data.savedPayloads.length : 0}`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Data written to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        GameState.activeSlot = "default_save";
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help', 'run r&d', or 'run vab'.`);
                        break;
                }
                return;
            }

            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Reading save records...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const loadSaves = getSaveList();
                        if (loadSaves.length === 0) {
                            print("[ERR] No save files present in memory.");
                            return;
                        }

                        print("[SYS] Available Save Files:");
                        loadSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'.`);
                        break;
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (isExecutingProgram) return;

            // Module Editing Interactive UI Controls
            if (inPayloadDesigner && isRenderingCanvas && inModuleEditor && editingModuleIndex >= 0) {
                const targetMod = payloadSpecs.modules[editingModuleIndex];
                const key = e.key.toUpperCase();

                if (["W", "A", "S", "D", "E", "Q"].includes(key)) {
                    e.preventDefault();
                }

                if (editingModuleType === "ballistic_capsule") {
                    const maxSlots = 3;
                    if (key === "W") {
                        selectedModuleSlotIndex = (selectedModuleSlotIndex - 1 + maxSlots) % maxSlots;
                    } else if (key === "S") {
                        selectedModuleSlotIndex = (selectedModuleSlotIndex + 1) % maxSlots;
                    } else if (key === "E") {
                        if (selectedModuleSlotIndex === 0) {
                            targetMod.parachute = !targetMod.parachute;
                        } else if (selectedModuleSlotIndex === 1) {
                            targetMod.heatShield = !targetMod.heatShield;
                        } else if (selectedModuleSlotIndex === 2) {
                            if (targetMod.internalSlot === "None") targetMod.internalSlot = "Film Capsule";
                            else if (targetMod.internalSlot === "Film Capsule") targetMod.internalSlot = "Flight Recorder";
                            else targetMod.internalSlot = "None";
                        }
                    } else if (key === "Q") {
                        inModuleEditor = false;
                        updatePrompt();
                        print("[SYS] Exited module editing mode.");
                    }
                } else if (editingModuleType === "film_camera") {
                    const maxOptions = 5;
                    if (key === "W") {
                        selectedModuleSlotIndex = (selectedModuleSlotIndex - 1 + maxOptions) % maxOptions;
                    } else if (key === "S") {
                        selectedModuleSlotIndex = (selectedModuleSlotIndex + 1) % maxOptions;
                    } else if (key === "A") {
                        if (selectedModuleSlotIndex === 0) targetMod.aperture = Math.max(0, (targetMod.aperture || 50) - 5);
                        else if (selectedModuleSlotIndex === 1) targetMod.zoom = Math.max(0, (targetMod.zoom || 30) - 5);
                        else if (selectedModuleSlotIndex === 2) targetMod.exposure = Math.max(0, (targetMod.exposure || 40) - 5);
                        else if (selectedModuleSlotIndex === 3) targetMod.iso = Math.max(0, (targetMod.iso || 50) - 5);
                        else if (selectedModuleSlotIndex === 4) targetMod.direction = targetMod.direction === "Left" ? "Right" : "Left";
                    } else if (key === "D") {
                        if (selectedModuleSlotIndex === 0) targetMod.aperture = Math.min(100, (targetMod.aperture || 50) + 5);
                        else if (selectedModuleSlotIndex === 1) targetMod.zoom = Math.min(100, (targetMod.zoom || 30) + 5);
                        else if (selectedModuleSlotIndex === 2) targetMod.exposure = Math.min(100, (targetMod.exposure || 40) + 5);
                        else if (selectedModuleSlotIndex === 3) targetMod.iso = Math.min(100, (targetMod.iso || 50) + 5);
                        else if (selectedModuleSlotIndex === 4) targetMod.direction = targetMod.direction === "Left" ? "Right" : "Left";
                    } else if (key === "Q") {
                        inModuleEditor = false;
                        updatePrompt();
                        print("[SYS] Exited camera editing mode.");
                    }
                }
                return;
            }

            if (inPayloadDesigner && isRenderingCanvas && inPartPicker) {
                const k = e.key.toUpperCase();
                if (["W", "A", "S", "D", "E", "Q"].includes(k)) {
                    e.preventDefault();
                }

                if (k === "A") {
                    selectedPartCatIndex = (selectedPartCatIndex - 1 + PART_CATEGORIES.length) % PART_CATEGORIES.length;
                    selectedPartItemIndex = 0;
                } else if (k === "D") {
                    selectedPartCatIndex = (selectedPartCatIndex + 1) % PART_CATEGORIES.length;
                    selectedPartItemIndex = 0;
                } else if (k === "W") {
                    const catLen = PART_CATEGORIES[selectedPartCatIndex].parts.length;
                    selectedPartItemIndex = (selectedPartItemIndex - 1 + catLen) % catLen;
                } else if (k === "S") {
                    const catLen = PART_CATEGORIES[selectedPartCatIndex].parts.length;
                    selectedPartItemIndex = (selectedPartItemIndex + 1) % catLen;
                } else if (k === "E") {
                    const activeCat = PART_CATEGORIES[selectedPartCatIndex];
                    const part = activeCat.parts[selectedPartItemIndex];

                    const sideX = payloadSpecs.sideX || 0.50;
                    const sideY = payloadSpecs.sideY || 0.50;
                    const fitResult = canFitInProbe(payloadSpecs.modules, part, sideX, sideY);

                    if (!fitResult.canFit) {
                        print(`[ERR] Cannot install '${part.name}'. ${fitResult.reason}`);
                    } else {
                        payloadSpecs.modules.push({ ...part });
                        print(`[SYS] Installed '${part.name}' into chassis.`);
                        const rect = canvasContainerEl.getBoundingClientRect();
                        spawnSparks((rect.width || 700) * 0.30, (rect.height || 400) * 0.50);
                    }
                } else if (k === "Q") {
                    inPartPicker = false;
                    updatePrompt();
                    print("[SYS] Exited Part Selector.");
                }
                return;
            }

            if (inRDModule && isRDNavActive) {
                const key = e.key.toUpperCase();
                
                if (["W", "A", "S", "D", "E", "Q"].includes(key)) {
                    e.preventDefault();
                }

                if (key === "W") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex > 0) selectedCategoryIndex--;
                    renderRDLibrary();
                } else if (key === "S") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex < techMatrix[selectedTierIndex].categories.length - 1) selectedCategoryIndex++;
                    renderRDLibrary();
                } else if (key === "A") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex > 0) {
                        selectedTierIndex--;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                } else if (key === "D") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex < techMatrix.length - 1) {
                        selectedTierIndex++;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                } else if (key === "E") {
                    if (!isInspecting) showCategoryInspection();
                } else if (key === "Q") {
                    if (isInspecting) {
                        renderRDLibrary();
                    } else {
                        isRDNavActive = false;
                        updatePrompt();
                        print("[SYS] Exited WASD navigation mode.");
                    }
                }
            }

            if (e.key === "Enter") {
                const input = inputEl.value;
                inputEl.value = "";
                processCommand(input);
            }
        });

        bootTerminal();
    </script>
</body>
