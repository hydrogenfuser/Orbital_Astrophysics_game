<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL v0.0.1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #080500;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.65) 50%
            );
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 9;
            opacity: 0.85;
        }

        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            padding: 20px;
            position: relative;
            z-index: 1;
            overflow: hidden;
            background-color: #080500;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.25;
            font-size: 0.95rem;
            position: relative;
            color: #ffb000;
        }

        .line-amber, .line-title, #prompt, #command-input, #controls-info {
            color: #ffb000;
            text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
        }

        .line-amber, .line-title {
            animation: generate-scan 0.08s ease-out forwards;
        }

        @keyframes generate-scan {
            0% {
                background-color: rgba(255, 176, 0, 0.12);
                color: #ffb000;
                text-shadow: 0 0 3px rgba(255, 176, 0, 0.6);
            }
            100% {
                background-color: transparent;
                color: #ffb000;
                text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
            }
        }

        .line-title { 
            font-weight: bold; 
            color: #ffb000;
        }

        .entry-title {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 2px;
            color: #ffb000;
        }

        .entry-version {
            font-size: 1.1rem;
            opacity: 0.85;
            margin-bottom: 18px;
            letter-spacing: 2px;
            color: #ffb000;
        }

        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #080500;
            z-index: 5;
            padding: 20px;
            color: #ffb000;
        }

        #loading-title-container {
            white-space: pre;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.15;
            min-height: 120px;
            color: #ffb000;
        }

        #loading-bar-container {
            text-align: center;
            font-weight: bold;
            color: #ffb000;
        }

        #loading-bar-str {
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: #ffb000;
        }

        #loading-percent {
            font-size: 1rem;
            opacity: 0.9;
            color: #ffb000;
        }

        #loading-corner-logs {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 0.75rem;
            opacity: 0.85;
            line-height: 1.3;
            max-width: 45%;
            pointer-events: none;
            color: #ffb000;
        }

        #controls-info {
            border-top: 1px solid rgba(255, 176, 0, 0.35);
            padding: 6px 0;
            font-size: 0.88rem;
            min-height: 1.6rem;
            opacity: 0.95;
            font-weight: bold;
            color: #ffb000;
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 176, 0, 0.5);
            padding-top: 8px;
        }

        #prompt {
            margin-right: 8px;
            font-weight: bold;
            color: #ffb000;
        }

        #command-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
            color: #ffb000;
        }

        #probe-canvas-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            flex: 1;
            margin-bottom: 10px;
            position: relative;
        }

        #probe-canvas {
            border: 1px solid #ffb000;
            background-color: #050300;
            box-shadow: 0 0 8px rgba(255, 176, 0, 0.2);
            width: 100%;
            height: 100%;
        }

        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: rgba(255, 176, 0, 0.6);
        }
        #output::-webkit-scrollbar-track {
            background: #080500;
        }
    </style>
</head>
<body>

        <div id="output"></div>

        </div>
        <div id="controls-info"></div>
        <div id="input-line">
            <span id="prompt">Command:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>

                    { id: "battery_nicd", name: "Battery Ni/Cd", dimX: 0.50, dimY: 0.20, watts: 0, volts: 12, heatGen: 0, heatDiss: 0, capAh: 10.0, desc: "High-density Nickel-Cadmium battery module." }

                    { id: "helical", name: "Helical Antenna", dimX: 0, dimY: 0, watts: 1.0, volts: 12, heatGen: 0.5, heatDiss: 0, capAh: 0, desc: "Large directional coil antenna with central axial feed line mounted to top shell.", mount: "top" }

        const AVAILABLE_PARTS = PART_CATEGORIES.flatMap(c => c.parts);

        let GameState = {
            activeSlot: "default_save",
            data: {
                user: { name: "Operator", password: "" },
                saveName: "default_save",
                timestamp: null,
                vessel: { 
                    name: "Sounder-Mk1",

                    sepDelay: 1.5

                savedPayloads: []

        };

        let currentMode = "MAIN_MENU"; 
        let inRDModule = false;
        let isRDNavActive = false;
        let inVABModule = false;
        let activeVABApp = null;
        let isExecutingProgram = false;
        let isInspecting = false;
        let tempName = "";
        let pendingLoadSlot = "";
        let selectedTierIndex = 0;
        let selectedCategoryIndex = 0;

        let inPayloadDesigner = false;
        let payloadSubMode = "LIST";
        let payloadDeleteTarget = "";
        let payloadStep = "NAME";
        let payloadSpecs = {
            name: "",
            maxArea: 0.25,
            sideX: 0.50,
            sideY: 0.50,
            shape: "Cubic",
            purpose: "Payload",
            isPressurized: false,
            modules: []
        };
        let isRenderingCanvas = false;
        let animFrameId = null;
        let sparkParticles = [];

        let inPartPicker = false;
        let selectedPartCatIndex = 0;
        let selectedPartItemIndex = 0;

        // Interactive Module Editing UI State
        let inModuleEditor = false;
        let editingModuleType = null; // "ballistic_capsule" | "film_camera"
        let editingModuleIndex = -1;
        let selectedModuleSlotIndex = 0;

        let pressurizeCurrent = 0.0;
        let lastFrameTime = performance.now();

        const vabApplications = [
            { id: "rocket", name: "Rocket Designer" },
            { id: "payload", name: "Payload Designer" },
            { id: "rover", name: "Rover Simulator" },
            { id: "lander", name: "Lander Simulator" },
            { id: "drone", name: "Drone Simulator" },
            { id: "docking", name: "Docking Computer Simulator" },
            { id: "station", name: "Space Station Computer Simulator" }
        ];

        const techMatrix = [
            {
                tier: 0,
                tierName: "TIER 0: FOUNDATION TECH",
                categories: [
                    { cat: "Probes", name: "Sounding Rocket Payloads", desc: "Tiny 2D footprint payloads (0.5m x 0.5m = 0.25 m² area limit). Used for sub-orbital vertical hops." },
                    { cat: "Computers", name: "Mechanical / Analog Relays", desc: "Computers are analog and slow, operating purely via direct electronic relay execution." },
                    { cat: "Lifting Bodies", name: "Unpressurized Sounding Rockets", desc: "Solid/liquid rockets for potential energy testing." },
                    { cat: "Fuels", name: "Kerosene & Solid Propellants", desc: "Volatile mixtures with higher failure risks." },
                    { cat: "RCS", name: "Cold Gas Thrusters", desc: "Pressurized Nitrogen systems for simple attitude holds." },
                    { cat: "Power", name: "Primary Silver-Zinc & Ni/Cd Batteries", desc: "Rechargeable and primary energy cells." },
                    { cat: "Heat", name: "Convection Fans & Fins", desc: "Active cooling units requiring pressure contact." },
                    { cat: "Comms", name: "Dipole & Helical Antennas", desc: "Large directional and omnidirectional top-mounted antenna arrays." },
                    { cat: "Science", name: "Basic Sounding Suite", desc: "Thermometers, Barometers, Geiger counters, Film Cameras, and Ballistic Capsules." }
                ]
            }
        ];

        const outputEl = document.getElementById("output");
        const promptEl = document.getElementById("prompt");
        const inputEl = document.getElementById("command-input");
        const controlsInfoEl = document.getElementById("controls-info");
        const canvasContainerEl = document.getElementById("probe-canvas-container");
        const probeCanvas = document.getElementById("probe-canvas");
        const ctx = probeCanvas.getContext("2d");

        function print(text, type = "amber") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function setControlsBar(text) {
            controlsInfoEl.textContent = text;
        }

        function updatePrompt() {
            if (inPayloadDesigner) {
                if (isRenderingCanvas) {
                    if (inPartPicker) {
                        setControlsBar("PART SELECTOR: 'A'/'D' = Prev/Next Cat | 'W'/'S' = Up/Down Item | 'E' = Install | 'Q' = Exit");
                        promptEl.textContent = `[VAB // PART SELECTOR (WASD)]> `;
                    } else if (inModuleEditor) {
                        if (editingModuleType === "ballistic_capsule") {
                            setControlsBar("BALLISTIC CAPSULE EDITOR: 'W'/'S' = Move Slot | 'E' = Select/Toggle | 'Q' = Exit Editing");
                            promptEl.textContent = `[VAB // EDIT BALLISTIC CAPSULE]> `;
                        } else {
                            setControlsBar("FILM CAMERA EDITOR: 'W'/'S' = Select Slider | 'A'/'D' = Move Slider/Dir | 'Q' = Exit Editing");
                            promptEl.textContent = `[VAB // EDIT FILM CAMERA]> `;
                        }
                    } else {
                        setControlsBar("CONTROLS: 'add' | 'edit module' | 'remove [item]' | 'pressurize' | 'depressurize' | 'save' | 'back' | 'terminate'");
                        promptEl.textContent = `[VAB // PROBE DESIGN CANVAS]> `;
                    }
                } else if (payloadSubMode === "LIST") {
                    setControlsBar("CONTROLS: Type 'new' to design | Number [1-N] / 'load [name]' | 'delete [name]' | 'back' | 'terminate'");
                    promptEl.textContent = `[VAB // PAYLOAD MANAGER]> `;
                } else if (payloadSubMode === "DELETE_CONFIRM") {
                    setControlsBar("CONTROLS: Type 'yes' to confirm deletion | 'no' to cancel | 'terminate' = Exit");
                    promptEl.textContent = `[VAB // CONFIRM DELETE]> `;
                } else {
                    setControlsBar("CONTROLS: Input selection/text | 'back' = Return | 'terminate' = Exit");
                    promptEl.textContent = `[VAB // PAYLOAD CONFIG (${payloadStep})]> `;
                }
                return;
            }

            if (inRDModule) {
                if (isRDNavActive) {
                    setControlsBar("CONTROLS: WASD = Navigate Tree | E = Inspect Item | Q = Exit WASD Nav Mode | 'terminate'");
                    promptEl.textContent = `[R&D // WASD NAV ACTIVE]> `;
                } else if (isInspecting) {
                    setControlsBar("CONTROLS: WASD/Q = Return to Index | 'terminate'");
                    promptEl.textContent = `[R&D // INSPECTION VIEW]> `;
                } else {
                    setControlsBar("CONTROLS: Type 'move' to unlock WASD navigation | 'terminate'");
                    promptEl.textContent = `[R&D // COMMAND]> `;
                }
                return;
            }

            if (inVABModule) {
                setControlsBar("CONTROLS: Enter Option # (1-7) | 'back' = App List | 'terminate'");
                if (activeVABApp) {
                    promptEl.textContent = `[VAB // ${activeVABApp.name.toUpperCase()} ]> `;
                } else {
                    promptEl.textContent = `[VAB // MENU]> `;
                }
                return;
            }

            setControlsBar("SYSTEM READY // Enter command.");

            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
        }

            outputEl.appendChild(titleDiv);
            outputEl.appendChild(versionDiv);
            print("");

            print("██▒  ██▒   █    ██▒  ██▒", "title");
            print("██▒  ██▒  ▒▒▒   ██████▒ ", "title");
            print("================================================================================", "title");
            print("                    RESEARCH & DEVELOPMENT LABORATORY                           ", "title");

            print("██▒  ██▒ ██▒  ██▒  ██▒  ██▒", "title");
            print("██▒  ██▒ ███████▒  ██████▒ ", "title");
            print("██▒  ██▒ ██▒  ██▒  ██▒  ██▒", "title");
            print(" █████▒  ██▒  ██▒  ██████▒ ", "title");

            print("                   VEHICLE ASSEMBLY BUILDING SYSTEM                             ", "title");

            print("    ├── VAB");
            print("    ├── Hangars");
            print("    ├── R&D");
            print("    ├── Astronaut Complex");

        function printMainMenuHelp() {
            print("Available commands:");
            print("  new             - Create a new profile and start session");
            print("  load            - View save files and login");
            print("  saves           - List available save files");

        function printLoggedInHelp() {
            print("Available commands:");
            print("  run [program]   - Execute system program (e.g. 'run r&d', 'run vab')");
            print("  programs        - Display system program tree");
            print("  status          - Display vessel parameters");
            print("  save            - Save current progress");
            print("  logout          - Exit current session");
            print("  clear           - Clear terminal screen");

        function bootTerminal() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            inRDModule = false;
            isRDNavActive = false;
            inVABModule = false;
            inPayloadDesigner = false;
            isRenderingCanvas = false;
            inPartPicker = false;
            inModuleEditor = false;
            canvasContainerEl.style.display = "none";
            outputEl.style.display = "block";
            activeVABApp = null;
            updatePrompt();
            printMainMenuHelp();
        }

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        async function runModuleBootSequence(moduleType, onComplete) {
            isExecutingProgram = true;
            inputEl.disabled = true;

            const overlay = document.createElement("div");
            overlay.id = "loading-overlay";

            const titleContainer = document.createElement("div");
            titleContainer.id = "loading-title-container";
            titleContainer.className = "line-title";

            const barContainer = document.createElement("div");
            barContainer.id = "loading-bar-container";

            const barStrEl = document.createElement("div");
            barStrEl.id = "loading-bar-str";
            barStrEl.className = "line-title";

            const percentEl = document.createElement("div");
            percentEl.id = "loading-percent";
            percentEl.className = "line-amber";

            barContainer.appendChild(barStrEl);
            barContainer.appendChild(percentEl);

            const cornerLogs = document.createElement("div");
            cornerLogs.id = "loading-corner-logs";
            cornerLogs.className = "line-amber";

            overlay.appendChild(titleContainer);
            overlay.appendChild(barContainer);
            overlay.appendChild(cornerLogs);
            document.getElementById("terminal-screen").appendChild(overlay);

            const logoLines = (moduleType === "RD") ? [
                "██████▒   ▒▒▒   ██████▒ ",
                "██▒  ██▒   █    ██▒  ██▒",
                "██████▒   ▒█▒   ██▒  ██▒",
                "██▒  ██▒   █    ██▒  ██▒",
                "██▒  ██▒  ▒▒▒   ██████▒ "
            ] : [
                "██▒  ██▒  █████▒   ██████▒ ",
                "██▒  ██▒ ██▒  ██▒  ██▒  ██▒",
                "██▒  ██▒ ███████▒  ██████▒ ",
                "██▒  ██▒ ██▒  ██▒  ██▒  ██▒",
                " █████▒  ██▒  ██▒  ██████▒ "
            ];

            const parseQueue = [
                "Authorizing user security credentials...",
                "Establishing physical wire connection...",
                "Routing telemetry data protocols...",
                "Allocating local stack memory buffers...",
                "Bypassing mainframe authentication proxy...",
                "Initializing bus interface controllers...",
                "Loading hardware specs and definitions...",
                "Verifying hardware node parity keys..."
            ];

            const totalDurationMs = (5.0 + Math.random() * 2.0) * 1000;
            const steps = 30;
            const stepDelay = totalDurationMs / steps;

            const willGetStuck = Math.random() < 0.25;
            const stuckStep = Math.floor(Math.random() * 10) + 10;
            const stuckDurationMs = 3000;

            let activeLogs = [];
            let isStuckTriggered = false;

            for (let i = 1; i <= steps; i++) {
                const percent = Math.floor((i / steps) * 100);

                const linesToShow = Math.max(1, Math.ceil((percent / 100) * logoLines.length));
                let renderedTitle = "";
                for (let l = 0; l < logoLines.length; l++) {
                    if (l < linesToShow) {
                        renderedTitle += logoLines[l] + "\n";
                    } else {
                        renderedTitle += "\n";
                    }
                }
                titleContainer.textContent = renderedTitle;

                const totalWidth = 34;
                const filled = Math.floor((percent / 100) * totalWidth);
                const empty = totalWidth - filled;
                barStrEl.textContent = "[" + "█".repeat(filled) + "░".repeat(empty) + "]";
                percentEl.textContent = `${percent}%`;

                if (parseQueue.length > 0 && Math.random() < 0.45) {
                    const msg = parseQueue.shift();
                    if (msg) activeLogs.push(`> ${msg}`);
                    if (activeLogs.length > 4) activeLogs.shift();
                }

                if (willGetStuck && i === stuckStep && !isStuckTriggered) {
                    isStuckTriggered = true;
                    activeLogs.push("[WARN] Connection interruption detected... Re-routing bus connection...");
                    if (activeLogs.length > 4) activeLogs.shift();
                    cornerLogs.innerHTML = activeLogs.join("<br>");
                    await new Promise(r => setTimeout(r, stuckDurationMs));
                }

                cornerLogs.innerHTML = activeLogs.join("<br>");
                await new Promise(r => setTimeout(r, stepDelay));
            }

            overlay.remove();
            outputEl.innerHTML = "";
            isExecutingProgram = false;
            inputEl.disabled = false;
            inputEl.focus();
            onComplete();
        }

        function renderRDLibrary() {
            outputEl.innerHTML = "";
            isInspecting = false;

            for (let i = 0; i < 6; i++) {
