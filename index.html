<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL v0.0.1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #080500;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.65) 50%
            );
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 9;
            opacity: 0.85;
        }

        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            padding: 20px;
            position: relative;
            z-index: 1;
            overflow: hidden;
            background-color: #080500;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.25;
            font-size: 0.95rem;
            position: relative;
        }

        .line-amber, .line-title, #prompt, #command-input, #controls-info {
            color: #ffb000;
            text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
        }

        .line-amber, .line-title {
            animation: generate-scan 0.08s ease-out forwards;
        }

        @keyframes generate-scan {
            0% {
                background-color: rgba(255, 176, 0, 0.12);
                color: #ffca42;
                text-shadow: 0 0 3px rgba(255, 176, 0, 0.6);
            }
            100% {
                background-color: transparent;
                color: #ffb000;
                text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
            }
        }

        .line-title { 
            font-weight: bold; 
        }

        .entry-title {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 2px;
        }

        .entry-version {
            font-size: 1.1rem;
            opacity: 0.85;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }

        /* Centered Loading Overlay */
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #080500;
            z-index: 5;
            padding: 20px;
        }

        #loading-title-container {
            white-space: pre;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.15;
            min-height: 120px;
        }

        #loading-bar-container {
            text-align: center;
            font-weight: bold;
        }

        #loading-bar-str {
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        #loading-percent {
            font-size: 1rem;
            opacity: 0.9;
        }

        #loading-corner-logs {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 0.75rem;
            opacity: 0.65;
            line-height: 1.3;
            max-width: 45%;
            pointer-events: none;
        }

        #controls-info {
            border-top: 1px solid rgba(255, 176, 0, 0.35);
            padding: 6px 0;
            font-size: 0.88rem;
            min-height: 1.6rem;
            opacity: 0.95;
            font-weight: bold;
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 176, 0, 0.5);
            padding-top: 8px;
        }

        #prompt {
            margin-right: 8px;
            font-weight: bold;
        }

        #command-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }

        /* Graphical Canvas Container - Takes Terminal Workspace Space */
        #probe-canvas-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            flex: 1;
            margin-bottom: 10px;
            position: relative;
        }

        #probe-canvas {
            border: 1px solid #ffb000;
            background-color: #050300;
            box-shadow: 0 0 8px rgba(255, 176, 0, 0.2);
            width: 100%;
            height: 100%;
        }

        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: rgba(255, 176, 0, 0.6);
        }
        #output::-webkit-scrollbar-track {
            background: #080500;
        }
    </style>
</head>

        const outputEl = document.getElementById("output");

        function print(text, type = "amber") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function setControlsBar(text) {
            controlsInfoEl.textContent = text;
        }

        function updatePrompt() {
            if (inPayloadDesigner) {
                if (isRenderingCanvas) {
                    setControlsBar("CONTROLS: add [part] | remove [part] | pressurize | depressurize | save | back | terminate");
                    promptEl.textContent = `[VAB // PROBE DESIGN CANVAS]> `;
                } else if (payloadSubMode === "LIST") {
                    setControlsBar("CONTROLS: load [name] | new | delete [name] | back = VAB Menu | terminate = Exit");
                    promptEl.textContent = `[VAB // PAYLOAD MANAGER]> `;
                } else if (payloadSubMode === "DELETE_CONFIRM") {
                    setControlsBar("CONTROLS: Type 'yes' to confirm deletion | 'no' to cancel | 'terminate' = Exit");
                    promptEl.textContent = `[VAB // CONFIRM DELETE]> `;
                } else {
                    setControlsBar("CONTROLS: Input selection/text | 'back' = Return to Payload List | 'terminate' = Exit");
                    promptEl.textContent = `[VAB // PAYLOAD CONFIG (${payloadStep})]> `;
                }
                return;
            }

            if (inRDModule) {
                if (isRDNavActive) {
                    setControlsBar("CONTROLS: WASD = Navigate Tree | E = Inspect Item | Q = Exit WASD Nav Mode | 'terminate' = Close Program");
                    promptEl.textContent = `[R&D // WASD NAV ACTIVE]> `;
                } else if (isInspecting) {
                    setControlsBar("CONTROLS: WASD/Q = Return to Index | 'terminate' = Close Program");
                    promptEl.textContent = `[R&D // INSPECTION VIEW]> `;
                } else {
                    setControlsBar("CONTROLS: Type 'move' to unlock WASD navigation | 'terminate' = Close Program");
                    promptEl.textContent = `[R&D // COMMAND]> `;
                }
                return;
            }

            if (inVABModule) {
                setControlsBar("CONTROLS: Enter Option # (1-7) | 'back' = App List | 'terminate' = Close Program");
                if (activeVABApp) {
                    promptEl.textContent = `[VAB // ${activeVABApp.name.toUpperCase()} ]> `;
                } else {
                    promptEl.textContent = `[VAB // MENU]> `;
                }
                return;
            }

            setControlsBar("SYSTEM READY // Enter command.");

            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
        }

            print("  load            - View save files and login");
            print("  saves           - List available save files");

            print("  run [program]   - Execute system program (e.g. 'run r&d', 'run vab')");
            print("  programs        - Display system program tree");
            print("  status          - Display vessel parameters");
            print("  save            - Save current progress");
            print("  logout          - Exit current session");

        }

        function bootTerminal() {
            stopCanvasLoop();
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            inRDModule = false;
            isRDNavActive = false;
            inVABModule = false;
            inPayloadDesigner = false;
            isRenderingCanvas = false;
            canvasContainerEl.style.display = "none";
            outputEl.style.display = "block";
            activeVABApp = null;
            updatePrompt();
            printMainMenuHelp();
        }

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        async function runModuleBootSequence(moduleType, onComplete) {
            isExecutingProgram = true;
            inputEl.disabled = true;

            const overlay = document.createElement("div");
            overlay.id = "loading-overlay";

            const titleContainer = document.createElement("div");
            titleContainer.id = "loading-title-container";
            titleContainer.className = "line-title";

            const barContainer = document.createElement("div");
            barContainer.id = "loading-bar-container";

            const barStrEl = document.createElement("div");
            barStrEl.id = "loading-bar-str";
            barStrEl.className = "line-title";

            const percentEl = document.createElement("div");
            percentEl.id = "loading-percent";
            percentEl.className = "line-amber";

            barContainer.appendChild(barStrEl);
            barContainer.appendChild(percentEl);

            const cornerLogs = document.createElement("div");
            cornerLogs.id = "loading-corner-logs";
            cornerLogs.className = "line-amber";

            overlay.appendChild(titleContainer);
            overlay.appendChild(barContainer);
            overlay.appendChild(cornerLogs);
            document.getElementById("terminal-screen").appendChild(overlay);

            const logoLines = (moduleType === "RD") ? [
                "██████▒   ▒▒▒   ██████▒ ",
                "██▒  ██▒   █    ██▒  ██▒",
                "██████▒   ▒█▒   ██▒  ██▒",
                "██▒  ██▒   █    ██▒  ██▒",
                "██▒  ██▒  ▒▒▒   ██████▒ "
            ] : [
                "██▒  ██▒  █████▒   ██████▒ ",
                "██▒  ██▒ ██▒  ██▒  ██▒  ██▒",
                "██▒  ██▒ ███████▒  ██████▒ ",
                "██▒  ██▒ ██▒  ██▒  ██▒  ██▒",
                " █████▒  ██▒  ██▒  ██████▒ "
            ];

            const parseQueue = [
                "Authorizing user security credentials...",
                "Establishing physical wire connection...",
                "Routing telemetry data protocols...",
                "Allocating local stack memory buffers...",
                "Bypassing mainframe authentication proxy...",
                "Initializing bus interface controllers...",
                "Loading hardware specs and definitions...",
                "Verifying hardware node parity keys..."
            ];

            const totalDurationMs = (5.0 + Math.random() * 2.0) * 1000;
            const steps = 30;
            const stepDelay = totalDurationMs / steps;

            const willGetStuck = Math.random() < 0.25;
            const stuckStep = Math.floor(Math.random() * 10) + 10;
            const stuckDurationMs = 3000;

            let activeLogs = [];
            let isStuckTriggered = false;

            for (let i = 1; i <= steps; i++) {
                const percent = Math.floor((i / steps) * 100);

                const linesToShow = Math.max(1, Math.ceil((percent / 100) * logoLines.length));
                let renderedTitle = "";
                for (let l = 0; l < logoLines.length; l++) {
                    if (l < linesToShow) {
                        renderedTitle += logoLines[l] + "\n";
                    } else {
                        renderedTitle += "\n";
                    }
                }
                titleContainer.textContent = renderedTitle;

                const totalWidth = 34;
                const filled = Math.floor((percent / 100) * totalWidth);
                const empty = totalWidth - filled;
                barStrEl.textContent = "[" + "█".repeat(filled) + "░".repeat(empty) + "]";
                percentEl.textContent = `${percent}%`;

                if (parseQueue.length > 0 && Math.random() < 0.45) {
                    const msg = parseQueue.shift();
                    if (msg) activeLogs.push(`> ${msg}`);
                    if (activeLogs.length > 4) activeLogs.shift();
                }

                if (willGetStuck && i === stuckStep && !isStuckTriggered) {
                    isStuckTriggered = true;
                    activeLogs.push("[WARN] Connection interruption detected... Re-routing bus connection...");
                    if (activeLogs.length > 4) activeLogs.shift();
                    cornerLogs.innerHTML = activeLogs.join("<br>");
                    await new Promise(r => setTimeout(r, stuckDurationMs));
                }

                cornerLogs.innerHTML = activeLogs.join("<br>");
                await new Promise(r => setTimeout(r, stepDelay));
            }

            overlay.remove();
            outputEl.innerHTML = "";
            isExecutingProgram = false;
            inputEl.disabled = false;
            inputEl.focus();
            onComplete();
        }

        function renderRDLibrary() {
            outputEl.innerHTML = "";
            isInspecting = false;
            printRDHeader();

            const activeTier = techMatrix[selectedTierIndex];
            const activeCategory = activeTier.categories[selectedCategoryIndex];

            print(`ACTIVE TIER: ${activeTier.tierName}`, "title");
            print("--------------------------------------------------------------------------------");

            for (let i = 0; i < activeTier.categories.length; i++) {
                const item = activeTier.categories[i];
                const isSelected = (i === selectedCategoryIndex);
                
                let lineStr = isSelected 
                    ? ` ►► [UNLOCKED] ${item.cat.toUpperCase().padEnd(15)} : ${item.name} ◄◄` 
                    : `    [UNLOCKED] ${item.cat.toUpperCase().padEnd(15)} : ${item.name}`;

                print(lineStr, isSelected ? "title" : "amber");
            }

            print("--------------------------------------------------------------------------------");
            print(`CURRENTLY HIGHLIGHTED: [${activeCategory.cat.toUpperCase()}] -> ${activeCategory.name}`, "title");
            print(`BRIEF: ${activeCategory.desc}`);
            print("================================================================================", "title");
            updatePrompt();
        }

        function showCategoryInspection() {
            outputEl.innerHTML = "";
            isInspecting = true;
            printRDHeader();

            const activeTier = techMatrix[selectedTierIndex];
            const item = activeTier.categories[selectedCategoryIndex];

            print(`SPECIFICATION LEDGER // ${item.cat.toUpperCase()}`, "title");
            print("--------------------------------------------------------------------------------");
            print(`ITEM NAME:   ${item.name}`);
            print(`TIER LEVEL:  ${activeTier.tierName}`);
            print(`STATUS:      UNLOCKED & AVAILABLE`);
            print("--------------------------------------------------------------------------------");
            print("HARDWARE OVERVIEW:", "title");
            print(`  ${item.desc}`);

            print("================================================================================", "title");
            updatePrompt();
        }

        function renderPayloadListScreen() {
            stopCanvasLoop();
            outputEl.innerHTML = "";
            canvasContainerEl.style.display = "none";
            outputEl.style.display = "block";
            isRenderingCanvas = false;
            payloadSubMode = "LIST";
            printVABHeader();

            print("STUDIO TOOLKIT: PAYLOAD / PROBE DESIGNER", "title");

            print("EXISTING PAYLOAD DESIGNS:", "title");

        function parseRatio(ratioStr) {
            if (!ratioStr || !ratioStr.includes(":")) return { h: 1, w: 1 };
            const parts = ratioStr.split(":");
            return {
                h: parseFloat(parts[0]) || 1,
                w: parseFloat(parts[1]) || 1
            };
        }

        function spawnSparks(originX, originY) {
            for (let i = 0; i < 6; i++) {
                sparks.push({
                    x: originX,
                    y: originY,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.8) * 6 - 2,
                    gravity: 0.25,
                    life: 1.0,
                    decay: 0.03 + Math.random() * 0.03,
                    size: 2 + Math.random() * 2
                });
            }
        }

        function updateSparks() {
            for (let i = sparks.length - 1; i >= 0; i--) {
                let s = sparks[i];
                s.x += s.vx;
                s.y += s.vy;
                s.vy += s.gravity;
                s.life -= s.decay;
                if (s.life <= 0) {
                    sparks.splice(i, 1);
                }
            }
        }

        function drawSparks(ctx) {
            ctx.save();
            sparks.forEach(s => {
                ctx.fillStyle = `rgba(255, ${Math.floor(176 * s.life)}, 0, ${s.life})`;
                ctx.shadowColor = "#ffb000";
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function startCanvasLoop() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            function loop() {
                if (isRenderingCanvas) {
                    renderProbeGraphicsCanvas();
                    animFrameId = requestAnimationFrame(loop);
                }
            }
            loop();
        }

        function stopCanvasLoop() {
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
        }

        function calculatePayloadTotals() {
            let usedIVU = 0;
            let watts = 0;
            let heatGen = 0;
            let heatDis = 0;
            let capAh = 0;

            if (payloadSpecs.modules) {
                payloadSpecs.modules.forEach(partKey => {
                    const p = PARTS_LIBRARY[partKey];
                    if (p) {
                        usedIVU += p.ivu;
                        watts += p.watts;
                        heatGen += p.heatGen;
                        heatDis += p.heatDis;
                        capAh += p.capAh;
                    }
                });
            }

            const totalIVU = payloadSpecs.sizeIVU || 1.0;
            const volts = 12;
            let timeSec = 0;
            if (watts > 0 && capAh > 0) {
                const totalWattHours = capAh * volts;
                timeSec = (totalWattHours / watts) * 3600;
            } else if (capAh > 0 && watts === 0) {
                timeSec = 99999;
            }

            return {
                usedIVU,
                totalIVU,
                watts,
                volts,
                heatGen,
                heatDis,
                capAh,
                timeSec
            };
        }

        function renderProbeGraphicsCanvas() {
            outputEl.style.display = "none";
            canvasContainerEl.style.display = "flex";
            isRenderingCanvas = true;

            const rect = canvasContainerEl.getBoundingClientRect();
            probeCanvas.width = rect.width || 800;
            probeCanvas.height = rect.height || 500;

            const w = probeCanvas.width;
            const h = probeCanvas.height;

            ctx.clearRect(0, 0, w, h);

            ctx.fillStyle = "#050300";
            ctx.fillRect(0, 0, w, h);

            const totals = calculatePayloadTotals();

            // Probe Body position: positioned strictly towards the left side & enlarged to fill space
            const probeCenterX = w * 0.32;
            const probeCenterY = h * 0.5;

            const ratioObj = parseRatio(payloadSpecs.ratio);
            const scaleFactor = Math.sqrt(payloadSpecs.sizeIVU || 1.0);
            
            let baseW = 240 * scaleFactor;
            let baseH = baseW * (ratioObj.h / ratioObj.w);

            const maxAllowedH = h * 0.82;
            const maxAllowedW = w * 0.52;
            if (baseH > maxAllowedH || baseW > maxAllowedW) {
                const scale = Math.min(maxAllowedH / baseH, maxAllowedW / baseW);
                baseW *= scale;
                baseH *= scale;
            }

            const left = probeCenterX - (baseW / 2);
            const top = probeCenterY - (baseH / 2);

            // Path creation for bounding shape
            ctx.beginPath();
            if (payloadSpecs.shape === "Spherical") {
                ctx.ellipse(probeCenterX, probeCenterY, baseW / 2, baseH / 2, 0, 0, Math.PI * 2);
            } else {
                ctx.rect(left, top, baseW, baseH);
            }

            // Interior Clipping
            ctx.save();
            ctx.clip();

            // Handle Pressurization Animation Visual Fill
            const targetGasOpacity = payloadSpecs.pressurized ? 0.35 : 0.0;
            pressureGasOpacity += (targetGasOpacity - pressureGasOpacity) * 0.1;

            if (pressureGasOpacity > 0.01) {
                ctx.fillStyle = `rgba(255, 176, 0, ${pressureGasOpacity})`;
                ctx.fillRect(left - 10, top - 10, baseW + 20, baseH + 20);

                // Gas particles
                ctx.fillStyle = `rgba(255, 210, 80, ${pressureGasOpacity * 1.5})`;
                const time = Date.now() * 0.002;
                for (let i = 0; i < 18; i++) {
                    const gx = left + ((Math.sin(time + i * 1.7) + 1) / 2) * baseW;
                    const gy = top + ((Math.cos(time * 0.8 + i * 2.3) + 1) / 2) * baseH;
                    ctx.beginPath();
                    ctx.arc(gx, gy, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Modular Parts Layout inside Probe Shell
            const modules = payloadSpecs.modules || [];
            if (modules.length > 0) {
                const innerMargin = 16;
                const innerW = baseW - (innerMargin * 2);
                const innerH = baseH - (innerMargin * 2);
                const innerLeft = left + innerMargin;
                const innerTop = top + innerMargin;

                let curX = innerLeft;
                let curY = innerTop;
                let maxHeightInRow = 0;

                modules.forEach((modKey, idx) => {
                    const p = PARTS_LIBRARY[modKey];
                    if (!p) return;

                    // Relative scale representation: 0.5 IVU = ~50% inner space relative
                    const modRelArea = (p.ivu / totals.totalIVU) * (innerW * innerH);
                    let mBoxW = Math.max(38, Math.sqrt(modRelArea * 1.3));
                    let mBoxH = Math.max(28, modRelArea / mBoxW);

                    if (mBoxW > innerW) mBoxW = innerW;
                    if (mBoxH > innerH) mBoxH = innerH;

                    if (curX + mBoxW > innerLeft + innerW) {
                        curX = innerLeft;
                        curY += maxHeightInRow + 6;
                        maxHeightInRow = 0;
                    }

                    if (curY + mBoxH <= innerTop + innerH) {
                        ctx.fillStyle = "rgba(255, 176, 0, 0.12)";
                        ctx.fillRect(curX, curY, mBoxW, mBoxH);
                        ctx.strokeStyle = "#ffb000";
                        ctx.lineWidth = 1;
                        ctx.strokeRect(curX, curY, mBoxW, mBoxH);

                        ctx.fillStyle = "#ffb000";
                        ctx.font = "10px 'Courier New', monospace";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(p.label, curX + (mBoxW / 2), curY + (mBoxH / 2));

                        curX += mBoxW + 6;
                        if (mBoxH > maxHeightInRow) maxHeightInRow = mBoxH;
                    }
                });
            }

            ctx.restore(); // Restore clip

            // Outer Outer Shape Chassis Outline Frame
            ctx.strokeStyle = "#ffb000";
            ctx.lineWidth = 2;
            ctx.shadowColor = "#ffb000";
            ctx.shadowBlur = 6;

            ctx.beginPath();
            if (payloadSpecs.shape === "Spherical") {
                ctx.ellipse(probeCenterX, probeCenterY, baseW / 2, baseH / 2, 0, 0, Math.PI * 2);
            } else {
                ctx.rect(left, top, baseW, baseH);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Probe Header Title
            ctx.fillStyle = "#ffb000";
            ctx.font = "13px 'Courier New', monospace";
            ctx.textAlign = "left";
            ctx.fillText(`PROBE: ${payloadSpecs.name.toUpperCase()} [${payloadSpecs.shape.toUpperCase()}]`, left, Math.max(20, top - 12));

            // RIGHT SIDE PANEL: Installed Items & IVU Meter
            const rightPanelX = w * 0.60;
            const topPanelY = 30;

            ctx.font = "bold 13px 'Courier New', monospace";
            ctx.fillStyle = "#ffb000";
            ctx.fillText(`${totals.usedIVU.toFixed(2)} / ${totals.totalIVU.toFixed(2)} IVU used`, rightPanelX, topPanelY);

            ctx.strokeStyle = "rgba(255, 176, 0, 0.4)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(rightPanelX, topPanelY + 8);
            ctx.lineTo(w - 20, topPanelY + 8);
            ctx.stroke();

            ctx.font = "11px 'Courier New', monospace";
            let listY = topPanelY + 28;

            if (modules.length === 0) {
                ctx.fillStyle = "rgba(255, 176, 0, 0.5)";
                ctx.fillText("  (No internal modules installed)", rightPanelX, listY);
                listY += 20;
            } else {
                modules.forEach((modKey, idx) => {
                    const p = PARTS_LIBRARY[modKey];
                    if (p) {
                        ctx.fillStyle = "#ffb000";
                        ctx.fillText(` [${idx + 1}] ${p.name.padEnd(20)} (${p.ivu} IVU)`, rightPanelX, listY);
                        listY += 18;
                    }
                });
            }

            // Catalog Quick Reference Legend
            listY += 10;
            ctx.fillStyle = "rgba(255, 176, 0, 0.7)";
            ctx.fillText("PARTS LIST FOR 'add [name]':", rightPanelX, listY);
            listY += 16;
            ctx.font = "10px 'Courier New', monospace";
            Object.keys(PARTS_LIBRARY).forEach(k => {
                const item = PARTS_LIBRARY[k];
                ctx.fillText(`  • ${item.id.padEnd(14)} (${item.ivu} IVU)`, rightPanelX, listY);
                listY += 14;
            });

            // BOTTOM RIGHT CORNER: Electrical & Heat Readouts
            const botPanelX = w * 0.58;
            const botPanelY = h - 145;

            // Border Box for Systems Telemetry
            ctx.strokeStyle = "rgba(255, 176, 0, 0.5)";
            ctx.strokeRect(botPanelX - 10, botPanelY - 10, w - botPanelX, 140);
            ctx.fillStyle = "#080500";
            ctx.fillRect(botPanelX - 9, botPanelY - 9, w - botPanelX - 2, 138);

            // Electrical Section
            ctx.font = "bold 12px 'Courier New', monospace";
            ctx.fillStyle = "#ffb000";
            ctx.fillText("ELECTRICAL SYSTEM:", botPanelX, botPanelY + 6);

            ctx.font = "11px 'Courier New', monospace";
            ctx.fillText(` Watts                 : ${totals.watts.toFixed(1)} W`, botPanelX, botPanelY + 22);
            ctx.fillText(` Volts                 : ${totals.volts.toFixed(1)} V`, botPanelX, botPanelY + 36);

            let powerTimeStr = "~ INF";
            if (totals.watts > 0) {
                if (totals.capAh === 0) {
                    powerTimeStr = "0.0s (NO POWER)";
                } else {
                    const mins = Math.floor(totals.timeSec / 60);
                    const secs = Math.floor(totals.timeSec % 60);
                    powerTimeStr = `~ ${mins}m ${secs}s`;
                }
            }
            ctx.fillText(` Time Until Power Loss : ${powerTimeStr}`, botPanelX, botPanelY + 50);

            // Heat System Bars Section
            ctx.font = "bold 12px 'Courier New', monospace";
            ctx.fillText("THERMAL BALANCE:", botPanelX, botPanelY + 72);

            ctx.font = "11px 'Courier New', monospace";

            const maxHeatBarWidth = 12;
            const genRatio = Math.min(1.0, totals.heatGen / 30);
            const disRatio = Math.min(1.0, totals.heatDis / 30);

            const genFilled = Math.floor(genRatio * maxHeatBarWidth);
            const disFilled = Math.floor(disRatio * maxHeatBarWidth);

            const genBar = "[" + "█".repeat(genFilled) + "░".repeat(maxHeatBarWidth - genFilled) + "]";
            const disBar = "[" + "█".repeat(disFilled) + "░".repeat(maxHeatBarWidth - disFilled) + "]";

            ctx.fillText(` Heat Generated  : ${genBar} ${totals.heatGen.toFixed(1)} W_th`, botPanelX, botPanelY + 88);
            ctx.fillText(` Heat Dealt With : ${disBar} ${totals.heatDis.toFixed(1)} W_th`, botPanelX, botPanelY + 104);

            if (totals.heatGen > totals.heatDis) {
                ctx.fillStyle = "#ff4444";
                ctx.fillText(" STATUS: OVERHEATING WARN (Output < Input)", botPanelX, botPanelY + 120);
            } else {
                ctx.fillStyle = "#55ff55";
                ctx.fillText(" STATUS: THERMAL NOMINAL", botPanelX, botPanelY + 120);
            }

            // Render Sparks Particle Overlay
            updateSparks();
            drawSparks(ctx);

            updatePrompt();
        }

        function processCommand(input) {
            if (isExecutingProgram) return;

            const trimmedInput = input.trim();
            const lowerInput = trimmedInput.toLowerCase();

            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${trimmedInput}`, "amber");
            }

            if (lowerInput === "terminate") {
                stopCanvasLoop();
                inRDModule = false;
                isRDNavActive = false;
                inVABModule = false;
                inPayloadDesigner = false;
                isRenderingCanvas = false;
                isInspecting = false;
                canvasContainerEl.style.display = "none";
                outputEl.style.display = "block";
                activeVABApp = null;
                outputEl.innerHTML = "";
                print("[SYS] ACTIVE PROGRAM TERMINATED.");
                print("");
                printLoggedInHelp();
                updatePrompt();
                return;
            }

            if (inPayloadDesigner) {
                if (isRenderingCanvas) {
                    if (lowerInput === "pressurize") {
                        payloadSpecs.pressurized = true;
                        return;
                    }
                    if (lowerInput === "depressurize") {
                        payloadSpecs.pressurized = false;
                        return;
                    }
                    if (lowerInput.startsWith("add ")) {
                        const partKey = lowerInput.substring(4).trim();
                        const part = PARTS_LIBRARY[partKey];
                        if (!part) {
                            print(`[ERR] Unknown part key '${partKey}'. Check catalog on right side.`);
                            return;
                        }
                        const totals = calculatePayloadTotals();
                        if (totals.usedIVU + part.ivu > totals.totalIVU + 0.001) {
                            print(`[ERR] Not enough available space! (${(totals.totalIVU - totals.usedIVU).toFixed(2)} IVU remaining)`);
                            return;
                        }
                        if (!payloadSpecs.modules) payloadSpecs.modules = [];
                        payloadSpecs.modules.push(part.id);

                        // Trigger visual sparks flying off from item list region
                        const rect = probeCanvas.getBoundingClientRect();
                        spawnSparks(rect.width * 0.70, rect.height * 0.25);
                        return;
                    }
                    if (lowerInput.startsWith("remove ")) {
                        const arg = lowerInput.substring(7).trim();
                        if (!payloadSpecs.modules || payloadSpecs.modules.length === 0) {
                            print("[ERR] Probe interior is empty.");
                            return;
                        }
                        const idx = parseInt(arg, 10);
                        if (!isNaN(idx) && idx >= 1 && idx <= payloadSpecs.modules.length) {
                            payloadSpecs.modules.splice(idx - 1, 1);
                        } else {
                            const foundIdx = payloadSpecs.modules.findIndex(m => m.toLowerCase() === arg.toLowerCase());
                            if (foundIdx >= 0) {
                                payloadSpecs.modules.splice(foundIdx, 1);
                            } else {
                                print(`[ERR] Module '${arg}' not found inside payload.`);
                            }
                        }
                        return;
                    }
                    if (lowerInput === "save") {
                        if (!GameState.data.savedPayloads) GameState.data.savedPayloads = [];
                        const existingIdx = GameState.data.savedPayloads.findIndex(p => p.name.toLowerCase() === payloadSpecs.name.toLowerCase());
                        if (existingIdx >= 0) {
                            GameState.data.savedPayloads[existingIdx] = JSON.parse(JSON.stringify(payloadSpecs));
                        } else {
                            GameState.data.savedPayloads.push(JSON.parse(JSON.stringify(payloadSpecs)));
                        }
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        stopCanvasLoop();
                        renderPayloadListScreen();
                        print(`[SYS] Payload design '${payloadSpecs.name}' successfully saved.`);
                        return;
                    }
                    if (lowerInput === "back") {
                        stopCanvasLoop();
                        renderPayloadDesignerCriteria();
                        return;
                    }
                    print("[SYS] Commands: add [part] | remove [part] | pressurize | depressurize | save | back | terminate");
                    return;
                }

                if (payloadSubMode === "LIST") {
                    if (lowerInput === "back") {
                        inPayloadDesigner = false;
                        activeVABApp = null;
                        renderVABMenu();
                        return;
                    }
                    if (lowerInput === "new") {
                        payloadStep = "NAME";
                        payloadSpecs = { name: "", sizeIVU: null, shape: null, purpose: null, ratio: "1:1", modules: [], pressurized: false };
                        renderPayloadDesignerCriteria();
                        return;
                    }
                    if (lowerInput.startsWith("load")) {
                        const targetName = trimmedInput.substring(4).trim();
                        if (!targetName) {
                            print("[SYS] Usage: load [payload name or index]");
                            return;
                        }
                        let targetPayload = null;
                        const targetIdx = parseInt(targetName, 10);
                        if (!isNaN(targetIdx) && GameState.data.savedPayloads && GameState.data.savedPayloads[targetIdx - 1]) {
                            targetPayload = GameState.data.savedPayloads[targetIdx - 1];
                        } else if (GameState.data.savedPayloads) {
                            targetPayload = GameState.data.savedPayloads.find(p => p.name.toLowerCase() === targetName.toLowerCase());
                        }

                        if (!targetPayload) {
                            print(`[ERR] Saved payload '${targetName}' not found.`);
                            return;
                        }

                        payloadSpecs = JSON.parse(JSON.stringify(targetPayload));
                        if (!payloadSpecs.modules) payloadSpecs.modules = [];
                        if (payloadSpecs.pressurized === undefined) payloadSpecs.pressurized = false;

                        startCanvasLoop();
                        return;
                    }
                    if (lowerInput.startsWith("delete")) {
                        const targetName = trimmedInput.substring(6).trim();
                        if (!targetName) {
                            print("[SYS] Usage: delete [payload name]");
                            return;
                        }
                        const exists = GameState.data.savedPayloads && GameState.data.savedPayloads.some(p => p.name.toLowerCase() === targetName.toLowerCase());
                        if (!exists) {
                            print(`[ERR] Payload '${targetName}' not found in registry.`);
                            return;
                        }
                        payloadDeleteTarget = targetName;
                        payloadSubMode = "DELETE_CONFIRM";
                        print(`[WARN] Are you sure you want to permanently delete '${targetName}'? (type 'yes' or 'no')`, "title");
                        updatePrompt();
                        return;
                    }
                    print("[SYS] Options: 'load [name]', 'new', 'delete [name]', 'back', or 'terminate'.");
                    return;
                }

                if (payloadSubMode === "DELETE_CONFIRM") {
                    if (lowerInput === "yes" || lowerInput === "y") {
                        GameState.data.savedPayloads = GameState.data.savedPayloads.filter(p => p.name.toLowerCase() !== payloadDeleteTarget.toLowerCase());
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        const removed = payloadDeleteTarget;
                        payloadDeleteTarget = "";
                        renderPayloadListScreen();
                        print(`[SYS] Payload design '${removed}' deleted.`);
                        return;
                    }
                    if (lowerInput === "no" || lowerInput === "n" || lowerInput === "back") {
                        payloadDeleteTarget = "";
                        renderPayloadListScreen();
                        print("[SYS] Deletion canceled.");
                        return;
                    }
                    print("[SYS] Confirm deletion of payload? Type 'yes' or 'no'.");
                    return;
                }

                if (payloadSubMode === "CRITERIA") {
                    if (lowerInput === "back") {
                        renderPayloadListScreen();
                        return;
                    }

                    if (payloadStep === "NAME") {
                        if (!trimmedInput) {
                            print("[SYS] Please enter a valid payload name.");
                            return;
                        }
                        payloadSpecs.name = trimmedInput;
                        payloadStep = "SIZE";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "SIZE") {
                        if (lowerInput === "1") payloadSpecs.sizeIVU = 0.5;
                        else if (lowerInput === "2") payloadSpecs.sizeIVU = 1.0;
                        else if (lowerInput === "3") payloadSpecs.sizeIVU = 2.0;
                        else {
                            print("[SYS] Select size option 1, 2, or 3.");
                            return;
                        }
                        payloadStep = "SHAPE";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "SHAPE") {
                        if (lowerInput === "1") payloadSpecs.shape = "Cubic";
                        else if (lowerInput === "2") payloadSpecs.shape = "Spherical";
                        else {
                            print("[SYS] Select shape option 1 or 2.");
                            return;
                        }
                        payloadStep = "RATIO";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "RATIO") {
                        if (lowerInput === "1") payloadSpecs.ratio = "1:1";
                        else if (lowerInput === "2") payloadSpecs.ratio = "2:1";
                        else if (lowerInput === "3") payloadSpecs.ratio = "1:2";
                        else {
                            print("[SYS] Select ratio option 1, 2, or 3.");
                            return;
                        }
                        payloadStep = "PURPOSE";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "PURPOSE") {
                        if (lowerInput === "1") payloadSpecs.purpose = "Payload";
                        else {
                            print("[SYS] Select purpose option 1.");
                            return;
                        }
                        payloadStep = "CONFIRM";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "CONFIRM") {
                        if (lowerInput === "start") {
                            startCanvasLoop();
                            return;
                        }
                        print("[SYS] Type 'start' to initialize design canvas, or 'back' to return to list.");
                        return;
                    }
                }
            }

            if (inRDModule) {
                if (lowerInput === "move") {
                    isRDNavActive = true;
                    updatePrompt();
                    print("[SYS] WASD Navigation Unlocked. Use WASD keys to browse tree, 'E' to select/inspect, 'Q' to return to typing.");
                    return;
                }

                if (isRDNavActive) {
                    if (lowerInput === "q") {
                        isRDNavActive = false;
                        updatePrompt();
                        print("[SYS] Exited WASD navigation mode. Type 'move' to enter again.");
                        return;
                    }
                }

                if (isInspecting) {
                    if (lowerInput === "q" || lowerInput === "back") {
                        renderRDLibrary();
                        return;
                    }
                }

                print(`[SYS] R&D Command: Type 'move' to activate tree navigation, or 'terminate' to exit.`);
                return;
            }

            if (inVABModule) {
                if (activeVABApp) {
                    if (lowerInput === "back") {
                        activeVABApp = null;
                        renderVABMenu();
                        return;
                    }
                    const v = GameState.data.vessel;
                    if (lowerInput === "1") {
                        v.fuelRatio = (v.fuelRatio + 10) > 100 ? 10 : v.fuelRatio + 10;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "2") {
                        v.gimbal = (v.gimbal + 20) > 100 ? 20 : v.gimbal + 20;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "3") {
                        v.finArea = (v.finArea + 2) > 20 ? 2 : v.finArea + 2;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "4") {
                        v.sepDelay = (v.sepDelay >= 3.0) ? 0.5 : parseFloat((v.sepDelay + 0.5).toFixed(1));
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    print("[SYS] Type '1'-'4' to adjust, 'back' for menu, or 'terminate'.");
                    return;
                } else {
                    const option = parseInt(lowerInput, 10);
                    if (!isNaN(option) && option >= 1 && option <= vabApplications.length) {
                        activeVABApp = vabApplications[option - 1];
                        if (activeVABApp.id === "payload") {
                            inPayloadDesigner = true;
                            renderPayloadListScreen();
                            return;
                        }
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    print("[SYS] Enter an application number (1-7), or type 'terminate'.");
                    return;
                }
            }

            if (currentMode === "NEW_NAME") {
                if (!trimmedInput) return;
                tempName = trimmedInput;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "NEW_PASS") {
                if (!trimmedInput) return;
                const password = trimmedInput;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();
                if (!GameState.data.savedPayloads) GameState.data.savedPayloads = [];

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                outputEl.innerHTML = "";
                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' created.`);
                print(`[SYS] Profile ID: [${slotName}]`);
                print("");
                printProgramTree();
                printLoggedInHelp();
                return;
            }

            if (currentMode === "LOAD_SELECT") {
                if (!trimmedInput) return;
                const targetSlot = trimmedInput.toLowerCase().replace(/\s+/g, '_');

                if (lowerInput === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${trimmedInput}' not found.`);
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "LOAD_PASS") {
                if (!trimmedInput) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === trimmedInput) {
                    GameState.data = parsedData;
                    if (!GameState.data.savedPayloads) GameState.data.savedPayloads = [];
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    
                    outputEl.innerHTML = "";
                    updatePrompt();
                    
                    print(`[SYS] Access granted for user '${GameState.data.user.name}'.`);
                    print("");
                    printProgramTree();
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Invalid password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            const parts = lowerInput.split(" ");
            const cmd = parts[0];
            const subCmd = parts[1] || "";

            if (currentMode === "LOGGED_IN") {
                if ((cmd === "run" && subCmd === "r&d") || cmd === "r&d") {
                    runModuleBootSequence("RD", () => {
                        inRDModule = true;
                        isRDNavActive = false;
                        renderRDLibrary();
                    });
                    return;
                }

                if ((cmd === "run" && subCmd === "vab") || cmd === "vab") {
                    runModuleBootSequence("VAB", () => {
                        inVABModule = true;
                        renderVABMenu();
                    });
                    return;
                }

                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "programs":
                    case "dir":
                        printProgramTree();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        print(`Saved Payloads: ${GameState.data.savedPayloads ? GameState.data.savedPayloads.length : 0}`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Data written to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        GameState.activeSlot = "default_save";
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help', 'run r&d', or 'run vab'.`);
                        break;
                }
                return;
            }

            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Reading save records...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const loadSaves = getSaveList();
                        if (loadSaves.length === 0) {
                            print("[ERR] No save files present in memory.");
                            return;
                        }

                        print("[SYS] Available Save Files:");
                        loadSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'.`);
                        break;
                }
            }
        }

        function renderVABAppStudio(app) {
            stopCanvasLoop();
            outputEl.innerHTML = "";
            canvasContainerEl.style.display = "none";
            outputEl.style.display = "block";
            printVABHeader();

            const v = GameState.data.vessel;
            const totalMass = v.mass_kg + Math.floor(v.fuelRatio * 4.2) + Math.floor(v.finArea * 1.5);
            const thrust = 12.5;
            const twr = ((thrust * 1000) / (totalMass * 9.81)).toFixed(2);
            const estDV = Math.floor(1200 + (v.fuelRatio * 18) - (v.finArea * 5));

            print(`ACTIVE STUDIO TOOLKIT: ${app.name.toUpperCase()}`, "title");
            print(`TARGET CHASSIS: [ ${v.name} ]`);
            print("--------------------------------------------------------------------------------");
            print(" [TUNING & MODIFICATION MATRIX]", "title");
            print(`  [1] Fuel Mixture Ratio  : [${"█".repeat(Math.floor(v.fuelRatio / 10))}${"░".repeat(10 - Math.floor(v.fuelRatio / 10))}] ${v.fuelRatio}% Kerosene`);
            print(`  [2] Gimbal Limiter      : [${"█".repeat(Math.floor(v.gimbal / 10))}${"░".repeat(10 - Math.floor(v.gimbal / 10))}] ${v.gimbal}% Range`);
            print(`  [3] Aero Fin Area       : [${"█".repeat(Math.floor(v.finArea / 2))}${"░".repeat(10 - Math.floor(v.finArea / 2))}] ${v.finArea} sq.m`);
            print(`  [4] Stage Sep Delay     : [ ${v.sepDelay}s ]`);
            print("--------------------------------------------------------------------------------");
            print(" [DYNAMIC TELEMETRY CALCULATOR]", "title");
            print(`  Calculated Wet Mass : ${totalMass} kg`);
            print(`  Ground Thrust-to-Wt : ${twr} TWR`);
            print(`  Estimated Delta-V   : ${estDV} m/s`);
            print("--------------------------------------------------------------------------------");
            print("Controls: Type '1'-'4' to adjust parameters. Type 'back' for VAB menu, or 'terminate'.");
            print("================================================================================", "title");
            updatePrompt();
        }

        window.addEventListener("resize", () => {
            if (isRenderingCanvas) {
                renderProbeGraphicsCanvas();
            }
        });

        window.addEventListener("keydown", (e) => {
            if (isExecutingProgram) return;

            if (inRDModule && isRDNavActive) {
                const key = e.key.toUpperCase();
                
                if (["W", "A", "S", "D", "E", "Q"].includes(key)) {
                    e.preventDefault();
                }

                if (key === "W") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex > 0) selectedCategoryIndex--;
                    renderRDLibrary();
                } else if (key === "S") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex < techMatrix[selectedTierIndex].categories.length - 1) selectedCategoryIndex++;
                    renderRDLibrary();
                } else if (key === "A") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex > 0) {
                        selectedTierIndex--;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                } else if (key === "D") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex < techMatrix.length - 1) {
                        selectedTierIndex++;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                } else if (key === "E") {
                    if (!isInspecting) showCategoryInspection();
                } else if (key === "Q") {
                    if (isInspecting) {
                        renderRDLibrary();
                    } else {
                        isRDNavActive = false;
                        updatePrompt();
                        print("[SYS] Exited WASD navigation mode.");
                    }
                }
            }

            if (e.key === "Enter") {
                const input = inputEl.value;
                inputEl.value = "";
                processCommand(input);
            }
        });

        bootTerminal();
    </script>
</body>
