<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ORBITAL OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
/* UNIVERSAL UI - AMBER & CRT */
:root{--t:#ffb000;--b:#0a0500;--f:'Courier New',Courier,monospace}
body{background:var(--b);color:var(--t);font-family:var(--f);margin:0;padding:20px;overflow:hidden;text-shadow:0 0 5px var(--t)}
.terminal-screen,.boot-screen{display:flex;flex-direction:column;height:95vh;justify-content:flex-end; position:relative;}
body::after{content:"";position:absolute;top:0;left:0;width:100vw;height:100vh;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.1),rgba(0,0,0,0.1) 1px,transparent 1px,transparent 2px);pointer-events:none;z-index:999}
.boot-screen{justify-content:center;align-items:center;text-align:center}
.title{font-size:3em;font-weight:bold;margin-bottom:40px;letter-spacing:10px;text-transform:uppercase}
.boot-box{border:1px solid var(--t);padding:20px;width:300px}
.input-container{margin-bottom:15px;text-align:left}
.input-container label{display:block;margin-bottom:5px}
#output-log{white-space:pre-wrap;overflow-y:auto;margin-bottom:10px;padding-right:10px; flex-grow:1; z-index: 10;}
.input-line{display:flex;align-items:center; z-index:10;}
.prompt{margin-right:10px;font-weight:bold}
input[type=text],input[type=password]{background:transparent;border:1px solid rgba(255,176,0,0.3);color:var(--t);font-family:var(--f);font-size:16px;outline:none;text-shadow:0 0 5px var(--t);padding:5px;width:280px}
input[type=text]:focus,input[type=password]:focus{border-color:var(--t)}
#terminal-input{border:none;flex-grow:1;width:auto}
#submit-btn{border:1px solid var(--t);padding:5px 15px;cursor:pointer;margin-top:10px;display:inline-block}
#submit-btn:hover{background:var(--t);color:var(--b);text-shadow:none}
.input-line.app-mode {border-top: 1px solid var(--t); padding-top: 10px; margin-top: 10px;}

/* 3D & 2D OVERLAY CONTAINERS */
#webgl-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% - 50px);
    display: none;
    z-index: 1;
}
#ui-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% - 50px);
    display: none;
    pointer-events: none; /* Let clicks pass through to 3D controls */
    z-index: 2;
}
</style>
</head><body>

<div id="boot-screen" class="boot-screen">
    <div class="title">ORBITAL</div>
    <div class="boot-box">
        <div class="input-container"><label>USERNAME:</label><input type="text" id="user-input" autocomplete="off"></div>
        <div class="input-container"><label>PASSWORD:</label><input type="password" id="pass-input" autocomplete="off"></div>
        <div id="submit-btn">[SUBMIT]</div>
    </div>
</div>

<div id="terminal-screen" class="terminal-screen" style="display:none;">
    <div id="webgl-container"></div>
    <canvas id="ui-canvas"></canvas>
    <div id="output-log">OSIRIS KERNEL BOOT (AMBER)... OK.</div>
    <div id="input-wrapper" class="input-line"><span class="prompt">></span><input type="text" id="terminal-input" autocomplete="off"></div>
</div>

<script>
const AuthSystem={
    isAuthenticated:!1,
    validUser:"DIRECTOR",
    validPass:"TIER0",
    attemptLogin:function(){
        const e=document.getElementById("user-input").value.toUpperCase().trim(),
              t=document.getElementById("pass-input").value.toUpperCase().trim();
        e===this.validUser&&t===this.validPass?(
            this.isAuthenticated=!0,
            document.getElementById("boot-screen").style.display="none",
            document.getElementById("terminal-screen").style.display="flex",
            Terminal.log("\n[AUTH SUCCESS] WELCOME TO ORBITAL.\nType 'HELP' for commands."),
            Terminal.inputField.focus()
        ):(
            Terminal.clearInputs(),
            document.getElementById("user-input").placeholder="ERR: INVALID CREDENTIALS",
            setTimeout(()=>document.getElementById("user-input").placeholder="", 2000)
        )
    }
};

// --- 3D ASTROPHYSICS ENGINE (THREE.JS) ---
const MapEngine = {
    container: document.getElementById("webgl-container"),
    uiCanvas: document.getElementById("ui-canvas"),
    ctx: null,
    
    scene: null,
    camera: null,
    renderer: null,
    controls: null,
    
    isRunning: false,
    startTime: Date.now(),
    timeScale: 1000, // Sped up for visual testing
    
    activeTarget: null,
    lastTargetPos: null, // Used for Relative Tracking
    
    // Scales to convert massive distances into manageable 3D space coordinates
    D_SCALE: 1e-5, // Distance Scale
    R_SCALE: 5e-3, // Radius Visual Exaggeration
    
    system: {
        name: "OSIRIS", radius: 12.6, 
        desc_astro: "CLASS: STELLAR BLACK HOLE\nMASS:  2.542 SOLAR MASSES\nAGE:   ~200 MILLION YEARS",
        bodies: [
            {
                name: "FURRA", a: 271000000, e: 0.0167, inc: 0.0, lan: 0.0, argp: 0.0, radius: 5796, period: 48384000,
                desc_astro: "CLASS: HABITABLE TERRESTRIAL\nGRAVITY: 1.0G (STANDARD)\nDAY:   32 HOURS",
                bodies: [
                    { name: "HARMONY", a: 11796, e: 0.001, inc: 0.0, lan: 0.0, argp: 0.0, radius: 21, period: 14004,
                      desc_astro: "CLASS: SHEPHERD MOON\nGRAVITY: MICROGRAVITY\nLOCKED:  YES" },     
                    { name: "KIITOS", a: 340000, e: 0.05, inc: 2.1, lan: 45.0, argp: 90.0, radius: 1876, period: 2171520,
                      desc_astro: "CLASS: MAJOR LUNAR BODY\nGRAVITY: ~0.16G (1/6 FURRA)\nLOCKED:  YES" }  
                ]
            }
        ]
    },

    init: function() {
        this.ctx = this.uiCanvas.getContext("2d");
        
        // 1. Setup Three.js Scene
        this.scene = new THREE.Scene();
        this.scene.background = null; // Let the black CRT background show
        
        const aspect = window.innerWidth / (window.innerHeight - 50);
        this.camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 100000);
        
        this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight - 50);
        this.container.appendChild(this.renderer.domElement);
        
        // 2. Setup Orbit Controls (Draggable 3D Map)
        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxDistance = 50000;
        
        this.buildSystem();
        
        window.addEventListener("resize", () => this.resize());
        
        // Handle UI clicks through the WebGL canvas
        this.renderer.domElement.addEventListener("click", (e) => {
            const rect = this.renderer.domElement.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // Basic UI Button interception
            if (this.btnBounds && mouseX >= this.btnBounds.x1 && mouseX <= this.btnBounds.x2 && mouseY >= this.btnBounds.y1 && mouseY <= this.btnBounds.y2) {
                Terminal.log("ENCYCLOPEDIA MODULE NOT YET INSTALLED.");
                return;
            }
        });
    },

    createBodyMesh: function(bodyData, parentObj, isStar = false) {
        // Material: Amber Wireframe
        const material = new THREE.MeshBasicMaterial({ 
            color: 0xffb000, 
            wireframe: true,
            transparent: true,
            opacity: isStar ? 1.0 : 0.6
        });
        
        let visRadius = bodyData.radius * this.R_SCALE;
        if (visRadius < 0.5) visRadius = 0.5; // Minimum visible size
        
        const geometry = new THREE.SphereGeometry(visRadius, 16, 16);
        const mesh = new THREE.Mesh(geometry, material);
        
        // Setup Orbital Pivot for Inclination/LAN
        const pivot = new THREE.Group();
        if (!isStar) {
            pivot.rotation.y = THREE.MathUtils.degToRad(bodyData.lan);
            pivot.rotation.x = THREE.MathUtils.degToRad(bodyData.inc);
            
            // Draw Orbit Path
            const points = [];
            const pathMaterial = new THREE.LineDashedMaterial({
                color: 0xffb000, dashSize: 5, gapSize: 5, transparent: true, opacity: 0.3
            });
            const segments = 64;
            for(let i=0; i<=segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                // Simplified circular orbit for visual path
                const r = bodyData.a * this.D_SCALE;
                points.push(new THREE.Vector3(Math.cos(theta)*r, 0, Math.sin(theta)*r));
            }
            const pathGeom = new THREE.BufferGeometry().setFromPoints(points);
            const orbitLine = new THREE.Line(pathGeom, pathMaterial);
            orbitLine.computeLineDistances();
            pivot.add(orbitLine);
        }
        
        pivot.add(mesh);
        parentObj.add(pivot);
        
        // Store references in our data
        bodyData.mesh = mesh;
        bodyData.pivot = pivot;
    },

    buildSystem: function() {
        // Build Osiris
        this.system.group = new THREE.Group();
        this.scene.add(this.system.group);
        this.createBodyMesh(this.system, this.system.group, true);
        
        // Build Planets & Moons
        this.system.bodies.forEach(planet => {
            this.createBodyMesh(planet, this.system.group);
            
            planet.bodies.forEach(moon => {
                this.createBodyMesh(moon, planet.mesh); // Moons pivot around their planet's mesh
            });
        });
    },

    selectTargetByName: function(name) {
        if (name === "OSIRIS") {
            this.activeTarget = this.system;
            this.lastTargetPos = new THREE.Vector3();
            this.system.mesh.getWorldPosition(this.lastTargetPos);
            this.camera.position.set(0, 50, 150);
            return true;
        }
        for (let planet of this.system.bodies) {
            if (planet.name === name) {
                this.activeTarget = planet;
                this.lastTargetPos = new THREE.Vector3();
                planet.mesh.getWorldPosition(this.lastTargetPos);
                this.camera.position.copy(this.lastTargetPos).add(new THREE.Vector3(0, 10, 30));
                return true;
            }
        }
        return false;
    },

    resize: function() {
        const w = window.innerWidth;
        const h = window.innerHeight - 50;
        this.uiCanvas.width = w;
        this.uiCanvas.height = h;
        if(this.camera) {
            this.camera.aspect = w / h;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(w, h);
        }
    },

    start: function() {
        this.isRunning = true;
        this.container.style.display = "block";
        this.uiCanvas.style.display = "block";
        document.getElementById("output-log").style.display = "none";
        this.resize();
        this.loop();
    },

    stop: function() {
        this.isRunning = false;
        this.activeTarget = null;
        this.container.style.display = "none";
        this.uiCanvas.style.display = "none";
        document.getElementById("output-log").style.display = "block";
    },

    loop: function() {
        if (!this.isRunning) return;
        this.update();
        this.renderer.render(this.scene, this.camera);
        this.drawUI();
        requestAnimationFrame(() => this.loop());
    },

    update: function() {
        const elapsedSeconds = ((Date.now() - this.startTime) / 1000) * this.timeScale;
        
        // Update Orbital Positions
        this.system.bodies.forEach(planet => {
            const tP = ((2 * Math.PI) / planet.period) * elapsedSeconds;
            const rP = (planet.a * (1 - Math.pow(planet.e, 2))) / (1 + planet.e * Math.cos(tP));
            planet.mesh.position.x = rP * Math.cos(tP) * this.D_SCALE;
            planet.mesh.position.z = rP * Math.sin(tP) * this.D_SCALE;
            
            planet.bodies.forEach(moon => {
                const tM = ((2 * Math.PI) / moon.period) * elapsedSeconds;
                const rM = (moon.a * (1 - Math.pow(moon.e, 2))) / (1 + moon.e * Math.cos(tM));
                moon.mesh.position.x = rM * Math.cos(tM) * this.D_SCALE;
                moon.mesh.position.z = rM * Math.sin(tM) * this.D_SCALE;
            });
        });

        // Relative Tracking Logic: Move Camera & Target strictly by the delta of the planet's movement
        if (this.activeTarget && this.activeTarget.mesh) {
            const currentPos = new THREE.Vector3();
            this.activeTarget.mesh.getWorldPosition(currentPos);
            
            if (this.lastTargetPos) {
                const delta = currentPos.clone().sub(this.lastTargetPos);
                this.camera.position.add(delta);
                this.controls.target.add(delta);
            }
            this.lastTargetPos = currentPos.clone();
        }

        this.controls.update();
    },

    drawUI: function() {
        this.ctx.clearRect(0, 0, this.uiCanvas.width, this.uiCanvas.height);
        
        // UI Overlay Text
        this.ctx.fillStyle = "#ffb000";
        this.ctx.font = "14px 'Courier New'";
        this.ctx.fillText(`TIME MULTIPLIER: ${this.timeScale}x`, 10, 20);
        this.ctx.fillText(`[L-CLICK: ROTATE | R-CLICK: PAN | SCROLL: ZOOM]`, 10, 40);

        if (this.activeTarget) {
            let isAnchor = this.activeTarget.name === "OSIRIS";
            
            let boxWidth = 340;
            let startX = this.uiCanvas.width - (boxWidth + 10);
            let textX = startX + 10;
            let astroLines = this.activeTarget.desc_astro.split('\n');
            let buttonY = 100 + (astroLines.length * 20);
            if (!isAnchor) buttonY += 170; 
            let boxHeight = buttonY + 55;
            
            this.ctx.fillStyle = "rgba(10, 5, 0, 0.85)";
            this.ctx.fillRect(startX, 10, boxWidth, boxHeight);
            this.ctx.strokeStyle = "#ffb000";
            this.ctx.strokeRect(startX, 10, boxWidth, boxHeight);
            
            this.ctx.fillStyle = "#ffb000";
            this.ctx.font = "bold 16px 'Courier New'";
            this.ctx.fillText(`TARGET: ${this.activeTarget.name}`, textX, 30);
            
            this.ctx.beginPath();
            this.ctx.moveTo(startX, 40);
            this.ctx.lineTo(startX + boxWidth, 40);
            this.ctx.stroke();

            this.ctx.font = "bold 12px 'Courier New'";
            this.ctx.fillText(`[ ASTROPHYSICS ]`, textX, 60);
            this.ctx.font = "12px 'Courier New'";
            this.ctx.fillText(`RADIUS:  ${this.activeTarget.radius.toLocaleString()} KM`, textX, 80);
            for(let i=0; i<astroLines.length; i++) this.ctx.fillText(astroLines[i], textX, 100 + (i*20));

            if (!isAnchor) {
                let currentY = buttonY - 170;
                this.ctx.font = "bold 12px 'Courier New'";
                this.ctx.fillText(`[ ORBITAL DATA ]`, textX, currentY);
                this.ctx.font = "12px 'Courier New'";
                
                this.ctx.fillText(`SMA (a):  ${this.activeTarget.a.toLocaleString()} KM`, textX, currentY + 20);
                this.ctx.fillText(`ECC (e):  ${this.activeTarget.e}`, textX, currentY + 40);
                this.ctx.fillText(`INC (i):  ${this.activeTarget.inc.toFixed(1)}°`, textX, currentY + 60);
                this.ctx.fillText(`LAN (Ω):  ${this.activeTarget.lan.toFixed(1)}°`, textX, currentY + 80);
            }

            // Button Logic
            let btnX = startX + 10;
            let btnY = buttonY + 10;
            let btnW = boxWidth - 20;
            let btnH = 35;
            
            this.ctx.fillStyle = "rgba(255, 176, 0, 0.05)";
            this.ctx.fillRect(btnX, btnY, btnW, btnH);
            this.ctx.strokeStyle = "#ffb000";
            this.ctx.strokeRect(btnX, btnY, btnW, btnH);
            
            this.ctx.fillStyle = "#ffb000";
            this.ctx.font = "bold 13px 'Courier New'";
            this.ctx.textAlign = "center";
            this.ctx.fillText("ENCYCLOPEDIA", btnX + btnW / 2, btnY + 22);
            this.ctx.textAlign = "left"; 
            
            this.btnBounds = { x1: btnX, y1: btnY, x2: btnX + btnW, y2: btnY + btnH };
        } else {
            this.btnBounds = null;
        }
    }
};

// --- TERMINAL LOGIC ---
const Terminal={
    outputLog:document.getElementById("output-log"),
    inputField:document.getElementById("terminal-input"),
    inputWrapper:document.getElementById("input-wrapper"),
    userInput:document.getElementById("user-input"),
    currentApp: null,
    
    init:function(){
        this.userInput.addEventListener("keydown",e=>{"Enter"===e.key&&this.userInput.value.trim()!=""&&document.getElementById("pass-input").focus()});
        document.getElementById("pass-input").addEventListener("keydown",e=>{"Enter"===e.key&&AuthSystem.attemptLogin()});
        this.inputField.addEventListener("keydown",e=>{"Enter"===e.key&&(e=this.inputField.value,""!==e.trim()&&this.processInput(e),this.inputField.value="")});
        document.getElementById("submit-btn").addEventListener("click",()=>AuthSystem.attemptLogin());
        this.userInput.focus();
        MapEngine.init(); 
    },

    launchApp:function(appName){
        this.currentApp = "LOADING"; 
        this.inputField.disabled = true; 
        this.inputField.value = "";
        
        const loadTime = Math.floor(Math.random() * 2000) + 1000; // Sped up for testing
        const ticks = loadTime / 100;
        let currentTick = 0;
        
        const loader = setInterval(() => {
            currentTick++;
            let pct = Math.floor((currentTick / ticks) * 100);
            let pBar = "[";
            for(let i=0; i<20; i++) pBar += (i < pct/5) ? "█" : "░";
            pBar += "] " + pct + "%";
            
            this.outputLog.innerText = "ACCESSING " + appName + " MAINFRAME...\n" + pBar;
            
            if (currentTick >= ticks) {
                clearInterval(loader);
                this.currentApp = appName;
                this.inputField.disabled = false;
                this.inputWrapper.classList.add('app-mode');
                
                this.outputLog.innerText = appName + " ONLINE.\nAWAITING TARGET DESIGNATION OR TYPE 'TERMINATE'.";
                this.inputField.focus();
            }
        }, 100);
    },
    
    processInput:function(input){
        const cmd = input.toUpperCase().trim();

        if (this.currentApp !== null) {
            if (this.currentApp === "LOADING") return; 

            if (cmd === "TERMINATE") {
                this.currentApp = null;
                this.inputWrapper.classList.remove('app-mode');
                MapEngine.stop();
                this.outputLog.innerText = "OSIRIS KERNEL RESTORED.\nAPP TERMINATED.";
            } else if (this.currentApp === "PLANETARY CHARTS") {
                if (!MapEngine.isRunning) {
                    if (cmd === "FURRA" || cmd === "OSIRIS") {
                        MapEngine.start();
                        MapEngine.selectTargetByName(cmd);
                    } else {
                        this.outputLog.innerText += "\n> " + cmd + "\nERR: TARGET NOT FOUND. START WITH 'FURRA' OR 'OSIRIS'.";
                        window.scrollTo(0,document.body.scrollHeight);
                    }
                } else {
                    let found = MapEngine.selectTargetByName(cmd);
                    if (!found) {
                        this.inputField.value = "";
                        this.inputField.placeholder = "ERR: UNKNOWN BODY";
                        setTimeout(() => this.inputField.placeholder = "", 2000);
                    }
                }
            } else {
                this.log("> " + cmd + "\nERR: APP [" + this.currentApp + "] IS RUNNING. TYPE 'TERMINATE' TO EXIT.");
            }
            return;
        }

        this.log("> " + cmd);
        switch(cmd) {
            case "HELP": this.log("AVAILABLE COMMANDS:\nHELP\nLIST\nLOGOUT\n\nEXECUTABLES:\nVAB\nDSN\nCONTRACTS\nMETAR DATA\nPLANETARY CHARTS"); break;
            case "LIST": this.log("AGENCY ASSET LIST:\n--- TIER 0 ---\n[READY] sounding_rocket_alpha\n[BUILDING] test_stand_01 (4h 12m)"); break;
            case "LOGOUT": location.reload(); break;
            case "PLANETARY CHARTS": this.launchApp(cmd); break;
            case "VAB": case "DSN": case "CONTRACTS": case "METAR DATA":
                this.currentApp = cmd;
                this.log("EXECUTING [" + cmd + "]...\nPROCESS COMPLETE. APP RUNNING IN FOREGROUND.");
                break;
            default: this.log("ERR: UNKNOWN COMMAND.");
        }
    },
    
    log:function(e){this.outputLog.innerText+="\n"+e,window.scrollTo(0,document.body.scrollHeight)},
    clearInputs:function(){document.getElementById("user-input").value="",document.getElementById("pass-input").value="",this.userInput.focus()}
};
window.onload=()=>Terminal.init();
</script>
</body></html>
