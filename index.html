<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL OS - Core Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #05080a;
            color: #ffb000; /* Amber aesthetic */
            font-family: "Courier New", Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 15px;
            overflow: hidden;
        }
        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.3;
        }
        .line-info { color: #ffb000; }
        .line-sys { color: #00bfff; }
        .line-err { color: #ff4500; }
        .line-cmd { color: #ffffff; }
        
        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid #332200;
            padding-top: 8px;
        }
        #prompt {
            color: #ffb000;
            margin-right: 8px;
            font-weight: bold;
        }
        #command-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }
    </style>
</head>
<body>

    <div id="output">=== ORBITAL OS CORE TESTBED ===
Type 'help' for available terminal commands.
</div>

    <div id="input-line">
        <span id="prompt">[slot_01]> Command:</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        // Game State Core Engine
        const GameState = {
            activeSlot: "slot_01",
            data: {
                saveName: "slot_01",
                timestamp: null,
                vessel: {
                    name: "Probe-Alpha",
                    mass_kg: 1200,
                    altitude_m: 375000, // Low Furra Orbit
                    velocity_ms: 2450
                }
            }
        };

        const outputEl = document.getElementById("output");
        const promptEl = document.getElementById("prompt");
        const inputEl = document.getElementById("command-input");

        function print(text, type = "info") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function updatePrompt() {
            promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
        }

        // Save Engine
        function saveGame(slotName) {
            const targetSlot = slotName || GameState.activeSlot;
            GameState.activeSlot = targetSlot;
            GameState.data.saveName = targetSlot;
            GameState.data.timestamp = new Date().toISOString();
            
            localStorage.setItem(`orbital_save_${targetSlot}`, JSON.stringify(GameState.data));
            updatePrompt();
            print(`[SYS] Telemetry saved to slot '${targetSlot}'.`, "sys");
        }

        function loadGame(slotName) {
            const targetSlot = slotName || GameState.activeSlot;
            const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
            
            if (!rawData) {
                print(`[ERR] Save slot '${targetSlot}' not found.`, "err");
                return;
            }

            GameState.data = JSON.parse(rawData);
            GameState.activeSlot = targetSlot;
            updatePrompt();
            print(`[SYS] Telemetry loaded from slot '${targetSlot}'.`, "sys");
            print(`[DATA] Vessel: ${GameState.data.vessel.name} | Mass: ${GameState.data.vessel.mass_kg}kg | Alt: ${GameState.data.vessel.altitude_m}m`, "info");
        }

        function listSaves() {
            print("[SYS] Searching local state memory...", "sys");
            let found = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    const slot = key.replace("orbital_save_", "");
                    print(`  - Slot: ${slot}`, "info");
                    found++;
                }
            }
            if (found === 0) print("  No saves found.", "err");
        }

        // Command Parser
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const input = inputEl.value.trim();
                if (!input) return;

                print(`[${GameState.activeSlot}]> ${input}`, "cmd");
                inputEl.value = "";

                const parts = input.split(" ");
                const cmd = parts[0].toLowerCase();
                const arg = parts[1];

                switch (cmd) {
                    case "help":
                        print("Available commands:");
                        print("  status            - Output current vessel state");
                        print("  save [slot_name]  - Save current state");
                        print("  load [slot_name]  - Load state from slot");
                        print("  saves             - List all existing save files");
                        print("  clear             - Clear terminal screen");
                        break;

                    case "status":
                        print(`Vessel: ${GameState.data.vessel.name}`, "info");
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`, "info");
                        print(`Altitude: ${GameState.data.vessel.altitude_m} m`, "info");
                        print(`Velocity: ${GameState.data.vessel.velocity_ms} m/s`, "info");
                        break;

                    case "save":
                        saveGame(arg);
                        break;

                    case "load":
                        loadGame(arg);
                        break;

                    case "saves":
                        listSaves();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' for commands.`, "err");
                        break;
                }
            }
        });

        updatePrompt();
    </script>
</body>
</html>
