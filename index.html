<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL OS - CRT TERMINAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #080500;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.65) 50%
            );
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 9;
            opacity: 0.85;
        }

        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.15;
            font-size: 0.92rem;
        }

        .line-amber, .line-title, #prompt, #command-input {
            color: #ffb000;
            text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
        }

        .line-amber, .line-title {
            animation: generate-scan 0.08s ease-out forwards;
        }

        @keyframes generate-scan {
            0% {
                background-color: rgba(255, 176, 0, 0.12);
                color: #ffca42;
                text-shadow: 0 0 3px rgba(255, 176, 0, 0.6);
            }
            100% {
                background-color: transparent;
                color: #ffb000;
                text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
            }
        }

        .line-title { 
            font-weight: bold; 
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 176, 0, 0.4);
            padding-top: 8px;
        }
        #prompt {
            margin-right: 8px;
            font-weight: bold;
        }
        #command-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }

        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: rgba(255, 176, 0, 0.6);
        }
        #output::-webkit-scrollbar-track {
            background: #080500;
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">Command:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        let GameState = {
            activeSlot: "default_save",
            data: {
                user: { name: "Operator", password: "" },
                saveName: "default_save",
                timestamp: null,
                vessel: { name: "Probe-Alpha", mass_kg: 1200, altitude_m: 375000, velocity_ms: 2450 }
            }
        };

        let currentMode = "MAIN_MENU"; 
        let isExecutingProgram = false;
        let inRDModule = false;
        let tempName = "";
        let pendingLoadSlot = "";
        let scrollY = 0;

        const techMatrix = [
            {
                tier: 0,
                tierName: "TIER 0: FOUNDATION TECH",
                status: "fully_researched", // "fully_researched", "half_researched", or "locked"
                categories: [
                    { cat: "Probes", name: "Sounding Rocket Payloads", status: "fully_researched" },
                    { cat: "Computers", name: "Mechanical Relays", status: "fully_researched" },
                    { cat: "Lifting Bodies", name: "Sounding Rockets", status: "fully_researched" },
                    { cat: "Fuels", name: "Solid Propellants", status: "fully_researched" }
                ]
            },
            {
                tier: 1,
                tierName: "TIER 1: DIGITAL ARRAYS",
                status: "half_researched",
                categories: [
                    { cat: "Probes", name: "Orbital Satellites", status: "half_researched" },
                    { cat: "Computers", name: "Analog Guidance", status: "half_researched" },
                    { cat: "Fuels", name: "Refined RP-1 / LOX", status: "half_researched" },
                    { cat: "Comms", name: "Yagi Antennas", status: "half_researched" }
                ]
            },
            {
                tier: 2,
                tierName: "TIER 2: DEEP SPACE DATA",
                status: "locked",
                categories: [
                    { cat: "Probes", name: "Deep Space Probes", status: "locked" },
                    { cat: "Power", name: "Solar Array Mk-I", status: "locked" },
                    { cat: "Science", name: "Magnetometer Booms", status: "locked" }
                ]
            }
        ];

        const outputEl = document.getElementById("output");
        const promptEl = document.getElementById("prompt");
        const inputEl = document.getElementById("command-input");

        function print(text, type = "amber") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function updatePrompt() {
            if (inRDModule) {
                promptEl.textContent = `[DIGITAL TREE // W/S: Scroll | exit: Back]> `;
                return;
            }
            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
        }

        function showTitle() {
            print("╔══════════════════════════════════════════════════╗", "title");
            print("║                   ORBITAL OS                     ║", "title");
            print("║             FRUTIGER DIGITAL TERMINAL            ║", "title");
            print("╚══════════════════════════════════════════════════╝", "title");
            print("");
        }

        function printProgramTree() {
            print("ORBITAL OS // SYSTEM DIRECTORY", "title");
            print("└── System Programs");
            print("    ├── VAB");
            print("    ├── Hangars");
            print("    ├── R&D");
            print("    ├── Astronaut Complex");
            print("    ├── Contractors");
            print("    ├── Flight");
            print("    └── DSN");
            print("");
        }

        function printMainMenuHelp() {
            print("System offline. Available commands:");
            print("  new             - Create a new profile and start game");
            print("  load            - View save files and login");
            print("  saves           - List available save files");
            print("  clear           - Clear terminal buffer");
        }

        function printLoggedInHelp() {
            print("Session Active. Available commands:");
            print("  run [program]   - Execute system program (e.g. 'run r&d')");
            print("  programs        - Display system program tree");
            print("  status          - Display vessel parameters");
            print("  save            - Save current progress");
            print("  logout          - Exit current session");
            print("  clear           - Clear terminal buffer");
        }

        function bootTerminal() {
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            inRDModule = false;
            updatePrompt();
            printMainMenuHelp();
        }

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        // Pseudo-random number generator based on save name seed
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // PROCEDURAL DIGITAL TREE GENERATOR (FRUTIGER AERO DIGITAL-ORGANIC STYLE)
        function generateDigitalTree() {
            const lines = [];
            const width = 76;
            const center = Math.floor(width / 2);
            let seed = 0;

            for (let i = 0; i < GameState.activeSlot.length; i++) {
                seed += GameState.activeSlot.charCodeAt(i);
            }

            // Top canopy buffer
            lines.push(" ".repeat(center - 10) + "░▒▓ DIGITAL CANOPY MATRIX ▓▒░");
            lines.push("");

            // Loop through tiers from top down (Tier 2 -> Tier 1 -> Tier 0 Sapling Base)
            for (let t = techMatrix.length - 1; t >= 0; t--) {
                const tier = techMatrix[t];
                const isFull = tier.status === "fully_researched";
                const isHalf = tier.status === "half_researched";

                // Line characters based on research state
                // Double lines for fully researched (ASCII 200-216 range)
                // Single lines for half researched (ASCII 193-197 range)
                const vLine = isFull ? "║" : (isHalf ? "│" : "┆");
                const hLine = isFull ? "═" : (isHalf ? "─" : "┄");
                const lJunc = isFull ? "╠" : (isHalf ? "├" : "├");
                const rJunc = isFull ? "╣" : (isHalf ? "┤" : "┤");
                const tCross = isFull ? "╬" : (isHalf ? "┼" : "┼");

                // Render Tier Label Box
                const labelStr = `[ ${tier.tierName} ]`;
                const sideBarLen = Math.floor((width - labelStr.length - 2) / 2);
                
                let topBorder = (isFull ? "╔" : "┌") + (isFull ? "═" : "─").repeat(labelStr.length) + (isFull ? "╗" : "┐");
                let midBorder = labelStr;
                let botBorder = (isFull ? "╚" : "└") + (isFull ? "═" : "─").repeat(labelStr.length) + (isFull ? "╝" : "┘");

                lines.push(" ".repeat(center - Math.floor(labelStr.length / 2) - 1) + topBorder);
                lines.push(" ".repeat(center - Math.floor(labelStr.length / 2) - 1) + midBorder);
                lines.push(" ".repeat(center - Math.floor(labelStr.length / 2) - 1) + botBorder);

                // Generate random digital branches and foliage layer for categories
                tier.categories.forEach((cat, idx) => {
                    let lineBuffer = Array(width).fill(" ");
                    lineBuffer[center] = vLine;

                    const dir = (idx % 2 === 0) ? -1 : 1; // Alternate branch direction
                    const bLen = Math.floor(seededRandom(seed++) * 14) + 8;
                    const cFull = cat.status === "fully_researched";
                    const cHalf = cat.status === "half_researched";

                    const bH = cFull ? "═" : (cHalf ? "─" : "┄");
                    const bCorner = dir === -1 ? (cFull ? "╔" : "┌") : (cFull ? "╗" : "┐");

                    lineBuffer[center] = cFull ? tCross : (cHalf ? "┼" : "┊");

                    // Draw procedural branch horizontally
                    for (let b = 1; b <= bLen; b++) {
                        const pos = center + (dir * b);
                        if (pos > 0 && pos < width) {
                            lineBuffer[pos] = bH;
                        }
                    }

                    // Attach category label at tip
                    const tipPos = center + (dir * (bLen + 1));
                    const catText = `[${cat.cat}: ${cat.name}]`;

                    if (dir === -1) {
                        const start = Math.max(0, tipPos - catText.length);
                        for (let k = 0; k < catText.length; k++) {
                            if (start + k < width) lineBuffer[start + k] = catText[k];
                        }
                    } else {
                        for (let k = 0; k < catText.length; k++) {
                            if (tipPos + k < width) lineBuffer[tipPos + k] = catText[k];
                        }
                    }

                    // Procedurally scatter leaves over branches (176-178 density gradient: ░, ▒, ▓)
                    for (let l = 1; l <= bLen + 4; l++) {
                        const leafPos = center + (dir * l);
                        if (leafPos > 0 && leafPos < width && lineBuffer[leafPos] === " ") {
                            const leafRand = seededRandom(seed++);
                            if (leafRand > 0.4) {
                                // Density decreases from inside out
                                const distRatio = l / (bLen + 4);
                                const leafChar = distRatio < 0.3 ? "▓" : (distRatio < 0.7 ? "▒" : "░");
                                lineBuffer[leafPos] = leafChar;
                            }
                        }
                    }

                    lines.push(lineBuffer.join(""));
                    
                    // Vertical trunk segment between branches
                    let connectorBuffer = Array(width).fill(" ");
                    connectorBuffer[center] = vLine;
                    
                    // Add ambient leaf floaters around trunk
                    if (seededRandom(seed++) > 0.5 && center - 2 > 0) connectorBuffer[center - 2] = "░";
                    if (seededRandom(seed++) > 0.5 && center + 2 < width) connectorBuffer[center + 2] = "░";

                    lines.push(connectorBuffer.join(""));
                });
            }

            // TIER 0 BASE / SAPLING ROOT
            // Features 186 (║), 182 (╢), and 176 (░) leaf elements
            lines.push(" ".repeat(center - 2) + "░ ╢ ░");
            lines.push(" ".repeat(center - 1) + "░║░");
            lines.push(" ".repeat(center - 1) + " ║ ");
            lines.push(" ".repeat(center - 1) + " ║ ");
            lines.push(" ".repeat(center - 6) + "═══╩═══╩═══");
            lines.push(" ".repeat(center - 9) + "[ TIER 0: SAPLING ROOT ]");

            return lines;
        }

        async function runRDProgram() {
            isExecutingProgram = true;
            inputEl.disabled = true;
            outputEl.innerHTML = "";

            const bootLogs = [
                "[SYS] INITIALIZING EXECUTABLE: R&D.PMCS...",
                "[SYS] GENERATING PROCEDURAL DIGITAL TREE MATRIX...",
                "[SYS] RENDERING FRUTIGER FOLIAGE ARRAYS...",
                "[SYS] EXECUTION OK."
            ];

            for (const log of bootLogs) {
                print(log);
                await new Promise(r => setTimeout(r, 20));
            }
            print("");

            isExecutingProgram = false;
            inRDModule = true;
            inputEl.disabled = false;
            inputEl.focus();
            
            scrollY = 0;
            renderRDView();
        }

        function renderRDView() {
            outputEl.innerHTML = "";
            print("================================================================================", "title");
            print("           RESEARCH & DEVELOPMENT // DIGITAL TREE (FRUTIGER AERO V0.9)          ", "title");
            print("================================================================================", "title");
            print("  NAVIGATION: Press [W] to scroll Up | [S] to scroll Down | Type 'exit' to quit");
            print("  STRUCTURE:  ═══ Double (Researched) | ─── Single (In-Progress) | ░▒▓ Leaves");
            print("--------------------------------------------------------------------------------");

            const fullTreeLines = generateDigitalTree();
            const viewportSize = 18;

            // Clamp scroll offset
            const maxScroll = Math.max(0, fullTreeLines.length - viewportSize);
            if (scrollY < 0) scrollY = 0;
            if (scrollY > maxScroll) scrollY = maxScroll;

            const visibleLines = fullTreeLines.slice(scrollY, scrollY + viewportSize);
            visibleLines.forEach(line => print(line));

            print("--------------------------------------------------------------------------------");
            print(`  VIEWPORT: Lines ${scrollY} - ${Math.min(scrollY + viewportSize, fullTreeLines.length)} of ${fullTreeLines.length} | Unique Seed: [${GameState.activeSlot}]`, "title");
            print("================================================================================", "title");
            updatePrompt();
        }

        function processCommand(input) {
            if (isExecutingProgram) return;

            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${input}`, "amber");
            }

            if (inRDModule) {
                if (input.toLowerCase() === "exit") {
                    inRDModule = false;
                    outputEl.innerHTML = "";
                    print("[SYS] R&D Module Terminated.");
                    print("");
                    printLoggedInHelp();
                    updatePrompt();
                    return;
                }
                if (input.toLowerCase() === "w") {
                    scrollY -= 2;
                    renderRDView();
                    return;
                }
                if (input.toLowerCase() === "s") {
                    scrollY += 2;
                    renderRDView();
                    return;
                }
                print(`[SYS] Navigation active. Press 'W' (Up), 'S' (Down), or type 'exit'.`);
                return;
            }

            if (currentMode === "NEW_NAME") {
                if (!input) return;
                tempName = input;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "NEW_PASS") {
                if (!input) return;
                const password = input;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                outputEl.innerHTML = "";
                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' initialized.`);
                print(`[SYS] Access ID locked: [${slotName}]`);
                print("");
                printProgramTree();
                printLoggedInHelp();
                return;
            }

            if (currentMode === "LOAD_SELECT") {
                if (!input) return;
                const targetSlot = input.toLowerCase().replace(/\s+/g, '_');

                if (input.toLowerCase() === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${input}' not found.`);
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "LOAD_PASS") {
                if (!input) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === input) {
                    GameState.data = parsedData;
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    
                    outputEl.innerHTML = "";
                    updatePrompt();
                    
                    print(`[SYS] Access granted for profile '${GameState.data.user.name}'.`);
                    print("");
                    printProgramTree();
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Incorrect password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            const parts = input.split(" ");
            const cmd = parts[0].toLowerCase();
            const subCmd = parts[1] ? parts[1].toLowerCase() : "";

            if (currentMode === "LOGGED_IN") {
                if ((cmd === "run" && subCmd === "r&d") || cmd === "r&d") {
                    runRDProgram();
                    return;
                }

                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "programs":
                    case "dir":
                        printProgramTree();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Telemetry saved to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        GameState.activeSlot = "default_save";
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' or 'run r&d'.`);
                        break;
                }
                return;
            }

            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Scanning local memory...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const loadSaves = getSaveList();
                        if (loadSaves.length === 0) {
                            print("[ERR] No save files present in memory.");
                            return;
                        }

                        print("[SYS] Open Save Files:");
                        loadSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'.`);
                        break;
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (isExecutingProgram) return;

            // Direct W/S scroll handling when inside R&D Module
            if (inRDModule) {
                const key = e.key.toUpperCase();
                if (key === "W") {
                    scrollY -= 2;
                    renderRDView();
                } else if (key === "S") {
                    scrollY += 2;
                    renderRDView();
                }
            }

            if (e.key === "Enter") {
                const input = inputEl.value.trim();
                inputEl.value = "";
                processCommand(input);
            }
        });

        bootTerminal();
    </script>
</body>
</html>
