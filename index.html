// === [ 1. AUTH SYSTEM ] ===
window.AuthSystem={isAuthenticated:!1,validUser:"DIRECTOR",validPass:"TIER0",attemptLogin:function(){const e=document.getElementById("user-input").value.toUpperCase().trim(),t=document.getElementById("pass-input").value.toUpperCase().trim();if(e===this.validUser&&t===this.validPass){this.isAuthenticated=!0;document.getElementById("boot-screen").style.display="none";document.getElementById("terminal-screen").style.display="flex";Terminal.log("\n[AUTH SUCCESS] WELCOME TO ORBITAL.\nType 'HELP' for commands.");Terminal.iF.focus()}else{Terminal.clearInputs();document.getElementById("user-input").placeholder="ERR: INVALID CREDENTIALS";setTimeout(()=>document.getElementById("user-input").placeholder="",2000)}}};

// === [ 2. MAP ENGINE: STATE & DATA ] ===
window.MapEngine={c:document.getElementById("webgl-container"),u:document.getElementById("ui-canvas"),cx:null,sc:null,ca:null,re:null,co:null,run:!1,sT:0,lT:0,tS:1,eA:!1,eR:0,eO:1,aT:null,lP:null,US:0.001,sys:{name:"OSIRIS",radius:12.6,axialTilt:0,desc_astro:"CLASS: STELLAR BLACK HOLE\nHORIZON REGION: 72 KM (ISCO)\nDISC MESH: VOLUMETRIC TOROIDAL",discs:[{name:"ACCRETION DISC",start:72,end:16000000}],bodies:[{name:"FURRA",a:271000000,e:0.0167,inc:0.0,lan:0.0,argp:0.0,radius:5796,period:48384000,rotationPeriod:115200,axialTilt:14.32,desc_astro:"CLASS: HABITABLE TERRESTRIAL\nLIGHT MATRIX: PARALLAX TERMINATOR SHADER\nLANDMASS PROFILE: CONTINUOUS FRACTAL ISLAND",rings:[{name:"RING A",start:8296,end:8896},{name:"RING B",start:8996,end:9896},{name:"RING C",start:9996,end:10896},{name:"RING D",start:12396,end:13096},{name:"RING E",start:13196,end:13716}],bodies:[{name:"HARMONY",a:11796,e:0.001,inc:0.0,lan:0.0,argp:0.0,radius:21,period:14004,rotationPeriod:14004,desc_astro:"CLASS: SHEPHERD MOON\nREGION: C / D RING SEGMENT GAP"},{name:"KIITOS",a:340000,e:0.05,inc:0.0,lan:0.0,argp:90.0,radius:1876,period:2171520,rotationPeriod:2171520,desc_astro:"CLASS: MAJOR LUNAR BODY\nTIDALLY LOCKED"}]}]}};

// === [ 3. MAP ENGINE: INIT & MATH ] ===
MapEngine.init=function(){this.cx=this.u.getContext("2d");this.sc=new THREE.Scene();const a=window.innerWidth/(window.innerHeight-50);this.ca=new THREE.PerspectiveCamera(45,a,0.0001,1e9);this.re=new THREE.WebGLRenderer({alpha:!0,antialias:!0,logarithmicDepthBuffer:!0});this.re.setSize(window.innerWidth,window.innerHeight-50);this.c.appendChild(this.re.domElement);this.co=new THREE.OrbitControls(this.ca,this.re.domElement);this.co.enableDamping=!0;this.co.dampingFactor=0.05;this.co.maxDistance=1e7;this.bld();window.addEventListener("resize",()=>this.rsz());};
MapEngine.sK=function(M,e){let E=M;for(let i=0;i<5;i++)E=E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));return E;};
MapEngine.gTA=function(E,e){return 2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2),Math.sqrt(1-e)*Math.cos(E/2));};

// === [ 4. MAP ENGINE: PROCEDURAL SHADERS ] ===
MapEngine.gFC=function(p,it,rg){let cP=[...p];for(let i=0;i<it;i++){let nP=[],cR=rg/Math.pow(1.5,i);for(let j=0;j<cP.length;j++){let p1=cP[j],p2=cP[(j+1)%cP.length],mX=(p1.x+p2.x)/2,mY=(p1.y+p2.y)/2,dx=p2.x-p1.x,dy=p2.y-p1.y,l=Math.sqrt(dx*dx+dy*dy),nx=-dy/l,ny=dx/l,o=(Math.sin(mX*0.03)*Math.cos(mY*0.03))*cR*l;nP.push(p1,{x:mX+nx*o,y:mY+ny*o});}cP=nP;}return cP;};
MapEngine.cBM=function(b,p,iS=!1){const sR=b.radius*this.US,g=new THREE.SphereGeometry(sR,128,128);let cM;if(b.name==="FURRA"){const cv=document.createElement('canvas');cv.width=4096;cv.height=2048;const cx=cv.getContext('2d');cx.fillStyle="rgba(4,10,12,1)";cx.fillRect(0,0,4096,2048);cx.fillStyle="rgba(255,176,0,0.35)";cx.strokeStyle="rgba(255,176,0,0.95)";cx.lineWidth=12;let bP=[];for(let i=0;i<16;i++){let a=(i/16)*Math.PI*2,rv=140*(0.8+Math.sin(a*4)*0.25+Math.cos(a*2)*0.1);bP.push({x:2048+Math.cos(a)*rv,y:1024+Math.sin(a)*rv});}let cs=this.gFC(bP,7,0.55);cx.beginPath();cx.moveTo(cs[0].x,cs[0].y);for(let i=1;i<cs.length;i++)cx.lineTo(cs[i].x,cs[i].y);cx.closePath();cx.fill();cx.stroke();const t=new THREE.CanvasTexture(cv);t.anisotropy=16;t.generateMipmaps=!0;cM=new THREE.ShaderMaterial({uniforms:{uSurfaceTex:{value:t}},transparent:!1,depthWrite:!0,side:THREE.FrontSide,vertexShader:`#include <common>\n#include <logdepthbuf_pars_vertex>\nvarying vec3 vN;varying vec3 vWP;varying vec2 vU;void main(){vU=uv;vN=normalize(vec3(modelMatrix*vec4(normal,0.0)));vec4 wP=modelMatrix*vec4(position,1.0);vWP=wP.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);\n#include <logdepthbuf_vertex>\n}`,fragmentShader:`#include <common>\n#include <logdepthbuf_pars_fragment>\nuniform sampler2D uSurfaceTex;varying vec3 vN;varying vec3 vWP;varying vec2 vU;void main(){vec3 n=normalize(vN),l=normalize(-vWP);float d=dot(n,l),t=smoothstep(-0.06,0.06,d);vec4 c=texture2D(uSurfaceTex,vU);gl_FragColor=vec4(mix(c.rgb*0.02,c.rgb,t),1.0);\n#include <logdepthbuf_fragment>\n}`});}else{cM=new THREE.MeshBasicMaterial({color:0x160B00,depthWrite:!0});cM.polygonOffset=!0;cM.polygonOffsetFactor=1;cM.polygonOffsetUnits=1;}const cMe=new THREE.Mesh(g,cM);if(!iS&&b.name!=="FURRA")cMe.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffb000,wireframe:!0,transparent:!0,opacity:0.5,depthWrite:!1})));const pv=new THREE.Group(),iG=new THREE.Group(),aG=new THREE.Group(),tG=new THREE.Group(),eG=new THREE.Group();if(!iS){pv.rotation.y=THREE.MathUtils.degToRad(b.lan);iG.rotation.x=THREE.MathUtils.degToRad(b.inc);aG.rotation.y=THREE.MathUtils.degToRad(b.argp);const pt=[];for(let i=0;i<=256;i++){let th=(i/256)*Math.PI*2,r=(b.a*(1-Math.pow(b.e,2)))/(1+b.e*Math.cos(th));pt.push(new THREE.Vector3(Math.cos(th)*r*this.US,0,Math.sin(th)*r*this.US));}aG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pt),new THREE.LineBasicMaterial({color:0xffb000,transparent:!0,opacity:0.2,depthWrite:!1})));}eG.rotation.x=THREE.MathUtils.degToRad(b.axialTilt||0);if(b.name==="FURRA"){const aM=new THREE.ShaderMaterial({blending:THREE.AdditiveBlending,side:THREE.BackSide,transparent:!0,depthWrite:!1,vertexShader:`#include <common>\n#include <logdepthbuf_pars_vertex>\nvarying vec3 vN;varying vec3 vV;void main(){vN=normalize(normalMatrix*normal);vec4 m=modelViewMatrix*vec4(position,1.0);vV=-m.xyz;gl_Position=projectionMatrix*m;\n#include <logdepthbuf_vertex>\n}`,fragmentShader:`#include <common>\n#include <logdepthbuf_pars_fragment>\nvarying vec3 vN;varying vec3 vV;void main(){float i=pow(max(0.0,0.72-dot(normalize(vN),normalize(vV))),2.8);gl_FragColor=vec4(1.0,0.69,0.0,smoothstep(0.0,0.45,i)*0.42);\n#include <logdepthbuf_fragment>\n}`});eG.add(new THREE.Mesh(new THREE.SphereGeometry((b.radius+95)*this.US,128,128),aM));}if(b.discs)b.discs.forEach(d=>{const lP=[];let iR=d.start*this.US,oR=d.end*this.US;for(let i=0;i<=64;i++){let t=i/64,r=iR+t*t*(oR-iR);lP.push(new THREE.Vector2(r,t*t*(oR*0.12)));}for(let i=64;i>=0;i--){let t=i/64,r=iR+t*t*(oR-iR);lP.push(new THREE.Vector2(r,-t*t*(oR*0.12)));}const dG=new THREE.LatheGeometry(lP,128),dM=new THREE.Mesh(dG,new THREE.MeshBasicMaterial({color:0xffb000,transparent:!0,opacity:0.22,side:THREE.DoubleSide,depthWrite:!1}));dM.add(new THREE.Mesh(dG,new THREE.MeshBasicMaterial({color:0xffb000,transparent:!0,opacity:0.04,wireframe:!0,depthWrite:!1})));eG.add(dM);});if(b.rings)b.rings.forEach(r=>{let iR=r.start*this.US,oR=r.end*this.US;const r // === [ 5. MAP ENGINE: BUILDER & CAMERA ] ===
MapEngine.bld=function(){this.sys.g=new THREE.Group();this.sc.add(this.sys.g);this.cBM(this.sys,this.sys.g,!0);this.sys.bodies.forEach(p=>{this.cBM(p,this.sys.g);p.bodies.forEach(m=>this.cBM(m,p.eG));});};
MapEngine.sTBN=function(n){let t=null;if(n==="OSIRIS")t=this.sys;else{for(let p of this.sys.bodies){if(p.name===n)t=p;if(p.bodies){for(let m of p.bodies)if(m.name===n)t=m;}}}if(t){this.aT=t;const P=new THREE.Vector3();t.m.getWorldPosition(P);const O=(t.radius*this.US)*4;this.ca.position.copy(P).add(new THREE.Vector3(0,O*0.5,O*1.2));this.co.target.copy(P);this.co.minDistance=(t.radius*this.US)*1.005;this.lP=P.clone();return!0;}return!1;};
MapEngine.rsz=function(){const w=window.innerWidth,h=window.innerHeight-50;this.u.width=w;this.u.height=h;if(this.ca){this.ca.aspect=w/h;this.ca.updateProjectionMatrix();this.re.setSize(w,h);}};

// === [ 6. MAP ENGINE: CHRONO & LOOP ] ===
MapEngine.eTW=function(y,d,h,m,s,sp="MEDIUM"){const t=(y*31536000)+(d*86400)+(h*3600)+(m*60)+s;let r=30;if(sp==="FAST")r=15;if(sp==="SLOW")r=60;if(t<=r)return!1;this.eO=this.tS;this.eR=t;this.eA=!0;this.tS=t/r;return!0;};
MapEngine.sTW=function(){if(!this.eA)return;this.eA=!1;this.eR=0;this.tS=this.eO;};
MapEngine.start=function(){this.run=!0;this.lT=Date.now();this.c.style.display="block";this.u.style.display="block";document.getElementById("output-log").style.display="none";this.rsz();this.loop();};
MapEngine.stop=function(){this.run=!1;this.aT=null;this.sTW();this.c.style.display="none";this.u.style.display="none";document.getElementById("output-log").style.display="block";};
MapEngine.loop=function(){if(!this.run)return;this.upd();this.re.render(this.sc,this.ca);this.dUI();requestAnimationFrame(()=>this.loop());};
MapEngine.upd=function(){const n=Date.now();if(!this.lT)this.lT=n;const dt=(n-this.lT)/1000;this.lT=n;let dS=dt*this.tS;if(this.eA){if(this.eR<=dS){dS=this.eR;this.sTW();Terminal.log("\n[CHRONO CODES COMPLETE] WARP TARGET RANGE ACHIEVED.");}else this.eR-=dS;}this.sT+=dS;const pO=(b)=>{if(b.period){const M=((2*Math.PI)/b.period)*this.sT,th=this.gTA(this.sK(M,b.e),b.e),r=(b.a*(1-Math.pow(b.e,2)))/(1+b.e*Math.cos(th));b.tG.position.x=r*Math.cos(th)*this.US;b.tG.position.z=r*Math.sin(th)*this.US;}if(b.rotationPeriod&&b.m)b.m.rotation.y=((2*Math.PI)/b.rotationPeriod)*this.sT;};this.sys.bodies.forEach(p=>{pO(p);if(p.bodies)p.bodies.forEach(m=>pO(m));});if(this.aT&&this.aT.m){const cP=new THREE.Vector3();this.aT.m.getWorldPosition(cP);if(this.lP)this.ca.position.add(cP.clone().sub(this.lP));this.co.target.copy(cP);this.lP=cP.clone();}this.co.update();};
MapEngine.dUI=function(){this.cx.clearRect(0,0,this.u.width,this.u.height);this.cx.fillStyle="#ffb000";this.cx.font="14px 'Courier New'";this.cx.fillText(`CHRONO ENGINE: ${this.tS.toLocaleString()}X SYSTEM VELOCITY`,10,20);this.cx.fillText(`OSIRIS MASS MODEL: ACTIVE ACCRETION VECTOR MATRIX`,10,40);if(this.eA){let tR=Math.ceil(this.eR),y=Math.floor(tR/31536000),d=Math.floor((tR%31536000)/86400),h=Math.floor((tR%86400)/3600),m=Math.floor((tR%3600)/60),s=tR%60;let dS=`WARPING TIME CORE: T-MINUS [ ${String(y).padStart(4,'0')}Y : ${String(d).padStart(3,'0')}D : ${String(h).padStart(2,'0')}H : ${String(m).padStart(2,'0')}M : ${String(s).padStart(2,'0')}S ]`;this.cx.font="bold 16px 'Courier New'";let sW=this.cx.measureText(dS).width,dX=(this.u.width-sW)/2,dY=this.u.height/2;this.cx.fillStyle="rgba(10,5,0,0.85)";this.cx.fillRect(dX-20,dY-30,sW+40,50);this.cx.strokeStyle="#ffb000";this.cx.strokeRect(dX-20,dY-30,sW+40,50);this.cx.fillStyle="#ffb000";this.cx.fillText(dS,dX,dY);this.cx.font="10px 'Courier New'";this.cx.fillText("PRESS [ENTER] TO EMERGENCY STOP",dX+15,dY+12);}if(this.aT){let iA=this.aT.name==="OSIRIS",bW=360,sX=this.u.width-(bW+10),tX=sX+10,aL=this.aT.desc_astro.split('\n'),bY=100+(aL.length*20);if(!iA)bY+=130;let bH=bY+20;this.cx.fillStyle="rgba(10,5,0,0.9)";this.cx.fillRect(sX,10,bW,bH);this.cx.strokeStyle="#ffb000";this.cx.strokeRect(sX,10,bW,bH);this.cx.fillStyle="#ffb000";this.cx.font="bold 16px 'Courier New'";this.cx.fillText(`TARGET: ${this.aT.name}`,tX,30);this.cx.beginPath();this.cx.moveTo(sX,40);this.cx.lineTo(sX+bW,40);this.cx.stroke();this.cx.font="bold 12px 'Courier New'";this.cx.fillText(`[ VISUAL MANIFEST ]`,tX,60);this.cx.font="12px 'Courier New'";this.cx.fillText(`RADIUS:  ${this.aT.radius.toLocaleString()} KM`,tX,80);for(let i=0;i<aL.length;i++)this.cx.fillText(aL[i],tX,100+(i*20));if(!iA){let cY=bY-130;this.cx.font="bold 12px 'Courier New'";this.cx.fillText(`[ TELEMETRY ]`,tX,cY);this.cx.font="12px 'Courier New'";this.cx.fillText(`SMA (a):  ${this.aT.a.toLocaleString()} KM`,tX,cY+20);this.cx.fillText(`ECC (e):  ${this.aT.e}`,tX,cY+40);this.cx.fillText(`INC (i):  ${this.aT.inc.toFixed(2)}°`,tX,cY+60);this.cx.fillText(`LAN (Ω):  ${this.aT.lan.toFixed(2)}°`,tX,cY+80);}}};

// === [ 7. VAB ENGINE: INIT & RENDER ] ===
window.VabEngine={c:document.getElementById("vab-webgl-container"),u:document.getElementById("vab-ui"),sc:null,ca:null,re:null,co:null,m:null,hG:null,fG:null,run:!1,p:{h:10,rt:2,rb:2,f:!1,sy:1},rc:new THREE.Raycaster(),mv:new THREE.Vector2(),gA:null,lX:0,lY:0};
VabEngine.init=function(){if(this.re)return;this.sc=new THREE.Scene();this.ca=new THREE.PerspectiveCamera(45,window.innerWidth/(window.innerHeight-50),0.1,1000);this.ca.position.set(0,10,40);this.re=new THREE.WebGLRenderer({alpha:!0,antialias:!0});this.re.setSize(window.innerWidth,window.innerHeight-50);this.c.appendChild(this.re.domElement);this.co=new THREE.OrbitControls(this.ca,this.re.domElement);this.co.enableDamping=!0;this.co.dampingFactor=0.05;this.co.target.set(0,5,0);let g=new THREE.GridHelper(50,50,0xffb000,0xffb000);g.material.opacity=0.15;g.material.transparent=!0;this.sc.add(g);
this.bld();
window.addEventListener("resize",()=>{if(!this.run)return;this.ca.aspect=window.innerWidth/(window.innerHeight-50);this.ca.updateProjectionMatrix();this.re.setSize(window.innerWidth,window.innerHeight-50);});
let D=this.re.domElement;D.addEventListener("pointerdown",e=>this.pD(e));window.addEventListener("pointermove",e=>this.pM(e));window.addEventListener("pointerup",()=>this.pU());};

// === [ 8. VAB ENGINE: MATH, MESH & GIZMOS ] ===
