<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL OS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #05080a;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
        }

        /* Full Window Terminal Container */
        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 15px;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.3;
        }

        .line-info { color: #ffb000; }
        .line-sys { color: #00bfff; }
        .line-err { color: #ff4500; }
        .line-cmd { color: #ffffff; }
        .line-title { color: #ffb000; font-weight: bold; }
        
        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid #332200;
            padding-top: 8px;
        }
        #prompt {
            color: #ffb000;
            margin-right: 8px;
            font-weight: bold;
        }
        #command-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">Command:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        // Game State Object
        let GameState = {
            activeSlot: null,
            data: {
                user: {
                    name: "",
                    password: ""
                },
                saveName: "",
                timestamp: null,
                vessel: {
                    name: "Probe-Alpha",
                    mass_kg: 1200,
                    altitude_m: 375000,
                    velocity_ms: 2450
                }
            }
        };

        // State machine variables for command sequences
        let currentMode = "MAIN_MENU"; // MAIN_MENU, NEW_NAME, NEW_PASS, LOGGED_IN
        let tempName = "";

        const outputEl = document.getElementById("output");
        const promptEl = document.getElementById("prompt");
        const inputEl = document.getElementById("command-input");

        function print(text, type = "info") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function updatePrompt() {
            if (currentMode === "LOGGED_IN" && GameState.activeSlot) {
                promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
            } else if (currentMode === "NEW_NAME") {
                promptEl.textContent = "Name?:";
            } else if (currentMode === "NEW_PASS") {
                promptEl.textContent = "Password?:";
            } else {
                promptEl.textContent = "Command:";
            }
        }

        function showTitle() {
            print("==================================================", "title");
            print("                   ORBITAL OS                     ", "title");
            print("               SYSTEM VERSION 0.1.0               ", "title");
            print("==================================================", "title");
            print("");
        }

        function printMainMenuHelp() {
            print("System offline. Available commands:");
            print("  new      - Create a new profile and start game");
            print("  load     - Load saved game");
            print("  saves    - List available save files");
            print("  clear    - Clear terminal buffer");
        }

        function printLoggedInHelp() {
            print("Session Active. Available commands:");
            print("  status   - Display vessel parameters and telemetry");
            print("  save     - Save current progress");
            print("  logout   - Exit current session and lock terminal");
            print("  clear    - Clear terminal buffer");
        }

        function bootTerminal() {
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            updatePrompt();
            printMainMenuHelp();
        }

        function processCommand(input) {
            // Handle masked password input visually
            if (currentMode === "NEW_PASS") {
                print("Password?: ********", "cmd");
            } else {
                print(`${promptEl.textContent} ${input}`, "cmd");
            }

            // 1. New Game Setup - Name Step
            if (currentMode === "NEW_NAME") {
                if (!input) return;
                tempName = input;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            // 2. New Game Setup - Password Step
            if (currentMode === "NEW_PASS") {
                if (!input) return;
                const password = input;
                inputEl.type = "text"; // Reset input field mask

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();

                // Save initial state
                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' initialized.`, "sys");
                print(`[SYS] Access ID locked: [${slotName}]`, "sys");
                print("");
                printLoggedInHelp();
                return;
            }

            const parts = input.split(" ");
            const cmd = parts[0].toLowerCase();
            const arg = parts[1];

            // 3. Logged In Mode Commands
            if (currentMode === "LOGGED_IN") {
                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`, "info");
                        print(`Vessel: ${GameState.data.vessel.name}`, "info");
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`, "info");
                        print(`Altitude: ${GameState.data.vessel.altitude_m} m`, "info");
                        print(`Velocity: ${GameState.data.vessel.velocity_ms} m/s`, "info");
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Telemetry saved to slot '${GameState.activeSlot}'.`, "sys");
                        break;

                    case "logout":
                        print(`[SYS] Logging out user '${GameState.data.user.name}'...`, "sys");
                        GameState.activeSlot = null;
                        GameState.data.user.name = "";
                        GameState.data.user.password = "";
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' for available options.`, "err");
                        break;
                }
                return;
            }

            // 4. Main Menu Mode Commands
            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Scanning local state memory...", "sys");
                        let count = 0;
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (key.startsWith("orbital_save_")) {
                                print(`  - ${key.replace("orbital_save_", "")}`, "info");
                                count++;
                            }
                        }
                        if (count === 0) print("  No save files found.", "err");
                        break;

                    case "load":
                        let target = arg;
                        if (!target) {
                            // Find first save if no argument provided
                            for (let i = 0; i < localStorage.length; i++) {
                                if (localStorage.key(i).startsWith("orbital_save_")) {
                                    target = localStorage.key(i).replace("orbital_save_", "");
                                    break;
                                }
                            }
                        }

                        if (!target) {
                            print("[ERR] No save file specified or found.", "err");
                            return;
                        }

                        const rawData = localStorage.getItem(`orbital_save_${target}`);
                        if (!rawData) {
                            print(`[ERR] Save slot '${target}' not found.`, "err");
                            return;
                        }

                        GameState.data = JSON.parse(rawData);
                        GameState.activeSlot = target;
                        currentMode = "LOGGED_IN";
                        updatePrompt();
                        print(`[SYS] Session loaded for profile '${GameState.data.user.name}'.`, "sys");
                        print("");
                        printLoggedInHelp();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' for available options.`, "err");
                        break;
                }
            }
        }

        // Input Listener
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const input = inputEl.value.trim();
                inputEl.value = "";
                processCommand(input);
            }
        });

        // Initialize application
        bootTerminal();
    </script>
</body>
</html>
