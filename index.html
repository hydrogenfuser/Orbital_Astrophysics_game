<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL OS - CRT TERMINAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        /* CRT Screen Base */
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #0d0900;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            position: relative;
        }

        /* Tightened High-Density CRT Scanlines (2px Pitch) */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.75) 50%
            );
            background-size: 100% 2px; /* Tighter spacing */
            pointer-events: none;
            z-index: 9;
            opacity: 0.95;
        }

        /* Full Window Terminal Container */
        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.25; /* Compact line height */
        }

        /* Base Phosphor Text Style */
        .line-amber, .line-title, #prompt, #command-input {
            color: #ffb000;
            text-shadow: 0 0 3px rgba(255, 176, 0, 0.85), 0 0 6px rgba(255, 176, 0, 0.35);
        }

        /* Scan Effect Triggered EXCLUSIVELY on Newly Generated Text Lines */
        .line-amber, .line-title {
            animation: generate-scan 0.09s ease-out forwards;
        }

        @keyframes generate-scan {
            0% {
                background-color: rgba(255, 176, 0, 0.4);
                box-shadow: 0 0 10px rgba(255, 176, 0, 0.7);
                color: #fff2b3;
                text-shadow: 0 0 12px rgba(255, 200, 80, 1);
            }
            100% {
                background-color: transparent;
                box-shadow: none;
                color: #ffb000;
                text-shadow: 0 0 3px rgba(255, 176, 0, 0.85), 0 0 6px rgba(255, 176, 0, 0.35);
            }
        }

        .line-title { 
            font-weight: bold; 
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 176, 0, 0.6);
            box-shadow: 0 -1px 4px rgba(255, 176, 0, 0.2);
            padding-top: 8px;
        }
        #prompt {
            margin-right: 8px;
            font-weight: bold;
        }
        #command-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }

        /* Custom Amber Scrollbar */
        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: #ffb000;
            box-shadow: 0 0 4px #ffb000;
        }
        #output::-webkit-scrollbar-track {
            background: #0d0900;
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">Command:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        // Game State Object
        let GameState = {
            activeSlot: null,
            data: {
                user: { name: "", password: "" },
                saveName: "",
                timestamp: null,
                vessel: { name: "Probe-Alpha", mass_kg: 1200, altitude_m: 375000, velocity_ms: 2450 }
            }
        };

        let currentMode = "MAIN_MENU"; 
        let tempName = "";
        let pendingLoadSlot = "";
        let pendingDeleteSlot = "";

        const outputEl = document.getElementById("output");
        const promptEl = document.getElementById("prompt");
        const inputEl = document.getElementById("command-input");

        // Print function triggers the line-level scan burst on output
        function print(text, type = "amber") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function updatePrompt() {
            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                case "DELETE_SELECT":
                    promptEl.textContent = "Delete Save File:";
                    break;
                case "DELETE_CONFIRM":
                    promptEl.textContent = "Are you sure? (Y/N):";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
        }

        function showTitle() {
            print("╔══════════════════════════════════════════════════╗", "title");
            print("║                   ORBITAL OS                     ║", "title");
            print("║              CRT MONITOR SYSTEM 0.1              ║", "title");
            print("╚══════════════════════════════════════════════════╝", "title");
            print("");
        }

        function printMainMenuHelp() {
            print("System offline. Available commands:");
            print("  new      - Create a new profile and start game");
            print("  load     - View save files and login");
            print("  delete   - Delete a save file");
            print("  saves    - List available save files");
            print("  clear    - Clear terminal buffer");
        }

        function printLoggedInHelp() {
            print("Session Active. Available commands:");
            print("  status   - Display vessel parameters and telemetry");
            print("  save     - Save current progress");
            print("  logout   - Exit current session and lock terminal");
            print("  clear    - Clear terminal buffer");
        }

        function bootTerminal() {
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            updatePrompt();
            printMainMenuHelp();
        }

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        function processCommand(input) {
            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${input}`, "amber");
            }

            if (currentMode === "NEW_NAME") {
                if (!input) return;
                tempName = input;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "NEW_PASS") {
                if (!input) return;
                const password = input;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' initialized.`);
                print(`[SYS] Access ID locked: [${slotName}]`);
                print("");
                printLoggedInHelp();
                return;
            }

            if (currentMode === "LOAD_SELECT") {
                if (!input) return;
                const targetSlot = input.toLowerCase().replace(/\s+/g, '_');

                if (input.toLowerCase() === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${input}' not found.`);
                    print("Enter valid save file name or type 'cancel':");
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "LOAD_PASS") {
                if (!input) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === input) {
                    GameState.data = parsedData;
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    updatePrompt();
                    print(`[SYS] Access granted. Session loaded for profile '${GameState.data.user.name}'.`);
                    print("");
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Incorrect password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            if (currentMode === "DELETE_SELECT") {
                if (!input) return;
                const targetSlot = input.toLowerCase().replace(/\s+/g, '_');

                if (input.toLowerCase() === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${input}' not found.`);
                    print("Enter valid save file name or type 'cancel':");
                    return;
                }

                pendingDeleteSlot = targetSlot;
                currentMode = "DELETE_CONFIRM";
                updatePrompt();
                return;
            }

            if (currentMode === "DELETE_CONFIRM") {
                const choice = input.toUpperCase();
                if (choice === "Y" || choice === "YES") {
                    localStorage.removeItem(`orbital_save_${pendingDeleteSlot}`);
                    print(`[SYS] Save file '${pendingDeleteSlot}' has been permanently deleted.`);
                } else if (choice === "N" || choice === "NO") {
                    print("[SYS] Deletion canceled.");
                } else {
                    print("[ERR] Invalid input. Please enter 'Y' or 'N'.");
                    return;
                }

                pendingDeleteSlot = "";
                currentMode = "MAIN_MENU";
                updatePrompt();
                print("");
                printMainMenuHelp();
                return;
            }

            const parts = input.split(" ");
            const cmd = parts[0].toLowerCase();

            if (currentMode === "LOGGED_IN") {
                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        print(`Altitude: ${GameState.data.vessel.altitude_m} m`);
                        print(`Velocity: ${GameState.data.vessel.velocity_ms} m/s`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Telemetry saved to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        print(`[SYS] Logging out user '${GameState.data.user.name}'...`);
                        GameState.activeSlot = null;
                        GameState.data.user.name = "";
                        GameState.data.user.password = "";
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' for options.`);
                        break;
                }
                return;
            }

            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Scanning local state memory...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const loadSaves = getSaveList();
                        if (loadSaves.length === 0) {
                            print("[ERR] No save files present in system memory.");
                            return;
                        }

                        print("[SYS] Open Save Files Available:");
                        loadSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "delete":
                        const deleteSaves = getSaveList();
                        if (deleteSaves.length === 0) {
                            print("[ERR] No save files present to delete.");
                            return;
                        }

                        print("[SYS] Open Save Files Available for Deletion:");
                        deleteSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "DELETE_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' for options.`);
                        break;
                }
            }
        }

        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const input = inputEl.value.trim();
                inputEl.value = "";
                processCommand(input);
            }
        });

        bootTerminal();
    </script>
</body>
</html>
