<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL v0.0.1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #080500;
            color: #ffb000;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.65) 50%
            );
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 9;
            opacity: 0.85;
        }

        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            padding: 20px;
            position: relative;
            z-index: 1;
            overflow: hidden;
            background-color: #080500;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.25;
            font-size: 0.95rem;
            position: relative;
        }

        .line-amber, .line-title, #prompt, #command-input, #controls-info {
            color: #ffb000;
            text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
        }

        .line-amber, .line-title {
            animation: generate-scan 0.08s ease-out forwards;
        }

        @keyframes generate-scan {
            0% {
                background-color: rgba(255, 176, 0, 0.12);
                color: #ffca42;
                text-shadow: 0 0 3px rgba(255, 176, 0, 0.6);
            }
            100% {
                background-color: transparent;
                color: #ffb000;
                text-shadow: 0 0 1.5px rgba(255, 176, 0, 0.4);
            }
        }

        .line-title { 
            font-weight: bold; 
        }

        .entry-title {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 2px;
        }

        .entry-version {
            font-size: 1.1rem;
            opacity: 0.85;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }

        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #080500;
            z-index: 5;
            padding: 20px;
        }

        #loading-title-container {
            white-space: pre;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.15;
            min-height: 120px;
        }

        #loading-bar-container {
            text-align: center;
            font-weight: bold;
        }

        #loading-bar-str {
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        #loading-percent {
            font-size: 1rem;
            opacity: 0.9;
        }

        #loading-corner-logs {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 0.75rem;
            opacity: 0.65;
            line-height: 1.3;
            max-width: 45%;
            pointer-events: none;
        }

        #controls-info {
            border-top: 1px solid rgba(255, 176, 0, 0.35);
            padding: 6px 0;
            font-size: 0.88rem;
            min-height: 1.6rem;
            opacity: 0.95;
            font-weight: bold;
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 176, 0, 0.5);
            padding-top: 8px;
        }

        #prompt {
            margin-right: 8px;
            font-weight: bold;
        }

        #command-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }

        #probe-canvas-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            flex: 1;
            margin-bottom: 10px;
            position: relative;
        }

        #probe-canvas {
            border: 1px solid #ffb000;
            background-color: #050300;
            box-shadow: 0 0 8px rgba(255, 176, 0, 0.2);
            width: 100%;
            height: 100%;
        }

        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-thumb {
            background: rgba(255, 176, 0, 0.6);
        }
        #output::-webkit-scrollbar-track {
            background: #080500;
        }
    </style>
</head>

            outputEl.scrollTop = outputEl.scrollHeight;

        function setControlsBar(text) {
            controlsInfoEl.textContent = text;
        }

        function updatePrompt() {
            if (inPayloadDesigner) {
                if (isRenderingCanvas) {
                    if (inPartPicker) {
                        setControlsBar("PART SELECTOR: 'A'/'D' = Prev/Next Cat | 'W'/'S' = Up/Down Item | 'E' = Install | 'Q' = Exit");
                        promptEl.textContent = `[VAB // PART SELECTOR (WASD)]> `;
                    } else {
                        setControlsBar("CONTROLS: 'add' (Parts Menu) | 'remove [item]' | 'pressurize' | 'depressurize' | 'save' | 'back' | 'terminate'");
                        promptEl.textContent = `[VAB // PROBE DESIGN CANVAS]> `;
                    }
                } else if (payloadSubMode === "LIST") {
                    setControlsBar("CONTROLS: Type 'new' to design | Number [1-N] / 'load [name]' | 'delete [name]' | 'back' | 'terminate'");
                    promptEl.textContent = `[VAB // PAYLOAD MANAGER]> `;
                } else if (payloadSubMode === "DELETE_CONFIRM") {
                    setControlsBar("CONTROLS: Type 'yes' to confirm deletion | 'no' to cancel | 'terminate' = Exit");
                    promptEl.textContent = `[VAB // CONFIRM DELETE]> `;
                } else {
                    setControlsBar("CONTROLS: Input selection/text | 'back' = Return | 'terminate' = Exit");
                    promptEl.textContent = `[VAB // PAYLOAD CONFIG (${payloadStep})]> `;
                }
                return;
            }

            if (inRDModule) {
                if (isRDNavActive) {
                    setControlsBar("CONTROLS: WASD = Navigate Tree | E = Inspect Item | Q = Exit WASD Nav Mode | 'terminate'");
                    promptEl.textContent = `[R&D // WASD NAV ACTIVE]> `;
                } else if (isInspecting) {
                    setControlsBar("CONTROLS: WASD/Q = Return to Index | 'terminate'");
                    promptEl.textContent = `[R&D // INSPECTION VIEW]> `;
                } else {
                    setControlsBar("CONTROLS: Type 'move' to unlock WASD navigation | 'terminate'");
                    promptEl.textContent = `[R&D // COMMAND]> `;
                }
                return;
            }

            if (inVABModule) {
                setControlsBar("CONTROLS: Enter Option # (1-7) | 'back' = App List | 'terminate'");
                if (activeVABApp) {
                    promptEl.textContent = `[VAB // ${activeVABApp.name.toUpperCase()} ]> `;
                } else {
                    promptEl.textContent = `[VAB // MENU]> `;
                }
                return;
            }

            setControlsBar("SYSTEM READY // Enter command.");

            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
        }

        function bootTerminal() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";

            isRDNavActive = false;
            inVABModule = false;
            inPayloadDesigner = false;
            isRenderingCanvas = false;

            outputEl.style.display = "block";

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        async function runModuleBootSequence(moduleType, onComplete) {
            isExecutingProgram = true;
            inputEl.disabled = true;

            const overlay = document.createElement("div");
            overlay.id = "loading-overlay";

            const titleContainer = document.createElement("div");
            titleContainer.id = "loading-title-container";
            titleContainer.className = "line-title";

            const barContainer = document.createElement("div");
            barContainer.id = "loading-bar-container";

            const barStrEl = document.createElement("div");
            barStrEl.id = "loading-bar-str";
            barStrEl.className = "line-title";

            const percentEl = document.createElement("div");
            percentEl.id = "loading-percent";
            percentEl.className = "line-amber";

            barContainer.appendChild(barStrEl);
            barContainer.appendChild(percentEl);

            const cornerLogs = document.createElement("div");
            cornerLogs.id = "loading-corner-logs";
            cornerLogs.className = "line-amber";

            overlay.appendChild(titleContainer);
            overlay.appendChild(barContainer);
            overlay.appendChild(cornerLogs);
            document.getElementById("terminal-screen").appendChild(overlay);

            const logoLines = (moduleType === "RD") ? [
                "██████▒   ▒▒▒   ██████▒ ",
                "██▒  ██▒   █    ██▒  ██▒",
                "██████▒   ▒█▒   ██▒  ██▒",
                "██▒  ██▒   █    ██▒  ██▒",
                "██▒  ██▒  ▒▒▒   ██████▒ "
            ] : [
                "██▒  ██▒  █████▒   ██████▒ ",
                "██▒  ██▒ ██▒  ██▒  ██▒  ██▒",
                "██▒  ██▒ ███████▒  ██████▒ ",
                "██▒  ██▒ ██▒  ██▒  ██▒  ██▒",
                " █████▒  ██▒  ██▒  ██████▒ "
            ];

            const parseQueue = [
                "Authorizing user security credentials...",
                "Establishing physical wire connection...",
                "Routing telemetry data protocols...",
                "Allocating local stack memory buffers...",
                "Bypassing mainframe authentication proxy...",
                "Initializing bus interface controllers...",
                "Loading hardware specs and definitions...",
                "Verifying hardware node parity keys..."
            ];

            const totalDurationMs = (5.0 + Math.random() * 2.0) * 1000;
            const steps = 30;
            const stepDelay = totalDurationMs / steps;

            const willGetStuck = Math.random() < 0.25;
            const stuckStep = Math.floor(Math.random() * 10) + 10;
            const stuckDurationMs = 3000;

            let activeLogs = [];
            let isStuckTriggered = false;

            for (let i = 1; i <= steps; i++) {
                const percent = Math.floor((i / steps) * 100);

                const linesToShow = Math.max(1, Math.ceil((percent / 100) * logoLines.length));
                let renderedTitle = "";
                for (let l = 0; l < logoLines.length; l++) {
                    if (l < linesToShow) {
                        renderedTitle += logoLines[l] + "\n";
                    } else {
                        renderedTitle += "\n";
                    }
                }
                titleContainer.textContent = renderedTitle;

                const totalWidth = 34;
                const filled = Math.floor((percent / 100) * totalWidth);
                const empty = totalWidth - filled;
                barStrEl.textContent = "[" + "█".repeat(filled) + "░".repeat(empty) + "]";
                percentEl.textContent = `${percent}%`;

                if (parseQueue.length > 0 && Math.random() < 0.45) {
                    const msg = parseQueue.shift();
                    if (msg) activeLogs.push(`> ${msg}`);
                    if (activeLogs.length > 4) activeLogs.shift();
                }

                if (willGetStuck && i === stuckStep && !isStuckTriggered) {
                    isStuckTriggered = true;
                    activeLogs.push("[WARN] Connection interruption detected... Re-routing bus connection...");
                    if (activeLogs.length > 4) activeLogs.shift();
                    cornerLogs.innerHTML = activeLogs.join("<br>");
                    await new Promise(r => setTimeout(r, stuckDurationMs));
                }

                cornerLogs.innerHTML = activeLogs.join("<br>");
                await new Promise(r => setTimeout(r, stepDelay));
            }

            overlay.remove();
            outputEl.innerHTML = "";
            isExecutingProgram = false;
            inputEl.disabled = false;
            inputEl.focus();
            onComplete();
        }

        function renderRDLibrary() {
            outputEl.innerHTML = "";
            isInspecting = false;
            printRDHeader();

            const activeTier = techMatrix[selectedTierIndex];
            const activeCategory = activeTier.categories[selectedCategoryIndex];

            print(`ACTIVE TIER: ${activeTier.tierName}`, "title");
            print("--------------------------------------------------------------------------------");

            for (let i = 0; i < activeTier.categories.length; i++) {
                const item = activeTier.categories[i];
                const isSelected = (i === selectedCategoryIndex);
                
                let lineStr = isSelected 
                    ? ` ►► [UNLOCKED] ${item.cat.toUpperCase().padEnd(15)} : ${item.name} ◄◄` 
                    : `    [UNLOCKED] ${item.cat.toUpperCase().padEnd(15)} : ${item.name}`;

                print(lineStr, isSelected ? "title" : "amber");
            }

            print("--------------------------------------------------------------------------------");
            print(`CURRENTLY HIGHLIGHTED: [${activeCategory.cat.toUpperCase()}] -> ${activeCategory.name}`, "title");
            print(`BRIEF: ${activeCategory.desc}`);
            print("================================================================================", "title");
            updatePrompt();
        }

        function spawnSparks(x, y) {
            for (let i = 0; i < 6; i++) {
                sparkParticles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 1.2) * 4,
                    life: 1.0,
                    size: Math.random() * 3 + 2
                });
            }
        }

        function renderProbeGraphicsLoop() {
            if (!isRenderingCanvas) return;

            const now = performance.now();
            const dt = (now - lastFrameTime) / 1000;
            lastFrameTime = now;

            const rect = canvasContainerEl.getBoundingClientRect();
            probeCanvas.width = rect.width || 700;
            probeCanvas.height = rect.height || 400;

            const w = probeCanvas.width;
            const h = probeCanvas.height;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "#050300";
            ctx.fillRect(0, 0, w, h);

            // Left side positioning (Adjusted for 2.2x scale)
            const probeCenterX = w * 0.30;
            const probeCenterY = h * 0.50;

            const scaleFactor = Math.sqrt(payloadSpecs.sizeIVU || 0.5);
            // Size bumped 2.2x (220 * 2.2 = 484 max base width)
            const baseW = Math.min(w * 0.52, 484 * scaleFactor);
            const baseH = baseW;

            const left = probeCenterX - (baseW / 2);
            const top = probeCenterY - (baseH / 2);

            // Calculate Pressurization Fill/Empty over 2 seconds
            const pressTarget = payloadSpecs.isPressurized ? 1.0 : 0.0;
            if (pressurizeCurrent < pressTarget) {
                pressurizeCurrent = Math.min(pressTarget, pressurizeCurrent + dt / 2.0);
            } else if (pressurizeCurrent > pressTarget) {
                pressurizeCurrent = Math.max(pressTarget, pressurizeCurrent - dt / 2.0);
            }

            // Set up shape clipping path
            ctx.save();
            ctx.beginPath();
            if (payloadSpecs.shape === "Spherical") {
                ctx.ellipse(probeCenterX, probeCenterY, baseW / 2, baseH / 2, 0, 0, Math.PI * 2);
            } else {
                ctx.rect(left, top, baseW, baseH);
            }
            ctx.clip();

            // Darker Orange Inside Pressurization Effect
            if (pressurizeCurrent > 0.001) {
                ctx.fillStyle = `rgba(180, 70, 0, ${0.55 * pressurizeCurrent})`;
                ctx.fillRect(left - 20, top - 20, baseW + 40, baseH + 40);
            }

            // Render installed modules bottom-up inside usable inner bounds
            const modules = payloadSpecs.modules || [];
            const totalIVU = payloadSpecs.sizeIVU || 0.5;

            let innerWidth, innerHeight, innerLeft, innerTop;

            if (payloadSpecs.shape === "Spherical") {
                // Inscribed square inside circle: side length = baseW / sqrt(2)
                innerWidth = baseW / Math.SQRT2;
                innerHeight = baseH / Math.SQRT2;
                innerLeft = probeCenterX - (innerWidth / 2);
                innerTop = probeCenterY - (innerHeight / 2);
            } else {
                innerWidth = baseW - 16;
                innerHeight = baseH - 16;
                innerLeft = left + 8;
                innerTop = top + 8;
            }

            let currentY = innerTop + innerHeight;
            const availableHeight = innerHeight;

            modules.forEach((mod) => {
                const modHeight = (mod.ivu / totalIVU) * availableHeight;
                currentY -= modHeight;

                ctx.fillStyle = "rgba(255, 176, 0, 0.22)";
                ctx.strokeStyle = "#ffb000";
                ctx.lineWidth = 1.5;

                ctx.fillRect(innerLeft, currentY, innerWidth, modHeight - 2);
                ctx.strokeRect(innerLeft, currentY, innerWidth, modHeight - 2);

                ctx.fillStyle = "#ffb000";
                ctx.font = `${Math.max(9, Math.floor(Math.min(modHeight * 0.5, 15)))}px 'Courier New', monospace`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(`${mod.name.toUpperCase()} (${mod.ivu} IVU)`, innerLeft + innerWidth / 2, currentY + (modHeight / 2));
            });

            ctx.restore(); // Restore from clip

            // Spherical Inscribed Box Debug Outline ( subtle hint for user bounds )
            if (payloadSpecs.shape === "Spherical") {
                ctx.strokeStyle = "rgba(255, 176, 0, 0.25)";
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.strokeRect(innerLeft, innerTop, innerWidth, innerHeight);
                ctx.setLineDash([]);
            }

            // Outer Frame Glow Outline
            ctx.strokeStyle = payloadSpecs.isPressurized ? "#ff6600" : "#ffb000";
            ctx.lineWidth = 2.5;
            ctx.shadowColor = payloadSpecs.isPressurized ? "#ff6600" : "#ffb000";
            ctx.shadowBlur = 10;
            ctx.beginPath();
            if (payloadSpecs.shape === "Spherical") {
                ctx.ellipse(probeCenterX, probeCenterY, baseW / 2, baseH / 2, 0, 0, Math.PI * 2);
            } else {
                ctx.rect(left, top, baseW, baseH);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Render Right Side UI: Module List & IVU Usage Tracker
            const rightX = w * 0.60;
            const usedIVU = modules.reduce((acc, m) => acc + m.ivu, 0);

            ctx.fillStyle = "#ffb000";
            ctx.font = "bold 13px 'Courier New', monospace";
            ctx.textAlign = "left";
            ctx.textBaseline = "top";

            ctx.fillText(`CHASSIS: ${payloadSpecs.name.toUpperCase()} [${payloadSpecs.shape.toUpperCase()}]`, rightX, 15);
            ctx.fillText(`ATMOSPHERE: ${pressurizeCurrent > 0.01 ? `PRESSURIZING (${Math.floor(pressurizeCurrent * 100)}%)` : "VACUUM"}`, rightX, 32);

            ctx.fillStyle = usedIVU > totalIVU ? "#ff3333" : "#ffca42";
            ctx.fillText(`USAGE: ${usedIVU.toFixed(2)} / ${totalIVU.toFixed(2)} IVU used`, rightX, 55);

            ctx.strokeStyle = "rgba(255, 176, 0, 0.4)";
            ctx.beginPath();
            ctx.moveTo(rightX, 72);
            ctx.lineTo(w - 15, 72);
            ctx.stroke();

            ctx.fillStyle = "#ffb000";
            ctx.font = "bold 11px 'Courier New', monospace";
            ctx.fillText("INSTALLED MODULES:", rightX, 80);

            if (modules.length === 0) {
                ctx.fillStyle = "rgba(255, 176, 0, 0.5)";
                ctx.fillText("  (No modules installed - type 'add' to open parts)", rightX, 98);
            } else {
                modules.forEach((mod, idx) => {
                    ctx.fillStyle = "#ffb000";
                    ctx.fillText(`  ${idx + 1}. ${mod.name.padEnd(16)} [${mod.ivu.toFixed(2)} IVU]`, rightX, 98 + (idx * 16));
                });
            }

            // Bottom Right HUD: Electrical & Heat
            let totalWatts = modules.reduce((a, m) => a + m.watts, 0);
            let totalVolts = modules.some(m => m.volts === 12) ? 12 : (modules.some(m => m.volts === 5) ? 5 : 0);
            let totalCapAh = modules.reduce((a, m) => a + m.capAh, 0);
            let heatGen = modules.reduce((a, m) => a + m.heatGen, 0);
            let heatDiss = modules.reduce((a, m) => a + m.heatDiss, 0);

            let timeStr = "0h 00m";
            if (totalWatts > 0 && totalCapAh > 0) {
                const totalWattHours = totalCapAh * totalVolts;
                const hours = totalWattHours / totalWatts;
                const h = Math.floor(hours);
                const m = Math.floor((hours - h) * 60);
                timeStr = `${h}h ${m}m`;
            } else if (totalWatts === 0 && totalCapAh > 0) {
                timeStr = "∞ (No Load)";
            } else {
                timeStr = "0m (No Power)";
            }

            const hudY = h - 110;
            ctx.fillStyle = "rgba(255, 176, 0, 0.2)";
            ctx.fillRect(rightX - 5, hudY - 5, w - rightX - 10, 105);
            ctx.strokeStyle = "#ffb000";
            ctx.strokeRect(rightX - 5, hudY - 5, w - rightX - 10, 105);

            ctx.fillStyle = "#ffb000";
            ctx.font = "bold 11px 'Courier New', monospace";
            ctx.fillText(`ELECTRICAL TELEMETRY:`, rightX, hudY);
            ctx.font = "11px 'Courier New', monospace";
            ctx.fillText(`  Watts                 : ${totalWatts.toFixed(1)} W`, rightX, hudY + 15);
            ctx.fillText(`  Volts                 : ${totalVolts} V`, rightX, hudY + 28);
            ctx.fillText(`  Time until power loss : ~${timeStr}`, rightX, hudY + 41);

            // Heat ASCII Bars
            const maxBar = 25;
            const genFilled = Math.min(maxBar, Math.floor((heatGen / 30) * maxBar));
            const genBar = "[" + "█".repeat(genFilled) + "░".repeat(maxBar - genFilled) + "]";
            
            const dissFilled = Math.min(maxBar, Math.floor((heatDiss / 30) * maxBar));
            const dissBar = "[" + "█".repeat(dissFilled) + "░".repeat(maxBar - dissFilled) + "]";

            const heatWarning = heatGen > heatDiss;
            ctx.fillStyle = heatWarning ? "#ff3333" : "#ffb000";
            ctx.fillText(`HEAT TELEMETRY ${heatWarning ? "[OVERHEAT RISK!]" : "[STABLE]"}`, rightX, hudY + 58);
            ctx.fillText(`  Heat Generated: ${genBar} ${heatGen.toFixed(1)}W`, rightX, hudY + 71);
            ctx.fillStyle = "#ffb000";
            ctx.fillText(`  Heat Dealt With: ${dissBar} ${heatDiss.toFixed(1)}W`, rightX, hudY + 84);

            // Physics update and render gravity spark particles
            for (let i = sparkParticles.length - 1; i >= 0; i--) {
                const sp = sparkParticles[i];
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.vy += 0.25; // gravity pull downwards
                sp.life -= 0.03;

                if (sp.life <= 0) {
                    sparkParticles.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = `rgba(255, ${Math.floor(200 * sp.life)}, 0, ${sp.life})`;
                ctx.beginPath();
                ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Interactive Part Selector WASD Overlay
            if (inPartPicker) {
                const modalW = w * 0.88;
                const modalH = h * 0.82;
                const modalX = (w - modalW) / 2;
                const modalY = (h - modalH) / 2;

                ctx.fillStyle = "rgba(8, 5, 0, 0.94)";
                ctx.fillRect(modalX, modalY, modalW, modalH);
                ctx.strokeStyle = "#ffb000";
                ctx.lineWidth = 2;
                ctx.strokeRect(modalX, modalY, modalW, modalH);

                // Top Modal Banner
                ctx.fillStyle = "#ffb000";
                ctx.font = "bold 14px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText("=== HARDWARE PARTS CATALOG [WASD TO NAVIGATE] ===", w / 2, modalY + 18);

                // Categories Row (A / D)
                let catStartX = modalX + 20;
                ctx.textAlign = "left";
                ctx.font = "bold 11px 'Courier New', monospace";

                PART_CATEGORIES.forEach((cat, idx) => {
                    const isSelected = (idx === selectedPartCatIndex);
                    if (isSelected) {
                        ctx.fillStyle = "#ffb000";
                        ctx.fillText(`► [${cat.catName}] ◄`, catStartX, modalY + 42);
                        catStartX += ctx.measureText(`► [${cat.catName}] ◄`).width + 15;
                    } else {
                        ctx.fillStyle = "rgba(255, 176, 0, 0.5)";
                        ctx.fillText(`  ${cat.catName}  `, catStartX, modalY + 42);
                        catStartX += ctx.measureText(`  ${cat.catName}  `).width + 15;
                    }
                });

                ctx.strokeStyle = "rgba(255, 176, 0, 0.4)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(modalX + 15, modalY + 56);
                ctx.lineTo(modalX + modalW - 15, modalY + 56);
                ctx.stroke();

                // Left Column: Items List (W / S)
                const currentCat = PART_CATEGORIES[selectedPartCatIndex];
                const listX = modalX + 25;
                let listY = modalY + 75;

                ctx.font = "bold 12px 'Courier New', monospace";
                ctx.fillStyle = "#ffb000";
                ctx.fillText(`CATEGORY: ${currentCat.catName}`, listX, listY);
                listY += 20;

                currentCat.parts.forEach((p, idx) => {
                    const isHovered = (idx === selectedPartItemIndex);
                    if (isHovered) {
                        ctx.fillStyle = "#ffca42";
                        ctx.fillText(` ► ${p.name.padEnd(18)} (${p.ivu} IVU)`, listX, listY);
                    } else {
                        ctx.fillStyle = "rgba(255, 176, 0, 0.6)";
                        ctx.fillText(`   ${p.name.padEnd(18)} (${p.ivu} IVU)`, listX, listY);
                    }
                    listY += 22;
                });

                // Right Column: Active Part Specs & Description
                const hoveredPart = currentCat.parts[selectedPartItemIndex];
                const specX = modalX + modalW * 0.48;
                let specY = modalY + 75;

                ctx.strokeStyle = "rgba(255, 176, 0, 0.3)";
                ctx.beginPath();
                ctx.moveTo(specX - 15, modalY + 65);
                ctx.lineTo(specX - 15, modalY + modalH - 45);
                ctx.stroke();

                if (hoveredPart) {
                    ctx.fillStyle = "#ffb000";
                    ctx.font = "bold 13px 'Courier New', monospace";
                    ctx.fillText(`SPECIFICATIONS: ${hoveredPart.name.toUpperCase()}`, specX, specY);
                    specY += 22;

                    ctx.font = "11px 'Courier New', monospace";
                    ctx.fillText(`  Volume Size     : ${hoveredPart.ivu} IVU`, specX, specY); specY += 16;
                    ctx.fillText(`  Power Draw      : ${hoveredPart.watts} Watts @ ${hoveredPart.volts} Volts`, specX, specY); specY += 16;
                    ctx.fillText(`  Battery Capacity: ${hoveredPart.capAh} Ah`, specX, specY); specY += 16;
                    ctx.fillText(`  Heat Generation : ${hoveredPart.heatGen} W`, specX, specY); specY += 16;
                    ctx.fillText(`  Heat Dissipation: ${hoveredPart.heatDiss} W`, specX, specY); specY += 22;

                    ctx.fillStyle = "#ffca42";
                    ctx.fillText(`DESCRIPTION:`, specX, specY); specY += 16;
                    ctx.fillStyle = "rgba(255, 176, 0, 0.85)";
                    
                    // Simple description line wrap
                    const words = hoveredPart.desc.split(" ");
                    let line = "  ";
                    words.forEach(w => {
                        if ((line + w).length > 32) {
                            ctx.fillText(line, specX, specY);
                            specY += 15;
                            line = "  " + w + " ";
                        } else {
                            line += w + " ";
                        }
                    });
                    if (line.trim()) ctx.fillText(line, specX, specY);
                }

                // Bottom Overlay Controls Footer
                ctx.strokeStyle = "rgba(255, 176, 0, 0.4)";
                ctx.beginPath();
                ctx.moveTo(modalX + 15, modalY + modalH - 35);
                ctx.lineTo(modalX + modalW - 15, modalY + modalH - 35);
                ctx.stroke();

                ctx.fillStyle = "#ffb000";
                ctx.font = "bold 11px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText("[A / D] Category | [W / S] Highlight | [E] Install Module | [Q] Exit", w / 2, modalY + modalH - 15);
            }

            animFrameId = requestAnimationFrame(renderProbeGraphicsLoop);
        }

        function processCommand(input) {
            if (isExecutingProgram) return;

            const trimmedInput = input.trim();
            const lowerInput = trimmedInput.toLowerCase();

            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${trimmedInput}`, "amber");
            }

            if (lowerInput === "terminate") {
                if (animFrameId) cancelAnimationFrame(animFrameId);
                inRDModule = false;
                isRDNavActive = false;
                inVABModule = false;
                inPayloadDesigner = false;
                isRenderingCanvas = false;
                inPartPicker = false;
                isInspecting = false;
                canvasContainerEl.style.display = "none";
                outputEl.style.display = "block";
                activeVABApp = null;
                outputEl.innerHTML = "";
                print("[SYS] ACTIVE PROGRAM TERMINATED.");
                print("");
                printLoggedInHelp();
                updatePrompt();
                return;
            }

            if (inPayloadDesigner) {
                if (isRenderingCanvas) {
                    if (lowerInput === "add") {
                        inPartPicker = true;
                        selectedPartCatIndex = 0;
                        selectedPartItemIndex = 0;
                        updatePrompt();
                        return;
                    }
                    if (lowerInput === "pressurize") {
                        payloadSpecs.isPressurized = true;
                        print("[SYS] Initialized payload pressurization process (2.0 sec).");
                        return;
                    }
                    if (lowerInput === "depressurize") {
                        payloadSpecs.isPressurized = false;
                        print("[SYS] Initialized payload depressurization process (2.0 sec).");
                        return;
                    }
                    if (lowerInput.startsWith("add ")) {
                        const search = lowerInput.substring(4).trim();
                        const part = AVAILABLE_PARTS.find(p => p.id === search || p.name.toLowerCase() === search);
                        if (!part) {
                            print(`[ERR] Unknown module '${search}'. Type 'add' to open the interactive part menu.`);
                            return;
                        }

                        const currentIVU = payloadSpecs.modules.reduce((a, m) => a + m.ivu, 0);
                        if (currentIVU + part.ivu > payloadSpecs.sizeIVU + 0.001) {
                            print(`[ERR] Cannot install '${part.name}' (${part.ivu} IVU). Exceeds capacity limit (${payloadSpecs.sizeIVU} IVU).`);
                            return;
                        }

                        payloadSpecs.modules.push({ ...part });
                        print(`[SYS] Installed '${part.name}' into chassis.`);

                        const rect = canvasContainerEl.getBoundingClientRect();
                        spawnSparks((rect.width || 700) * 0.30, (rect.height || 400) * 0.50);
                        return;
                    }

                    if (lowerInput.startsWith("remove ")) {
                        const search = lowerInput.substring(7).trim();
                        const idx = payloadSpecs.modules.findIndex(m => m.id === search || m.name.toLowerCase() === search);
                        if (idx >= 0) {
                            const removed = payloadSpecs.modules.splice(idx, 1)[0];
                            print(`[SYS] Removed '${removed.name}' from chassis.`);
                        } else {
                            print(`[ERR] Module '${search}' not found inside current payload.`);
                        }
                        return;
                    }

                    if (lowerInput === "save") {
                        if (!GameState.data.savedPayloads) GameState.data.savedPayloads = [];
                        const existingIdx = GameState.data.savedPayloads.findIndex(p => p.name.toLowerCase() === payloadSpecs.name.toLowerCase());
                        if (existingIdx >= 0) {
                            GameState.data.savedPayloads[existingIdx] = JSON.parse(JSON.stringify(payloadSpecs));
                        } else {
                            GameState.data.savedPayloads.push(JSON.parse(JSON.stringify(payloadSpecs)));
                        }
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        renderPayloadListScreen();
                        print(`[SYS] Payload design '${payloadSpecs.name}' successfully saved to memory.`);
                        return;
                    }

                    if (lowerInput === "back") {
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    print("[SYS] Canvas Commands: 'add' (Parts Menu), 'remove [item]', 'pressurize', 'depressurize', 'save', 'back', 'terminate'.");
                    return;
                }

                if (payloadSubMode === "LIST") {
                    if (lowerInput === "back") {
                        inPayloadDesigner = false;
                        activeVABApp = null;
                        renderVABMenu();
                        return;
                    }
                    if (lowerInput === "new") {
                        payloadSubMode = "CRITERIA";
                        payloadStep = "NAME";
                        payloadSpecs = {
                            name: "",
                            sizeIVU: 0.5,
                            shape: "Cubic",
                            purpose: "Payload",
                            isPressurized: false,
                            modules: []
                        };
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    const selIdx = parseInt(lowerInput, 10);
                    if (!isNaN(selIdx) && GameState.data.savedPayloads && selIdx >= 1 && selIdx <= GameState.data.savedPayloads.length) {
                        payloadSpecs = JSON.parse(JSON.stringify(GameState.data.savedPayloads[selIdx - 1]));
                        if (!payloadSpecs.modules) payloadSpecs.modules = [];
                        payloadSubMode = "CRITERIA";
                        payloadStep = "CONFIRM";
                        renderPayloadDesignerCriteria();
                        print(`[SYS] Loaded saved payload design '${payloadSpecs.name}'.`);
                        return;
                    }

                    if (lowerInput.startsWith("load ")) {
                        const targetName = trimmedInput.substring(5).trim();
                        const foundPayload = GameState.data.savedPayloads ? GameState.data.savedPayloads.find(p => p.name.toLowerCase() === targetName.toLowerCase()) : null;
                        if (foundPayload) {
                            payloadSpecs = JSON.parse(JSON.stringify(foundPayload));
                            if (!payloadSpecs.modules) payloadSpecs.modules = [];
                            payloadSubMode = "CRITERIA";
                            payloadStep = "CONFIRM";
                            renderPayloadDesignerCriteria();
                            print(`[SYS] Loaded saved payload design '${payloadSpecs.name}'.`);
                            return;
                        } else {
                            print(`[ERR] Payload '${targetName}' not found in registry.`);
                            return;
                        }
                    }

                    if (lowerInput.startsWith("delete")) {
                        const targetName = trimmedInput.substring(6).trim();
                        if (!targetName) {
                            print("[SYS] Usage: delete [payload name]");
                            return;
                        }
                        const exists = GameState.data.savedPayloads && GameState.data.savedPayloads.some(p => p.name.toLowerCase() === targetName.toLowerCase());
                        if (!exists) {
                            print(`[ERR] Payload '${targetName}' not found in registry.`);
                            return;
                        }
                        payloadDeleteTarget = targetName;
                        payloadSubMode = "DELETE_CONFIRM";
                        print(`[WARN] Are you sure you want to permanently delete '${targetName}'? (type 'yes' or 'no')`, "title");
                        updatePrompt();
                        return;
                    }
                    print("[SYS] Options: 'new', [1-N] / 'load [name]', 'delete [name]', 'back', or 'terminate'.");
                    return;
                }

                if (payloadSubMode === "DELETE_CONFIRM") {
                    if (lowerInput === "yes" || lowerInput === "y") {
                        GameState.data.savedPayloads = GameState.data.savedPayloads.filter(p => p.name.toLowerCase() !== payloadDeleteTarget.toLowerCase());
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        const removed = payloadDeleteTarget;
                        payloadDeleteTarget = "";
                        renderPayloadListScreen();
                        print(`[SYS] Payload design '${removed}' deleted.`);
                        return;
                    }
                    if (lowerInput === "no" || lowerInput === "n" || lowerInput === "back") {
                        payloadDeleteTarget = "";
                        renderPayloadListScreen();
                        print("[SYS] Deletion canceled.");
                        return;
                    }
                    print("[SYS] Confirm deletion of payload? Type 'yes' or 'no'.");
                    return;
                }

                if (payloadSubMode === "CRITERIA") {
                    if (lowerInput === "back") {
                        renderPayloadListScreen();
                        return;
                    }

                    if (payloadStep === "NAME") {
                        if (!trimmedInput) {
                            print("[SYS] Please enter a valid payload name.");
                            return;
                        }
                        payloadSpecs.name = trimmedInput;
                        payloadStep = "SIZE";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "SIZE") {
                        if (lowerInput === "1") payloadSpecs.sizeIVU = 0.5;
                        else if (lowerInput === "2") payloadSpecs.sizeIVU = 1.0;
                        else if (lowerInput === "3") payloadSpecs.sizeIVU = 2.0;
                        else {
                            print("[SYS] Select size option 1, 2, or 3.");
                            return;
                        }
                        payloadStep = "SHAPE";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "SHAPE") {
                        if (lowerInput === "1") payloadSpecs.shape = "Cubic";
                        else if (lowerInput === "2") payloadSpecs.shape = "Spherical";
                        else {
                            print("[SYS] Select shape option 1 or 2.");
                            return;
                        }
                        payloadStep = "PURPOSE";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "PURPOSE") {
                        if (lowerInput === "1") payloadSpecs.purpose = "Payload";
                        else {
                            print("[SYS] Select purpose option 1.");
                            return;
                        }
                        payloadStep = "CONFIRM";
                        renderPayloadDesignerCriteria();
                        return;
                    }

                    if (payloadStep === "CONFIRM") {
                        if (lowerInput === "start") {
                            outputEl.style.display = "none";
                            canvasContainerEl.style.display = "flex";
                            isRenderingCanvas = true;
                            lastFrameTime = performance.now();
                            updatePrompt();
                            renderProbeGraphicsLoop();
                            return;
                        }
                        print("[SYS] Type 'start' to initialize chassis canvas, or 'back' to return.");
                        return;
                    }
                }
            }

            if (inRDModule) {
                if (lowerInput === "move") {
                    isRDNavActive = true;
                    updatePrompt();
                    print("[SYS] WASD Navigation Unlocked. Use WASD keys to browse tree, 'E' to select/inspect, 'Q' to return to typing.");
                    return;
                }

                if (isRDNavActive) {
                    if (lowerInput === "q") {
                        isRDNavActive = false;
                        updatePrompt();
                        print("[SYS] Exited WASD navigation mode. Type 'move' to enter again.");
                        return;
                    }
                }

                if (isInspecting) {
                    if (lowerInput === "q" || lowerInput === "back") {
                        renderRDLibrary();
                        return;
                    }
                }

                print(`[SYS] R&D Command: Type 'move' to activate tree navigation, or 'terminate' to exit.`);
                return;
            }

            if (inVABModule) {
                if (activeVABApp) {
                    if (lowerInput === "back") {
                        activeVABApp = null;
                        renderVABMenu();
                        return;
                    }
                    const v = GameState.data.vessel;
                    if (lowerInput === "1") {
                        v.fuelRatio = (v.fuelRatio + 10) > 100 ? 10 : v.fuelRatio + 10;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "2") {
                        v.gimbal = (v.gimbal + 20) > 100 ? 20 : v.gimbal + 20;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "3") {
                        v.finArea = (v.finArea + 2) > 20 ? 2 : v.finArea + 2;
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    if (lowerInput === "4") {
                        v.sepDelay = (v.sepDelay >= 3.0) ? 0.5 : parseFloat((v.sepDelay + 0.5).toFixed(1));
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    print("[SYS] Type '1'-'4' to adjust, 'back' for menu, or 'terminate'.");
                    return;
                } else {
                    const option = parseInt(lowerInput, 10);
                    if (!isNaN(option) && option >= 1 && option <= vabApplications.length) {
                        activeVABApp = vabApplications[option - 1];
                        if (activeVABApp.id === "payload") {
                            inPayloadDesigner = true;
                            renderPayloadListScreen();
                            return;
                        }
                        renderVABAppStudio(activeVABApp);
                        return;
                    }
                    print("[SYS] Enter an application number (1-7), or type 'terminate'.");
                    return;
                }
            }

            if (currentMode === "NEW_NAME") {
                if (!trimmedInput) return;
                tempName = trimmedInput;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "NEW_PASS") {
                if (!trimmedInput) return;
                const password = trimmedInput;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();
                if (!GameState.data.savedPayloads) GameState.data.savedPayloads = [];

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                outputEl.innerHTML = "";
                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' created.`);
                print(`[SYS] Profile ID: [${slotName}]`);
                print("");
                printProgramTree();
                printLoggedInHelp();
                return;
            }

            if (currentMode === "LOAD_SELECT") {
                if (!trimmedInput) return;
                const targetSlot = trimmedInput.toLowerCase().replace(/\s+/g, '_');

                if (lowerInput === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);
                if (!rawData) {
                    print(`[ERR] Save file '${trimmedInput}' not found.`);
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            if (currentMode === "LOAD_PASS") {
                if (!trimmedInput) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === trimmedInput) {
                    GameState.data = parsedData;
                    if (!GameState.data.savedPayloads) GameState.data.savedPayloads = [];
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    
                    outputEl.innerHTML = "";
                    updatePrompt();
                    
                    print(`[SYS] Access granted for user '${GameState.data.user.name}'.`);
                    print("");
                    printProgramTree();
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Invalid password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            const parts = lowerInput.split(" ");
            const cmd = parts[0];
            const subCmd = parts[1] || "";

            if (currentMode === "LOGGED_IN") {
                if ((cmd === "run" && subCmd === "r&d") || cmd === "r&d") {
                    runModuleBootSequence("RD", () => {
                        inRDModule = true;
                        isRDNavActive = false;
                        renderRDLibrary();
                    });
                    return;
                }

                if ((cmd === "run" && subCmd === "vab") || cmd === "vab") {
                    runModuleBootSequence("VAB", () => {
                        inVABModule = true;
                        renderVABMenu();
                    });
                    return;
                }

                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "programs":
                    case "dir":
                        printProgramTree();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        print(`Saved Payloads: ${GameState.data.savedPayloads ? GameState.data.savedPayloads.length : 0}`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Data written to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        GameState.activeSlot = "default_save";
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help', 'run r&d', or 'run vab'.`);
                        break;
                }
                return;
            }

            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Reading save records...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const loadSaves = getSaveList();
                        if (loadSaves.length === 0) {
                            print("[ERR] No save files present in memory.");
                            return;
                        }

                        print("[SYS] Available Save Files:");
                        loadSaves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'.`);
                        break;
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (isExecutingProgram) return;

            // Interactive Part Selector Keyboard WASD Listener
            if (inPayloadDesigner && isRenderingCanvas && inPartPicker) {
                const k = e.key.toUpperCase();
                if (["W", "A", "S", "D", "E", "Q"].includes(k)) {
                    e.preventDefault();
                }

                if (k === "A") {
                    selectedPartCatIndex = (selectedPartCatIndex - 1 + PART_CATEGORIES.length) % PART_CATEGORIES.length;
                    selectedPartItemIndex = 0;
                } else if (k === "D") {
                    selectedPartCatIndex = (selectedPartCatIndex + 1) % PART_CATEGORIES.length;
                    selectedPartItemIndex = 0;
                } else if (k === "W") {
                    const catLen = PART_CATEGORIES[selectedPartCatIndex].parts.length;
                    selectedPartItemIndex = (selectedPartItemIndex - 1 + catLen) % catLen;
                } else if (k === "S") {
                    const catLen = PART_CATEGORIES[selectedPartCatIndex].parts.length;
                    selectedPartItemIndex = (selectedPartItemIndex + 1) % catLen;
                } else if (k === "E") {
                    const activeCat = PART_CATEGORIES[selectedPartCatIndex];
                    const part = activeCat.parts[selectedPartItemIndex];
                    const currentIVU = payloadSpecs.modules.reduce((a, m) => a + m.ivu, 0);

                    if (currentIVU + part.ivu > payloadSpecs.sizeIVU + 0.001) {
                        print(`[ERR] Cannot install '${part.name}' (${part.ivu} IVU). Exceeds capacity limit (${payloadSpecs.sizeIVU} IVU).`);
                    } else {
                        payloadSpecs.modules.push({ ...part });
                        print(`[SYS] Installed '${part.name}' into chassis.`);
                        const rect = canvasContainerEl.getBoundingClientRect();
                        spawnSparks((rect.width || 700) * 0.30, (rect.height || 400) * 0.50);
                    }
                } else if (k === "Q") {
                    inPartPicker = false;
                    updatePrompt();
                    print("[SYS] Exited Part Selector.");
                }
                return;
            }

            // Research & Development Tree WASD Listener
            if (inRDModule && isRDNavActive) {
                const key = e.key.toUpperCase();
                
                if (["W", "A", "S", "D", "E", "Q"].includes(key)) {
                    e.preventDefault();
                }

                if (key === "W") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex > 0) selectedCategoryIndex--;
                    renderRDLibrary();
                } else if (key === "S") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedCategoryIndex < techMatrix[selectedTierIndex].categories.length - 1) selectedCategoryIndex++;
                    renderRDLibrary();
                } else if (key === "A") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex > 0) {
                        selectedTierIndex--;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                } else if (key === "D") {
                    if (isInspecting) { renderRDLibrary(); return; }
                    if (selectedTierIndex < techMatrix.length - 1) {
                        selectedTierIndex++;
                        selectedCategoryIndex = 0;
                    }
                    renderRDLibrary();
                } else if (key === "E") {
                    if (!isInspecting) showCategoryInspection();
                } else if (key === "Q") {
                    if (isInspecting) {
                        renderRDLibrary();
                    } else {
                        isRDNavActive = false;
                        updatePrompt();
                        print("[SYS] Exited WASD navigation mode.");
                    }
                }
            }

            if (e.key === "Enter") {
                const input = inputEl.value;
                inputEl.value = "";
                processCommand(input);
            }
        });

        bootTerminal();
    </script>
</body>
</html>
