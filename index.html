<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ORBITAL OS</title>
<style>
/* UNIVERSAL UI - AMBER & CRT */
:root{--t:#ffb000;--b:#0a0500;--f:'Courier New',Courier,monospace}
body{background:var(--b);color:var(--t);font-family:var(--f);margin:0;padding:20px;overflow:hidden;text-shadow:0 0 5px var(--t)}
.terminal-screen,.boot-screen{display:flex;flex-direction:column;height:95vh;justify-content:flex-end; position:relative;}
body::after{content:"";position:absolute;top:0;left:0;width:100vw;height:100vh;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.1),rgba(0,0,0,0.1) 1px,transparent 1px,transparent 2px);pointer-events:none;z-index:999}
.boot-screen{justify-content:center;align-items:center;text-align:center}
.title{font-size:3em;font-weight:bold;margin-bottom:40px;letter-spacing:10px;text-transform:uppercase}
.boot-box{border:1px solid var(--t);padding:20px;width:300px}
.input-container{margin-bottom:15px;text-align:left}
.input-container label{display:block;margin-bottom:5px}
#output-log{white-space:pre-wrap;overflow-y:auto;margin-bottom:10px;padding-right:10px; flex-grow:1;}
.input-line{display:flex;align-items:center; z-index:10;}
.prompt{margin-right:10px;font-weight:bold}
input[type=text],input[type=password]{background:transparent;border:1px solid rgba(255,176,0,0.3);color:var(--t);font-family:var(--f);font-size:16px;outline:none;text-shadow:0 0 5px var(--t);padding:5px;width:280px}
input[type=text]:focus,input[type=password]:focus{border-color:var(--t)}
#terminal-input{border:none;flex-grow:1;width:auto}
#submit-btn{border:1px solid var(--t);padding:5px 15px;cursor:pointer;margin-top:10px;display:inline-block}
#submit-btn:hover{background:var(--t);color:var(--b);text-shadow:none}
.input-line.app-mode {border-top: 1px solid var(--t); padding-top: 10px; margin-top: 10px;}

/* MAP CANVAS */
#map-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% - 50px);
    display: none;
    cursor: crosshair;
}
</style>
</head><body>

<div id="boot-screen" class="boot-screen">
    <div class="title">ORBITAL</div>
    <div class="boot-box">
        <div class="input-container"><label>USERNAME:</label><input type="text" id="user-input" autocomplete="off"></div>
        <div class="input-container"><label>PASSWORD:</label><input type="password" id="pass-input" autocomplete="off"></div>
        <div id="submit-btn">[SUBMIT]</div>
    </div>
</div>

<div id="terminal-screen" class="terminal-screen" style="display:none;">
    <canvas id="map-canvas"></canvas>
    <div id="output-log">OSIRIS KERNEL BOOT (AMBER)... OK.</div>
    <div id="input-wrapper" class="input-line"><span class="prompt">></span><input type="text" id="terminal-input" autocomplete="off"></div>
</div>

<script>
const AuthSystem={isAuthenticated:!1,validUser:"DIRECTOR",validPass:"TIER0",attemptLogin:function(){const e=document.getElementById("user-input").value.toUpperCase().trim(),t=document.getElementById("pass-input").value.toUpperCase().trim();e===this.validUser&&t===this.validPass?(this.isAuthenticated=!0,document.getElementById("boot-screen").style.display="none",document.getElementById("terminal-screen").style.display="flex",Terminal.log("\n[AUTH SUCCESS] WELCOME TO ORBITAL.\nType 'HELP' for commands."),Terminal.inputField.focus()):(Terminal.clearInputs(),Terminal.log("ERR: INVALID CREDENTIALS."))}};

// --- HIERARCHICAL ASTROPHYSICS ENGINE ---
const MapEngine = {
    canvas: document.getElementById("map-canvas"),
    ctx: null,
    isRunning: false,
    
    camera: { x: 0, y: 0, zoom: 0.0001 }, 
    isDragging: false,
    dragStart: { x: 0, y: 0 },
    mouseMoved: false,
    isTracking: false, // Locks camera to activeTarget
    
    startTime: Date.now(),
    timeScale: 3600, // Defaulted to 3600x (1 real second = 1 game hour) to see orbits move
    
    activeTarget: null, 
    
    system: {
        name: "OSIRIS", radius: 50000, currentX: 0, currentY: 0, // Central Black Hole Anchor
        bodies: [
            {
                name: "FURRA", a: 271000000, e: 0.0167, inc: 0.0, lan: 0.0, argp: 0.0, radius: 5796, period: 48384000, currentX: 0, currentY: 0, currentR: 0,
                rings: [
                    { name: "A", start: 8296, end: 9596, color: "rgba(255, 176, 0, 0.15)" },
                    { name: "B", start: 9596, end: 11296, color: "rgba(255, 176, 0, 0.30)" },
                    { name: "C", start: 11296, end: 11646, color: "rgba(255, 176, 0, 0.20)" },
                    { name: "D", start: 11946, end: 12596, color: "rgba(255, 176, 0, 0.25)" },
                    { name: "E", start: 12596, end: 13086, color: "rgba(255, 176, 0, 0.10)" }
                ],
                bodies: [
                    { name: "HARMONY", a: 11796, e: 0.001, inc: 0.0, lan: 0.0, argp: 0.0, radius: 21, period: 14004, currentX: 0, currentY: 0, currentR: 0 },     
                    { name: "KIITOS", a: 340000, e: 0.05, inc: 2.1, lan: 45.0, argp: 90.0, radius: 1876, period: 2171520, currentX: 0, currentY: 0, currentR: 0 }  
                ]
            }
        ]
    },

    init: function() {
        this.ctx = this.canvas.getContext("2d");
        this.resize();
        window.addEventListener("resize", () => this.resize());
        
        this.canvas.addEventListener("mousedown", (e) => {
            this.isDragging = true;
            this.isTracking = false; // Break camera lock on drag
            this.mouseMoved = false;
            this.dragStart = { x: e.clientX - this.camera.x, y: e.clientY - this.camera.y };
        });
        
        window.addEventListener("mousemove", (e) => {
            if (!this.isDragging) return;
            this.mouseMoved = true;
            this.camera.x = e.clientX - this.dragStart.x;
            this.camera.y = e.clientY - this.dragStart.y;
        });

        window.addEventListener("mouseup", (e) => {
            this.isDragging = false;
            if (!this.mouseMoved) {
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                this.checkClickSelection(mouseX, mouseY);
            }
        });
        
        this.canvas.addEventListener("wheel", (e) => {
            const zoomAmount = e.deltaY > 0 ? 0.8 : 1.25; 
            const rect = this.canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const worldX = (mouseX - this.camera.x - this.canvas.width/2) / this.camera.zoom;
            const worldY = (mouseY - this.camera.y - this.canvas.height/2) / this.camera.zoom;

            let newZoom = this.camera.zoom * zoomAmount;
            
            // Expanded zoom capabilities to handle hundreds of millions of km
            if (newZoom < 0.0000002) newZoom = 0.0000002; 
            if (newZoom > 5.0) newZoom = 5.0;

            this.camera.zoom = newZoom;
            
            if(!this.isTracking) {
                this.camera.x = mouseX - (worldX * this.camera.zoom) - this.canvas.width/2;
                this.camera.y = mouseY - (worldY * this.camera.zoom) - this.canvas.height/2;
            }
        });
    },

    checkClickSelection: function(mouseX, mouseY) {
        const cx = this.canvas.width / 2 + this.camera.x;
        const cy = this.canvas.height / 2 + this.camera.y;
        
        // 1. Check Osiris
        let distOsiris = Math.hypot(mouseX - cx, mouseY - cy);
        if (distOsiris < (this.system.radius * this.camera.zoom) + 10) {
            this.activeTarget = this.system;
            this.isTracking = true;
            return;
        }

        // 2. Check Furra and Moons
        for (let planet of this.system.bodies) {
            const px = cx + (planet.currentX * this.camera.zoom);
            const py = cy + (planet.currentY * this.camera.zoom);
            if (Math.hypot(mouseX - px, mouseY - py) < (planet.radius * this.camera.zoom) + 15) {
                this.activeTarget = planet;
                this.isTracking = true;
                return;
            }
            // Moons
            for (let moon of planet.bodies) {
                const mx = cx + (moon.currentX * this.camera.zoom);
                const my = cy + (moon.currentY * this.camera.zoom);
                if (Math.hypot(mouseX - mx, mouseY - my) < (moon.radius * this.camera.zoom) + 10) {
                    this.activeTarget = moon;
                    this.isTracking = true;
                    return;
                }
            }
        }
        this.activeTarget = null; 
        this.isTracking = false;
    },

    selectTargetByName: function(name) {
        if (name === "OSIRIS") {
            this.activeTarget = this.system;
            this.isTracking = true;
            return true;
        }
        for (let planet of this.system.bodies) {
            if (planet.name === name) {
                this.activeTarget = planet;
                this.isTracking = true;
                return true;
            }
            for (let moon of planet.bodies) {
                if (moon.name === name) {
                    this.activeTarget = moon;
                    this.isTracking = true;
                    return true;
                }
            }
        }
        return false;
    },

    resize: function() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight - 50; 
    },

    start: function() {
        this.isRunning = true;
        this.canvas.style.display = "block";
        document.getElementById("output-log").style.display = "none";
        // Do not reset startTime here, this allows orbits to persist over absolute time
        this.loop();
    },

    stop: function() {
        this.isRunning = false;
        this.activeTarget = null;
        this.isTracking = false;
        this.canvas.style.display = "none";
        document.getElementById("output-log").style.display = "block";
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    },

    loop: function() {
        if (!this.isRunning) return;
        this.update();
        this.render();
        requestAnimationFrame(() => this.loop());
    },

    update: function() {
        const elapsedSeconds = ((Date.now() - this.startTime) / 1000) * this.timeScale;
        
        // Calculate Furra (Relative to Osiris)
        this.system.bodies.forEach(planet => {
            const tP = ((2 * Math.PI) / planet.period) * elapsedSeconds;
            const rP = (planet.a * (1 - Math.pow(planet.e, 2))) / (1 + planet.e * Math.cos(tP));
            planet.currentR = rP; 
            planet.currentX = rP * Math.cos(tP);
            planet.currentY = rP * Math.sin(tP);
            
            // Calculate Moons (Relative to Furra)
            planet.bodies.forEach(moon => {
                const tM = ((2 * Math.PI) / moon.period) * elapsedSeconds;
                const rM = (moon.a * (1 - Math.pow(moon.e, 2))) / (1 + moon.e * Math.cos(tM));
                moon.currentR = rM;
                moon.currentX = planet.currentX + (rM * Math.cos(tM));
                moon.currentY = planet.currentY + (rM * Math.sin(tM));
            });
        });

        // Camera Tracking Lock
        if (this.activeTarget && this.isTracking) {
            this.camera.x = -(this.activeTarget.currentX * this.camera.zoom);
            this.camera.y = -(this.activeTarget.currentY * this.camera.zoom);
        }
    },

    render: function() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        const cx = this.canvas.width / 2 + this.camera.x;
        const cy = this.canvas.height / 2 + this.camera.y;

        // 1. Draw Osiris
        this.ctx.beginPath();
        this.ctx.arc(cx, cy, this.system.radius * this.camera.zoom, 0, 2 * Math.PI);
        this.ctx.fillStyle = "#0a0500"; 
        this.ctx.fill();
        this.ctx.strokeStyle = "#ffb000";
        this.ctx.stroke();

        this.system.bodies.forEach(planet => {
            const px = cx + (planet.currentX * this.camera.zoom);
            const py = cy + (planet.currentY * this.camera.zoom);

            // 2. Draw Planet Orbit Path
            this.ctx.beginPath();
            this.ctx.setLineDash([5, 5]);
            this.ctx.strokeStyle = "rgba(255, 176, 0, 0.4)";
            const pOffset = planet.a * planet.e * this.camera.zoom;
            this.ctx.arc(cx - pOffset, cy, planet.a * this.camera.zoom, 0, 2 * Math.PI);
            this.ctx.stroke();
            this.ctx.setLineDash([]);

            // 3. Draw Rings (if zoomed in enough)
            if (this.camera.zoom > 0.00001) {
                planet.rings.forEach(ring => {
                    const ringRadius = (ring.start + ring.end) / 2;
                    const ringWidth = ring.end - ring.start;
                    this.ctx.beginPath();
                    this.ctx.arc(px, py, ringRadius * this.camera.zoom, 0, 2 * Math.PI);
                    this.ctx.lineWidth = ringWidth * this.camera.zoom;
                    this.ctx.strokeStyle = ring.color;
                    this.ctx.stroke();
                });
                this.ctx.lineWidth = 1; // Reset
            }

            // 4. Draw Moon Orbit Paths
            planet.bodies.forEach(moon => {
                this.ctx.beginPath();
                this.ctx.setLineDash([2, 4]);
                this.ctx.strokeStyle = "rgba(255, 176, 0, 0.3)";
                const mOffset = moon.a * moon.e * this.camera.zoom;
                this.ctx.arc(px - mOffset, py, moon.a * this.camera.zoom, 0, 2 * Math.PI);
                this.ctx.stroke();
                this.ctx.setLineDash([]);
            });

            // 5. Draw Planet Body
            let pVisRad = planet.radius * this.camera.zoom;
            if (pVisRad < 2) pVisRad = 2;
            this.ctx.beginPath();
            this.ctx.arc(px, py, pVisRad, 0, 2 * Math.PI);
            this.ctx.fillStyle = "#0a0500"; this.ctx.fill();
            this.ctx.strokeStyle = "#ffb000"; this.ctx.stroke();
            if (this.activeTarget === planet) {
                this.ctx.beginPath(); this.ctx.arc(px, py, pVisRad + 5, 0, 2 * Math.PI); this.ctx.stroke();
            }

            // Labels
            if (this.camera.zoom > 0.000005) {
                this.ctx.fillStyle = "#ffb000";
                this.ctx.font = "12px 'Courier New'";
                this.ctx.fillText(planet.name, px + 10, py + 4);
            }

            // 6. Draw Moon Bodies
            planet.bodies.forEach(moon => {
                const mx = cx + (moon.currentX * this.camera.zoom);
                const my = cy + (moon.currentY * this.camera.zoom);
                let mVisRad = moon.radius * this.camera.zoom;
                if (mVisRad < 1.5) mVisRad = 1.5;

                this.ctx.beginPath();
                this.ctx.arc(mx, my, mVisRad, 0, 2 * Math.PI);
                this.ctx.fillStyle = "#0a0500"; this.ctx.fill();
                this.ctx.strokeStyle = "#ffb000"; this.ctx.stroke();
                
                if (this.activeTarget === moon) {
                    this.ctx.beginPath(); this.ctx.arc(mx, my, mVisRad + 4, 0, 2 * Math.PI); this.ctx.stroke();
                }

                if (this.camera.zoom > 0.00005) {
                    this.ctx.fillStyle = "#ffb000";
                    this.ctx.fillText(moon.name, mx + 8, my + 4);
                }
            });
        });
        
        // 7. Detailed Telemetry Box
        if (this.activeTarget) {
            let isAnchor = this.activeTarget.name === "OSIRIS";
            let isPlanet = this.activeTarget.name === "FURRA";
            let boxHeight = isAnchor ? 90 : (isPlanet ? 210 : 210);
            let startX = this.canvas.width - 290;
            let textX = startX + 10;
            
            this.ctx.fillStyle = "rgba(10, 5, 0, 0.8)";
            this.ctx.fillRect(startX, 10, 280, boxHeight);
            this.ctx.strokeStyle = "#ffb000";
            this.ctx.strokeRect(startX, 10, 280, boxHeight);
            
            this.ctx.fillStyle = "#ffb000";
            this.ctx.font = "bold 14px 'Courier New'";
            this.ctx.fillText(`TARGET: ${this.activeTarget.name}`, textX, 30);
            this.ctx.font = "12px 'Courier New'";
            this.ctx.fillText(`RADIUS:   ${this.activeTarget.radius.toLocaleString()} KM`, textX, 50);
            
            if (isAnchor) {
                this.ctx.fillText(`CLASS:    BLACK HOLE (2.54M☉)`, textX, 70);
            } else {
                let parentRadius = isPlanet ? this.system.radius : this.system.bodies[0].radius;
                const alt = Math.round(this.activeTarget.currentR - parentRadius);
                this.ctx.fillText(`ALTITUDE: ${alt.toLocaleString()} KM`, textX, 70);
                this.ctx.fillText(`SMA (a):  ${this.activeTarget.a.toLocaleString()} KM`, textX, 90);
                this.ctx.fillText(`ECC (e):  ${this.activeTarget.e}`, textX, 110);
                this.ctx.fillText(`INC (i):  ${this.activeTarget.inc.toFixed(1)}°`, textX, 130);
                this.ctx.fillText(`LAN (Ω):  ${this.activeTarget.lan.toFixed(1)}°`, textX, 150);
                this.ctx.fillText(`ARG (ω):  ${this.activeTarget.argp.toFixed(1)}°`, textX, 170);
                
                if (isPlanet) {
                    const periodDays = (this.activeTarget.period / (3600*32)).toFixed(2);
                    this.ctx.fillText(`PERIOD:   ${periodDays} FURRA DAYS`, textX, 190);
                } else {
                    const periodHours = (this.activeTarget.period / 3600).toFixed(2);
                    this.ctx.fillText(`PERIOD:   ${periodHours} HOURS`, textX, 190);
                }
            }
        }
        
        // Scale / UI Overlay
        this.ctx.fillStyle = "#ffb000";
        this.ctx.font = "14px 'Courier New'";
        this.ctx.fillText(`SCALE: 1px = ${(1/this.camera.zoom).toFixed(0)} km`, 10, 20);
        this.ctx.fillText(`TIME MULTIPLIER: ${this.timeScale}x`, 10, 40);
        if (this.isTracking) this.ctx.fillText(`[CAMERA LOCKED TO TARGET]`, 10, 60);
    }
};

// --- TERMINAL LOGIC ---
const Terminal={
    outputLog:document.getElementById("output-log"),
    inputField:document.getElementById("terminal-input"),
    inputWrapper:document.getElementById("input-wrapper"),
    userInput:document.getElementById("user-input"),
    currentApp: null,
    
    init:function(){
        this.userInput.addEventListener("keydown",e=>{"Enter"===e.key&&this.userInput.value.trim()!=""&&document.getElementById("pass-input").focus()});
        document.getElementById("pass-input").addEventListener("keydown",e=>{"Enter"===e.key&&AuthSystem.attemptLogin()});
        this.inputField.addEventListener("keydown",e=>{"Enter"===e.key&&(e=this.inputField.value,""!==e.trim()&&this.processInput(e),this.inputField.value="")});
        document.getElementById("submit-btn").addEventListener("click",()=>AuthSystem.attemptLogin());
        this.userInput.focus();
        MapEngine.init(); 
    },

    launchApp:function(appName){
        this.currentApp = "LOADING"; 
        this.inputField.disabled = true; 
        this.inputField.value = "";
        
        const loadTime = Math.floor(Math.random() * 5000) + 5000;
        const ticks = loadTime / 100;
        let currentTick = 0;
        
        const loader = setInterval(() => {
            currentTick++;
            let pct = Math.floor((currentTick / ticks) * 100);
            let pBar = "[";
            for(let i=0; i<20; i++) pBar += (i < pct/5) ? "█" : "░";
            pBar += "] " + pct + "%";
            
            this.outputLog.innerText = "ACCESSING " + appName + " MAINFRAME...\n" + pBar;
            
            if (currentTick >= ticks) {
                clearInterval(loader);
                this.currentApp = appName;
                this.inputField.disabled = false;
                this.inputWrapper.classList.add('app-mode');
                
                this.outputLog.innerText = appName + " ONLINE.\nAWAITING TARGET DESIGNATION OR TYPE 'TERMINATE'.";
                this.inputField.focus();
            }
        }, 100);
    },
    
    processInput:function(input){
        const cmd = input.toUpperCase().trim();

        if (this.currentApp !== null) {
            if (this.currentApp === "LOADING") return; 

            if (cmd === "TERMINATE") {
                this.currentApp = null;
                this.inputWrapper.classList.remove('app-mode');
                MapEngine.stop();
                this.outputLog.innerText = "OSIRIS KERNEL RESTORED.\nAPP TERMINATED.";
            } else if (this.currentApp === "PLANETARY CHARTS") {
                if (!MapEngine.isRunning) {
                    if (cmd === "FURRA" || cmd === "OSIRIS") {
                        MapEngine.start();
                        MapEngine.selectTargetByName(cmd);
                        // Auto-adjust initial zoom based on target
                        if (cmd === "OSIRIS") MapEngine.camera.zoom = 0.000001;
                        if (cmd === "FURRA") MapEngine.camera.zoom = 0.001;
                    } else {
                        this.outputLog.innerText += "\n> " + cmd + "\nERR: TARGET NOT FOUND OR MAP NOT INITIALIZED. START WITH 'FURRA' OR 'OSIRIS'.";
                        window.scrollTo(0,document.body.scrollHeight);
                    }
                } else {
                    let found = MapEngine.selectTargetByName(cmd);
                    if (!found) {
                        this.inputField.value = "";
                        this.inputField.placeholder = "ERR: UNKNOWN BODY";
                        setTimeout(() => this.inputField.placeholder = "", 2000);
                    }
                }
            } else {
                this.log("> " + cmd + "\nERR: APP [" + this.currentApp + "] IS RUNNING. TYPE 'TERMINATE' TO EXIT.");
            }
            return;
        }

        this.log("> " + cmd);
        switch(cmd) {
            case "HELP": this.log("AVAILABLE COMMANDS:\nHELP\nLIST\nLOGOUT\n\nEXECUTABLES:\nVAB\nDSN\nCONTRACTS\nMETAR DATA\nPLANETARY CHARTS"); break;
            case "LIST": this.log("AGENCY ASSET LIST:\n--- TIER 0 ---\n[READY] sounding_rocket_alpha\n[BUILDING] test_stand_01 (4h 12m)"); break;
            case "LOGOUT": location.reload(); break;
            case "PLANETARY CHARTS": this.launchApp(cmd); break;
            case "VAB": case "DSN": case "CONTRACTS": case "METAR DATA":
                this.currentApp = cmd;
                this.log("EXECUTING [" + cmd + "]...\nPROCESS COMPLETE. APP RUNNING IN FOREGROUND.");
                break;
            default: this.log("ERR: UNKNOWN COMMAND.");
        }
    },
    
    log:function(e){this.outputLog.innerText+="\n"+e,window.scrollTo(0,document.body.scrollHeight)},
    clearInputs:function(){document.getElementById("user-input").value="",document.getElementById("pass-input").value="",this.userInput.focus()}
};
window.onload=()=>Terminal.init();
</script>
</body></html>
