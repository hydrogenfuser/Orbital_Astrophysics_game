<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL OS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #05080a;
            color: #ffb000; /* All text amber orange */
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
        }

        /* Full Window Terminal Container */
        #terminal-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 15px;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 5px;
            line-height: 1.3;
        }

        /* Standardized class styling to maintain pure amber theme */
        .line-amber { color: #ffb000; }
        .line-title { color: #ffb000; font-weight: bold; }
        
        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid #ffb000;
            padding-top: 8px;
        }
        #prompt {
            color: #ffb000;
            margin-right: 8px;
            font-weight: bold;
        }
        #command-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffb000; /* Input text amber orange */
            font-family: inherit;
            font-size: 1rem;
            flex: 1;
        }
    </style>
</head>
<body>

    <div id="terminal-screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">Command:</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        // Game State Object
        let GameState = {
            activeSlot: null,
            data: {
                user: {
                    name: "",
                    password: ""
                },
                saveName: "",
                timestamp: null,
                vessel: {
                    name: "Probe-Alpha",
                    mass_kg: 1200,
                    altitude_m: 375000,
                    velocity_ms: 2450
                }
            }
        };

        // State Machine Modes: MAIN_MENU, NEW_NAME, NEW_PASS, LOAD_SELECT, LOAD_PASS, LOGGED_IN
        let currentMode = "MAIN_MENU"; 
        let tempName = "";
        let pendingLoadSlot = "";

        const outputEl = document.getElementById("output");
        const promptEl = document.getElementById("prompt");
        const inputEl = document.getElementById("command-input");

        function print(text, type = "amber") {
            const div = document.createElement("div");
            div.className = `line-${type}`;
            div.textContent = text;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function updatePrompt() {
            switch (currentMode) {
                case "LOGGED_IN":
                    promptEl.textContent = `[${GameState.activeSlot}]> Command:`;
                    break;
                case "NEW_NAME":
                    promptEl.textContent = "Name?:";
                    break;
                case "NEW_PASS":
                case "LOAD_PASS":
                    promptEl.textContent = "Password?:";
                    break;
                case "LOAD_SELECT":
                    promptEl.textContent = "Select Save File:";
                    break;
                default:
                    promptEl.textContent = "Command:";
                    break;
            }
        }

        function showTitle() {
            print("==================================================", "title");
            print("                   ORBITAL OS                     ", "title");
            print("               SYSTEM VERSION 0.1.0               ", "title");
            print("==================================================", "title");
            print("");
        }

        function printMainMenuHelp() {
            print("System offline. Available commands:");
            print("  new      - Create a new profile and start game");
            print("  load     - View save files and login");
            print("  saves    - List available save files");
            print("  clear    - Clear terminal buffer");
        }

        function printLoggedInHelp() {
            print("Session Active. Available commands:");
            print("  status   - Display vessel parameters and telemetry");
            print("  save     - Save current progress");
            print("  logout   - Exit current session and lock terminal");
            print("  clear    - Clear terminal buffer");
        }

        function bootTerminal() {
            outputEl.innerHTML = "";
            showTitle();
            currentMode = "MAIN_MENU";
            updatePrompt();
            printMainMenuHelp();
        }

        function getSaveList() {
            const saves = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("orbital_save_")) {
                    saves.push(key.replace("orbital_save_", ""));
                }
            }
            return saves;
        }

        function processCommand(input) {
            // Echo password inputs visually as asterisks
            if (currentMode === "NEW_PASS" || currentMode === "LOAD_PASS") {
                print(`${promptEl.textContent} ********`, "amber");
            } else {
                print(`${promptEl.textContent} ${input}`, "amber");
            }

            // 1. New Game Setup - Name Step
            if (currentMode === "NEW_NAME") {
                if (!input) return;
                tempName = input;
                currentMode = "NEW_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            // 2. New Game Setup - Password Step
            if (currentMode === "NEW_PASS") {
                if (!input) return;
                const password = input;
                inputEl.type = "text";

                const slotName = tempName.toLowerCase().replace(/\s+/g, '_');
                GameState.activeSlot = slotName;
                GameState.data.saveName = slotName;
                GameState.data.user.name = tempName;
                GameState.data.user.password = password;
                GameState.data.timestamp = new Date().toISOString();

                localStorage.setItem(`orbital_save_${slotName}`, JSON.stringify(GameState.data));

                currentMode = "LOGGED_IN";
                updatePrompt();
                print(`[SYS] User profile '${tempName}' initialized.`);
                print(`[SYS] Access ID locked: [${slotName}]`);
                print("");
                printLoggedInHelp();
                return;
            }

            // 3. Load File - Selection Step
            if (currentMode === "LOAD_SELECT") {
                if (!input) return;
                const targetSlot = input.toLowerCase().replace(/\s+/g, '_');
                const rawData = localStorage.getItem(`orbital_save_${targetSlot}`);

                if (!rawData) {
                    print(`[ERR] Save file '${input}' not found.`);
                    print("Enter valid save file name or type 'cancel':");
                    return;
                }

                if (input.toLowerCase() === "cancel") {
                    currentMode = "MAIN_MENU";
                    updatePrompt();
                    printMainMenuHelp();
                    return;
                }

                pendingLoadSlot = targetSlot;
                currentMode = "LOAD_PASS";
                inputEl.type = "password";
                updatePrompt();
                return;
            }

            // 4. Load File - Password Verification Step
            if (currentMode === "LOAD_PASS") {
                if (!input) return;
                inputEl.type = "text";
                const rawData = localStorage.getItem(`orbital_save_${pendingLoadSlot}`);
                const parsedData = JSON.parse(rawData);

                if (parsedData.user.password === input) {
                    GameState.data = parsedData;
                    GameState.activeSlot = pendingLoadSlot;
                    pendingLoadSlot = "";
                    currentMode = "LOGGED_IN";
                    updatePrompt();
                    print(`[SYS] Access granted. Session loaded for profile '${GameState.data.user.name}'.`);
                    print("");
                    printLoggedInHelp();
                } else {
                    print("[ERR] Access denied. Incorrect password.");
                    currentMode = "MAIN_MENU";
                    pendingLoadSlot = "";
                    updatePrompt();
                    printMainMenuHelp();
                }
                return;
            }

            const parts = input.split(" ");
            const cmd = parts[0].toLowerCase();

            // 5. Logged In Mode Commands
            if (currentMode === "LOGGED_IN") {
                switch (cmd) {
                    case "help":
                        printLoggedInHelp();
                        break;

                    case "status":
                        print(`User: ${GameState.data.user.name}`);
                        print(`Vessel: ${GameState.data.vessel.name}`);
                        print(`Mass: ${GameState.data.vessel.mass_kg} kg`);
                        print(`Altitude: ${GameState.data.vessel.altitude_m} m`);
                        print(`Velocity: ${GameState.data.vessel.velocity_ms} m/s`);
                        break;

                    case "save":
                        GameState.data.timestamp = new Date().toISOString();
                        localStorage.setItem(`orbital_save_${GameState.activeSlot}`, JSON.stringify(GameState.data));
                        print(`[SYS] Telemetry saved to slot '${GameState.activeSlot}'.`);
                        break;

                    case "logout":
                        print(`[SYS] Logging out user '${GameState.data.user.name}'...`);
                        GameState.activeSlot = null;
                        GameState.data.user.name = "";
                        GameState.data.user.password = "";
                        bootTerminal();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' for options.`);
                        break;
                }
                return;
            }

            // 6. Main Menu Mode Commands
            if (currentMode === "MAIN_MENU") {
                switch (cmd) {
                    case "help":
                        printMainMenuHelp();
                        break;

                    case "new":
                        currentMode = "NEW_NAME";
                        updatePrompt();
                        break;

                    case "saves":
                        print("[SYS] Scanning local state memory...");
                        const saveFiles = getSaveList();
                        if (saveFiles.length === 0) {
                            print("  No save files found.");
                        } else {
                            saveFiles.forEach(slot => print(`  - ${slot}`));
                        }
                        break;

                    case "load":
                        const saves = getSaveList();
                        if (saves.length === 0) {
                            print("[ERR] No save files present in system memory.");
                            return;
                        }

                        print("[SYS] Open Save Files Available:");
                        saves.forEach(slot => print(`  - ${slot}`));
                        print("");
                        currentMode = "LOAD_SELECT";
                        updatePrompt();
                        break;

                    case "clear":
                        outputEl.innerHTML = "";
                        break;

                    default:
                        print(`Unknown command: '${cmd}'. Type 'help' for options.`);
                        break;
                }
            }
        }

        // Event Listener
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const input = inputEl.value.trim();
                inputEl.value = "";
                processCommand(input);
            }
        });

        // Initialize Terminal application
        bootTerminal();
    </script>
</body>
</html>
